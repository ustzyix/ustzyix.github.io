name: Build Gallery Thumbnails
on:
  push:
    branches: [main]
    paths:
      - 'images/**'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate thumbnails and photos.js
        run: |
          mkdir -p thumbs data
          shopt -s nullglob nocaseglob
          files=(images/*.{jpg,jpeg,png,webp,avif})
          {
            echo 'window.GALLERY = {'
            echo '  folder: "images",'
            echo '  discover: false,'
            echo '  photos: ['
            for f in "${files[@]}"; do
              base=$(basename "$f")
              name="${base%.*}"
              out="thumbs/${name}.webp"
              if [ ! -f "$out" ] || [ "$f" -nt "$out" ]; then
                convert "$f" -auto-orient -resize "800x>" -strip -quality 82 "$out"
              fi
              printf '    { file: "%s", thumb: "%s" },\n' "$base" "$out"
            done
            echo '  ]'
            echo '};'
          } > data/photos.js

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thumbs data/photos.js
          git diff --staged --quiet || git commit -m "chore(gallery): auto-generate thumbnails"
          git push
