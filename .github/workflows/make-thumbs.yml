name: Generate Thumbnails

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '.github/workflows/make-thumbs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-thumbs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Resize images and build data/thumbs.js
        run: |
          python3 - << 'EOF'
          import os, json
          from pathlib import Path
          from PIL import Image, ImageOps

          IMG_DIR = Path("images")
          THUMB_DIR = Path("thumbs")
          OUT_JS = Path("data/thumbs.js")
          VALID_EXT = {".jpg", ".jpeg", ".png", ".webp", ".avif"}
          MAX_WIDTH = 800
          QUALITY = 80

          THUMB_DIR.mkdir(parents=True, exist_ok=True)
          OUT_JS.parent.mkdir(parents=True, exist_ok=True)

          thumbs_map = {}
          expected_files = set()

          if IMG_DIR.exists():
              for src in sorted(IMG_DIR.iterdir(), key=lambda p: p.name.lower()):
                  if not src.is_file() or src.suffix.lower() not in VALID_EXT:
                      continue

                  out_name = f"{src.stem}.webp"
                  dst = THUMB_DIR / out_name
                  expected_files.add(out_name)

                  # สร้างใหม่เฉพาะไฟล์ที่ยังไม่มีหรือต้นฉบับถูกอัปเดต
                  if not dst.exists() or src.stat().st_mtime > dst.stat().st_mtime:
                      with Image.open(src) as im:
                          im = ImageOps.exif_transpose(im)
                          if im.mode not in ("RGB", "RGBA"):
                              im = im.convert("RGB")
                          if im.width > MAX_WIDTH:
                              new_h = max(1, round(im.height * (MAX_WIDTH / im.width)))
                              im = im.resize((MAX_WIDTH, new_h), Image.Resampling.LANCZOS)
                          im.save(dst, "WEBP", quality=QUALITY, method=6)

                  thumbs_map[src.name] = f"thumbs/{out_name}"

          # ลบไฟล์ย่อเก่าใน thumbs/ หากต้นฉบับใน images/ ถูกลบไปแล้ว
          for old in THUMB_DIR.iterdir():
              if old.is_file() and old.name != ".gitkeep" and old.name not in expected_files:
                  old.unlink()

          js_content = (
              "// Auto-generated by GitHub Actions — do not edit manually\n"
              f"window.THUMBS_MAP = {json.dumps(thumbs_map, ensure_ascii=False, indent=2)};\n"
          )
          OUT_JS.write_text(js_content, encoding="utf-8")
          print(f"Generated manifest for {len(thumbs_map)} images.")
          EOF

      - name: Commit and push thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbs data/thumbs.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: update thumbs and data/thumbs.js [skip ci]"
            git pull --rebase origin main
            git push
          fi
