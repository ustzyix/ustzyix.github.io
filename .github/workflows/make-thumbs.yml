name: Generate Thumbnails and Media Manifest

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'videos/**'
      - 'audio/**'
      - '.github/workflows/make-thumbs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: media-generated-assets
  cancel-in-progress: false

jobs:
  build-thumbs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Generate image previews and data/thumbs.js
        run: |
          python3 - << 'EOF'
          import os, json
          from pathlib import Path
          from PIL import Image, ImageOps

          IMG_DIR = Path("images")
          THUMB_DIR = Path("thumbs")
          OUT_JS = Path("data/thumbs.js")
          VALID_EXT = {".jpg", ".jpeg", ".png", ".webp", ".gif", ".avif"}
          MANIFEST_IMAGE_EXTS = {".jpg", ".jpeg", ".png", ".webp", ".gif", ".avif"}
          VIDEO_EXTS = {".mp4", ".webm", ".mov", ".m4v"}
          AUDIO_EXTS = {".mp3", ".m4a", ".wav", ".ogg", ".flac"}
          MAX_WIDTH = 800
          QUALITY = 80

          THUMB_DIR.mkdir(parents=True, exist_ok=True)
          OUT_JS.parent.mkdir(parents=True, exist_ok=True)

          thumbs_map = {}
          expected_files = set()

          image_sources = [
              src
              for src in sorted(IMG_DIR.iterdir(), key=lambda p: p.name.lower())
              if src.is_file() and src.suffix.lower() in VALID_EXT
          ] if IMG_DIR.exists() else []

          # Preserve unique stems for the simple <stem>.webp convention.
          # When stems collide, include the original extension in the output name.
          stem_counts = {}
          for src in image_sources:
              key = src.stem.casefold()
              stem_counts[key] = stem_counts.get(key, 0) + 1

          for src in image_sources:
              duplicate_stem = stem_counts[src.stem.casefold()] > 1
              source_ext = src.suffix.lstrip(".")
              out_name = (
                  f"{src.stem}.{source_ext}.webp"
                  if duplicate_stem
                  else f"{src.stem}.webp"
              )
              dst = THUMB_DIR / out_name
              expected_files.add(out_name)

              # Always rebuild: checkout mtimes are not reliable source-change signals in CI.
              with Image.open(src) as im:
                  # GIF thumbnails use the first frame; the original GIF remains animated.
                  if src.suffix.lower() == ".gif":
                      im.seek(0)

                  im = ImageOps.exif_transpose(im.copy())

                  if im.mode not in ("RGB", "RGBA"):
                      if "transparency" in im.info:
                          im = im.convert("RGBA")
                      else:
                          im = im.convert("RGB")

                  if im.width > MAX_WIDTH:
                      new_h = max(1, round(im.height * (MAX_WIDTH / im.width)))
                      im = im.resize((MAX_WIDTH, new_h), Image.Resampling.LANCZOS)

                  im.save(dst, "WEBP", quality=QUALITY, method=6)

              thumbs_map[src.name] = f"thumbs/{out_name}"

          # Remove stale thumbnails whose source images no longer exist.
          for old in THUMB_DIR.iterdir():
              if old.is_file() and old.name != ".gitkeep" and old.name not in expected_files:
                  old.unlink()

          def scan_media(folder, allowed_exts):
              if not folder.is_dir():
                  return []
              return [
                  path.name
                  for path in sorted(folder.iterdir(), key=lambda item: item.name.lower())
                  if path.is_file()
                  and not path.name.startswith(".")
                  and path.suffix.lower() in allowed_exts
              ]

          media_manifest = {
              "images": scan_media(IMG_DIR, MANIFEST_IMAGE_EXTS),
              "videos": scan_media(Path("videos"), VIDEO_EXTS),
              "audio": scan_media(Path("audio"), AUDIO_EXTS),
          }

          js_content = (
              "// Auto-generated by GitHub Actions — do not edit manually\n"
              f"export const THUMBS_MAP = {json.dumps(thumbs_map, ensure_ascii=False, indent=2)};\n\n"
              f"export const MEDIA_MANIFEST = {json.dumps(media_manifest, ensure_ascii=False, indent=2)};\n"
          )
          OUT_JS.write_text(js_content, encoding="utf-8")
          media_count = sum(len(files) for files in media_manifest.values())
          print(f"Generated thumbnail map for {len(thumbs_map)} images and manifest for {media_count} media files.")
          EOF

      - name: Commit and push thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbs data/thumbs.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: update thumbs and data/thumbs.js [skip ci]"

            for attempt in 1 2 3; do
              git fetch origin

              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::Could not rebase generated thumbnails."
                exit 1
              fi

              if git push origin HEAD:main; then
                echo "Thumbnails and media manifest committed successfully."
                exit 0
              fi

              echo "Push attempt $attempt failed; retrying after fetching latest changes."
              sleep 2
            done

            echo "::error::Could not push generated thumbnails after 3 attempts."
            exit 1
          fi
