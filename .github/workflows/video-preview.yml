name: Generate Video Previews

on:
  push:
    branches:
      - main
    paths:
      - 'videos/*.mp4'
      - '.github/workflows/video-preview.yml'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-previews:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          ffmpeg -version

      - name: Generate previews
        shell: bash
        run: |
          set -euo pipefail

          VIDEO_DIR="$GITHUB_WORKSPACE/videos"
          PREVIEW_DIR="$VIDEO_DIR/preview"
          POSTER_DIR="$VIDEO_DIR/posters"

          mkdir -p "$PREVIEW_DIR" "$POSTER_DIR"

          echo "Working directory:"
          pwd

          echo "Video directory:"
          printf '%s\n' "$VIDEO_DIR"

          mapfile -d '' -t source_files < <(
            find "$VIDEO_DIR" \
              -maxdepth 1 \
              -type f \
              -iname '*.mp4' \
              -print0
          )

          declare -A expected_previews=()
          declare -A expected_posters=()

          echo "Found ${#source_files[@]} source video(s)." 
          if [[ ${#source_files[@]} -eq 0 ]]; then
            echo "No source MP4 files remain; generated assets will be cleaned up."
          fi

          for file in "${source_files[@]}"; do
            filename="$(basename "$file")"
            name="${filename%.*}"

            output="$PREVIEW_DIR/${name}.preview.mp4"
            poster="$POSTER_DIR/${name}.webp"

            expected_previews["${name}.preview.mp4"]=1
            expected_posters["${name}.webp"]=1

            echo "--------------------------------"
            printf 'Input: %s\n' "$file"
            printf 'Output: %s\n' "$output"

            if [[ ! -f "$file" ]]; then
              echo "::error::Input file not found: $file"
              exit 1
            fi

            ffmpeg -hide_banner -loglevel error \
              -y \
              -i "$file" \
              -map 0:v:0 \
              -vf 'scale=-2:min(480\,ih)' \
              -an \
              -sn \
              -dn \
              -c:v libx264 \
              -preset medium \
              -crf 30 \
              -pix_fmt yuv420p \
              -movflags +faststart \
              "$output"

            if [[ ! -s "$output" ]]; then
              echo "::error::Preview generation failed: $output"
              exit 1
            fi

            ffmpeg -hide_banner -v error \
              -i "$output" \
              -f null -

            echo "Created successfully: $output"

            # Generate a persistent WebP poster for the gallery card.
            if ! ffmpeg -hide_banner -loglevel error \
              -y \
              -ss 0.5 \
              -i "$file" \
              -frames:v 1 \
              -vf 'scale=800:800:force_original_aspect_ratio=decrease' \
              -c:v libwebp \
              -quality 78 \
              "$poster" || [[ ! -s "$poster" ]]; then
              rm -f "$poster"

              # Very short clips may not contain a frame at 0.5 seconds.
              ffmpeg -hide_banner -loglevel error \
                -y \
                -i "$file" \
                -frames:v 1 \
                -vf 'scale=800:800:force_original_aspect_ratio=decrease' \
                -c:v libwebp \
                -quality 78 \
                "$poster"
            fi

            if [[ ! -s "$poster" ]]; then
              echo "::error::Poster generation failed: $poster"
              exit 1
            fi

            echo "Created poster successfully: $poster"
          done

          # Remove generated previews and posters whose source MP4 was deleted.
          shopt -s nullglob

          for generated in "$PREVIEW_DIR"/*.preview.mp4; do
            filename="${generated##*/}"
            if [[ -z "${expected_previews[$filename]+x}" ]]; then
              echo "Removing stale preview: $generated"
              rm -f "$generated"
            fi
          done

          for generated in "$POSTER_DIR"/*.webp; do
            filename="${generated##*/}"
            if [[ -z "${expected_posters[$filename]+x}" ]]; then
              echo "Removing stale poster: $generated"
              rm -f "$generated"
            fi
          done

          echo "Video asset generation and cleanup completed."

          find "$PREVIEW_DIR" "$POSTER_DIR" \
            -maxdepth 1 \
            -type f \
            -print

      - name: Commit previews
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos/preview/ videos/posters/

          if git diff --cached --quiet; then
            echo "No preview changes."
            exit 0
          fi

          git commit -m "Generate video previews and posters [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"

            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "::error::Could not rebase generated video assets."
              exit 1
            fi

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Video previews and posters committed successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed; retrying after fetching latest changes."
            sleep 2
          done

          echo "::error::Could not push generated video assets after 3 attempts."
          exit 1
