name: Generate Video Previews

on:
  push:
    branches:
      - main
    paths:
      - 'videos/*.mp4'
      - '.github/workflows/make-previews.yml'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-previews:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install FFmpeg
      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          ffmpeg -version

      # 3. Generate preview videos
      - name: Generate previews
        shell: bash
        run: |
          set -euo pipefail

          VIDEO_DIR="$GITHUB_WORKSPACE/videos"
          PREVIEW_DIR="$VIDEO_DIR/preview"

          mkdir -p "$PREVIEW_DIR"

          echo "================================"
          echo "Working directory:"
          pwd

          echo "Video directory:"
          printf '%s\n' "$VIDEO_DIR"

          echo "================================"
          echo "Searching source videos..."

          # Collect source video paths safely.
          mapfile -d '' -t source_files < <(
            find "$VIDEO_DIR" \
              -maxdepth 1 \
              -type f \
              -iname '*.mp4' \
              -print0
          )

          # Stop if no source videos are found.
          if [[ ${#source_files[@]} -eq 0 ]]; then
            echo "::error::No source MP4 files found."
            exit 1
          fi

          echo "Found ${#source_files[@]} source video(s)."

          # Process each source video.
          for file in "${source_files[@]}"; do

            filename="$(basename "$file")"
            name="${filename%.*}"

            output="$PREVIEW_DIR/${name}.preview.mp4"

            echo ""
            echo "================================"
            printf 'Input:  %s\n' "$file"
            printf 'Output: %s\n' "$output"

            # Validate input.
            if [[ ! -f "$file" ]]; then
              echo "::error::Input file not found: $file"
              exit 1
            fi

            # Generate optimized preview.
            ffmpeg -hide_banner -loglevel error \
              -y \
              -i "$file" \
              -map 0:v:0 \
              -vf 'scale=-2:min(480\,ih)' \
              -an \
              -sn \
              -dn \
              -c:v libx264 \
              -preset medium \
              -crf 30 \
              -pix_fmt yuv420p \
              -movflags +faststart \
              "$output"

            # Validate generated preview.
            if [[ ! -s "$output" ]]; then
              echo "::error::Preview generation failed: $output"
              exit 1
            fi

            # Verify that FFmpeg can read the generated file.
            ffmpeg -hide_banner -v error \
              -i "$output" \
              -f null -

            echo "Created successfully: $output"

          done

          echo ""
          echo "================================"
          echo "All previews generated successfully."

          echo "Generated preview files:"
          find "$PREVIEW_DIR" \
            -maxdepth 1 \
            -type f \
            -iname '*.mp4' \
            -print

      # 4. Commit generated previews
      - name: Commit previews
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos/preview/

          if git diff --cached --quiet; then
            echo "No preview changes to commit."
            exit 0
          fi

          git commit -m "Generate video previews [skip ci]"

          git push origin "HEAD:${GITHUB_REF_NAME}"

          echo "Preview files committed successfully."
