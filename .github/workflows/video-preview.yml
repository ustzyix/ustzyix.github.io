name: Generate Video Previews

on:
  push:
    branches:
      - main
    paths:
      - 'videos/**'
      - '.github/workflows/video-preview.yml'

  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Rebuild every preview and poster, even when source files are unchanged'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: media-generated-assets
  cancel-in-progress: false

jobs:
  generate-previews:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          ffmpeg -version

      - name: Generate previews
        shell: bash
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild }}
        run: |
          set -euo pipefail

          VIDEO_DIR="$GITHUB_WORKSPACE/videos"
          PREVIEW_DIR="$VIDEO_DIR/preview"
          POSTER_DIR="$VIDEO_DIR/posters"
          MANIFEST="$VIDEO_DIR/.preview-manifest.json"
          CHANGED_LIST="$RUNNER_TEMP/changed-videos.nul"
          MANIFEST_TEMP="$RUNNER_TEMP/preview-manifest.json"
          export VIDEO_DIR PREVIEW_DIR POSTER_DIR MANIFEST CHANGED_LIST MANIFEST_TEMP

          mkdir -p "$PREVIEW_DIR" "$POSTER_DIR"

          mapfile -d '' -t source_files < <(
            find "$VIDEO_DIR" -maxdepth 1 -type f -iname '*.mp4' -print0
          )

          # Hash source contents rather than relying on checkout timestamps.
          # Reject case-insensitive stem collisions before generating output paths.
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          video_dir = Path(os.environ["VIDEO_DIR"])
          preview_dir = Path(os.environ["PREVIEW_DIR"])
          poster_dir = Path(os.environ["POSTER_DIR"])
          manifest_path = Path(os.environ["MANIFEST"])
          changed_list = Path(os.environ["CHANGED_LIST"])
          manifest_temp = Path(os.environ["MANIFEST_TEMP"])
          force_rebuild = os.environ.get("FORCE_REBUILD", "false").lower() == "true"

          sources = sorted(
              (path for path in video_dir.iterdir()
               if path.is_file() and path.suffix.lower() == ".mp4"),
              key=lambda path: (path.stem.casefold(), path.name.casefold(), path.name),
          )

          stems = {}
          for source in sources:
              key = source.stem.casefold()
              previous = stems.get(key)
              if previous is not None:
                  raise SystemExit(
                      "::error::Case-insensitive preview filename collision: "
                      f"{previous.name!r} and {source.name!r} map to the same output stem."
                  )
              stems[key] = source

          try:
              previous_manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              if not isinstance(previous_manifest, dict):
                  raise ValueError("manifest root must be an object")
          except FileNotFoundError:
              previous_manifest = {}
          except (json.JSONDecodeError, ValueError) as error:
              print(f"::warning::Ignoring invalid preview manifest and rebuilding all videos: {error}")
              previous_manifest = {}

          next_manifest = {}
          changed = []

          for source in sources:
              digest = hashlib.sha256()
              with source.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              source_hash = digest.hexdigest()

              name = source.stem
              preview = preview_dir / f"{name}.preview.mp4"
              poster = poster_dir / f"{name}.webp"
              old_entry = previous_manifest.get(source.name, {})
              unchanged = (
                  not force_rebuild
                  and isinstance(old_entry, dict)
                  and old_entry.get("sha256") == source_hash
                  and preview.is_file() and preview.stat().st_size > 0
                  and poster.is_file() and poster.stat().st_size > 0
              )

              if not unchanged:
                  changed.append(source.name)

              next_manifest[source.name] = {
                  "sha256": source_hash,
                  "preview": f"videos/preview/{name}.preview.mp4",
                  "poster": f"videos/posters/{name}.webp",
              }

          changed_list.write_bytes(
              b"".join(os.fsencode(name) + b"\0" for name in changed)
          )
          manifest_temp.write_text(
              json.dumps(next_manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(f"Found {len(sources)} source video(s); {len(changed)} require generation.")
          if force_rebuild:
              print("Manual force rebuild is enabled.")
          PY

          echo "Source videos found: ${#source_files[@]}"
          mapfile -d '' -t changed_files < "$CHANGED_LIST"
          echo "Videos to encode: ${#changed_files[@]}"

          for filename in "${changed_files[@]}"; do
            file="$VIDEO_DIR/$filename"
            name="${filename%.*}"
            output="$PREVIEW_DIR/${name}.preview.mp4"
            poster="$POSTER_DIR/${name}.webp"

            echo "--------------------------------"
            printf 'Input: %s\n' "$file"
            printf 'Output: %s\n' "$output"

            ffmpeg -hide_banner -loglevel error \
              -y \
              -i "$file" \
              -map 0:v:0 \
              -vf 'scale=-2:min(480\,ih)' \
              -an \
              -sn \
              -dn \
              -c:v libx264 \
              -preset medium \
              -crf 30 \
              -pix_fmt yuv420p \
              -movflags +faststart \
              "$output"

            if [[ ! -s "$output" ]]; then
              echo "::error::Preview generation failed: $output"
              exit 1
            fi

            ffmpeg -hide_banner -v error -i "$output" -f null -
            echo "Created and validated preview: $output"

            # Generate a persistent WebP poster for the gallery card.
            if ! ffmpeg -hide_banner -loglevel error \
              -y -ss 0.5 -i "$file" \
              -frames:v 1 \
              -vf 'scale=800:800:force_original_aspect_ratio=decrease' \
              -c:v libwebp -quality 78 "$poster" || [[ ! -s "$poster" ]]; then
              rm -f "$poster"
              # Very short clips may not contain a frame at 0.5 seconds.
              ffmpeg -hide_banner -loglevel error \
                -y -i "$file" -frames:v 1 \
                -vf 'scale=800:800:force_original_aspect_ratio=decrease' \
                -c:v libwebp -quality 78 "$poster"
            fi

            if [[ ! -s "$poster" ]]; then
              echo "::error::Poster generation failed: $poster"
              exit 1
            fi

            echo "Created poster successfully: $poster"
          done

          # Build the expected output sets from every current source, not just changed files.
          declare -A expected_previews=()
          declare -A expected_posters=()
          for file in "${source_files[@]}"; do
            filename="${file##*/}"
            name="${filename%.*}"
            expected_previews["${name}.preview.mp4"]=1
            expected_posters["${name}.webp"]=1
          done

          # Remove generated assets for deleted or renamed source videos.
          shopt -s nullglob
          for generated in "$PREVIEW_DIR"/*.preview.mp4; do
            filename="${generated##*/}"
            if [[ -z "${expected_previews[$filename]+x}" ]]; then
              echo "Removing stale preview: $generated"
              rm -f "$generated"
            fi
          done

          for generated in "$POSTER_DIR"/*.webp; do
            filename="${generated##*/}"
            if [[ -z "${expected_posters[$filename]+x}" ]]; then
              echo "Removing stale poster: $generated"
              rm -f "$generated"
            fi
          done

          # Publish the new manifest only after every required encode succeeded.
          mv "$MANIFEST_TEMP" "$MANIFEST"

          echo "Video asset generation and cleanup completed."
          find "$PREVIEW_DIR" "$POSTER_DIR" -maxdepth 1 -type f -print

      - name: Commit previews
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- videos

          if git diff --cached --quiet; then
            echo "No preview changes."
            exit 0
          fi

          git commit -m "Generate video previews and posters [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin

            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "::error::Could not rebase generated video assets."
              exit 1
            fi

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Video previews and posters committed successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed; retrying after fetching latest changes."
            sleep 2
          done

          echo "::error::Could not push generated video assets after 3 attempts."
          exit 1
