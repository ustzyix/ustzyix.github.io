<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="description" content="ustzyix — A black-space visual archive for image, motion, interactive, and audio work."/>
<meta name="theme-color" content="#000000"/>
<title>ustzyix — Visual Studio</title>
<link rel="preload" href="data/projects.js" as="script"/>
<link rel="preconnect" href="https://api.github.com" crossorigin/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"/>
<link rel="stylesheet" href="assets/style.css"/>
</head>
<body data-layout="scatter" data-mode="gallery">

<header id="topBar" role="banner">
  <button class="pill brand-btn" id="projBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Switch project archive">
    <span class="brand">ustzyix</span>
    <svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    <span class="count"><span class="dot"></span><span id="projName">Archive</span> · <span id="count">0 items</span></span>
  </button>
  <div class="tools">
    <button class="ibtn" id="layoutBtn" type="button" aria-label="Switch scatter or grid layout">
      <svg class="i-s" viewBox="0 0 24 24"><rect x="3" y="4" width="9" height="7" rx="2"/><rect x="12" y="13" width="9" height="7" rx="2"/></svg>
      <svg class="i-g" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg>
    </button>
  </div>
</header>

<main id="stage" role="main"><div class="canvas" id="canvas" data-empty-msg="No items found in this collection yet."></div></main>

<!-- Full-screen Project Navigation -->
<div class="pm" id="pm" role="dialog" aria-modal="true" aria-label="Choose a project">
  <div class="pm-shell">
    <div class="pm-top">
      <span class="pm-brand">Another Work</span>
      <button class="ibtn pm-close" id="pmX" type="button" aria-label="Close project menu"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="pm-content">
      <nav class="pm-list" id="pmList" aria-label="Projects"></nav>
      <p class="pm-empty" id="pmEmpty" role="status" hidden>No matching projects</p>
    </div>
    <label class="pm-search-wrap">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
      <input class="pm-search" id="pmSearch" type="search" placeholder="Search projects" aria-label="Search projects" autocomplete="off" spellcheck="false"/>
    </label>
  </div>
</div>

<!-- Lightbox -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Media view">
  <button class="ibtn lb-x" id="lbX" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <div class="lb-in">
    <div class="scene" id="scene" role="button" tabindex="0" aria-label="Flip card for information">
      <div class="flip" id="flip">
        <div class="front">
          <img id="lbImg" alt="" draggable="false"/>
          <video id="lbVid" controls playsinline loop preload="metadata" style="display:none"></video>
        </div>
        <div class="back">
          <div class="ex-top"><span class="ex-cam" id="xCam"></span><span class="ex-date" id="xDate"></span></div>
          <div class="metrics">
            <div class="mc"><span class="mv" id="xAp"></span><span class="ml" id="mL1">Aperture</span></div>
            <div class="mc"><span class="mv" id="xSh"></span><span class="ml" id="mL2">Shutter</span></div>
            <div class="mc"><span class="mv" id="xFo"></span><span class="ml" id="mL3">Focal</span></div>
            <div class="mc"><span class="mv" id="xIso"></span><span class="ml" id="mL4">ISO</span></div>
          </div>
          <div class="rows">
            <div class="row"><span class="rk">Edited with</span><span class="rv" id="xApp"></span></div>
            <div class="row"><span class="rk">Resolution</span><span class="rv" id="xRes"></span></div>
            <div class="row"><span class="rk">File</span><span class="rv" id="xFile"></span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="cap" id="cap"></div>
    <div class="lb-ctl">
      <button class="fbtn" id="fbtn" type="button"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16m0 0v5m0-5h5M3 12A9 9 0 0 1 18.5 5.8L21 8m0 0V3m0 5h-5"/></svg><span id="fbtnT">Media info</span></button>
    </div>
    <div class="hint">tap to flip · esc to close</div>
  </div>
</div>

<script src="data/projects.js"></script>
<script src="data/thumbs.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
