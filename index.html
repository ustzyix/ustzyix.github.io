<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="description" content="ustzyix — Atmospheric visual, motion, interactive, and audio studio archive."/>
<meta name="theme-color" content="#050507"/>
<title>ustzyix — Visual Studio</title>
<link rel="preload" href="data/projects.js" as="script"/>
<link rel="preconnect" href="https://api.github.com" crossorigin/>
<style>
@property --aura-1{syntax:"<color>";inherits:true;initial-value:#9b221c}
@property --aura-2{syntax:"<color>";inherits:true;initial-value:#481a16}
@property --abyss{syntax:"<color>";inherits:true;initial-value:#1c0907}
:root{--bg:#050507;--fg:#f5f5f9;--fg2:rgba(245,245,249,.7);--fg3:rgba(245,245,249,.42);--ease:cubic-bezier(.22,1,.36,1);--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;width:100%;height:100dvh;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Text","Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
header,.card,.lb,.pm,.pl-deck,.ix-bar{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid rgba(255,255,255,.7);outline-offset:3px}

/* ---------- atmosphere ---------- */
.atm{position:fixed;inset:0;z-index:-8;pointer-events:none;opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 0s linear 1s}
.atm.on{opacity:1;visibility:visible;transition:opacity 1s ease}
.atm i{position:absolute;display:block;pointer-events:none}
.amb{inset:0;background:
 radial-gradient(ellipse 85% 65% at 50% 34%,color-mix(in srgb,var(--aura-1) 72%,transparent),transparent 72%),
 radial-gradient(ellipse 95% 78% at 50% 82%,color-mix(in srgb,var(--aura-2) 55%,transparent),var(--abyss) 86%,var(--bg))}
.mist{inset:-12%;opacity:.56;will-change:transform;
 background:radial-gradient(ellipse 70% 56% at 24% 32%,var(--aura-1),transparent 75%),radial-gradient(ellipse 68% 62% at 78% 68%,var(--aura-2),transparent 78%);
 animation:sway 28s ease-in-out infinite alternate}
@keyframes sway{from{transform:translate3d(-2%,-1%,0)}to{transform:translate3d(2%,1.2%,0)}}
.rays{inset:-20%;opacity:.22;will-change:transform;transform:rotate(-22deg);
 background:radial-gradient(ellipse 20% 78% at 36% 24%,var(--aura-1),transparent 78%),radial-gradient(ellipse 16% 72% at 54% 28%,rgba(255,248,240,.14),transparent 78%);
 animation:ray 22s ease-in-out infinite alternate}
@keyframes ray{from{transform:translate3d(-2.5%,-1%,0) rotate(-24deg)}to{transform:translate3d(2.5%,1.2%,0) rotate(-19deg)}}
.fluted,.halftone{position:fixed;inset:0;z-index:-5;pointer-events:none;opacity:0;transition:opacity .6s var(--ease)}
.fluted{background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0,rgba(0,0,0,.2) 14px,rgba(255,255,255,.04) 28px)}
.halftone{background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.2px);background-size:16px 16px}
[data-look=fluted] .fluted{opacity:.8}
[data-look=halftone] .halftone{opacity:.5}
.vig{position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse 82% 76% at 50% 48%,transparent 45%,rgba(5,5,7,.4) 78%,rgba(3,3,5,.8))}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
body.modal-active .mist,body.modal-active .rays{animation-play-state:paused}

/* ---------- liquid glass ---------- */
.glass,.hair{position:relative}
.glass{background:radial-gradient(120% 100% at 14% 0%,rgba(255,255,255,.16),transparent 55%),linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);transform:translateZ(0)}
.glass::before,.hair::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
 background:linear-gradient(145deg,rgba(255,255,255,.6),rgba(255,255,255,.07) 32%,rgba(255,255,255,.02) 62%,rgba(255,255,255,.3));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
 mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.card.glass,.tag.glass{-webkit-backdrop-filter:none;backdrop-filter:none}

/* ---------- header ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:25;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;
 padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left))}
header>*{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:0;border-radius:999px;box-shadow:0 10px 26px -12px rgba(0,0,0,.6)}
.brand-btn{cursor:pointer;transition:transform .25s var(--ease),background .25s var(--ease)}
.brand-btn:active{transform:translateZ(0) scale(.95)}
@media(hover:hover){.brand-btn:hover{background:radial-gradient(120% 100% at 14% 0%,rgba(255,255,255,.22),transparent 58%),linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04))}}
.mark{flex-shrink:0;width:14px;height:14px;border-radius:5px;background:conic-gradient(from 140deg,var(--aura-1),#f472b6,#818cf8,var(--aura-1));box-shadow:0 0 14px var(--aura-1)}
.brand{font-size:12.5px;font-weight:600;letter-spacing:.16em}
.chev{width:13px;height:13px;fill:none;stroke:var(--fg2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease)}
.brand-btn[aria-expanded=true] .chev{transform:rotate(180deg)}
.count{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--fg2);padding-left:10px;border-left:1px solid rgba(255,255,255,.14);white-space:nowrap}
.dot{flex-shrink:0;width:5px;height:5px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,.8);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45;transform:scale(.85)}}
.tools{display:flex;align-items:center;gap:8px}
.seg{display:flex;height:38px;padding:4px;border-radius:999px;box-shadow:0 10px 26px -12px rgba(0,0,0,.6)}
.thumb{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:rgba(255,255,255,.18);box-shadow:0 3px 12px rgba(0,0,0,.28),inset 0 0 0 .5px rgba(255,255,255,.28)}
.thumb.ready{transition:transform .4s var(--ease),width .4s var(--ease)}
.tab{position:relative;z-index:1;height:30px;padding:0 12px;border:0;border-radius:999px;background:none;color:var(--fg2);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:color .25s}
.tab.on,.tab:hover{color:var(--fg)}
.ibtn{position:relative;display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;cursor:pointer;box-shadow:0 10px 26px -12px rgba(0,0,0,.6);transition:transform .25s var(--ease)}
.ibtn:active{transform:translateZ(0) scale(.92)}
.ibtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn .i-s,.ibtn .i-g{position:absolute;transition:opacity .3s var(--ease),transform .38s var(--ease)}
[data-layout=grid] .i-g,[data-layout=scatter] .i-s{opacity:0;transform:scale(.6) rotate(-25deg);pointer-events:none}
[data-layout=grid] .i-s,[data-layout=scatter] .i-g{opacity:1;transform:scale(1) rotate(0deg)}
[data-mode=interactive] #layoutBtn,[data-mode=playlist] #layoutBtn{display:none}
@media(max-width:640px){.count{display:none}.tab{padding:0 10px;font-size:11.5px}}

/* ---------- project switcher window ---------- */
.pm{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,5,8,.68);opacity:0;visibility:hidden;transition:opacity .28s var(--ease),visibility 0s linear .28s}
.pm.open{opacity:1;visibility:visible;transition:opacity .28s var(--ease)}
.pm-box{width:100%;max-width:420px;max-height:min(78dvh,560px);display:flex;flex-direction:column;border-radius:30px;overflow:hidden;
 background:radial-gradient(120% 100% at 14% 0%,rgba(255,255,255,.15),transparent 55%),rgba(14,14,20,.9);
 box-shadow:0 34px 90px rgba(0,0,0,.88),0 0 80px -22px var(--aura-1);
 transform:scale(.94) translateY(10px);transition:transform .36s var(--ease)}
.pm.open .pm-box{transform:none}
.pm-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.pm-t{font-size:14px;font-weight:600;letter-spacing:.04em}
.pm-x{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,255,255,.08);cursor:pointer;transition:transform .2s var(--ease)}
.pm-x:active{transform:scale(.9)}
.pm-x svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.pm-list{display:flex;flex-direction:column;gap:10px;padding:14px 16px 18px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.pm-list::-webkit-scrollbar{display:none}
.pitem{display:flex;align-items:center;gap:13px;width:100%;padding:9px;border:0;border-radius:20px;text-align:left;cursor:pointer;
 background:rgba(255,255,255,.04);transition:transform .25s var(--ease),background .25s var(--ease),box-shadow .25s var(--ease)}
.pitem:active{transform:scale(.98)}
@media(hover:hover){.pitem:hover{background:rgba(255,255,255,.085)}}
.pitem.active{background:radial-gradient(120% 100% at 0% 0%,color-mix(in srgb,var(--aura-1) 24%,transparent),rgba(255,255,255,.07));
 box-shadow:0 10px 28px -12px rgba(0,0,0,.7),inset 0 0 0 1px color-mix(in srgb,var(--aura-1) 55%,rgba(255,255,255,.2))}
.pthumb{flex-shrink:0;width:54px;height:54px;border-radius:14px;overflow:hidden;display:grid;place-items:center;
 background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--aura-1) 42%,transparent),rgba(255,255,255,.05))}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pthumb svg{width:20px;height:20px;fill:none;stroke:var(--fg);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ptitle{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{font-size:12px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbadge{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:10.5px;color:var(--fg2);background:rgba(255,255,255,.06)}
.pitem.active .pbadge{color:var(--fg);background:rgba(255,255,255,.12)}

/* ---------- stage ---------- */
main{position:fixed;inset:0;z-index:2;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
main::-webkit-scrollbar{display:none}
.canvas{position:relative;width:calc(100% - 40px);max-width:1240px;margin:76px auto 0;min-height:calc(100dvh - 110px)}
[data-mode=gallery][data-layout=grid] .canvas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));align-content:start;align-items:start;min-height:0;gap:22px;margin-top:84px;padding-bottom:48px;height:auto!important}
[data-mode=gallery][data-layout=grid] .card{position:relative!important;left:auto!important;top:auto!important;width:auto!important;translate:none!important}
.canvas[data-empty]::after{content:attr(data-empty-msg);position:absolute;left:0;right:0;top:48px;text-align:center;font-size:13px;color:var(--fg2)}

/* ---------- gallery cards ---------- */
.card{position:absolute;display:flex;flex-direction:column;gap:10px;padding:8px;border:0;border-radius:28px;text-align:left;cursor:pointer;opacity:0;touch-action:manipulation;contain:layout style;
 box-shadow:0 20px 44px -20px rgba(0,0,0,.8),0 0 60px -24px var(--item-aura,var(--aura-1));
 transition:transform .45s var(--ease),box-shadow .45s var(--ease),top .5s var(--ease)}
.card.in{opacity:1;animation:rise .7s var(--ease) var(--d,0ms) backwards}
.card.settled{opacity:1;animation:none}
.card.flipping{will-change:transform;transition:none}
@keyframes rise{from{opacity:0;transform:translate3d(0,18px,0) scale(.97)}}
.card:active{transform:scale(.975)}
@media(hover:hover){.card:hover{z-index:15!important;transform:translateY(-4px);box-shadow:0 28px 64px -20px rgba(0,0,0,.9),0 0 80px -16px var(--item-aura,var(--aura-1))}.card:hover img,.card:hover video{transform:scale(1.04)}}
.frame{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:20px;background:rgba(255,255,255,.04)}
.frame.loaded{aspect-ratio:auto}
.frame::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.08) 50%,transparent 75%);background-size:200% 100%;animation:shimmer 1.6s linear infinite;pointer-events:none;transition:opacity .4s ease}
.frame.loaded::before{opacity:0;animation:none}
@keyframes shimmer{to{background-position:-200% 0}}
.frame::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16);pointer-events:none}
.frame img,.frame video{display:block;width:100%;height:auto;opacity:0;transition:opacity .45s var(--ease),transform .7s var(--ease);pointer-events:none}
.frame.loaded img,.frame.loaded video{opacity:1}
.vbadge{position:absolute;top:10px;right:10px;z-index:2;display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;font-size:10px;font-family:var(--mono);background:rgba(10,10,14,.72);color:var(--fg);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.24)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px 4px}
.tw{min-width:0;display:flex;flex-direction:column;gap:3px}
.ttl{font-size:13.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{flex-shrink:0;padding:5px 11px;border-radius:999px;font-size:11px;color:var(--fg2)}
@media(max-width:680px){body[data-mode=gallery]:not([data-layout=grid]) .tag{display:none}}

/* ---------- interactive & playlist stages ---------- */
.ix-wrap{display:flex;flex-direction:column;gap:12px;max-width:900px;margin:10px auto 36px;padding:12px;border-radius:30px;box-shadow:0 28px 70px -20px rgba(0,0,0,.88),0 0 80px -22px var(--aura-1);animation:rise .6s var(--ease) backwards}
.ix-frame{position:relative;width:100%;height:min(68dvh,600px);border-radius:20px;overflow:hidden;background:#08080c;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16)}
.ix-frame iframe{display:block;width:100%;height:100%;border:0;image-rendering:pixelated}
.ix-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 6px}
.ix-info{min-width:0;display:flex;flex-direction:column;gap:2px}
.ix-ctl{font-size:11px;font-family:var(--mono);color:var(--fg2)}
.ix-fs{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:0;border-radius:999px;font-size:11.5px;font-weight:500;cursor:pointer;background:rgba(255,255,255,.1);transition:transform .2s var(--ease)}
.ix-fs svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ix-wrap.fs-fallback{position:fixed;inset:0;z-index:45;max-width:none;margin:0;border-radius:0;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.ix-wrap.fs-fallback .ix-frame{height:calc(100% - 52px)}
.pl-wrap{display:flex;flex-direction:column;gap:18px;max-width:760px;margin:10px auto 48px;animation:rise .6s var(--ease) backwards}
.pl-deck{display:flex;flex-direction:column;gap:16px;padding:18px;border-radius:30px;box-shadow:0 28px 70px -20px rgba(0,0,0,.88),0 0 80px -22px var(--aura-1)}
.pl-top{display:flex;align-items:center;gap:16px}
.pl-art{flex-shrink:0;width:84px;height:84px;border-radius:20px;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--aura-1) 50%,transparent),rgba(255,255,255,.06));box-shadow:0 14px 32px -12px rgba(0,0,0,.8),inset 0 0 0 .5px rgba(255,255,255,.22)}
.pl-art img{width:100%;height:100%;object-fit:cover}
.pl-art svg{width:28px;height:28px;fill:none;stroke:var(--fg);stroke-width:1.6}
.pl-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pl-now{font-size:10px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg3)}
.pl-title{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-artist{font-size:12.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-prog{display:flex;flex-direction:column;gap:6px}
.pl-bar{width:100%;height:6px;border-radius:999px;background:rgba(255,255,255,.12);cursor:pointer;overflow:hidden}
.pl-fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--aura-1),#f5f5f9);transition:width .1s linear}
.pl-times{display:flex;justify-content:space-between;font-size:10.5px;font-family:var(--mono);color:var(--fg3)}
.pl-btns{display:flex;align-items:center;justify-content:center;gap:14px}
.pl-cbtn{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.07);cursor:pointer}
.pl-cbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pl-play{width:50px;height:50px;background:rgba(255,255,255,.18);box-shadow:0 8px 24px -8px rgba(0,0,0,.7),inset 0 0 0 .5px rgba(255,255,255,.35)}
.pl-play svg{width:20px;height:20px;fill:currentColor;stroke:none}
.pl-tracks{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border:0;border-radius:20px;text-align:left;cursor:pointer}
.trow.on{box-shadow:0 12px 30px -14px rgba(0,0,0,.8),inset 0 0 0 1px color-mix(in srgb,var(--aura-1) 60%,rgba(255,255,255,.25))}
.tnum{width:22px;font-size:11px;font-family:var(--mono);color:var(--fg3);text-align:center}
.tinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tttl{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tart{font-size:11px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdur{font-size:11px;font-family:var(--mono);color:var(--fg3)}

/* ---------- mobile power-saving & GPU tuning ---------- */
@media(max-width:768px){
 .rays{display:none}
 .mist{animation-duration:36s;opacity:.5}
 .glass{-webkit-backdrop-filter:blur(12px) saturate(140%);backdrop-filter:blur(12px) saturate(140%)}
 .card{box-shadow:0 12px 26px -12px rgba(0,0,0,.78),0 0 34px -16px var(--item-aura,var(--aura-1))}
}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px 32px;background:radial-gradient(ellipse 80% 70% at 50% 45%,rgba(5,5,8,.76),rgba(5,5,8,.95));opacity:0;visibility:hidden;transition:opacity .32s var(--ease),visibility 0s linear .32s}
.lb.open{opacity:1;visibility:visible;transition:opacity .32s var(--ease)}
body.modal-active header,body.modal-active main{pointer-events:none}
.lb .ibtn,.lb .fbtn{-webkit-backdrop-filter:none;backdrop-filter:none;background:radial-gradient(120% 100% at 14% 0%,rgba(255,255,255,.15),transparent 58%),linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03)),rgba(16,16,22,.82)}
.lb .ibtn{position:absolute;z-index:5}
.lb-x{top:max(18px,env(safe-area-inset-top));right:max(18px,env(safe-area-inset-right))}
.lb-p,.lb-n{top:50%;margin-top:-19px}
.lb-p{left:max(18px,env(safe-area-inset-left))}.lb-n{right:max(18px,env(safe-area-inset-right))}
@media(max-width:680px){.lb-p,.lb-n{display:none}}
.lb-in{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:92vw;pointer-events:none}
.scene,.lb-ctl{pointer-events:auto}
.scene{perspective:1500px;display:grid;place-items:center;cursor:pointer;transform:scale(.93) translateY(12px);transition:transform .45s var(--ease);touch-action:manipulation}
.lb.open .scene{transform:none}
.flip{display:grid;place-items:center;transform-style:preserve-3d;transition:transform .65s var(--ease)}
.flip.on{transform:rotateY(180deg)}
.front,.back{grid-area:1/1;border-radius:28px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{padding:8px;background:rgba(255,255,255,.06);box-shadow:0 34px 90px rgba(0,0,0,.85),0 0 80px -18px var(--aura-1)}

/* ---------- lazy loader for individual data/*.js files ---------- */
const loadedScripts=new Map();

/* ---------- tabs ---------- */
const tabs=$$("[data-look-btn]"),thumb=$("#thumb");

/* ---------- FLIP layout switch ---------- */
let flipTok=0;

 if((activeProj.type||"gallery")!=="gallery")return;
 const tok=++flipTok,vh=innerHeight;
 const first=cards.map(c=>c.getBoundingClientRect());
 cards.forEach(c=>{c.getAnimations?.().forEach(a=>a.cancel());c.classList.remove("flipping");c.style.transformOrigin=""});

 cards.forEach(c=>{c.classList.add("settled");c.style.translate="";if(grid)c.style.zIndex=""});
 if(grid)canvas.style.height="";else layout();
 if(stage.scrollTop)stage.scrollTop=0;
 const last=cards.map(c=>c.getBoundingClientRect());
 if(!reduceMotion()){
  cards.forEach((c,i)=>{
   const f=first[i],l=last[i];if(!f||!l||!f.width||!l.width)return;
   if((f.bottom<-120&&l.bottom<-120)||(f.top>vh+120&&l.top>vh+120))return;

   const anim=c.animate([{transform:`translate3d(${dx.toFixed(1)}px,${dy.toFixed(1)}px,0) scale(${s.toFixed(4)})`},{transform:"translate3d(0,0,0) scale(1)"}],{duration:360,delay:Math.min(i*14,84),easing:"cubic-bezier(.22,1,.36,1)",fill:"backwards"});
   anim.onfinish=()=>{if(tok===flipTok){c.style.transformOrigin="";c.classList.remove("flipping")}};
  });

};

/* ---------- floating motes ---------- */
let fxId=0,fxBusy=false;
function startFx(){if(!fxId&&!modal&&!pmOpen&&!fxBusy&&!document.hidden&&!navigator.connection?.saveData)fxId=requestAnimationFrame(fxTick)}
let fxTick;
(()=>{const cv=$("#fx"),ctx=cv.getContext("2d");let W,H,lastT=0;
 const size=()=>{const mob=innerWidth<768,d=mob?1:Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)};size();

  for(const m of motes){m.p+=m.f;m.x+=m.vx+Math.sin(m.p)*.2;m.y+=m.vy;
   if(m.y<-14){m.y=H+14;m.x=Math.random()*W}if(m.x<-14)m.x=W+14;if(m.x>W+14)m.x=-14;
   ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,6.283);ctx.fillStyle=`rgba(${r},${g},${b},${Math.min(m.a*(.65+.35*Math.sin(m.p*1.8)),.48).toFixed(3)})`;ctx.fill()}};
 let t,st;addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(size,150)},{passive:true});
 stage.addEventListener("scroll",()=>{fxBusy=true;clearTimeout(st);st=setTimeout(()=>{fxBusy=false;startFx()},140)},{passive:true});
 document.addEventListener("visibilitychange",startFx);startFx()})();

/* ---------- desktop-only mouse parallax ---------- */
let tx=0,ty=0,cx=0,cy=0,pr=0;
function par(){if(modal||pmOpen||grid||(activeProj.type||"gallery")!=="gallery"){pr=0;return}cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;
 for(const c of cards)c.style.translate=`${(cx*c._d).toFixed(2)}px ${(cy*c._d).toFixed(2)}px`;
 pr=Math.abs(tx-cx)+Math.abs(ty-cy)>.02?requestAnimationFrame(par):0}
addEventListener("pointermove",e=>{if(e.pointerType!=="mouse"||modal||pmOpen||grid||(activeProj.type||"gallery")!=="gallery")return;tx=(e.clientX/innerWidth*2-1)*12;ty=(e.clientY/innerHeight*2-1)*9;pr||(pr=requestAnimationFrame(par))},{passive:true});

/* ---------- palette & manual hex aura ---------- */
const palCache=new Map(),sc=document.createElement("canvas");sc.width=sc.height=36;
const sx=sc.getContext("2d",{willReadFrequently:true});
const hex=a=>"#"+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
function hexToPalette(h){

}
async function palette(key,source){

 try{let bm=source;
  if(source instanceof HTMLImageElement){try{bm=await createImageBitmap(source,{resizeWidth:36,resizeHeight:36,resizeQuality:"low"})}catch(_){bm=source}}

   const mx=Math.max(r,g,b),mn=Math.min(r,g,b),s=mx?(mx-mn)/mx:0,l=(.299*r+.587*g+.114*b)/255;

   o.r+=r;o.g+=g;o.b+=b;o.c++;o.s+=s}

  const res={a:hex(p),b:hex(s2),abyss:hex(p.map(v=>v*.2)),tint:[180+p[0]*.28,180+p[1]*.28,185+p[2]*.28].map(Math.round)};
  palCache.set(key,res);return res}catch(_){return null}}
let front=$("#atmA"),back=$("#atmB"),curA="",fadeT=0;
[["--aura-1","#9b221c"],["--aura-2","#481a16"],["--abyss","#1c0907"]].forEach(([k,v])=>front.style.setProperty(k,v));
function applyAtmosphere(p){if(!p)return;tint=p.tint;

 const n=back;n.style.transition="none";n.classList.remove("on");void n.offsetWidth;n.style.transition="";
 n.style.setProperty("--aura-1",p.a);n.style.setProperty("--aura-2",p.b);n.style.setProperty("--abyss",p.abyss);

/* ---------- scatter layout ---------- */
const MP=[{x:.04,w:.46,g:-12,d:.45},{x:.5,w:.46,g:36,d:.7},{x:.12,w:.56,g:24,d:.85},{x:.44,w:.5,g:-16,d:.55},{x:.04,w:.45,g:34,d:.65},{x:.48,w:.48,g:28,d:.5}];
const DP=[{x:.07,w:.3,g:-24,d:.45},{x:.6,w:.32,g:28,d:.75},{x:.24,w:.34,g:-12,d:.9},{x:.48,w:.31,g:-40,d:.6},{x:.07,w:.28,g:24,d:.5},{x:.65,w:.29,g:-30,d:.8}];
let lt=0;const scheduleLayout=()=>{lt||(lt=requestAnimationFrame(()=>{lt=0;layout();moveThumb()}))};
function layout(){
 if(grid||!cards.length||(activeProj.type||"gallery")!=="gallery")return;
 const W=canvas.clientWidth;if(!W)return;

  el._d=p.d;el._l=l;el._w=w;el.style.width=w+"px";el.style.left=l+"px";el.style.zIndex=Math.round(p.d*10)});

 let bottom=0;
 cards.forEach((el,i)=>{const p=P[i%P.length],h=heights[i];let top=8;
  if(i){const q=cards[i-1],ov=el._l<q._l+q._w+16&&el._l+el._w+16>q._l;
   top=ov?bottom+Math.max(20,p.g+24):Math.max(bottom-Math.min(h,el._w*.85)*.42+p.g,q._t+42)}
  el._t=top;el.style.top=Math.round(top)+"px";bottom=Math.max(bottom,top+h)});

new ResizeObserver(scheduleLayout).observe(stage);

/* ---------- EXIF / Media Metadata ---------- */
const exifCache=new Map();
function parseTiff(v,t){
 const L=v.getUint16(t)===0x4949,g16=o=>v.getUint16(t+o,L),g32=o=>v.getUint32(t+o,L),p={},

  for(let i=0;i<n;i++){const e=off+2+i*12,tag=g16(e),c=g32(e+4),vo=g32(e+8);
   if(tag===0x10F)p.make=str(vo,c);else if(tag===0x110)p.model=str(vo,c);else if(tag===0x131)p.software=str(vo,c);
   else if(tag===0x9003||tag===0x132)p.date=p.date||str(vo,c);else if(tag===0x8769)ifd(vo);
   else if(tag===0x829A){const[a,b]=rat(vo);if(a&&b)p.shutter=a<b?`1/${Math.round(b/a)}s`:`${(a/b).toFixed(1)}s`}
   else if(tag===0x829D){const[a,b]=rat(vo);if(a&&b)p.aperture="f/"+(a/b).toFixed(1).replace(/\.0$/,"")}
   else if(tag===0x8827)p.iso="ISO "+g16(e+8);
   else if(tag===0x920A){const[a,b]=rat(vo);if(a&&b)p.focal=(a/b).toFixed(2).replace(/\.00$/,"")+" mm"}}};
 ifd(g32(4));return p}
async function readExif(src){
 if(exifCache.has(src))return exifCache.get(src);
 let out=null;
 try{let r=await fetch(src,{headers:{Range:"bytes=0-65535"}});const v=new DataView(await r.arrayBuffer());
  if(v.getUint16(0)===0xFFD8){let o=2;
   while(o<v.byteLength-4){const m=v.getUint16(o),len=v.getUint16(o+2);
    if(m===0xFFE1&&v.getUint32(o+4)===0x45786966){out=parseTiff(v,o+10);break}
    if((m&0xFF00)!==0xFF00)break;o+=2+len}}}catch(_){}
 exifCache.set(src,out);return out}
async function fillExif(it,mediaEl){
 const T=(id,v)=>$(id).textContent=v||"—";
 if(it.isVid){
  $("#mL1").textContent="Duration";$("#mL2").textContent="Format";$("#mL3").textContent="Ratio";$("#mL4").textContent="Audio";
  const ext=(it.file.split(".").pop()||"MP4").toUpperCase();
  const vw=lbVid.videoWidth||mediaEl?.videoWidth||0,vh=lbVid.videoHeight||mediaEl?.videoHeight||0;
  const dur=lbVid.duration||mediaEl?.duration||0;
  T("#xCam",it.sub||"Motion Sequence");T("#xDate",activeProj.year||"Video");
  T("#xAp",dur?fmtTime(dur):"Loop");T("#xSh",ext);
  T("#xFo",vw&&vh?`${(vw/vh).toFixed(2)}:1`:"—");T("#xIso","Stereo");
  T("#xApp",it.app||"—");T("#xFile",it.file);
  T("#xRes",vw&&vh?`${vw} × ${vh}`:"—");
  return;
 }
 $("#mL1").textContent="Aperture";$("#mL2").textContent="Shutter";$("#mL3").textContent="Focal";$("#mL4").textContent="ISO";
 const m=it.exif||{},full=m.camera&&m.captured&&m.aperture&&m.shutter&&m.focal&&m.iso;
 const a=full?{}:(await readExif(it.src))||{};
 T("#xCam",m.camera||`${a.make||""} ${a.model||""}`.trim());
 T("#xDate",m.captured||(a.date||"").replace(/^(\d{4}):(\d{2}):(\d{2})\s+(\d{2}:\d{2}).*$/,"$3/$2/$1 · $4"));
 T("#xAp",m.aperture||a.aperture);T("#xSh",m.shutter||a.shutter);T("#xFo",m.focal||a.focal);T("#xIso",m.iso||a.iso);
 T("#xApp",m.app||it.app||a.software);T("#xFile",it.file);
 const targetImg=(lbImg.naturalWidth?lbImg:mediaEl);
 T("#xRes",m.resolution||(targetImg&&targetImg.naturalWidth?`${targetImg.naturalWidth} × ${targetImg.naturalHeight} (${(targetImg.naturalWidth*targetImg.naturalHeight/1e6).toFixed(1)} MP)`:""))}

const decoded=new Map();
function predecode(src){let im=decoded.get(src);
 if(!im){im=new Image();im.decoding="async";im.src=src;decoded.set(src,im);if(decoded.size>2)decoded.delete(decoded.keys().next().value)}

let selTok=0;

  const[,p]=await Promise.all([it.isVid?Promise.resolve():predecode(it.src),palProm]);
  if(tok!==selTok)return;
  applyAtmosphere(p);flip.classList.remove("on");$("#fbtnT").textContent="Media info";
  if(it.isVid){

function addCard(it,i){
 const el=document.createElement("button");el.type="button";el.className="card glass in";el.style.setProperty("--d",Math.min(i*70,420)+"ms");
 el.setAttribute("aria-label","Inspect "+it.caption);
 const mediaHtml=it.isVid
  ?`<video src="${esc(it.src)}" ${it.poster?`poster="${esc(it.poster)}"`:""} muted loop playsinline preload="metadata"></video><span class="vbadge">▶ VIDEO</span>`
  :`<img alt="${esc(it.caption)}" decoding="async" draggable="false">`;
 el.innerHTML=`<div class="frame">${mediaHtml}</div><div class="meta"><div class="tw"><div class="ttl">${esc(it.caption)}</div><div class="sub">${esc(it.sub||"Stillness")}</div></div>${it.tag?`<span class="tag glass">${esc(it.tag)}</span>`:""}</div>`;
 const frame=el.querySelector(".frame"),mediaEl=el.querySelector("img,video");
 const onReady=async()=>{
  const w=mediaEl.naturalWidth||mediaEl.videoWidth,h=mediaEl.naturalHeight||mediaEl.videoHeight;
  if(w&&h)frame.style.aspectRatio=`${w}/${h}`;
  frame.classList.add("loaded");scheduleLayout();
  const p=it.aura?hexToPalette(it.aura):await palette(it.thumb,mediaEl);
  if(p){el.style.setProperty("--item-aura",p.a);if(entries[cur]===it)applyAtmosphere(p)}
 };
 if(it.isVid){
  mediaEl.onloadeddata=onReady;
  mediaEl.onerror=()=>{frame.classList.add("loaded");scheduleLayout()};
  vidObs.observe(mediaEl);
 }else{
  mediaEl.fetchPriority=i<4?"high":"low";
  mediaEl.loading=i<4?"eager":"lazy";
  mediaEl.onload=onReady;
  mediaEl.onerror=()=>{if(mediaEl.src!==new URL(it.src,location.href).href){mediaEl.src=it.src;return}
   if(it.auto){const k=entries.indexOf(it);if(k>-1){entries.splice(k,1);cards.splice(k,1)}el.remove();updateCount();scheduleLayout();return}
   frame.classList.add("loaded");scheduleLayout()};
  mediaEl.src=it.thumb;
 }
 el.onclick=()=>{if(!modal&&!pmOpen)select(entries.indexOf(it),true)};
 canvas.append(el);cards.push(el);
}

function mountPlaylist(proj){
 const fDir=cleanDir(proj.folder||"audio");
 let tracks=(proj.tracks||[]).map(t=>{if(typeof t==="string")t={file:t};const file=t.file||String(t.src).split("/").pop();return{file,src:t.src||`./${fDir}/${encodeURIComponent(file)}`,title:t.title||capOf(file),artist:t.artist||proj.title||"ustzyix",cover:t.cover?`./${fDir}/${encodeURIComponent(t.cover)}`:"",aura:t.aura||""}});

 function loadTrack(i,autoPlay){if(!tracks.length)return;idx=(i+tracks.length)%tracks.length;const tr=tracks[idx];aud.src=tr.src;wrap.querySelector("#plTitle").textContent=tr.title;wrap.querySelector("#plArtist").textContent=tr.artist;wrap.querySelector("#plCur").textContent="0:00";wrap.querySelector("#plDur").textContent="0:00";wrap.querySelector("#plFill").style.width="0%";if(tr.cover){artEl.innerHTML=`<img src="${esc(tr.cover)}" alt=""/>`;const im=artEl.querySelector("img");im.onload=async()=>{const p=tr.aura?hexToPalette(tr.aura):await palette(tr.cover,im);applyAtmosphere(p)}}else{artEl.innerHTML=TYPE_ICON.playlist;if(tr.aura)applyAtmosphere(hexToPalette(tr.aura))}[...listEl.children].forEach((r,k)=>r.classList.toggle("on",k===idx));if(autoPlay)aud.play().then(()=>setPlayIcon(true)).catch(()=>setPlayIcon(false))}

 aud.onloadedmetadata=()=>{wrap.querySelector("#plDur").textContent=fmtTime(aud.duration)};aud.onended=()=>loadTrack(idx+1,true);

/* ---------- GitHub folder auto-discovery ---------- */
const DTTL=15*60*1000;
function repoInfo(){
 if(G.repo){const[o,r]=G.repo.split("/");return{o,r}}
 const h=location.hostname,seg=location.pathname.split("/")[1];
 return h.endsWith(".github.io")?{o:h.split(".")[0],r:seg&&!/\./.test(seg)?seg:h}:null}
async function discoverFiles(folder,regex,pid,onFiles){
 const r=repoInfo();if(!r)return;
 const dk=`gallery_dir_v4_${folder}`;
 let cached=null;
 try{cached=JSON.parse(localStorage.getItem(dk)||"null")}catch(_){}
 if(cached?.files?.length){if(activeProj.id===pid)onFiles(cached.files);if(Date.now()-cached.t<DTTL)return}
 try{const res=await fetch(`https://api.github.com/repos/${r.o}/${r.r}/contents/${folder}`);if(!res.ok)return;
  const files=(await res.json()).filter(f=>f.type==="file"&&regex.test(f.name)).map(f=>f.name).sort();
  try{localStorage.setItem(dk,JSON.stringify({t:Date.now(),files}))}catch(_){}
  if(activeProj.id===pid)onFiles(files)}catch(_){}
}

/* ---------- project switcher ---------- */
let loadTok=0;
async function loadProject(baseProj,pushHash){
 stopAudio();
 cards.forEach(c=>{const v=c.querySelector("video");if(v){vidObs.unobserve(v);v.pause();v.removeAttribute("src")}});
 const tok=++loadTok;
 activeProj=baseProj;selTok++;cur=0;tx=ty=cx=cy=0;
 const mode=baseProj.type||"gallery";
 body.dataset.mode=mode;
 $("#projName").textContent=baseProj.title||"Archive";
 $("#count").textContent="Loading…";
 document.title=`ustzyix — ${baseProj.title||"Visual Studio"}`;
 if(pushHash&&baseProj.id)history.replaceState(null,"","#"+encodeURIComponent(baseProj.id));
 canvas.innerHTML="";cards=[];entries=[];canvas.style.height="";canvas.removeAttribute("data-empty");
 if(stage.scrollTop)stage.scrollTop=0;
 if(baseProj.aura)applyAtmosphere(hexToPalette(baseProj.aura));

 const{ok,proj}=await fetchProjectDetail(baseProj);
 if(tok!==loadTok)return;
 activeProj=proj;
 if(proj.aura)applyAtmosphere(hexToPalette(proj.aura));

 if(!ok&&proj.data){
  updateCount(`Could not load ${proj.data} — check file syntax.`);
  return;
 }

 if(mode==="interactive"){mountInteractive(proj);return}
 if(mode==="playlist"){mountPlaylist(proj);return}

 entries=(proj.photos||[]).filter(p=>p&&(typeof p==="string"||p.file||p.src)).map((p,i)=>toEntry(p,i,proj.folder,proj.thumbFolder));
 entries.forEach(addCard);
 updateCount();scheduleLayout();
 if(proj.discover!==false){
  discoverFiles(cleanDir(proj.folder||"images"),MEDIA_OK,proj.id,files=>{
   const have=new Set(entries.map(p=>p.file));
   files.filter(f=>!have.has(f)).forEach(f=>{const e=toEntry({file:f,auto:true},entries.length,proj.folder,proj.thumbFolder);entries.push(e);addCard(e,entries.length-1)});
   updateCount();scheduleLayout();
  });
 }
}
