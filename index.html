<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="ustzyix — Atmospheric visual and photographic studio archive." />
  <meta name="theme-color" content="#050507" />
  <title>ustzyix — Visual Studio</title>
  <style>
    :root {
      /* Liquid Glass & Pryzm Studio Tokens */
      --bg-obsidian: #050507;
      --fg-color: #f4f4f8;
      --fg-muted: rgba(244, 244, 248, 0.66);
      --fg-whisper: rgba(244, 244, 248, 0.38);
      --aura-primary: #9b221c;
      --aura-secondary: #481a16;
      --liquid-bg: rgba(255, 255, 255, 0.045);
      --liquid-bg-hover: rgba(255, 255, 255, 0.085);
      --liquid-bg-active: rgba(255, 255, 255, 0.14);
      --liquid-rim: inset 0 1px 0.5px rgba(255, 255, 255, 0.22), inset 0 -1px 0.5px rgba(255, 255, 255, 0.04);
      --liquid-rim-strong: inset 0 1px 1px rgba(255, 255, 255, 0.34), inset 0 -1px 1px rgba(255, 255, 255, 0.06);
      --px: 0px;
      --py: 0px;
      --ease-liquid: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-drift: cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      background-color: var(--bg-obsidian);
      color: var(--fg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Display", "Segoe UI", sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    .scatter-canvas, header, .lightbox {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    img {
      -webkit-user-drag: none;
      pointer-events: none;
    }

    :focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.65);
      outline-offset: 3px;
    }

    /* =========================================================
       UNIFIED ATMOSPHERIC LAYERS (NO DOUBLE-LAYER SEAMS)
       ========================================================= */
    #ambient-layer {
      position: fixed;
      inset: 0;
      z-index: -8;
      background:
        radial-gradient(ellipse 85% 65% at 50% 34%, rgba(155, 34, 28, 0.56) 0%, transparent 72%),
        radial-gradient(ellipse 95% 78% at 50% 82%, rgba(72, 26, 22, 0.42) 0%, var(--bg-obsidian) 88%);
      transition: background 1.2s var(--ease-liquid);
      pointer-events: none;
    }

    .mist-far {
      position: fixed;
      inset: -24%;
      z-index: -7;
      pointer-events: none;
      opacity: 0.66;
      background:
        radial-gradient(ellipse 70% 56% at 24% 32%, var(--aura-primary) 0%, transparent 75%),
        radial-gradient(ellipse 68% 62% at 78% 68%, var(--aura-secondary) 0%, transparent 78%);
      will-change: transform;
      animation: mistSwayA 26s ease-in-out infinite alternate;
    }

    .mist-near {
      position: fixed;
      inset: -18%;
      z-index: -6;
      pointer-events: none;
      opacity: 0.40;
      background:
        radial-gradient(ellipse 60% 48% at 72% 28%, var(--aura-primary) 0%, transparent 74%),
        radial-gradient(ellipse 72% 52% at 28% 76%, rgba(220, 225, 245, 0.09) 0%, transparent 78%);
      will-change: transform;
      animation: mistSwayB 19s ease-in-out infinite alternate;
    }

    @keyframes mistSwayA {
      0% { transform: translate3d(-2.5%, -1.2%, 0) scale(1); }
      100% { transform: translate3d(2.5%, 1.5%, 0) scale(1.06); }
    }

    @keyframes mistSwayB {
      0% { transform: translate3d(2%, 1.1%, 0) scale(1.03); }
      100% { transform: translate3d(-2.4%, -1.3%, 0) scale(0.98); }
    }

    /* Fluted Glass Texture without hard cutoff band */
    .fluted-glass-layer {
      position: fixed;
      inset: 0;
      z-index: -5;
      pointer-events: none;
      opacity: 0;
      background-image: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.04) 0px,
        rgba(255, 255, 255, 0.008) 11px,
        rgba(0, 0, 0, 0.24) 22px,
        rgba(255, 255, 255, 0.025) 34px
      );
      transition: opacity 0.7s var(--ease-liquid);
    }

    body[data-look="fluted"] .fluted-glass-layer {
      opacity: 0.85;
    }

    .halftone-layer {
      position: fixed;
      inset: 0;
      z-index: -5;
      pointer-events: none;
      opacity: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.14) 1px, transparent 1px);
      background-size: 16px 16px;
      transition: opacity 0.7s var(--ease-liquid);
    }

    body[data-look="halftone"] .halftone-layer {
      opacity: 0.52;
    }

    .god-rays {
      position: fixed;
      inset: -20%;
      z-index: -4;
      pointer-events: none;
      opacity: 0.28;
      background:
        radial-gradient(ellipse 20% 78% at 36% 24%, var(--aura-primary) 0%, transparent 78%),
        radial-gradient(ellipse 16% 72% at 54% 28%, rgba(255, 248, 240, 0.13) 0%, transparent 78%);
      transform: rotate(-22deg);
      will-change: transform, opacity;
      animation: raySweep 17s ease-in-out infinite alternate;
    }

    @keyframes raySweep {
      0% { transform: translate3d(-3%, -1%, 0) rotate(-24deg); opacity: 0.18; }
      50% { opacity: 0.32; }
      100% { transform: translate3d(3%, 1.5%, 0) rotate(-19deg); opacity: 0.22; }
    }

    /* Smooth edge falloff that never creates a stepped band */
    .void-vignette {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background: radial-gradient(
        ellipse 82% 76% at 50% 48%,
        transparent 45%,
        rgba(5, 5, 7, 0.38) 78%,
        rgba(3, 3, 5, 0.78) 100%
      );
    }

    #atmosphere-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
    }

    .film-grain {
      position: fixed;
      inset: -40px;
      width: calc(100% + 80px);
      height: calc(100% + 80px);
      z-index: 5;
      pointer-events: none;
      opacity: 0.038;
      background-repeat: repeat;
      will-change: transform;
      animation: grainShift 0.4s steps(3) infinite;
    }

    @keyframes grainShift {
      0% { transform: translate3d(0, 0, 0); }
      33% { transform: translate3d(20px, -16px, 0); }
      66% { transform: translate3d(-18px, 22px, 0); }
      100% { transform: translate3d(12px, 10px, 0); }
    }

    body.modal-active .mist-far,
    body.modal-active .mist-near,
    body.modal-active .god-rays,
    body.modal-active .film-grain {
      animation-play-state: paused !important;
    }

    /* =========================================================
       LIQUID GLASS TOP BAR (BORDERLESS / SPECULAR RIM ONLY)
       ========================================================= */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: max(14px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) 12px max(22px, env(safe-area-inset-left));
      z-index: 25;
      pointer-events: none;
    }

    .header-pill {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 36px;
      padding: 0 15px;
      border-radius: 999px;
      background: var(--liquid-bg);
      border: none;
      box-shadow: var(--liquid-rim), 0 12px 32px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
    }

    .brand-mark {
      width: 14px;
      height: 14px;
      border-radius: 5px;
      background: conic-gradient(from 140deg, var(--aura-primary), #f472b6, #818cf8, var(--aura-primary));
      box-shadow: 0 0 14px var(--aura-primary);
      transition: background 0.8s ease, box-shadow 0.8s ease;
    }

    .brand {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: lowercase;
      color: var(--fg-color);
    }

    .brand-divider {
      width: 1px;
      height: 12px;
      background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.18), transparent);
    }

    .presence-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--fg-muted);
    }

    .pulse-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.8);
      animation: solitaryPulse 3.6s ease-in-out infinite;
    }

    @keyframes solitaryPulse {
      0%, 100% { opacity: 0.45; transform: scale(0.88); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .studio-controls {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      height: 36px;
      padding: 4px;
      border-radius: 999px;
      background: var(--liquid-bg);
      border: none;
      box-shadow: var(--liquid-rim), 0 12px 32px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
    }

    .studio-tab {
      height: 28px;
      padding: 0 11px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--fg-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s var(--ease-liquid);
      white-space: nowrap;
    }

    .studio-tab:hover {
      color: var(--fg-color);
      background: var(--liquid-bg-hover);
    }

    .studio-tab.is-active {
      background: var(--liquid-bg-active);
      color: var(--fg-color);
      box-shadow: var(--liquid-rim);
    }

    @media (max-width: 640px) {
      .hide-mobile { display: none; }
      header { padding: max(12px, env(safe-area-inset-top)) 14px 10px 14px; }
      .studio-tab { padding: 0 9px; font-size: 9.5px; }
    }

    /* =========================================================
       MAIN CANVAS (FULL HEIGHT WITHOUT BOTTOM MUSIC BAR)
       ========================================================= */
    main {
      position: fixed;
      inset: 0;
      width: 100%;
      max-width: 1240px;
      height: 100dvh;
      margin: 0 auto;
      padding: 72px 20px 28px;
      z-index: 2;
      overflow: hidden;
      transition: filter 0.45s var(--ease-liquid), transform 0.5s var(--ease-drift);
    }

    body.modal-active main {
      filter: blur(12px) brightness(0.68);
      transform: scale(0.975);
      pointer-events: none;
    }

    .scatter-canvas {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: pan-y;
    }

    .scatter-canvas.is-grid-mode {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      align-content: center;
      gap: 24px;
      padding: 12px 8px;
      overflow-y: auto;
    }

    .scatter-canvas.is-grid-mode .scatter-item {
      position: relative !important;
      left: auto !important;
      top: auto !important;
      width: 100% !important;
      transform: none !important;
    }

    /* =========================================================
       LIQUID GLASS SPECIMEN CARDS (NO HARD OUTER BORDER)
       ========================================================= */
    .scatter-item {
      position: absolute;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      border-radius: 20px;
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.015) 100%);
      border: none;
      box-shadow:
        var(--liquid-rim),
        0 24px 60px -14px rgba(0, 0, 0, 0.75),
        0 0 60px -16px var(--item-aura, var(--aura-primary));
      backdrop-filter: blur(20px) saturate(145%);
      -webkit-backdrop-filter: blur(20px) saturate(145%);
      cursor: pointer;
      touch-action: manipulation;
      opacity: 0;
      transform: translate3d(0, 20px, 0);
      transition:
        opacity 0.8s var(--ease-liquid),
        transform 0.8s var(--ease-drift),
        box-shadow 0.45s ease,
        background 0.35s ease;
      will-change: transform, opacity;
      text-align: left;
    }

    .scatter-item.is-visible {
      opacity: 1;
      transform: translate3d(
        calc(var(--px) * var(--depth, 0.5)),
        calc(var(--py) * var(--depth, 0.5)),
        0
      );
    }

    @media (hover: hover) {
      .scatter-item:hover {
        z-index: 15 !important;
        background: linear-gradient(155deg, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0.03) 100%);
        box-shadow:
          var(--liquid-rim-strong),
          0 32px 80px -10px rgba(0, 0, 0, 0.88),
          0 0 82px -6px var(--item-aura, var(--aura-primary));
      }
      .scatter-item:hover .scatter-frame img {
        transform: scale(1.045);
      }
    }

    .scatter-item:active {
      transform: translate3d(
        calc(var(--px) * var(--depth, 0.5)),
        calc(var(--py) * var(--depth, 0.5)),
        0
      ) scale(0.975);
    }

    .scatter-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 13px;
      background-color: rgba(8, 8, 12, 0.65);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.14);
    }

    .scatter-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.01);
      transition: transform 0.75s var(--ease-drift);
    }

    .frame-chip {
      position: absolute;
      top: 9px;
      right: 9px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: var(--liquid-rim), 0 4px 12px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #ffffff;
      pointer-events: none;
    }

    .scatter-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 4px 2px;
      pointer-events: none;
    }

    .scatter-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .scatter-title {
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--fg-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scatter-sub {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--fg-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scatter-tag {
      flex-shrink: 0;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--liquid-bg);
      box-shadow: var(--liquid-rim);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      color: var(--fg-muted);
    }

    /* =========================================================
       LIQUID GLASS LIGHTBOX & 3D FLIP CARD
       ========================================================= */
    .lightbox {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px 36px;
      background: rgba(5, 5, 8, 0.78);
      backdrop-filter: blur(26px) saturate(145%);
      -webkit-backdrop-filter: blur(26px) saturate(145%);
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.35s var(--ease-liquid), visibility 0s linear 0.35s;
    }

    .lightbox.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.35s var(--ease-liquid), visibility 0s linear 0s;
    }

    .lightbox.is-closing {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease-out;
    }

    .lightbox-close,
    .lightbox-nav {
      position: absolute;
      z-index: 55;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: none;
      background: var(--liquid-bg-hover);
      box-shadow: var(--liquid-rim), 0 12px 28px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: var(--fg-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s var(--ease-liquid);
      touch-action: manipulation;
    }

    .lightbox-close {
      top: max(18px, env(safe-area-inset-top));
      right: max(20px, env(safe-area-inset-right));
    }

    .lightbox-close:hover {
      transform: scale(1.06);
      background: var(--liquid-bg-active);
      box-shadow: var(--liquid-rim-strong);
    }

    .lightbox-nav {
      top: 50%;
      transform: translateY(-50%);
    }

    .lightbox-nav:hover {
      transform: translateY(-50%) scale(1.06);
      background: var(--liquid-bg-active);
      box-shadow: var(--liquid-rim-strong);
    }

    .lightbox-nav.prev { left: max(18px, env(safe-area-inset-left)); }
    .lightbox-nav.next { right: max(18px, env(safe-area-inset-right)); }

    .lightbox-close svg,
    .lightbox-nav svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
    }

    @media (max-width: 680px) {
      .lightbox-nav { display: none; }
    }

    .lightbox-inner {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 92vw;
      pointer-events: none;
    }

    .lightbox.is-open .flip-scene {
      animation: openZoomBlur 0.5s var(--ease-drift) forwards;
    }

    .lightbox.is-closing .flip-scene {
      animation: closeZoomBlur 0.24s ease-in forwards;
    }

    @keyframes openZoomBlur {
      0% { opacity: 0; transform: scale(0.88) translate3d(0, 16px, 0); }
      100% { opacity: 1; transform: scale(1) translate3d(0, 0, 0); }
    }

    @keyframes closeZoomBlur {
      0% { opacity: 1; transform: scale(1) translate3d(0, 0, 0); }
      100% { opacity: 0; transform: scale(0.90) translate3d(0, 10px, 0); }
    }

    .flip-scene {
      perspective: 1500px;
      display: grid;
      place-items: center;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .flip-card {
      position: relative;
      display: grid;
      place-items: center;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 0.72s var(--ease-liquid);
    }

    .flip-card.is-pressing {
      transform: scale(0.975);
      transition: transform 0.18s ease-out;
    }

    .flip-card.is-flipped {
      transform: rotateY(180deg);
    }

    .flip-card.is-flipped.is-pressing {
      transform: rotateY(180deg) scale(0.975);
    }

    .flip-front {
      grid-area: 1 / 1;
      position: relative;
      padding: 11px;
      border-radius: 20px;
      background: linear-gradient(155deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.02) 100%);
      border: none;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      pointer-events: none;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        var(--liquid-rim-strong),
        0 34px 95px rgba(0, 0, 0, 0.9),
        0 0 85px -10px var(--aura-primary);
    }

    .flip-front img {
      display: block;
      max-width: min(88vw, 760px);
      max-height: 56dvh;
      width: auto;
      height: auto;
      border-radius: 12px;
      object-fit: contain;
    }

    .flip-back {
      grid-area: 1 / 1;
      width: 100%;
      height: 100%;
      min-width: min(88vw, 390px);
      min-height: 295px;
      border-radius: 20px;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      text-align: left;
      background:
        radial-gradient(circle at 16% 12%, rgba(255, 255, 255, 0.09) 0%, transparent 60%),
        rgba(14, 14, 20, 0.88);
      border: none;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        var(--liquid-rim-strong),
        0 34px 95px rgba(0, 0, 0, 0.92),
        0 0 75px -14px var(--aura-primary);
      transform: rotateY(180deg);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      pointer-events: none;
    }

    .exif-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.08);
    }

    .exif-device {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--fg-color);
    }

    .exif-device svg {
      width: 15px;
      height: 15px;
      opacity: 0.8;
    }

    .exif-date {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;

    function initFilmGrain() {
      const c = document.createElement("canvas");
      c.width = 96;
      c.height = 96;
      const ctx = c.getContext("2d");
      const imgData = ctx.createImageData(96, 96);
      const buf = imgData.data;
      for (let i = 0; i < buf.length; i += 4) {
        const v = (Math.random() * 255) | 0;
        buf[i] = v;
        buf[i + 1] = v;
        buf[i + 2] = v;
        buf[i + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
      filmGrainEl.style.backgroundImage = `url(${c.toDataURL("image/png")})`;
    }

    let isCanvasRunning = true;
    let canvasAnimId = null;

    function initAtmosphereCanvas() {
      const canvas = document.getElementById("atmosphere-canvas");
      const ctx = canvas.getContext("2d");
      let width = 0;
      let height = 0;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();

      let resizeTimeout = null;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          resize();
          if (!isGridMode) layoutScatterItems();
        }, 120);
      }, { passive: true });

      const count = width < 600 ? 28 : 44;
      const motes = Array.from({ length: count }, () => {
        const depth = Math.random();
        return {
          x: Math.random() * width,
          y: Math.random() * height,
          r: 0.65 + depth * 1.7,
          vx: (Math.random() - 0.5) * (0.14 + depth * 0.22),
          vy: -(0.12 + depth * 0.28),
          phase: Math.random() * Math.PI * 2,
          freq: 0.009 + Math.random() * 0.015,
          alpha: 0.08 + depth * 0.22,
          depth
        };
      });

      function tick() {
        if (!isCanvasRunning || document.hidden || document.body.classList.contains("modal-active")) {
          canvasAnimId = null;
          return;
        }

        ctx.clearRect(0, 0, width, height);
        const { r, g, b } = particleTint;

        for (let i = 0; i < motes.length; i++) {
          const m = motes[i];
          m.phase += m.freq;
          m.x += m.vx + Math.sin(m.phase) * 0.20;
          m.y += m.vy;

          if (m.y < -14) { m.y = height + 14; m.x = Math.random() * width; }
          if (m.x < -14) m.x = width + 14;
          if (m.x > width + 14) m.x = -14;

          const twinkle = 0.65 + 0.35 * Math.sin(m.phase * 1.8);
          const finalAlpha = Math.min(m.alpha * twinkle, 0.5);

          ctx.beginPath();
          ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${finalAlpha.toFixed(3)})`;
          ctx.fill();
        }

        canvasAnimId = requestAnimationFrame(tick);
      }

      window.startCanvasLoop = function() {
        if (!canvasAnimId && isCanvasRunning && !document.hidden && !document.body.classList.contains("modal-active")) {
          canvasAnimId = requestAnimationFrame(tick);
        }
      };

      window.startCanvasLoop();

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          if (canvasAnimId) cancelAnimationFrame(canvasAnimId);
          canvasAnimId = null;
        } else {
          window.startCanvasLoop();
        }
      });
    }

    function initLookAround() {
      let targetX = 0, targetY = 0, curX = 0, curY = 0, isParallaxActive = false;

      function stepParallax() {
        const dx = targetX - curX;
        const dy = targetY - curY;
        if (Math.abs(dx) < 0.01 && Math.abs(dy) < 0.01) {
          curX = targetX;
          curY = targetY;
          document.documentElement.style.setProperty("--px", `${curX.toFixed(2)}px`);
          document.documentElement.style.setProperty("--py", `${curY.toFixed(2)}px`);
          isParallaxActive = false;
          return;
        }
        curX += dx * 0.06;
        curY += dy * 0.06;
        document.documentElement.style.setProperty("--px", `${curX.toFixed(2)}px`);
        document.documentElement.style.setProperty("--py", `${curY.toFixed(2)}px`);
        requestAnimationFrame(stepParallax);
      }

      function wakeParallax() {
        if (!isParallaxActive) {
          isParallaxActive = true;
          requestAnimationFrame(stepParallax);
        }
      }

      window.addEventListener("pointermove", (e) => {
        if (document.body.classList.contains("modal-active") || isGridMode) return;
        targetX = ((e.clientX / window.innerWidth) * 2 - 1) * 10;
        targetY = ((e.clientY / window.innerHeight) * 2 - 1) * 8;
        wakeParallax();
      }, { passive: true });
    }

    function formatNewCaption(filename) {
      return filename
        .replace(/\.[^/.]+$/, "")
        .replace(/\(\d+\)/g, "")
        .replace(/^IMG[-_]?/i, "")
        .replace(/[-_]/g, " ")
        .trim() || "Stillness";
    }

    async function extractImageExif(src) {
      if (exifAutoCache.has(src)) return exifAutoCache.get(src);
      try {
        let res = await fetch(src, { headers: { Range: "bytes=0-65535" } }).catch(() => null);
        if (!res || (res.status !== 206 && res.status !== 200)) {
          res = await fetch(src).catch(() => null);
        }
        if (!res || !res.ok) return null;

        const buf = await res.arrayBuffer();
        const view = new DataView(buf);
        if (view.byteLength < 16 || view.getUint16(0) !== 0xFFD8) return null;

        let offset = 2;
        while (offset < view.byteLength - 4) {
          const marker = view.getUint16(offset);
          offset += 2;
          if (marker === 0xFFE1) {
            const len = view.getUint16(offset);
            if (offset + len > view.byteLength) break;
            const header = String.fromCharCode(
              view.getUint8(offset + 2),
              view.getUint8(offset + 3),
              view.getUint8(offset + 4),
              view.getUint8(offset + 5)
            );
            if (header === "Exif") {
              const tiffStart = offset + 8;
              if (tiffStart + 8 > view.byteLength) break;
              const little = view.getUint16(tiffStart) === 0x4949;
              const get16 = (o) => (tiffStart + o + 2 <= view.byteLength ? view.getUint16(tiffStart + o, little) : 0);
              const get32 = (o) => (tiffStart + o + 4 <= view.byteLength ? view.getUint32(tiffStart + o, little) : 0);
              const readStr = (o, count) => {
                let s = "";
                for (let i = 0; i < count - 1; i++) {
                  if (tiffStart + o + i >= view.byteLength) break;
                  const ch = view.getUint8(tiffStart + o + i);
                  if (ch === 0) break;
                  s += String.fromCharCode(ch);
                }
                return s.trim();
              };

              const parsed = {};
              const parseIFD = (ifdOffset) => {
                if (!ifdOffset || tiffStart + ifdOffset + 2 > view.byteLength) return;
                const entriesCount = get16(ifdOffset);
                for (let i = 0; i < entriesCount; i++) {
                  const entryOffset = ifdOffset + 2 + i * 12;
                  if (tiffStart + entryOffset + 12 > view.byteLength) break;
                  const tag = get16(entryOffset);
                  const type = get16(entryOffset + 2);
                  const count = get32(entryOffset + 4);
                  const valOffset = get32(entryOffset + 8);

                  if (tag === 0x010F && type === 2) parsed.make = readStr(valOffset, count);
                  if (tag === 0x0110 && type === 2) parsed.model = readStr(valOffset, count);
                  if (tag === 0x0131 && type === 2) parsed.software = readStr(valOffset, count);
                  if (tag === 0x0132 && type === 2) parsed.dateTime = readStr(valOffset, count);
                  if (tag === 0x8769) parseIFD(valOffset);

                  if (tag === 0x829A && type === 5) {
                    const num = get32(valOffset);
                    const den = get32(valOffset + 4);
                    if (num && den) parsed.shutter = num < den ? `1/${Math.round(den / num)}s` : `${(num / den).toFixed(1)}s`;
                  }
                  if (tag === 0x829D && type === 5) {
                    const num = get32(valOffset);
                    const den = get32(valOffset + 4);
                    if (num && den) parsed.aperture = `f/${(num / den).toFixed(1).replace(/\.0$/, "")}`;
                  }
                  if (tag === 0x8827 && type === 3) {
                    const isoVal = get16(entryOffset + 8);
                    if (isoVal) parsed.iso = `ISO ${isoVal}`;
                  }
                  if (tag === 0x920A && type === 5) {
                    const num = get32(valOffset);
                    const den = get32(valOffset + 4);
                    if (num && den) parsed.focal = `${(num / den).toFixed(2).replace(/\.00$/, "")} mm`;
                  }
                }
              };

              parseIFD(get32(4));
              exifAutoCache.set(src, parsed);
              return parsed;
            }
            offset += len;
          } else if ((marker & 0xFF00) !== 0xFF00) {
            break;
          } else {
            offset += view.getUint16(offset);
          }
        }
      } catch (_) {}
      return null;
    }

    function getDominantPalette(src, imgElement) {
      if (paletteCache.has(src)) return paletteCache.get(src);
      try {
        const size = 36;
        sampleCtx.clearRect(0, 0, size, size);
        sampleCtx.drawImage(imgElement, 0, 0, size, size);

        const data = sampleCtx.getImageData(0, 0, size, size).data;
        const buckets = new Map();
        const step = 28;
        let rSum = 0, gSum = 0, bSum = 0, total = 0;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i + 1], b = data[i + 2];
          rSum += r; gSum += g; bSum += b; total++;

          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const sat = max === 0 ? 0 : (max - min) / max;
          const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;

          if (lum < 0.08 || lum > 0.90) continue;

          const key = `${(r / step) | 0},${(g / step) | 0},${(b / step) | 0}`;
          let bucket = buckets.get(key);
          if (!bucket) {
            bucket = { r: 0, g: 0, b: 0, count: 0, satSum: 0 };
            buckets.set(key, bucket);
          }
          bucket.r += r;
          bucket.g += g;
          bucket.b += b;
          bucket.count += 1;
          bucket.satSum += sat;
        }

        const clusters = Array.from(buckets.values()).map(b => {
          const avgSat = b.satSum / b.count;
          return {
            rgb: [b.r / b.count, b.g / b.count, b.b / b.count],
            score: b.count * (0.45 + avgSat * 1.15)
          };
        });

        clusters.sort((a, b) => b.score - a.score);

        const avg = [rSum / (total || 1), gSum / (total || 1), bSum / (total || 1)];
        const primary = clusters.length > 0 ? clusters[0].rgb : avg;

        let secondary = null;
        for (let i = 1; i < clusters.length; i++) {
          const c = clusters[i].rgb;
          const dist = Math.abs(c[0] - primary[0]) + Math.abs(c[1] - primary[1]) + Math.abs(c[2] - primary[2]);
          if (dist > 75) {
            secondary = c;
            break;
          }
        }
        if (!secondary) secondary = primary.map(v => v * 0.45);

        const result = {
          primaryHex: rgbToHex(primary),
          secondaryHex: rgbToHex(secondary),
          glowPrimary: rgbToHex(primary.map(v => v * 0.82)),
          glowSecondary: rgbToHex(secondary.map(v => v * 0.68)),
          abyssBase: rgbToHex(primary.map(v => v * 0.20)),
          tint: {
            r: Math.round(180 + primary[0] * 0.28),
            g: Math.round(180 + primary[1] * 0.28),
            b: Math.round(185 + primary[2] * 0.28)
          }
        };

        paletteCache.set(src, result);
        return result;
      } catch (_) {
        return null;
      }
    }

    function rgbToHex([r, g, b]) {
      return "#" + [r, g, b]
        .map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, "0"))
        .join("");
    }

    function applyAtmosphere(palette) {
      if (!palette) return;
      const { primaryHex, secondaryHex, glowPrimary, glowSecondary, abyssBase, tint } = palette;
      particleTint = tint;

      document.documentElement.style.setProperty("--aura-primary", primaryHex);
      document.documentElement.style.setProperty("--aura-secondary", secondaryHex);

      ambientLayer.style.background = `
        radial-gradient(ellipse 85% 65% at 50% 34%, ${glowPrimary}dc 0%, transparent 72%),
        radial-gradient(ellipse 95% 78% at 50% 82%, ${glowSecondary}b4 0%, ${abyssBase} 86%, #050507 100%)
      `;

      swatchPrimaryEl.style.background = primaryHex;
      swatchSecondaryEl.style.background = secondaryHex;
      swatchHexEl.textContent = primaryHex.toUpperCase();
    }

    function layoutScatterItems() {
      if (isGridMode) return;
      const containerWidth = scatterCanvas.clientWidth;
      const containerHeight = scatterCanvas.clientHeight;
      if (!containerWidth || !containerHeight) return;

      const isMobile = containerWidth < 680;
      const items = Array.from(scatterCanvas.querySelectorAll(".scatter-item"));
      if (!items.length) return;

      const mobilePatterns = [
        { xPct: 0.04, wPct: 0.46, gapY: -12, depth: 0.45 },
        { xPct: 0.50, wPct: 0.46, gapY: 36,  depth: 0.70 },
        { xPct: 0.12, wPct: 0.56, gapY: 24,  depth: 0.85 },
        { xPct: 0.44, wPct: 0.50, gapY: -16, depth: 0.55 },
        { xPct: 0.04, wPct: 0.45, gapY: 34,  depth: 0.65 },
        { xPct: 0.48, wPct: 0.48, gapY: 28,  depth: 0.50 }
      ];

      const desktopPatterns = [
        { xPct: 0.07, wPct: 0.30, gapY: -24, depth: 0.45 },
        { xPct: 0.60, wPct: 0.32, gapY: 28,  depth: 0.75 },
        { xPct: 0.24, wPct: 0.34, gapY: -12, depth: 0.90 },
        { xPct: 0.48, wPct: 0.31, gapY: -40, depth: 0.60 },
        { xPct: 0.07, wPct: 0.28, gapY: 24,  depth: 0.50 },
        { xPct: 0.65, wPct: 0.29, gapY: -30, depth: 0.80 }
      ];

      const patterns = isMobile ? mobilePatterns : desktopPatterns;
      let cursorY = isMobile ? 12 : 22;
      let prevBottom = 0;

      items.forEach((el, idx) => {
        const pat = patterns[idx % patterns.length];
        const widthPx = Math.round(containerWidth * pat.wPct);
        const leftPx = Math.round(containerWidth * pat.xPct);

        el.style.width = `${widthPx}px`;
        el.style.left = `${leftPx}px`;
        el.style.setProperty("--depth", pat.depth);
        el.style.zIndex = Math.round(pat.depth * 10);

        const rectHeight = el.offsetHeight || Math.round(widthPx * 0.68 + 44);

        if (idx === 0) {
          el.style.top = `${cursorY}px`;
          prevBottom = cursorY + rectHeight;
        } else {
          const prevEl = items[idx - 1];
          const prevLeft = parseFloat(prevEl.style.left) || 0;
          const prevWidth = parseFloat(prevEl.style.width) || 0;

          const horizontalOverlap =
            leftPx < prevLeft + prevWidth + 16 &&
            leftPx + widthPx + 16 > prevLeft;

          if (horizontalOverlap) {
            cursorY = prevBottom + Math.max(20, pat.gapY + 24);
          } else {
            cursorY = Math.max(
              prevBottom - rectHeight * 0.42 + pat.gapY,
              (parseFloat(prevEl.style.top) || 0) + 42
            );
          }

          const maxTop = Math.max(12, containerHeight - rectHeight - 12);
          cursorY = Math.min(cursorY, maxTop);

          el.style.top = `${Math.round(cursorY)}px`;
          prevBottom = Math.max(prevBottom, cursorY + rectHeight);
        }
      });
    }

    async function populateBackExif(item, imgEl) {
      const manual = item.exif || {};
      const auto = manual.camera ? null : await extractImageExif(item.src);

      const camera = manual.camera || (auto?.model ? `${auto.make || ""} ${auto.model}`.trim() : "Apple iPhone 7 Plus");
      const captured = manual.captured || (auto?.dateTime ? auto.dateTime.replace(/^(\d{4}):(\d{2}):(\d{2})\s+(\d{2}:\d{2}).*$/, "$3/$2/$1 · $4") : "Archive");
      const aperture = manual.aperture || auto?.aperture || "f/1.8";
      const shutter = manual.shutter || auto?.shutter || "1/125s";
      const focal = manual.focal || auto?.focal || "3.99 mm";
      const iso = manual.iso || auto?.iso || "ISO 32";
      const app = manual.app || (auto?.software ? auto.software : "Adobe Lightroom");

      let resText = manual.resolution;
      if (!resText && imgEl && imgEl.naturalWidth) {
        const mp = ((imgEl.naturalWidth * imgEl.naturalHeight) / 1000000).toFixed(1);
        resText = `${imgEl.naturalWidth} × ${imgEl.naturalHeight} (${mp} MP)`;
      }

      exifCameraEl.textContent = camera;
      exifCapturedEl.textContent = captured;
      exifApertureEl.textContent = aperture;
      exifShutterEl.textContent = shutter;
      exifFocalEl.textContent = focal;
      exifIsoEl.textContent = iso;
      exifAppEl.textContent = app;
      exifResEl.textContent = resText || "Original";
      exifFileEl.textContent = item.file || "image.jpg";
    }

    function openLightboxModal() {
      clearTimeout(closeModalTimer);
      isClosingModal = false;
      window.getSelection()?.removeAllRanges();
      lightbox.classList.remove("is-closing", "is-open");
      document.body.classList.add("modal-active");
      void lightbox.offsetWidth;
      lightbox.classList.add("is-open");
      lightboxClose.focus();
    }

    function closeLightboxModal() {
      if (!lightbox.classList.contains("is-open") || isClosingModal) return;
      isClosingModal = true;
      clearTimeout(holdTimer);
      flipCard.classList.remove("is-pressing");
      lightbox.classList.add("is-closing");
      document.body.classList.remove("modal-active");

      clearTimeout(closeModalTimer);
      closeModalTimer = setTimeout(() => {
        lightbox.classList.remove("is-open", "is-closing");
        flipCard.classList.remove("is-flipped", "is-pressing");
        flipBtnText.textContent = "Inspect Node / EXIF";
        isClosingModal = false;
        if (window.startCanvasLoop) window.startCanvasLoop();
      }, 260);
    }

    function selectEntry(index, openModal = false) {
      if (!entries.length || isClosingModal) return;
      currentIndex = (index + entries.length) % entries.length;
      const item = entries[currentIndex];

      const allItems = scatterCanvas.querySelectorAll(".scatter-item");
      allItems.forEach((el, i) => {
        el.classList.toggle("is-active", i === currentIndex);
      });

      const imgEl = allItems[currentIndex]?.querySelector("img");
      if (imgEl && imgEl.complete && imgEl.naturalWidth > 0) {
        const pal = getDominantPalette(item.src, imgEl);
        if (pal) applyAtmosphere(pal);
      }

      if (openModal) {
        flipCard.classList.remove("is-flipped", "is-pressing");
        flipBtnText.textContent = "Inspect Node / EXIF";
        lightboxImg.src = item.src;
        lightboxCaption.textContent = item.caption;
        populateBackExif(item, imgEl);
        openLightboxModal();
      }
    }

    function renderGallery() {
      scatterCanvas.innerHTML = "";
      archiveCountEl.textContent = `${entries.length} frames`;

      entries.forEach((item, idx) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "scatter-item";
        card.setAttribute("aria-label", `Inspect ${item.caption}`);
        card.style.transitionDelay = `${Math.min(idx * 80, 480)}ms`;

        const frame = document.createElement("div");
        frame.className = "scatter-frame";

        const img = document.createElement("img");
        img.src = item.src;
        img.alt = item.caption;
        img.decoding = "async";
        img.draggable = false;

        img.onload = () => {
          const pal = getDominantPalette(item.src, img);
          if (pal) {
            card.style.setProperty("--item-aura", pal.primaryHex);
            if (idx === currentIndex) applyAtmosphere(pal);
          }
          layoutScatterItems();
          requestAnimationFrame(() => card.classList.add("is-visible"));
        };

        img.onerror = () => {
          layoutScatterItems();
          card.classList.add("is-visible");
        };

        const chip = document.createElement("span");
        chip.className = "frame-chip";
        chip.textContent = `0${idx + 1}`.slice(-2);

        frame.appendChild(img);
        frame.appendChild(chip);

        const meta = document.createElement("div");
        meta.className = "scatter-meta";

        const titleWrap = document.createElement("div");
        titleWrap.className = "scatter-title-wrap";

        const title = document.createElement("div");
        title.className = "scatter-title";
        title.textContent = item.caption;

        const sub = document.createElement("div");
        sub.className = "scatter-sub";
        sub.textContent = item.sub || "Stillness";

        titleWrap.appendChild(title);
        titleWrap.appendChild(sub);

        const tag = document.createElement("span");
        tag.className = "scatter-tag";
        tag.textContent = item.tag || "grain";

        meta.appendChild(titleWrap);
        meta.appendChild(tag);

        card.appendChild(frame);
        card.appendChild(meta);

        card.addEventListener("click", (e) => {
          if (lightbox.classList.contains("is-open") || isClosingModal) return;
          e.preventDefault();
          selectEntry(idx, true);
        });

        scatterCanvas.appendChild(card);
      });

      layoutScatterItems();
    }

    const GITHUB_CACHE_KEY = "ustzyix_github_cache_v4";
    const GITHUB_CACHE_TTL = 15 * 60 * 1000;

    function applyExtraPhotos(extraPhotos) {
      if (!extraPhotos || !extraPhotos.length) return;
      const existingNames = new Set(entries.map(p => p.file));
      const filtered = extraPhotos.filter(p => !existingNames.has(p.file));
      if (filtered.length > 0) {
        entries = [...entries, ...filtered];
        renderGallery();
      }
    }

    async function syncGitHubAssets() {
      try {
        const cached = sessionStorage.getItem(GITHUB_CACHE_KEY);
        if (cached) {
          try {
            const data = JSON.parse(cached);
            if (Date.now() - data.time < GITHUB_CACHE_TTL && Array.isArray(data.items)) {
              applyExtraPhotos(data.items);
              return;
            }
          } catch (_) {}
        }

        const imgApi = `https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${REPO_CONFIG.folder}`;
        const imgRes = await fetch(imgApi);

        if (imgRes.ok) {
          const files = await imgRes.json();
          const validExt = /\.(jpe?g|png|webp|gif|avif)$/i;
          const existingNames = new Set(entries.map(p => p.file));

          const extraPhotos = files
            .filter(f => f.type === "file" && validExt.test(f.name) && !existingNames.has(f.name))
            .map((f, i) => {
              const title = formatNewCaption(f.name);
              const num = String(entries.length + i + 1).padStart(2, "0");
              return {
                file: f.name,
                src: `./${REPO_CONFIG.folder}/${encodeURIComponent(f.name)}`,
                caption: title,
                sub: `Archive · ${num}`,
                tag: "glass · grain"
              };
            });

          try {
            sessionStorage.setItem(GITHUB_CACHE_KEY, JSON.stringify({
              time: Date.now(),
              items: extraPhotos
            }));
          } catch (_) {}

          if (extraPhotos.length > 0) {
            applyExtraPhotos(extraPhotos);
          }
        }
      } catch (_) {}
    }

    let holdTimer = null;
    let didFlipOnHold = false;

    function toggleCardFlip() {
      const isFlipped = flipCard.classList.contains("is-flipped");
      if (!isFlipped) {
        flipCard.classList.add("is-flipped");
        flipBtnText.textContent = "View Frame";
      } else {
        flipCard.classList.remove("is-flipped");
        flipBtnText.textContent = "Inspect Node / EXIF";
      }
      if (navigator.vibrate) {
        try { navigator.vibrate(12); } catch (_) {}
      }
    }

    flipBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleCardFlip();
    });

    flipScene.addEventListener("click", () => {
      if (isClosingModal || didFlipOnHold) {
        didFlipOnHold = false;
        return;
      }
      toggleCardFlip();
    });

    flipScene.addEventListener("pointerdown", () => {
      if (isClosingModal) return;
      didFlipOnHold = false;
      flipCard.classList.add("is-pressing");
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        flipCard.classList.remove("is-pressing");
        didFlipOnHold = true;
        toggleCardFlip();
      }, 340);
    });

    function clearHold() {
      clearTimeout(holdTimer);
      flipCard.classList.remove("is-pressing");
    }

    flipScene.addEventListener("pointerup", clearHold);
    flipScene.addEventListener("pointerleave", clearHold);
    flipScene.addEventListener("pointercancel", clearHold);
    flipScene.addEventListener("contextmenu", (e) => e.preventDefault());

    flipScene.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggleCardFlip();
      }
    });

    lightboxClose.addEventListener("click", (e) => {
      e.stopPropagation();
      closeLightboxModal();
    });

    lightboxPrev.addEventListener("click", (e) => {
      e.stopPropagation();
      selectEntry(currentIndex - 1, true);
    });

    lightboxNext.addEventListener("click", (e) => {
      e.stopPropagation();
      selectEntry(currentIndex + 1, true);
    });

    let touchStartX = 0, touchStartY = 0;
    lightbox.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    lightbox.addEventListener("touchend", (e) => {
      if (e.changedTouches.length === 1) {
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > 60 && Math.abs(dy) < 50) {
          selectEntry(dx < 0 ? currentIndex + 1 : currentIndex - 1, true);
        }
      }
    }, { passive: true });

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) closeLightboxModal();
    });

    window.addEventListener("keydown", (e) => {
      if (lightbox.classList.contains("is-open")) {
        if (e.key === "Escape") closeLightboxModal();
        else if (e.key === "ArrowLeft") selectEntry(currentIndex - 1, true);
        else if (e.key === "ArrowRight") selectEntry(currentIndex + 1, true);
      }
    });

    initFilmGrain();
    initAtmosphereCanvas();
    initLookAround();
    renderGallery();

    if ("requestIdleCallback" in window) {
      window.requestIdleCallback(syncGitHubAssets, { timeout: 2000 });
    } else {
      setTimeout(syncGitHubAssets, 1000);
    }
  </script>
</body>
