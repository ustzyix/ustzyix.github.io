<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="ustzyix — Atmospheric visual and photographic archive with dynamic soundscapes." />
  <meta name="theme-color" content="#020203" />
  <title>ustzyix</title>
  <style>
    :root {
      /* Pryzm-inspired design tokens */
      --fg-color: #e6e6ea;
      --fg-muted: rgba(230, 230, 234, 0.62);
      --fg-whisper: rgba(230, 230, 234, 0.38);
      --primary: #8c1d18; /* matches existing aura-primary */
      --secondary: #3b1814; /* matches existing aura-secondary */
      --accent: #ff00ff; /* magenta accent from Pryzm */
      --glass-bg: rgba(255, 255, 255, 0.08); /* glassmorphism overlay */
      --px: 0px;
      --py: 0px;
      --bass-boost: 0;
      --ease-liquid: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-drift: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Reduce motion for low‑power devices */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      background-color: #020203;
      color: var(--fg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    /* Selection & Drag Guard */
    .scatter-canvas, header, .floating-dock, .lightbox {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    img {
      -webkit-user-drag: none;
      user-drag: none;
      pointer-events: none;
    }

    /* Focus accessibility styling */
    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    /* ชั้นที่ 1: บรรยากาศสีหลักหน้าแรก */
    #ambient-layer {
      position: fixed;
      inset: 0;
      z-index: -7;
      background:
        radial-gradient(ellipse 85% 65% at 50% 34%, rgba(155, 34, 28, 0.56) 0%, transparent 72%),
        radial-gradient(ellipse 90% 70% at 50% 80%, rgba(72, 26, 22, 0.44) 0%, #020203 86%);
      transition: background 1.2s ease;
      pointer-events: none;
      will-change: background;
    }

    /* ชั้นที่ 2: หมอกลึกเคลื่อนตัวช้าๆ (GPU composited) */
    .mist-far {
      position: fixed;
      inset: -24%;
      z-index: -6;
      pointer-events: none;
      opacity: 0.62;
      background:
        radial-gradient(ellipse 74% 58% at 24% 34%, var(--aura-primary) 0%, transparent 76%),
        radial-gradient(ellipse 70% 62% at 76% 68%, var(--aura-secondary) 0%, transparent 78%);
      will-change: transform;
      animation: mistSwayA 28s ease-in-out infinite alternate;
    }

    .mist-near {
      position: fixed;
      inset: -18%;
      z-index: -5;
      pointer-events: none;
      opacity: 0.36;
      background:
        radial-gradient(ellipse 62% 48% at 72% 32%, var(--aura-primary) 0%, transparent 74%),
        radial-gradient(ellipse 72% 50% at 30% 76%, rgba(205, 210, 225, 0.08) 0%, transparent 78%);
      will-change: transform;
      animation: mistSwayB 20s ease-in-out infinite alternate;
    }

    @keyframes mistSwayA {
      0% { transform: translate3d(-2.5%, -1.2%, 0) scale(1); }
      100% { transform: translate3d(2.5%, 1.5%, 0) scale(1.05); }
    }

    @keyframes mistSwayB {
      0% { transform: translate3d(2%, 1.1%, 0) scale(1.03); }
      100% { transform: translate3d(-2.4%, -1.3%, 0) scale(0.98); }
    }

    /* ชั้นที่ 3: ลำแสงเฉียงส่องผ่านความมืด */
    .god-rays {
      position: fixed;
      inset: -20%;
      z-index: -4;
      pointer-events: none;
      opacity: 0.28;
      background:
        radial-gradient(ellipse 22% 78% at 36% 24%, var(--aura-primary) 0%, transparent 78%),
        radial-gradient(ellipse 18% 72% at 54% 28%, rgba(255, 248, 236, 0.14) 0%, transparent 78%);
      transform: rotate(-22deg);
      will-change: transform, opacity;
      animation: raySweep 17s ease-in-out infinite alternate;
    }

    @keyframes raySweep {
      0% { transform: translate3d(-3%, -1%, 0) rotate(-24deg); opacity: 0.18; }
      50% { opacity: 0.32; }
      100% { transform: translate3d(3%, 1.5%, 0) rotate(-19deg); opacity: 0.22; }
    }

    /* ชั้นที่ 4: ความมืดรอบขอบจอ */
    .void-vignette {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background: radial-gradient(
        circle at 50% 45%,
        transparent 42%,
        rgba(2, 2, 3, 0.56) 84%,
        rgba(0, 0, 1, 0.92) 100%
      );
    }

    /* ชั้นที่ 5: Canvas ละอองฝุ่นลอยในอากาศ */
    #atmosphere-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
    }

    /* ชั้นที่ 6: เกรนฟิล์มอนาล็อกบางเบา (GPU transform - ประหยัดพลังงาน 100% ไร้ CPU Repaint) */
    .film-grain {
      position: fixed;
      inset: -40px;
      width: calc(100% + 80px);
      height: calc(100% + 80px);
      z-index: 5;
      pointer-events: none;
      opacity: 0.035;
      background-repeat: repeat;
      will-change: transform;
      animation: grainShift 0.4s steps(3) infinite;
    }

    @keyframes grainShift {
      0% { transform: translate3d(0, 0, 0); }
      33% { transform: translate3d(20px, -16px, 0); }
      66% { transform: translate3d(-18px, 22px, 0); }
      100% { transform: translate3d(12px, 10px, 0); }
    }

    /* หยุดแอนิเมชันพื้นหลังเมื่อเปิดโมดอล เพื่อเซฟแบตเตอรี่และทรัพยากร GPU */
    body.modal-active .mist-far,
    body.modal-active .mist-near,
    body.modal-active .god-rays,
    body.modal-active .film-grain {
      animation-play-state: paused !important;
    }

    /* แถบหัวเว็บลอยโปร่งแสงด้านบน */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: max(18px, env(safe-area-inset-top)) max(26px, env(safe-area-inset-right)) 14px max(26px, env(safe-area-inset-left));
      font-size: 12px;
      z-index: 20;
      background: linear-gradient(to bottom, rgba(2, 2, 3, 0.72) 0%, transparent 100%);
      pointer-events: none;
    }

    .brand {
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: lowercase;
      color: var(--fg-muted);
    }

    .presence-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--fg-whisper);
    }

    .pulse-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--fg-muted);
      animation: solitaryPulse 4.2s ease-in-out infinite;
    }

    @keyframes solitaryPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.85); }
      50% { opacity: 0.85; transform: scale(1.25); }
    }

    /* ผืนผ้าใบวางรูปกระจายตัวอิสระ */
    main {
      position: fixed;
      inset: 0;
      width: 100%;
      max-width: 1180px;
      height: 100dvh;
      margin: 0 auto;
      padding: 76px 16px 96px;
      z-index: 2;
      overflow: hidden;
      overscroll-behavior: none;
      transition: filter 0.45s var(--ease-liquid), transform 0.5s var(--ease-drift), opacity 0.45s ease;
    }

    body.modal-active main {
      filter: blur(8px) brightness(0.75);
      transform: scale(0.975);
      pointer-events: none;
    }

    .scatter-canvas {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: pan-y;
    }

    /* การ์ดรูปภาพแต่ละใบ */
    .scatter-item {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 9px;
      cursor: pointer;
      touch-action: manipulation;
      opacity: 0;
      transform: translate3d(0, 18px, 0);
      transition:
        opacity 0.85s var(--ease-liquid),
        transform 0.85s var(--ease-drift);
      will-change: transform, opacity;
      border: none;
      background: transparent;
      padding: 0;
      text-align: left;
    }

    .scatter-item:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 6px;
      border-radius: 8px;
      z-index: 15 !important;
    }

    .scatter-item.is-visible {
      opacity: 1;
      transform: translate3d(
        calc(var(--px) * var(--depth, 0.5)),
        calc(var(--py) * var(--depth, 0.5)),
        0
      );
    }

    .item-aura-glow {
      position: absolute;
      inset: -48px;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(
        ellipse 68% 64% at 50% 48%,
        var(--item-aura, var(--aura-primary)) 0%,
        transparent 74%
      );
      opacity: 0.58;
      transition: opacity 0.45s ease, transform 0.55s var(--ease-drift);
    }

    .scatter-item.is-active-song .item-aura-glow {
      opacity: 0.78;
      transform: scale(1.08);
    }

    @media (hover: hover) {
      .scatter-item:hover {
        z-index: 12 !important;
      }
      .scatter-item:hover .item-aura-glow {
        opacity: 0.85;
        transform: scale(1.12);
      }
      .scatter-item:hover .scatter-frame {
        transform: scale(1.035);
        box-shadow:
          0 28px 75px -10px rgba(0, 0, 0, 0.94),
          0 0 75px -6px var(--item-aura, var(--aura-primary));
      }
      .scatter-item:hover .scatter-title {
        color: var(--fg-color);
      }
    }

    .scatter-item:active .scatter-frame {
      transform: scale(0.96);
    }

    .scatter-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 6px;
      border: none;
      background-color: #050507;
      box-shadow:
        0 20px 55px -12px rgba(0, 0, 0, 0.88),
        0 0 65px -8px var(--item-aura, var(--aura-primary));
      transition: transform 0.55s var(--ease-drift), box-shadow 0.55s ease;
    }

    .scatter-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.015);
      transition: transform 8s ease-out;
    }

    .scatter-item.is-active-song .scatter-frame img {
      animation: subtleFloatBreath 14s ease-in-out infinite alternate;
    }

    @keyframes subtleFloatBreath {
      0% { transform: scale(1.015) translate3d(-0.4%, -0.3%, 0); }
      100% { transform: scale(1.045) translate3d(0.4%, 0.4%, 0); }
    }

    .edge-dissolve {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow:
        inset 0 0 18px 4px rgba(2, 2, 3, 0.58),
        inset 0 0 36px 1px rgba(2, 2, 3, 0.24);
    }

    .scatter-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-left: 2px;
      max-width: 100%;
      pointer-events: none;
    }

    .scatter-title {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: rgba(235, 235, 240, 0.90);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.25s ease;
    }

    .scatter-sub {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--fg-muted);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scatter-item.is-active-song .scatter-title::before {
      content: "● ";
      font-size: 7px;
      vertical-align: middle;
      color: var(--fg-color);
      opacity: 0.88;
    }

    /* แถบเพลงลอยด้านล่างแบบไร้กรอบปุ่ม */
    .floating-dock {
      position: fixed;
      bottom: max(22px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: max-content;
      max-width: 90vw;
    }

    .music-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      max-width: min(88vw, 360px);
      height: 36px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--primary);
      background: rgba(8, 8, 12, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--fg-muted);
      font-size: 11.5px;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95);
      cursor: pointer;
      touch-action: manipulation;
      transition: color 0.35s ease, transform 0.25s ease, opacity 0.35s ease, border-color 0.35s ease;
    }

    .music-pill:hover {
      color: var(--fg-color);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .music-pill:active {
      transform: scale(0.97);
    }

    .music-pill.playing {
      color: rgba(236, 236, 240, 0.96);
      border-color: rgba(255, 255, 255, 0.14);
    }

    .eq-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
      width: 10px;
      flex-shrink: 0;
      opacity: 0.85;
    }

    .eq-bars i {
      display: block;
      width: 1.5px;
      height: 9px;
      background-color: currentColor;
      transform-origin: bottom;
      transform: scaleY(0.35);
      transition: transform 0.2s ease;
    }

    .eq-bars i:nth-child(2) { transform: scaleY(0.85); }
    .eq-bars i:nth-child(3) { transform: scaleY(0.55); }

    .music-pill.playing .eq-bars i {
      animation: eqBounce 0.9s ease-in-out infinite alternate;
    }
    .music-pill.playing .eq-bars i:nth-child(2) { animation-delay: 0.25s; }
    .music-pill.playing .eq-bars i:nth-child(3) { animation-delay: 0.5s; }

    @keyframes eqBounce {
      0% { transform: scaleY(0.25); }
      100% { transform: scaleY(1); }
    }

    .music-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-state {
      min-width: 38px;
      text-align: right;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0.6;
      flex-shrink: 0;
    }

    .music-progress {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 3px;
      height: 1.5px;
      background: linear-gradient(90deg, transparent 0%, currentColor 50%, transparent 100%);
      opacity: 0.45;
      transform: scaleX(0);
      transform-origin: left;
      border-radius: 1px;
    }

    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px 84px;
      background: rgba(2, 2, 3, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
      overscroll-behavior: none;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.35s var(--ease-liquid), visibility 0s linear 0.35s;
    }

    .lightbox.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition: opacity 0.35s var(--ease-liquid), visibility 0s linear 0s;
    }

    .lightbox.is-closing {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease-out;
    }

    /* ปุ่มปิด Lightbox */
    .lightbox-close {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      right: max(20px, env(safe-area-inset-right));
      z-index: 55;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(14, 14, 18, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--fg-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.85;
      transition: opacity 0.25s, transform 0.25s, background 0.25s;
      touch-action: manipulation;
    }

    .lightbox-close:hover {
      opacity: 1;
      transform: scale(1.08);
      background: rgba(25, 25, 32, 0.95);
    }

    .lightbox-close svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
    }

    /* ปุ่มเปลี่ยนรูปซ้าย-ขวา */
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 48;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(12, 12, 16, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: var(--fg-color);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.25s, transform 0.25s, background 0.25s;
      touch-action: manipulation;
    }

    .lightbox-nav:hover {
      opacity: 1;
      transform: translateY(-50%) scale(1.08);
      background: rgba(24, 24, 32, 0.9);
    }

    .lightbox-nav.prev {
      left: max(16px, env(safe-area-inset-left));
    }

    .lightbox-nav.next {
      right: max(16px, env(safe-area-inset-right));
    }

    .lightbox-nav svg {
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }

    @media (max-width: 680px) {
      .lightbox-nav {
        display: none;
      }
    }

    .lightbox-inner {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 92vw;
      pointer-events: none;
    }

    .lightbox.is-open .flip-scene {
      animation: openZoomBlur 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .lightbox.is-closing .flip-scene {
      animation: closeZoomBlur 0.25s cubic-bezier(0.4, 0, 1, 1) forwards;
    }

    @keyframes openZoomBlur {
      0% {
        opacity: 0;
        transform: scale(0.82) translate3d(0, 18px, 0);
      }
      100% {
        opacity: 1;
        transform: scale(1) translate3d(0, 0, 0);
      }
    }

    @keyframes closeZoomBlur {
      0% {
        opacity: 1;
        transform: scale(1) translate3d(0, 0, 0);
      }
      100% {
        opacity: 0;
        transform: scale(0.86) translate3d(0, 12px, 0);
      }
    }

    /* 3D Flip Card Scene */
    .flip-scene {
      perspective: 1400px;
      display: grid;
      place-items: center;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      will-change: transform, opacity;
    }

    .flip-card {
      position: relative;
      display: grid;
      place-items: center;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .flip-card.is-pressing {
      transform: scale(0.975);
      transition: transform 0.2s ease-out;
    }

    .flip-card.is-flipped {
      transform: rotateY(180deg);
    }

    .flip-card.is-flipped.is-pressing {
      transform: rotateY(180deg) scale(0.975);
    }

    /* ด้านหน้ารูป */
    .flip-front {
      grid-area: 1 / 1;
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      pointer-events: none;
      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.96),
        0 0 80px -10px var(--aura-primary);
    }

    .flip-front img {
      display: block;
      max-width: min(90vw, 760px);
      max-height: 58dvh;
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: none;
    }

    /* ด้านหลัง: ข้อมูล EXIF & กล้อง */
    .flip-back {
      grid-area: 1 / 1;
      width: 100%;
      height: 100%;
      min-width: min(86vw, 360px);
      min-height: 270px;
      border-radius: 6px;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      text-align: left;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.045) 0%, transparent 65%),

  <script>
    const REPO_CONFIG = {
      owner: "ustzyix",

    };

    const DEFAULT_AUDIO = "./audio/Loving%20Machine.mp3";

    /* ข้อมูลเทคนิคการถ่ายและแต่งสี (Fallback Base Entries) */

        exif: {
          camera: "Apple iPhone 7 Plus",

          shutter: "1/100s",
          focal: "3.99 mm",

        },

      }
    ];

    let entries = [...ENTRIES];
    let currentIndex = 0;
    let isAudioActive = false;
    let loadedAudioSrc = "";
    let particleTint = { r: 225, g: 215, b: 215 };
    let closeModalTimer = null;
    let isClosingModal = false;

    let audioCtx = null;
    let analyser = null;
    let freqData = null;

    const paletteCache = new Map();
    const exifAutoCache = new Map();
    const sampleCanvas = document.createElement("canvas");
    sampleCanvas.width = 36;
    sampleCanvas.height = 36;
    const sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });

    const scatterCanvas = document.getElementById("scatter-canvas");
    const ambientLayer = document.getElementById("ambient-layer");
    const archiveCountEl = document.getElementById("archive-count");
    const filmGrainEl = document.getElementById("film-grain");

    const bgAudio = document.getElementById("bg-audio");
    const musicPill = document.getElementById("music-pill");
    const musicTitleEl = document.getElementById("music-title");
    const musicStateEl = document.getElementById("music-state");
    const musicProgressEl = document.getElementById("music-progress");

    const lightbox = document.getElementById("lightbox");
    const lightboxClose = document.getElementById("lightbox-close");

    const exifCameraEl = document.getElementById("exif-camera");

    const exifApertureEl = document.getElementById("exif-aperture");
    const exifShutterEl = document.getElementById("exif-shutter");
    const exifFocalEl = document.getElementById("exif-focal");
    const exifIsoEl = document.getElementById("exif-iso");
    const exifAppEl = document.getElementById("exif-app");
    const exifResEl = document.getElementById("exif-res");
    const exifFileEl = document.getElementById("exif-file");

    /* 1. Film Grain Canvas Texture */
    function initFilmGrain() {
      const c = document.createElement("canvas");
      c.width = 96;
      c.height = 96;
      const ctx = c.getContext("2d");
      const imgData = ctx.createImageData(96, 96);
      const buf = imgData.data;
      for (let i = 0; i < buf.length; i += 4) {
        const v = (Math.random() * 255) | 0;
        buf[i] = v;
        buf[i + 1] = v;
        buf[i + 2] = v;
        buf[i + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
      filmGrainEl.style.backgroundImage = `url(${c.toDataURL("image/png")})`;
    }

    /* 2. Atmosphere Particle Canvas (ประหยัดพลังงาน: หยุดทำงานเมื่อแท็บซ่อนหรือเปิดโมดอล) */
    let isCanvasRunning = true;
    let canvasAnimId = null;
    let lastBassLevel = 0;

    function initAtmosphereCanvas() {
      const canvas = document.getElementById("atmosphere-canvas");
      const ctx = canvas.getContext("2d");
      let width = 0;
      let height = 0;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();

      let resizeTimeout = null;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          resize();
          layoutScatterItems();
        }, 120);
      }, { passive: true });

      const count = width < 600 ? 30 : 48;
      const motes = Array.from({ length: count }, () => {
        const depth = Math.random();
        return {
          x: Math.random() * width,
          y: Math.random() * height,
          r: 0.65 + depth * 1.8,
          vx: (Math.random() - 0.5) * (0.14 + depth * 0.24),
          vy: -(0.12 + depth * 0.30),
          phase: Math.random() * Math.PI * 2,
          freq: 0.009 + Math.random() * 0.015,
          alpha: 0.08 + depth * 0.22,
          depth
        };
      });

      function tick() {
        if (!isCanvasRunning || document.hidden || document.body.classList.contains("modal-active")) {
          canvasAnimId = null;
          return;
        }

        ctx.clearRect(0, 0, width, height);
        const { r, g, b } = particleTint;

        let bass = 0;
        if (analyser && !bgAudio.paused) {
          analyser.getByteFrequencyData(freqData);
          let sum = 0;
          for (let k = 0; k < 6; k++) sum += freqData[k];
          bass = sum / (6 * 255);
          if (Math.abs(bass - lastBassLevel) > 0.015) {
            lastBassLevel = bass;
            document.documentElement.style.setProperty("--bass-boost", bass.toFixed(3));
          }
        }

        for (let i = 0; i < motes.length; i++) {
          const m = motes[i];
          m.phase += m.freq;
          m.x += m.vx + Math.sin(m.phase) * 0.20;
          m.y += m.vy - bass * 0.22 * m.depth;

          if (m.y < -14) {
            m.y = height + 14;
            m.x = Math.random() * width;
          }
          if (m.x < -14) m.x = width + 14;
          if (m.x > width + 14) m.x = -14;

          const twinkle = 0.65 + 0.35 * Math.sin(m.phase * 1.8);
          const finalAlpha = Math.min(m.alpha * twinkle + bass * 0.06, 0.52);

          ctx.beginPath();
          ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${finalAlpha.toFixed(3)})`;
          ctx.fill();
        }

        canvasAnimId = requestAnimationFrame(tick);
      }

      window.startCanvasLoop = function() {
        if (!canvasAnimId && isCanvasRunning && !document.hidden && !document.body.classList.contains("modal-active")) {
          canvasAnimId = requestAnimationFrame(tick);
        }
      };

      window.startCanvasLoop();

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          if (canvasAnimId) cancelAnimationFrame(canvasAnimId);
          canvasAnimId = null;
        } else {
          window.startCanvasLoop();
        }
      });
    }

    /* 3. Parallax Look-Around (ประหยัดพลังงาน: อัปเดตเฉพาะเมื่อขยับ และหยุดลูปเมื่อค่านิ่ง) */
    function initLookAround() {
      let targetX = 0;
      let targetY = 0;
      let curX = 0;
      let curY = 0;
      let isParallaxActive = false;

      function stepParallax() {
        const dx = targetX - curX;
        const dy = targetY - curY;

        if (Math.abs(dx) < 0.01 && Math.abs(dy) < 0.01) {
          curX = targetX;
          curY = targetY;
          document.documentElement.style.setProperty("--px", `${curX.toFixed(2)}px`);
          document.documentElement.style.setProperty("--py", `${curY.toFixed(2)}px`);
          isParallaxActive = false;
          return;
        }

        curX += dx * 0.06;
        curY += dy * 0.06;
        document.documentElement.style.setProperty("--px", `${curX.toFixed(2)}px`);
        document.documentElement.style.setProperty("--py", `${curY.toFixed(2)}px`);

        requestAnimationFrame(stepParallax);
      }

      function wakeParallax() {
        if (!isParallaxActive) {
          isParallaxActive = true;
          requestAnimationFrame(stepParallax);
        }
      }

      window.addEventListener("pointermove", (e) => {
        if (document.body.classList.contains("modal-active")) return;
        const nx = (e.clientX / window.innerWidth) * 2 - 1;
        const ny = (e.clientY / window.innerHeight) * 2 - 1;
        targetX = nx * 10;
        targetY = ny * 8;
        wakeParallax();
      }, { passive: true });

      window.addEventListener("deviceorientation", (e) => {
        if (document.body.classList.contains("modal-active")) return;
        if (e.gamma === null || e.beta === null) return;
        const gx = Math.max(-25, Math.min(25, e.gamma)) / 25;
        const gy = Math.max(-25, Math.min(25, e.beta - 45)) / 25;
        targetX = gx * 10;
        targetY = gy * 8;
        wakeParallax();
      }, { passive: true });
    }

    /* 4. Audio Analyser (ปลอดภัย ไม่กระทบระบบเสียงของเบราว์เซอร์) */
    function initAudioAnalyser() {
      if (audioCtx) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioCtx = new AudioContextClass();
        const source = audioCtx.createMediaElementSource(bgAudio);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        freqData = new Uint8Array(analyser.frequencyBinCount);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
      } catch (_) {
        analyser = null;
      }
    }

    function formatNewCaption(filename) {
      return filename
        .replace(/\.[^/.]+$/, "")
        .replace(/\(\d+\)/g, "")
        .replace(/^IMG[-_]?/i, "")
        .replace(/[-_]/g, " ")
        .trim() || "Stillness";
    }

    /* 5. Safe & Efficient EXIF Extraction (อ่านเฉพาะ 64KB แรกของไฟล์ ไม่โหลดภาพเต็ม) */
    async function extractImageExif(src) {
      if (exifAutoCache.has(src)) return exifAutoCache.get(src);
      try {
        let res = await fetch(src, { headers: { Range: "bytes=0-65535" } }).catch(() => null);
        if (!res || (res.status !== 206 && res.status !== 200)) {
          res = await fetch(src).catch(() => null);
        }
        if (!res || !res.ok) return null;

        const buf = await res.arrayBuffer();
        const view = new DataView(buf);
        if (view.byteLength < 16 || view.getUint16(0) !== 0xFFD8) return null;

        let offset = 2;
        while (offset < view.byteLength - 4) {
          const marker = view.getUint16(offset);
          offset += 2;
          if (marker === 0xFFE1) {
            const len = view.getUint16(offset);
            if (offset + len > view.byteLength) break;
            const header = String.fromCharCode(
              view.getUint8(offset + 2),
              view.getUint8(offset + 3),
              view.getUint8(offset + 4),
              view.getUint8(offset + 5)
            );
            if (header === "Exif") {
              const tiffStart = offset + 8;
              if (tiffStart + 8 > view.byteLength) break;
              const little = view.getUint16(tiffStart) === 0x4949;
              const get16 = (o) => (tiffStart + o + 2 <= view.byteLength ? view.getUint16(tiffStart + o, little) : 0);
              const get32 = (o) => (tiffStart + o + 4 <= view.byteLength ? view.getUint32(tiffStart + o, little) : 0);
              const readStr = (o, count) => {
                let s = "";
                for (let i = 0; i < count - 1; i++) {
                  if (tiffStart + o + i >= view.byteLength) break;
                  const ch = view.getUint8(tiffStart + o + i);
                  if (ch === 0) break;
                  s += String.fromCharCode(ch);
                }
                return s.trim();
              };

              const parsed = {};
              const parseIFD = (ifdOffset) => {
                if (!ifdOffset || tiffStart + ifdOffset + 2 > view.byteLength) return;
                const entriesCount = get16(ifdOffset);
                for (let i = 0; i < entriesCount; i++) {
                  const entryOffset = ifdOffset + 2 + i * 12;
                  if (tiffStart + entryOffset + 12 > view.byteLength) break;
                  const tag = get16(entryOffset);
                  const type = get16(entryOffset + 2);
                  const count = get32(entryOffset + 4);
                  const valOffset = get32(entryOffset + 8);

                  if (tag === 0x010F && type === 2) parsed.make = readStr(valOffset, count);
                  if (tag === 0x0110 && type === 2) parsed.model = readStr(valOffset, count);
                  if (tag === 0x0131 && type === 2) parsed.software = readStr(valOffset, count);
                  if (tag === 0x0132 && type === 2) parsed.dateTime = readStr(valOffset, count);
                  if (tag === 0x8769) parseIFD(valOffset);

                  if (tag === 0x829A && type === 5) {
                    const num = get32(valOffset);
                    const den = get32(valOffset + 4);
                    if (num && den) parsed.shutter = num < den ? `1/${Math.round(den / num)}s` : `${(num / den).toFixed(1)}s`;
                  }
                  if (tag === 0x829D && type === 5) {
                    const num = get32(valOffset);
                    const den = get32(valOffset + 4);
                    if (num && den) parsed.aperture = `f/${(num / den).toFixed(1).replace(/\.0$/, "")}`;
                  }
                  if (tag === 0x8827 && type === 3) {
                    const isoVal = get16(entryOffset + 8);
                    if (isoVal) parsed.iso = `ISO ${isoVal}`;
                  }
                  if (tag === 0x920A && type === 5) {
                    const num = get32(valOffset);
                    const den = get32(valOffset + 4);
                    if (num && den) parsed.focal = `${(num / den).toFixed(2).replace(/\.00$/, "")} mm`;
                  }
                }
              };

              parseIFD(get32(4));
              exifAutoCache.set(src, parsed);
              return parsed;
            }
            offset += len;
          } else if ((marker & 0xFF00) !== 0xFF00) {
            break;
          } else {
            offset += view.getUint16(offset);
          }
        }
      } catch (_) {}
      return null;
    }

    /* 6. Extract Dominant Color Palette */
    function getDominantPalette(src, imgElement) {
      if (paletteCache.has(src)) return paletteCache.get(src);
      try {
        const size = 36;
        sampleCtx.clearRect(0, 0, size, size);
        sampleCtx.drawImage(imgElement, 0, 0, size, size);

        const data = sampleCtx.getImageData(0, 0, size, size).data;
        const buckets = new Map();
        const step = 28;
        let rSum = 0, gSum = 0, bSum = 0, total = 0;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i + 1], b = data[i + 2];
          rSum += r; gSum += g; bSum += b; total++;

          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const sat = max === 0 ? 0 : (max - min) / max;
          const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;

          if (lum < 0.08 || lum > 0.90) continue;

          const key = `${(r / step) | 0},${(g / step) | 0},${(b / step) | 0}`;
          let bucket = buckets.get(key);
          if (!bucket) {
            bucket = { r: 0, g: 0, b: 0, count: 0, satSum: 0 };
            buckets.set(key, bucket);
          }
          bucket.r += r;
          bucket.g += g;
          bucket.b += b;
          bucket.count += 1;
          bucket.satSum += sat;
        }

        const clusters = Array.from(buckets.values()).map(b => {
          const avgSat = b.satSum / b.count;
          return {
            rgb: [b.r / b.count, b.g / b.count, b.b / b.count],
            score: b.count * (0.45 + avgSat * 1.15)
          };
        });

        clusters.sort((a, b) => b.score - a.score);

        const avg = [rSum / (total || 1), gSum / (total || 1), bSum / (total || 1)];
        const primary = clusters.length > 0 ? clusters[0].rgb : avg;

        let secondary = null;
        for (let i = 1; i < clusters.length; i++) {
          const c = clusters[i].rgb;
          const dist = Math.abs(c[0] - primary[0]) + Math.abs(c[1] - primary[1]) + Math.abs(c[2] - primary[2]);
          if (dist > 75) {
            secondary = c;
            break;
          }
        }
        if (!secondary) secondary = primary.map(v => v * 0.45);

        const result = {
          primaryHex: rgbToHex(primary),
          secondaryHex: rgbToHex(secondary),
          glowPrimary: rgbToHex(primary.map(v => v * 0.78)),
          glowSecondary: rgbToHex(secondary.map(v => v * 0.64)),
          abyssBase: rgbToHex(primary.map(v => v * 0.18)),
          tint: {
            r: Math.round(180 + primary[0] * 0.28),
            g: Math.round(180 + primary[1] * 0.28),
            b: Math.round(185 + primary[2] * 0.28)
          }
        };

        paletteCache.set(src, result);
        return result;
      } catch (_) {
        return null;
      }
    }

    function rgbToHex([r, g, b]) {
      return "#" + [r, g, b]
        .map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, "0"))
        .join("");
    }

    function applyAtmosphere(palette) {
      if (!palette) return;
      const { primaryHex, secondaryHex, glowPrimary, glowSecondary, abyssBase, tint } = palette;
      particleTint = tint;

      document.documentElement.style.setProperty("--aura-primary", primaryHex);
      document.documentElement.style.setProperty("--aura-secondary", secondaryHex);

      ambientLayer.style.background = `
        radial-gradient(ellipse 85% 65% at 50% 34%, ${glowPrimary}dc 0%, transparent 72%),
        radial-gradient(ellipse 90% 70% at 50% 80%, ${glowSecondary}b4 0%, ${abyssBase} 84%, #020203 100%)
      `;
    }

    /* 7. Scatter Layout Engine */
    function layoutScatterItems() {
      const containerWidth = scatterCanvas.clientWidth;
      const containerHeight = scatterCanvas.clientHeight;
      if (!containerWidth || !containerHeight) return;

      const isMobile = containerWidth < 680;
      const items = Array.from(scatterCanvas.querySelectorAll(".scatter-item"));
      if (!items.length) return;

      const mobilePatterns = [
        { xPct: 0.05, wPct: 0.44, gapY: -20, depth: 0.45 },
        { xPct: 0.52, wPct: 0.43, gapY: 36,  depth: 0.70 },
        { xPct: 0.14, wPct: 0.52, gapY: 24,  depth: 0.85 },
        { xPct: 0.46, wPct: 0.48, gapY: -22, depth: 0.55 },
        { xPct: 0.05, wPct: 0.42, gapY: 36,  depth: 0.65 },
        { xPct: 0.50, wPct: 0.46, gapY: 30,  depth: 0.50 }
      ];

      const desktopPatterns = [
        { xPct: 0.08, wPct: 0.28, gapY: -30, depth: 0.45 },
        { xPct: 0.62, wPct: 0.30, gapY: 28,  depth: 0.75 },
        { xPct: 0.25, wPct: 0.32, gapY: -15, depth: 0.90 },
        { xPct: 0.48, wPct: 0.29, gapY: -45, depth: 0.60 },
        { xPct: 0.08, wPct: 0.26, gapY: 24,  depth: 0.50 },
        { xPct: 0.68, wPct: 0.27, gapY: -35, depth: 0.80 }
      ];

      const patterns = isMobile ? mobilePatterns : desktopPatterns;
      let cursorY = isMobile ? 12 : 24;
      let prevBottom = 0;

      items.forEach((el, idx) => {
        const pat = patterns[idx % patterns.length];
        const widthPx = Math.round(containerWidth * pat.wPct);
        const leftPx = Math.round(containerWidth * pat.xPct);

        el.style.width = `${widthPx}px`;
        el.style.left = `${leftPx}px`;
        el.style.setProperty("--depth", pat.depth);
        el.style.zIndex = Math.round(pat.depth * 10);

        const rectHeight = el.offsetHeight || Math.round(widthPx * 0.65 + 32);

        if (idx === 0) {
          el.style.top = `${cursorY}px`;
          prevBottom = cursorY + rectHeight;
        } else {
          const prevEl = items[idx - 1];
          const prevLeft = parseFloat(prevEl.style.left) || 0;
          const prevWidth = parseFloat(prevEl.style.width) || 0;

          const horizontalOverlap =
            leftPx < prevLeft + prevWidth + 16 &&
            leftPx + widthPx + 16 > prevLeft;

          if (horizontalOverlap) {
            cursorY = prevBottom + Math.max(20, pat.gapY + 24);
          } else {
            cursorY = Math.max(
              prevBottom - rectHeight * 0.45 + pat.gapY,
              (parseFloat(prevEl.style.top) || 0) + 40
            );
          }

          const maxTop = Math.max(12, containerHeight - rectHeight - 12);
          cursorY = Math.min(cursorY, maxTop);

          el.style.top = `${Math.round(cursorY)}px`;
          prevBottom = Math.max(prevBottom, cursorY + rectHeight);
        }
      });
    }

    /* 8. Populate Back EXIF */
    async function populateBackExif(item, imgEl) {
      const manual = item.exif || {};
      const auto = manual.camera ? null : await extractImageExif(item.src);

      const camera = manual.camera || (auto?.model ? `${auto.make || ""} ${auto.model}`.trim() : "Apple iPhone 7 Plus");
      const captured = manual.captured || (auto?.dateTime ? auto.dateTime.replace(/^(\d{4}):(\d{2}):(\d{2})\s+(\d{2}:\d{2}).*$/, "$3/$2/$1 · $4") : "Archive");
      const aperture = manual.aperture || auto?.aperture || "f/1.8";
      const shutter = manual.shutter || auto?.shutter || "1/125s";
      const focal = manual.focal || auto?.focal || "3.99 mm";
      const iso = manual.iso || auto?.iso || "ISO 32";
      const app = manual.app || (auto?.software ? auto.software : "Adobe Lightroom");

      let resText = manual.resolution;
      if (!resText && imgEl && imgEl.naturalWidth) {
        const mp = ((imgEl.naturalWidth * imgEl.naturalHeight) / 1000000).toFixed(1);
        resText = `${imgEl.naturalWidth} × ${imgEl.naturalHeight} (${mp} MP)`;
      }

      exifCameraEl.textContent = camera;
      exifCapturedEl.textContent = captured;
      exifApertureEl.textContent = aperture;
      exifShutterEl.textContent = shutter;
      exifFocalEl.textContent = focal;
      exifIsoEl.textContent = iso;
      exifAppEl.textContent = app;
      exifResEl.textContent = resText || "Original";
      exifFileEl.textContent = item.file || "image.jpg";
    }

    /* 9. Lightbox Modal Lifecycle */
    function openLightboxModal() {
      clearTimeout(closeModalTimer);
      isClosingModal = false;
      window.getSelection()?.removeAllRanges();
      lightbox.classList.remove("is-closing", "is-open");
      document.body.classList.add("modal-active");
      void lightbox.offsetWidth;
      lightbox.classList.add("is-open");
      lightboxClose.focus();
    }

    function closeLightboxModal() {
      if (!lightbox.classList.contains("is-open") || isClosingModal) return;
      isClosingModal = true;
      clearTimeout(holdTimer);
      window.getSelection()?.removeAllRanges();
      flipCard.classList.remove("is-pressing");
      lightbox.classList.add("is-closing");
      document.body.classList.remove("modal-active");

      clearTimeout(closeModalTimer);
      closeModalTimer = setTimeout(() => {
        lightbox.classList.remove("is-open", "is-closing");
        flipCard.classList.remove("is-flipped", "is-pressing");
        flipBtnText.textContent = "Camera Info";
        isClosingModal = false;
        if (window.startCanvasLoop) window.startCanvasLoop();
      }, 260);
    }

    function selectEntry(index, openModal = false) {
      if (!entries.length || isClosingModal) return;
      currentIndex = (index + entries.length) % entries.length;
      const item = entries[currentIndex];

      const allItems = scatterCanvas.querySelectorAll(".scatter-item");
      allItems.forEach((el, i) => {
        el.classList.toggle("is-active-song", i === currentIndex);
      });

      const imgEl = allItems[currentIndex]?.querySelector("img");
      if (imgEl && imgEl.complete && imgEl.naturalWidth > 0) {
        const pal = getDominantPalette(item.src, imgEl);
        if (pal) applyAtmosphere(pal);
      }

      syncAudio(item, openModal);

      if (openModal) {
        flipCard.classList.remove("is-flipped", "is-pressing");
        flipBtnText.textContent = "Camera Info";
        lightboxImg.src = item.src;
        lightboxCaption.textContent = item.caption;
        populateBackExif(item, imgEl);
        openLightboxModal();
      }
    }

    function syncAudio(item, autoStart = false) {
      const targetTitle = item.song || DEFAULT_SONG;
      if (musicTitleEl.textContent !== targetTitle) {
        musicTitleEl.textContent = targetTitle;
      }

      if (!item.audio) {
        bgAudio.pause();
        loadedAudioSrc = "";
        musicPill.classList.remove("playing");
        musicProgressEl.style.transform = "scaleX(0)";
        musicStateEl.textContent = "—";
        return;
      }

      if (autoStart && !isAudioActive) {
        isAudioActive = true;
        initAudioAnalyser();
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
      }

      if (loadedAudioSrc === item.audio) {
        if (isAudioActive && bgAudio.paused) {
          bgAudio.play().catch(() => {});
        }
        return;
      }

      loadedAudioSrc = item.audio;
      bgAudio.src = item.audio;
      musicProgressEl.style.transform = "scaleX(0)";

      if (isAudioActive) {
        bgAudio.play()
          .then(() => {
            musicPill.classList.add("playing");
            musicStateEl.textContent = "pause";
          })
          .catch(() => {
            musicPill.classList.remove("playing");
            musicStateEl.textContent = "play";
          });
      }
    }

    /* 10. Render Gallery Cards */
    function renderGallery() {
      scatterCanvas.innerHTML = "";
      archiveCountEl.textContent = `${entries.length} frames`;

      entries.forEach((item, idx) => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "scatter-item" + (idx === currentIndex ? " is-active-song" : "");
        card.setAttribute("aria-label", `View ${item.caption}`);
        card.style.transitionDelay = `${Math.min(idx * 80, 480)}ms`;

        const auraGlow = document.createElement("div");
        auraGlow.className = "item-aura-glow";
        auraGlow.setAttribute("aria-hidden", "true");

        const frame = document.createElement("div");
        frame.className = "scatter-frame";

        const img = document.createElement("img");
        img.src = item.src;
        img.alt = item.caption;
        img.decoding = "async";
        img.draggable = false;

        img.onload = () => {
          const pal = getDominantPalette(item.src, img);
          if (pal) {
            card.style.setProperty("--item-aura", pal.primaryHex);
            if (idx === currentIndex) applyAtmosphere(pal);
          }
          layoutScatterItems();
          requestAnimationFrame(() => card.classList.add("is-visible"));
        };

        img.onerror = () => {
          layoutScatterItems();
          card.classList.add("is-visible");
        };

        const dissolve = document.createElement("div");
        dissolve.className = "edge-dissolve";
        dissolve.setAttribute("aria-hidden", "true");

        frame.appendChild(img);
        frame.appendChild(dissolve);

        const meta = document.createElement("div");
        meta.className = "scatter-meta";

        const title = document.createElement("div");
        title.className = "scatter-title";
        title.textContent = item.caption;

        const sub = document.createElement("div");
        sub.className = "scatter-sub";
        sub.textContent = item.sub || item.song || "Stillness";

        meta.appendChild(title);
        meta.appendChild(sub);

        card.appendChild(auraGlow);
        card.appendChild(frame);
        card.appendChild(meta);

        card.addEventListener("click", (e) => {
          if (lightbox.classList.contains("is-open") || isClosingModal) return;
          e.preventDefault();
          selectEntry(idx, true);
        });

        scatterCanvas.appendChild(card);
      });

      layoutScatterItems();
    }

    /* 11. GitHub Asset Sync with Smart Session Caching (ลด API call และป้องกัน 403 Rate Limit) */
    const GITHUB_CACHE_KEY = "ustzyix_github_cache_v2";
    const GITHUB_CACHE_TTL = 15 * 60 * 1000; // 15 นาที

    function applyExtraPhotos(extraPhotos) {
      if (!extraPhotos || !extraPhotos.length) return;
      const existingNames = new Set(entries.map(p => p.file));
      const filtered = extraPhotos.filter(p => !existingNames.has(p.file));
      if (filtered.length > 0) {
        entries = [...entries, ...filtered];
        renderGallery();
      }
    }

    async function syncGitHubAssets() {
      try {
        const cached = sessionStorage.getItem(GITHUB_CACHE_KEY);
        if (cached) {
          try {
            const data = JSON.parse(cached);
            if (Date.now() - data.time < GITHUB_CACHE_TTL && Array.isArray(data.items)) {
              applyExtraPhotos(data.items);
              return;
            }
          } catch (_) {}
        }

        const imgApi = `https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${REPO_CONFIG.folder}`;
        const audioApi = `https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${REPO_CONFIG.audioFolder}`;

        const [imgRes, audioRes] = await Promise.allSettled([
          fetch(imgApi),
          fetch(audioApi)
        ]);

        const audioMap = new Map();
        if (audioRes.status === "fulfilled" && audioRes.value.ok) {
          const audioFiles = await audioRes.value.json();
          const validAudio = /\.(mp3|m4a|ogg|wav|aac)$/i;
          audioFiles
            .filter(f => f.type === "file" && validAudio.test(f.name))
            .forEach(f => {
              const baseName = f.name.replace(/\.[^/.]+$/, "").toLowerCase();
              audioMap.set(baseName, `./${REPO_CONFIG.audioFolder}/${encodeURIComponent(f.name)}`);
            });
        }

        if (imgRes.status === "fulfilled" && imgRes.value.ok) {
          const files = await imgRes.value.json();
          const validExt = /\.(jpe?g|png|webp|gif|avif)$/i;
          const existingNames = new Set(entries.map(p => p.file));

          const extraPhotos = files
            .filter(f => f.type === "file" && validExt.test(f.name) && !existingNames.has(f.name))
            .map((f, i) => {
              const baseName = f.name.replace(/\.[^/.]+$/, "").toLowerCase();
              const title = formatNewCaption(f.name);
              const num = String(entries.length + i + 1).padStart(2, "0");
              return {
                file: f.name,
                src: `./${REPO_CONFIG.folder}/${encodeURIComponent(f.name)}`,
                caption: title,
                sub: `Archive · ${num}`,
                song: audioMap.has(baseName) ? title : DEFAULT_SONG,
                audio: audioMap.get(baseName) || DEFAULT_AUDIO
              };
            });

          try {
            sessionStorage.setItem(GITHUB_CACHE_KEY, JSON.stringify({
              time: Date.now(),
              items: extraPhotos
            }));
          } catch (_) {}

          if (extraPhotos.length > 0) {
            applyExtraPhotos(extraPhotos);
          }
        }
      } catch (_) {}
    }

    /* 12. Audio Controls */
    musicPill.addEventListener("click", () => {
      const item = entries[currentIndex];
      if (!item || !item.audio) return;

      initAudioAnalyser();
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }

      if (bgAudio.paused) {
        isAudioActive = true;
        if (!loadedAudioSrc) {
          loadedAudioSrc = item.audio;
          bgAudio.src = item.audio;
        }
        bgAudio.play()
          .then(() => {
            musicPill.classList.add("playing");
            musicStateEl.textContent = "pause";
          })
          .catch(() => {
            isAudioActive = false;
            musicPill.classList.remove("playing");
            musicStateEl.textContent = "retry";
          });
      } else {
        isAudioActive = false;
        bgAudio.pause();
        musicPill.classList.remove("playing");
        musicStateEl.textContent = "play";
        document.documentElement.style.setProperty("--bass-boost", "0");
      }
    });

    bgAudio.addEventListener("play", () => {
      musicPill.classList.add("playing");
      musicStateEl.textContent = "pause";
    });

    bgAudio.addEventListener("pause", () => {
      musicPill.classList.remove("playing");
      musicStateEl.textContent = "play";
      document.documentElement.style.setProperty("--bass-boost", "0");
    });

    bgAudio.addEventListener("timeupdate", () => {
      if (bgAudio.duration) {
        musicProgressEl.style.transform = `scaleX(${bgAudio.currentTime / bgAudio.duration})`;
      }
    });

    /* 13. Lightbox 3D Card Flip (รองรับทั้งคลิก/แตะ, ปุ่มเฉพาะ และกดค้าง) */
    let holdTimer = null;
    let didFlipOnHold = false;

    function toggleCardFlip() {
      const isFlipped = flipCard.classList.contains("is-flipped");
      if (!isFlipped) {
        flipCard.classList.add("is-flipped");
        flipBtnText.textContent = "View Photo";
        flipScene.setAttribute("aria-label", "Flip card to view photo");
      } else {
        flipCard.classList.remove("is-flipped");
        flipBtnText.textContent = "Camera Info";
        flipScene.setAttribute("aria-label", "Flip card for EXIF camera information");
      }

      if (navigator.vibrate) {
        try { navigator.vibrate(12); } catch (_) {}
      }
    }

    flipBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleCardFlip();
    });

    /* Click or Hold on Card */
    flipScene.addEventListener("click", (e) => {
      if (isClosingModal || didFlipOnHold) {
        didFlipOnHold = false;
        return;
      }
      toggleCardFlip();
    });

    flipScene.addEventListener("pointerdown", (e) => {
      if (isClosingModal) return;
      didFlipOnHold = false;
      flipCard.classList.add("is-pressing");
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        flipCard.classList.remove("is-pressing");
        didFlipOnHold = true;
        toggleCardFlip();
      }, 340);
    });

    function clearHold() {
      clearTimeout(holdTimer);
      flipCard.classList.remove("is-pressing");
    }

    flipScene.addEventListener("pointerup", clearHold);
    flipScene.addEventListener("pointerleave", clearHold);
    flipScene.addEventListener("pointercancel", clearHold);
    flipScene.addEventListener("contextmenu", (e) => e.preventDefault());

    flipScene.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggleCardFlip();
      }
    });

    /* Lightbox Navigation */
    lightboxClose.addEventListener("click", (e) => {
      e.stopPropagation();
      closeLightboxModal();
    });

    lightboxPrev.addEventListener("click", (e) => {
      e.stopPropagation();
      selectEntry(currentIndex - 1, true);
    });

    lightboxNext.addEventListener("click", (e) => {
      e.stopPropagation();
      selectEntry(currentIndex + 1, true);
    });

    /* Touch Swipe Navigation on Lightbox */
    let touchStartX = 0;
    let touchStartY = 0;
    lightbox.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    lightbox.addEventListener("touchend", (e) => {
      if (e.changedTouches.length === 1) {
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(dx) > 60 && Math.abs(dy) < 50) {
          if (dx < 0) {
            selectEntry(currentIndex + 1, true); // Swipe left -> Next
          } else {
            selectEntry(currentIndex - 1, true); // Swipe right -> Prev
          }
        }
      }
    }, { passive: true });

    /* Backdrop Click to Close */
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) {
        closeLightboxModal();
      }
    });

    /* Keyboard Shortcuts */
    window.addEventListener("keydown", (e) => {
      if (lightbox.classList.contains("is-open")) {
        if (e.key === "Escape") {
          closeLightboxModal();
        } else if (e.key === "ArrowLeft") {
          selectEntry(currentIndex - 1, true);
        } else if (e.key === "ArrowRight") {
          selectEntry(currentIndex + 1, true);
        }
      } else {
        if (e.key === " ") {
          e.preventDefault();
          musicPill.click();
        }
      }
    });

    /* Initialization */
    initFilmGrain();
    initAtmosphereCanvas();
    initLookAround();
    renderGallery();
    syncAudio(entries[0], false);
    
    // Defer GitHub API sync slightly to accelerate initial First Contentful Paint
    if ("requestIdleCallback" in window) {
      window.requestIdleCallback(syncGitHubAssets, { timeout: 2000 });
    } else {
      setTimeout(syncGitHubAssets, 1000);
    }
  </script>
</body>
</html>
