<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ustzyix</title>
  <style>
    :root {
      --fg-color: #e6e6ea;
      --fg-muted: rgba(230, 230, 234, 0.52);
      --fg-whisper: rgba(230, 230, 234, 0.28);
      --aura-primary: #8c1d18;
      --aura-secondary: #3b1814;
      --px: 0px;
      --py: 0px;
      --bass-boost: 0;
      --ease-liquid: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-drift: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #020203;
      color: var(--fg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ชั้นที่ 1: บรรยากาศสีหลักหน้าแรก */
    #ambient-layer {
      position: fixed;
      inset: 0;
      z-index: -7;
      background:
        radial-gradient(ellipse 85% 65% at 50% 34%, rgba(155, 34, 28, 0.56) 0%, transparent 72%),
        radial-gradient(ellipse 90% 70% at 50% 80%, rgba(72, 26, 22, 0.44) 0%, #020203 86%);
      transition: background 1.2s ease;
      pointer-events: none;
    }

    /* ชั้นที่ 2: หมอกลึกเคลื่อนตัวช้าๆ */
    .mist-far {
      position: fixed;
      inset: -24%;
      z-index: -6;
      pointer-events: none;
      opacity: 0.62;
      background:
        radial-gradient(ellipse 74% 58% at 24% 34%, var(--aura-primary) 0%, transparent 76%),
        radial-gradient(ellipse 70% 62% at 76% 68%, var(--aura-secondary) 0%, transparent 78%);
      animation: mistSwayA 28s ease-in-out infinite alternate;
    }

    .mist-near {
      position: fixed;
      inset: -18%;
      z-index: -5;
      pointer-events: none;
      opacity: 0.36;
      background:
        radial-gradient(ellipse 62% 48% at 72% 32%, var(--aura-primary) 0%, transparent 74%),
        radial-gradient(ellipse 72% 50% at 30% 76%, rgba(205, 210, 225, 0.08) 0%, transparent 78%);
      animation: mistSwayB 20s ease-in-out infinite alternate;
    }

    @keyframes mistSwayA {
      0% { transform: translate3d(-2.5%, -1.2%, 0) scale(1); }
      100% { transform: translate3d(2.5%, 1.5%, 0) scale(1.05); }
    }

    @keyframes mistSwayB {
      0% { transform: translate3d(2%, 1.1%, 0) scale(1.03); }
      100% { transform: translate3d(-2.4%, -1.3%, 0) scale(0.98); }
    }

    /* ชั้นที่ 3: ลำแสงเฉียงส่องผ่านความมืด */
    .god-rays {
      position: fixed;
      inset: -20%;
      z-index: -4;
      pointer-events: none;
      opacity: 0.28;
      background:
        radial-gradient(ellipse 22% 78% at 36% 24%, var(--aura-primary) 0%, transparent 78%),
        radial-gradient(ellipse 18% 72% at 54% 28%, rgba(255, 248, 236, 0.14) 0%, transparent 78%);
      transform: rotate(-22deg);
      animation: raySweep 17s ease-in-out infinite alternate;
    }

    @keyframes raySweep {
      0% { transform: translate3d(-3%, -1%, 0) rotate(-24deg); opacity: 0.18; }
      50% { opacity: 0.32; }
      100% { transform: translate3d(3%, 1.5%, 0) rotate(-19deg); opacity: 0.22; }
    }

    /* ชั้นที่ 4: ความมืดรอบขอบจอ */
    .void-vignette {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background: radial-gradient(
        circle at 50% 45%,
        transparent 42%,
        rgba(2, 2, 3, 0.56) 84%,
        rgba(0, 0, 1, 0.92) 100%
      );
    }

    /* ชั้นที่ 5: Canvas 60fps ละอองฝุ่นลอยในอากาศ */
    #atmosphere-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
    }

    /* ชั้นที่ 6: เกรนฟิล์มอนาล็อกบางเบา */
    .film-grain {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0.035;
      background-repeat: repeat;
      animation: grainShift 0.36s steps(2) infinite;
    }

    @keyframes grainShift {
      0% { background-position: 0 0; }
      33% { background-position: 24px -18px; }
      66% { background-position: -19px 27px; }
      100% { background-position: 14px 12px; }
    }

    /* แถบหัวเว็บลอยโปร่งแสงด้านบน */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: max(18px, env(safe-area-inset-top)) 26px 14px;
      font-size: 12px;
      z-index: 20;
      background: linear-gradient(to bottom, rgba(2, 2, 3, 0.72) 0%, transparent 100%);
      pointer-events: none;
    }

    .brand {
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: lowercase;
      color: var(--fg-muted);
      pointer-events: auto;
    }

    .presence-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--fg-whisper);
    }

    .pulse-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--fg-muted);
      animation: solitaryPulse 4.2s ease-in-out infinite;
    }

    @keyframes solitaryPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.85); }
      50% { opacity: 0.85; transform: scale(1.25); }
    }

    /* ผืนผ้าใบวางรูปกระจายตัวอิสระ */
    main {
      position: relative;
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 84px 16px 130px;
      z-index: 2;
      transition: filter 0.45s var(--ease-liquid), transform 0.5s var(--ease-drift), opacity 0.45s ease;
    }

    body.modal-active main {
      filter: blur(8px) brightness(0.75);
      transform: scale(0.975);
    }

    .scatter-canvas {
      position: relative;
      width: 100%;
      min-height: 82dvh;
    }

    /* การ์ดรูปภาพแต่ละใบ */
    .scatter-item {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 9px;
      cursor: pointer;
      opacity: 0;
      transform: translate3d(0, 18px, 0);
      transition:
        opacity 0.85s var(--ease-liquid),
        transform 0.85s var(--ease-drift),
        z-index 0s;
      will-change: transform, opacity;
    }

    .scatter-item.is-visible {
      opacity: 1;
      transform: translate3d(
        calc(var(--px) * var(--depth, 0.5)),
        calc(var(--py) * var(--depth, 0.5)),
        0
      );
    }

    .item-aura-glow {
      position: absolute;
      inset: -48px;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(
        ellipse 68% 64% at 50% 48%,
        var(--item-aura, var(--aura-primary)) 0%,
        transparent 74%
      );
      opacity: 0.58;
      transition: opacity 0.45s ease, transform 0.55s var(--ease-drift);
    }

    .scatter-item.is-active-song .item-aura-glow {
      opacity: 0.78;
      transform: scale(1.08);
    }

    @media (hover: hover) {
      .scatter-item:hover {
        z-index: 12 !important;
      }
      .scatter-item:hover .item-aura-glow {
        opacity: 0.85;
        transform: scale(1.12);
      }
      .scatter-item:hover .scatter-frame {
        transform: scale(1.035);
        box-shadow:
          0 28px 75px -10px rgba(0, 0, 0, 0.94),
          0 0 75px -6px var(--item-aura, var(--aura-primary));
      }
      .scatter-item:hover .scatter-title {
        color: var(--fg-color);
      }
    }

    .scatter-item:active .scatter-frame {
      transform: scale(0.96);
    }

    .scatter-frame {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 6px;
      border: none;
      background-color: #050507;
      box-shadow:
        0 20px 55px -12px rgba(0, 0, 0, 0.88),
        0 0 65px -8px var(--item-aura, var(--aura-primary));
      transition: transform 0.55s var(--ease-drift), box-shadow 0.55s ease;
    }

    .scatter-frame img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
      transform: scale(1.015);
      transition: transform 8s ease-out;
    }

    .scatter-item.is-active-song .scatter-frame img {
      animation: subtleFloatBreath 14s ease-in-out infinite alternate;
    }

    @keyframes subtleFloatBreath {
      0% { transform: scale(1.015) translate3d(-0.4%, -0.3%, 0); }
      100% { transform: scale(1.045) translate3d(0.4%, 0.4%, 0); }
    }

    .edge-dissolve {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow:
        inset 0 0 18px 4px rgba(2, 2, 3, 0.58),
        inset 0 0 36px 1px rgba(2, 2, 3, 0.24);
    }

    .scatter-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-left: 2px;
      max-width: 100%;
    }

    .scatter-title {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: rgba(230, 230, 234, 0.84);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.25s ease;
    }

    .scatter-sub {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9.5px;
      letter-spacing: 0.06em;
      color: rgba(230, 230, 234, 0.42);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scatter-item.is-active-song .scatter-title::before {
      content: "● ";
      font-size: 7px;
      vertical-align: middle;
      color: var(--fg-color);
      opacity: 0.88;
    }

    /* ============================================================
       แถบเพลงลอยด้านล่างแบบไร้กรอบปุ่ม (Soft Atmospheric Mist Text)
       ============================================================ */
    .floating-dock {
      position: fixed;
      bottom: max(22px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: max-content;
      max-width: 90vw;
    }

    .music-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      max-width: min(88vw, 340px);
      height: 32px;
      padding: 0 14px;
      border-radius: 0;
      border: none;
      outline: none;
      background: transparent;
      box-shadow: none;
      color: var(--fg-muted);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95);
      cursor: pointer;
      touch-action: manipulation;
      transition: color 0.35s ease, transform 0.25s ease, opacity 0.35s ease;
    }

    .music-pill::before {
      content: "";
      position: absolute;
      inset: -14px -26px;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(
        ellipse 60% 55% at 50% 50%,
        rgba(6, 6, 9, 0.72) 0%,
        rgba(6, 6, 9, 0.28) 54%,
        transparent 80%
      );
      filter: blur(8px);
      -webkit-filter: blur(8px);
      opacity: 0.85;
      transition: opacity 0.4s ease;
    }

    .music-pill:active {
      transform: scale(0.97);
    }

    .music-pill.playing {
      color: rgba(236, 236, 240, 0.92);
    }

    .eq-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
      width: 10px;
      flex-shrink: 0;
      opacity: 0.78;
    }

    .eq-bars i {
      display: block;
      width: 1.5px;
      height: 9px;
      background-color: currentColor;
      transform-origin: bottom;
      transform: scaleY(0.35);
    }

    .eq-bars i:nth-child(2) { transform: scaleY(0.85); }
    .eq-bars i:nth-child(3) { transform: scaleY(0.55); }

    .music-pill.playing .eq-bars i {
      animation: eqBounce 0.9s ease-in-out infinite alternate;
    }
    .music-pill.playing .eq-bars i:nth-child(2) { animation-delay: 0.25s; }
    .music-pill.playing .eq-bars i:nth-child(3) { animation-delay: 0.5s; }

    @keyframes eqBounce {
      0% { transform: scaleY(0.25); }
      100% { transform: scaleY(1); }
    }

    .music-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-state {
      min-width: 38px;
      text-align: right;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0.55;
      flex-shrink: 0;
    }

    .music-progress {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 2px;
      height: 1px;
      width: auto;
      background: linear-gradient(90deg, transparent 0%, currentColor 50%, transparent 100%);
      opacity: 0.35;
      transform: scaleX(0);
      transform-origin: left;
    }

    /* ============================================================
       หน้า 2: โหมดขยายดูรูปเดี่ยว + Motion Blur ตอนกดเปิด & กดค้างพลิก
       ============================================================ */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px 84px;
      background: rgba(2, 2, 3, 0.92);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.42s var(--ease-liquid);
    }

    .lightbox.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-inner {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      max-width: 92vw;
    }

    /* แอนิเมชัน Motion Blur ตอนกดเปิดรูปเข้า Lightbox และตอนกดปิด */
    .lightbox.is-open .flip-scene {
      animation: openZoomBlur 0.62s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .lightbox.is-closing .flip-scene {
      animation: closeZoomBlur 0.32s cubic-bezier(0.4, 0, 1, 1) forwards;
    }

    @keyframes openZoomBlur {
      0% {
        opacity: 0;
        transform: scale(0.76) translate3d(0, 22px, 0);
        filter: blur(18px) brightness(1.15);
      }
      45% {
        opacity: 0.92;
        transform: scale(1.015) translate3d(0, -2px, 0);
        filter: blur(4px) brightness(1.03);
      }
      100% {
        opacity: 1;
        transform: scale(1) translate3d(0, 0, 0);
        filter: blur(0px) brightness(1);
      }
    }

    @keyframes closeZoomBlur {
      0% {
        opacity: 1;
        transform: scale(1) translate3d(0, 0, 0);
        filter: blur(0px);
      }
      100% {
        opacity: 0;
        transform: scale(0.84) translate3d(0, 14px, 0);
        filter: blur(14px);
      }
    }

    .lightbox.is-open .lightbox-caption {
      animation: openCaptionBlur 0.68s cubic-bezier(0.16, 1, 0.3, 1) 0.08s both;
    }

    .lightbox.is-open .lightbox-hint {
      animation: openHintBlur 0.72s cubic-bezier(0.16, 1, 0.3, 1) 0.14s both;
    }

    .lightbox.is-closing .lightbox-caption,
    .lightbox.is-closing .lightbox-hint {
      opacity: 0;
      filter: blur(8px);
      transition: opacity 0.22s ease, filter 0.22s ease;
    }

    @keyframes openCaptionBlur {
      0% {
        opacity: 0;
        transform: translate3d(0, 10px, 0) scaleX(1.08);
        filter: url(#text-motion-blur) blur(7px);
      }
      100% {
        opacity: 0.9;
        transform: translate3d(0, 0, 0) scaleX(1);
        filter: blur(0px);
      }
    }

    @keyframes openHintBlur {
      0% {
        opacity: 0;
        transform: translate3d(0, 8px, 0);
        filter: blur(5px);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
        filter: blur(0px);
      }
    }

    /* เวที 3D Flip Card */
    .flip-scene {
      perspective: 1400px;
      display: grid;
      place-items: center;
      cursor: pointer;
      touch-action: manipulation;
      will-change: transform, opacity, filter;
    }

    .flip-card {
      position: relative;
      display: grid;
      place-items: center;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 0.82s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .flip-card.is-pressing {
      transform: scale(0.975);
      transition: transform 0.25s ease-out;
    }

    .flip-card.is-flipped {
      transform: rotateY(180deg);
    }

    .flip-card.is-flipped.is-pressing {
      transform: rotateY(180deg) scale(0.975);
    }

    /* ด้านหน้า: รูปภาพคมชัด */
    .flip-front {
      grid-area: 1 / 1;
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.96),
        0 0 80px -10px var(--aura-primary);
    }

    .flip-front img {
      display: block;
      max-width: min(90vw, 760px);
      max-height: 60dvh;
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: none;
    }

    /* ด้านหลัง: ข้อมูลเทคนิคภาพถ่าย & การแต่งสี */
    .flip-back {
      grid-area: 1 / 1;
      width: 100%;
      height: 100%;
      min-width: min(86vw, 340px);
      min-height: 256px;
      border-radius: 6px;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.045) 0%, transparent 65%),
        rgba(9, 9, 13, 0.96);
      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.96),
        0 0 70px -16px var(--aura-primary),
        inset 0 0 0 1px rgba(255, 255, 255, 0.07);
      transform: rotateY(180deg);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    /* เตรียมตัวหนังสือหลังการ์ดให้มี Motion Blur และ Stagger ตามจังหวะพลิก */
    .flip-back .exif-top,
    .flip-back .exif-metrics,
    .flip-back .exif-row {
      opacity: 0;
      transform: translate3d(-18px, 0, 0) scaleX(1.06);
      filter: url(#text-motion-blur) blur(5px);
      will-change: transform, opacity, filter;
    }

    .flip-card.is-flipped .exif-top {
      animation: exifTextMotionIn 0.72s cubic-bezier(0.16, 1, 0.3, 1) 0.16s forwards;
    }

    .flip-card.is-flipped .exif-metrics {
      animation: exifTextMotionIn 0.76s cubic-bezier(0.16, 1, 0.3, 1) 0.22s forwards;
    }

    .flip-card.is-flipped .exif-row:nth-child(1) {
      animation: exifTextMotionIn 0.78s cubic-bezier(0.16, 1, 0.3, 1) 0.27s forwards;
    }

    .flip-card.is-flipped .exif-row:nth-child(2) {
      animation: exifTextMotionIn 0.80s cubic-bezier(0.16, 1, 0.3, 1) 0.31s forwards;
    }

    .flip-card.is-flipped .exif-row:nth-child(3) {
      animation: exifTextMotionIn 0.82s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
    }

    .flip-card.is-flipping-back .exif-top,
    .flip-card.is-flipping-back .exif-metrics,
    .flip-card.is-flipping-back .exif-row {
      animation: exifTextMotionOut 0.34s cubic-bezier(0.4, 0, 1, 1) forwards !important;
    }

    @keyframes exifTextMotionIn {
      0% {
        opacity: 0;
        transform: translate3d(-24px, 0, 0) scaleX(1.12);
        filter: url(#text-motion-blur) blur(6px);
      }
      45% {
        opacity: 0.78;
        transform: translate3d(4px, 0, 0) scaleX(1.02);
        filter: blur(2.5px);
      }
      100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scaleX(1);
        filter: blur(0px);
      }
    }

    @keyframes exifTextMotionOut {
      0% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scaleX(1);
        filter: blur(0px);
      }
      100% {
        opacity: 0;

    function initFilmGrain() {
      const c = document.createElement("canvas");
      c.width = 96;
      c.height = 96;
      const ctx = c.getContext("2d");
      const imgData = ctx.createImageData(96, 96);
      const buf = imgData.data;
      for (let i = 0; i < buf.length; i += 4) {
        const v = (Math.random() * 255) | 0;
        buf[i] = v;
        buf[i + 1] = v;
        buf[i + 2] = v;
        buf[i + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
      filmGrainEl.style.backgroundImage = `url(${c.toDataURL("image/png")})`;
    }

    function initAtmosphereCanvas() {
      const canvas = document.getElementById("atmosphere-canvas");
      const ctx = canvas.getContext("2d");
      let width = 0;
      let height = 0;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener("resize", () => {
        resize();
        layoutScatterItems();
      }, { passive: true });

      const count = width < 600 ? 36 : 56;
      const motes = Array.from({ length: count }, () => {
        const depth = Math.random();
        return {
          x: Math.random() * width,
          y: Math.random() * height,
          r: 0.65 + depth * 1.8,
          vx: (Math.random() - 0.5) * (0.14 + depth * 0.24),
          vy: -(0.12 + depth * 0.30),
          phase: Math.random() * Math.PI * 2,
          freq: 0.009 + Math.random() * 0.015,
          alpha: 0.08 + depth * 0.22,
          depth
        };
      });

      function tick() {
        ctx.clearRect(0, 0, width, height);
        const { r, g, b } = particleTint;

        let bass = 0;
        if (analyser && !bgAudio.paused) {
          analyser.getByteFrequencyData(freqData);
          let sum = 0;
          for (let k = 0; k < 6; k++) sum += freqData[k];
          bass = sum / (6 * 255);
          document.documentElement.style.setProperty("--bass-boost", bass.toFixed(3));
        }

        for (let i = 0; i < motes.length; i++) {
          const m = motes[i];
          m.phase += m.freq;
          m.x += m.vx + Math.sin(m.phase) * 0.20;
          m.y += m.vy - bass * 0.22 * m.depth;

          if (m.y < -14) {
            m.y = height + 14;
            m.x = Math.random() * width;
          }
          if (m.x < -14) m.x = width + 14;
          if (m.x > width + 14) m.x = -14;

          const twinkle = 0.65 + 0.35 * Math.sin(m.phase * 1.8);
          const finalAlpha = Math.min(m.alpha * twinkle + bass * 0.06, 0.52);

          ctx.beginPath();
          ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${finalAlpha.toFixed(3)})`;
          ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function initLookAround() {
      let targetX = 0;
      let targetY = 0;
      let curX = 0;
      let curY = 0;

      window.addEventListener("pointermove", (e) => {
        const nx = (e.clientX / window.innerWidth) * 2 - 1;
        const ny = (e.clientY / window.innerHeight) * 2 - 1;
        targetX = nx * 10;
        targetY = ny * 8;
      }, { passive: true });

      window.addEventListener("deviceorientation", (e) => {
        if (e.gamma === null || e.beta === null) return;
        const gx = Math.max(-25, Math.min(25, e.gamma)) / 25;
        const gy = Math.max(-25, Math.min(25, e.beta - 45)) / 25;
        targetX = gx * 10;
        targetY = gy * 8;
      }, { passive: true });

      function updateParallax() {
        curX += (targetX - curX) * 0.06;
        curY += (targetY - curY) * 0.06;
        document.documentElement.style.setProperty("--px", `${curX.toFixed(2)}px`);
        document.documentElement.style.setProperty("--py", `${curY.toFixed(2)}px`);
        requestAnimationFrame(updateParallax);
      }
      requestAnimationFrame(updateParallax);
    }

    function initAudioAnalyser() {
      if (audioCtx) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioCtx = new AudioContextClass();
        const source = audioCtx.createMediaElementSource(bgAudio);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        freqData = new Uint8Array(analyser.frequencyBinCount);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
      } catch (_) {
        analyser = null;
      }
    }

    function formatNewCaption(filename) {
      return filename
        .replace(/\.[^/.]+$/, "")
        .replace(/\(\d+\)/g, "")
        .replace(/^IMG[-_]?/i, "")
        .replace(/[-_]/g, " ")
        .trim() || "Stillness";
    }

    /* อ่าน EXIF Metadata จากไฟล์ JPEG อัตโนมัติสำหรับรูปใหม่ที่อัปโหลดเพิ่ม */
    async function extractImageExif(src) {
      if (exifAutoCache.has(src)) return exifAutoCache.get(src);
      try {
        const res = await fetch(src);
        const buf = await res.arrayBuffer();
        const view = new DataView(buf);
        if (view.byteLength < 4 || view.getUint16(0) !== 0xFFD8) return null;

        let offset = 2;
        while (offset < view.byteLength - 4) {
          const marker = view.getUint16(offset);
          offset += 2;
          if (marker === 0xFFE1) {
            const len = view.getUint16(offset);
            const header = String.fromCharCode(
              view.getUint8(offset + 2),
              view.getUint8(offset + 3),
              view.getUint8(offset + 4),
              view.getUint8(offset + 5)
            );
            if (header === "Exif") {
              const tiffStart = offset + 8;
              const little = view.getUint16(tiffStart) === 0x4949;
              const get16 = (o) => view.getUint16(o, little);
              const get32 = (o) => view.getUint32(o, little);
              const readStr = (o, count) => {
                let s = "";
                for (let i = 0; i < count - 1; i++) {
                  const ch = view.getUint8(o + i);
                  if (ch === 0) break;
                  s += String.fromCharCode(ch);
                }
                return s.trim();
              };

              const parsed = {};
              const parseIFD = (ifdOffset) => {
                if (!ifdOffset || tiffStart + ifdOffset >= view.byteLength - 2) return;
                const entriesCount = get16(tiffStart + ifdOffset);
                for (let i = 0; i < entriesCount; i++) {
                  const entryOffset = tiffStart + ifdOffset + 2 + i * 12;
                  if (entryOffset + 12 > view.byteLength) break;
                  const tag = get16(entryOffset);
                  const type = get16(entryOffset + 2);
                  const count = get32(entryOffset + 4);
                  const valOffset = get32(entryOffset + 8);

                  if (tag === 0x010F && type === 2) parsed.make = readStr(tiffStart + valOffset, count);
                  if (tag === 0x0110 && type === 2) parsed.model = readStr(tiffStart + valOffset, count);
                  if (tag === 0x0131 && type === 2) parsed.software = readStr(tiffStart + valOffset, count);
                  if (tag === 0x0132 && type === 2) parsed.dateTime = readStr(tiffStart + valOffset, count);
                  if (tag === 0x8769) parseIFD(valOffset);

                  if (tag === 0x829A && type === 5) {
                    const num = get32(tiffStart + valOffset);
                    const den = get32(tiffStart + valOffset + 4);
                    if (num && den) {
                      parsed.shutter = num < den ? `1/${Math.round(den / num)}s` : `${(num / den).toFixed(1)}s`;
                    }
                  }
                  if (tag === 0x829D && type === 5) {
                    const num = get32(tiffStart + valOffset);
                    const den = get32(tiffStart + valOffset + 4);
                    if (num && den) parsed.aperture = `f/${(num / den).toFixed(1).replace(/\.0$/, "")}`;
                  }
                  if (tag === 0x8827 && type === 3) {
                    const isoVal = little ? view.getUint16(entryOffset + 8, true) : view.getUint16(entryOffset + 8, false);
                    if (isoVal) parsed.iso = `ISO ${isoVal}`;
                  }
                  if (tag === 0x920A && type === 5) {
                    const num = get32(tiffStart + valOffset);
                    const den = get32(tiffStart + valOffset + 4);
                    if (num && den) parsed.focal = `${(num / den).toFixed(2).replace(/\.00$/, "")} mm`;
                  }
                }
              };

              parseIFD(get32(tiffStart + 4));
              exifAutoCache.set(src, parsed);
              return parsed;
            }
            offset += len;
          } else if ((marker & 0xFF00) !== 0xFF00) {
            break;
          } else {
            offset += view.getUint16(offset);
          }
        }
      } catch (_) {}
      return null;
    }

    function getDominantPalette(src, imgElement) {
      if (paletteCache.has(src)) return paletteCache.get(src);

      try {
        const size = 36;
        sampleCtx.clearRect(0, 0, size, size);
        sampleCtx.drawImage(imgElement, 0, 0, size, size);

        const data = sampleCtx.getImageData(0, 0, size, size).data;
        const buckets = new Map();
        const step = 28;
        let rSum = 0, gSum = 0, bSum = 0, total = 0;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i + 1], b = data[i + 2];
          rSum += r; gSum += g; bSum += b; total++;

          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const sat = max === 0 ? 0 : (max - min) / max;
          const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;

          if (lum < 0.08 || lum > 0.90) continue;

          const key = `${(r / step) | 0},${(g / step) | 0},${(b / step) | 0}`;
          let bucket = buckets.get(key);
          if (!bucket) {
            bucket = { r: 0, g: 0, b: 0, count: 0, satSum: 0 };
            buckets.set(key, bucket);
          }
          bucket.r += r;
          bucket.g += g;
          bucket.b += b;
          bucket.count += 1;
          bucket.satSum += sat;
        }

        const clusters = Array.from(buckets.values()).map(b => {
          const avgSat = b.satSum / b.count;
          return {
            rgb: [b.r / b.count, b.g / b.count, b.b / b.count],
            score: b.count * (0.45 + avgSat * 1.15)
          };
        });

        clusters.sort((a, b) => b.score - a.score);

        const avg = [rSum / total, gSum / total, bSum / total];
        const primary = clusters.length > 0 ? clusters[0].rgb : avg;

        let secondary = null;
        for (let i = 1; i < clusters.length; i++) {
          const c = clusters[i].rgb;
          const dist = Math.abs(c[0] - primary[0]) + Math.abs(c[1] - primary[1]) + Math.abs(c[2] - primary[2]);
          if (dist > 75) {
            secondary = c;
            break;
          }
        }
        if (!secondary) secondary = primary.map(v => v * 0.45);

        const result = {
          primaryHex: rgbToHex(primary),
          secondaryHex: rgbToHex(secondary),
          glowPrimary: rgbToHex(primary.map(v => v * 0.78)),
          glowSecondary: rgbToHex(secondary.map(v => v * 0.64)),
          abyssBase: rgbToHex(primary.map(v => v * 0.18)),
          tint: {
            r: Math.round(180 + primary[0] * 0.28),
            g: Math.round(180 + primary[1] * 0.28),
            b: Math.round(185 + primary[2] * 0.28)
          }
        };

        paletteCache.set(src, result);
        return result;
      } catch (_) {
        return null;
      }
    }

    function rgbToHex([r, g, b]) {
      return "#" + [r, g, b]
        .map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, "0"))
        .join("");
    }

    /* ปรับสีพื้นหลังหน้าแรกให้กว้างและชัดขึ้นตามภาพที่เลือก */
    function applyAtmosphere(palette) {
      if (!palette) return;
      const { primaryHex, secondaryHex, glowPrimary, glowSecondary, abyssBase, tint } = palette;
      particleTint = tint;

      document.documentElement.style.setProperty("--aura-primary", primaryHex);
      document.documentElement.style.setProperty("--aura-secondary", secondaryHex);

      ambientLayer.style.background = `
        radial-gradient(ellipse 85% 65% at 50% 34%, ${glowPrimary}dc 0%, transparent 72%),
        radial-gradient(ellipse 90% 70% at 50% 80%, ${glowSecondary}b4 0%, ${abyssBase} 84%, #020203 100%)
      `;
    }

    function layoutScatterItems() {
      const containerWidth = scatterCanvas.clientWidth;
      if (!containerWidth) return;

      const isMobile = containerWidth < 680;
      const items = Array.from(scatterCanvas.querySelectorAll(".scatter-item"));
      if (!items.length) return;

      const mobilePatterns = [
        { xPct: 0.04, wPct: 0.44, gapY: -30, depth: 0.45 },
        { xPct: 0.55, wPct: 0.41, gapY: 42,  depth: 0.70 },
        { xPct: 0.14, wPct: 0.52, gapY: 28,  depth: 0.85 },
        { xPct: 0.46, wPct: 0.48, gapY: -22, depth: 0.55 },
        { xPct: 0.05, wPct: 0.42, gapY: 36,  depth: 0.65 },
        { xPct: 0.50, wPct: 0.46, gapY: 30,  depth: 0.50 }
      ];

      const desktopPatterns = [
        { xPct: 0.06, wPct: 0.24, gapY: -40, depth: 0.45 },
        { xPct: 0.64, wPct: 0.26, gapY: 30,  depth: 0.75 },
        { xPct: 0.25, wPct: 0.28, gapY: -20, depth: 0.90 },
        { xPct: 0.46, wPct: 0.27, gapY: -55, depth: 0.60 },
        { xPct: 0.08, wPct: 0.23, gapY: 24,  depth: 0.50 },
        { xPct: 0.68, wPct: 0.25, gapY: -35, depth: 0.80 }
      ];

      const patterns = isMobile ? mobilePatterns : desktopPatterns;
      let cursorY = isMobile ? 16 : 24;
      let prevBottom = 0;

      items.forEach((el, idx) => {
        const pat = patterns[idx % patterns.length];
        const widthPx = Math.round(containerWidth * pat.wPct);
        const leftPx = Math.round(containerWidth * pat.xPct);

        el.style.width = `${widthPx}px`;
        el.style.left = `${leftPx}px`;
        el.style.setProperty("--depth", pat.depth);
        el.style.zIndex = Math.round(pat.depth * 10);

        const rectHeight = el.offsetHeight || Math.round(widthPx * 1.25);

        if (idx === 0) {
          el.style.top = `${cursorY}px`;
          prevBottom = cursorY + rectHeight;
        } else {
          const prevEl = items[idx - 1];
          const prevLeft = parseFloat(prevEl.style.left) || 0;
          const prevWidth = parseFloat(prevEl.style.width) || 0;

          const horizontalOverlap =
            leftPx < prevLeft + prevWidth + 16 &&
            leftPx + widthPx + 16 > prevLeft;

          if (horizontalOverlap) {
            cursorY = prevBottom + Math.max(32, pat.gapY + 34);
          } else {
            cursorY = Math.max(
              prevBottom - rectHeight * 0.42 + pat.gapY,
              (parseFloat(prevEl.style.top) || 0) + 56
            );
          }

          el.style.top = `${Math.round(cursorY)}px`;
          prevBottom = Math.max(prevBottom, cursorY + rectHeight);
        }
      });

      scatterCanvas.style.height = `${Math.round(prevBottom + 60)}px`;
    }

    async function populateBackExif(item, imgEl) {
      const manual = item.exif || {};
      const auto = manual.camera ? null : await extractImageExif(item.src);

      const camera = manual.camera || (auto?.model ? `${auto.make || ""} ${auto.model}`.trim() : "Apple iPhone 7 Plus");
      const captured = manual.captured || (auto?.dateTime ? auto.dateTime.replace(/^(\d{4}):(\d{2}):(\d{2})\s+(\d{2}:\d{2}).*$/, "$3/$2/$1 · $4") : "Archive");
      const aperture = manual.aperture || auto?.aperture || "f/1.8";
      const shutter = manual.shutter || auto?.shutter || "1/125s";
      const focal = manual.focal || auto?.focal || "3.99 mm";
      const iso = manual.iso || auto?.iso || "ISO 32";
      const app = manual.app || (auto?.software ? auto.software : "Adobe Lightroom");

      let resText = manual.resolution;
      if (!resText && imgEl && imgEl.naturalWidth) {
        const mp = ((imgEl.naturalWidth * imgEl.naturalHeight) / 1000000).toFixed(1);
        resText = `${imgEl.naturalWidth} × ${imgEl.naturalHeight} (${mp} MP)`;
      }

      exifCameraEl.textContent = camera;
      exifCapturedEl.textContent = captured;
      exifApertureEl.textContent = aperture;
      exifShutterEl.textContent = shutter;
      exifFocalEl.textContent = focal;
      exifIsoEl.textContent = iso;
      exifAppEl.textContent = app;
      exifResEl.textContent = resText || "Original";
      exifFileEl.textContent = item.file || "image.jpg";
    }

    function openLightboxModal() {
      clearTimeout(closeModalTimer);
      lightbox.classList.remove("is-closing", "is-open");
      document.body.classList.add("modal-active");
      void lightbox.offsetWidth;
      lightbox.classList.add("is-open");
    }

    function closeLightboxModal() {
      if (!lightbox.classList.contains("is-open") || lightbox.classList.contains("is-closing")) return;
      lightbox.classList.add("is-closing");
      document.body.classList.remove("modal-active");
      clearTimeout(closeModalTimer);
      closeModalTimer = setTimeout(() => {
        lightbox.classList.remove("is-open", "is-closing");
        flipCard.classList.remove("is-flipped", "is-pressing", "is-flipping-back");
      }, 320);
    }

    function selectEntry(index, openModal = false) {
      if (!entries.length) return;
      currentIndex = (index + entries.length) % entries.length;
      const item = entries[currentIndex];

      const allItems = scatterCanvas.querySelectorAll(".scatter-item");
      allItems.forEach((el, i) => {
        el.classList.toggle("is-active-song", i === currentIndex);
      });

      const imgEl = allItems[currentIndex]?.querySelector("img");
      if (imgEl && imgEl.complete && imgEl.naturalWidth > 0) {
        const pal = getDominantPalette(item.src, imgEl);
        if (pal) applyAtmosphere(pal);
      }

      syncAudio(item, openModal);

      if (openModal) {
        flipCard.classList.remove("is-flipped", "is-pressing", "is-flipping-back");
        lightboxHint.classList.remove("is-switching");
        lightboxCaption.classList.remove("is-blur-pulse");
        lightboxImg.src = item.src;
        lightboxCaption.textContent = item.caption;
        lightboxHint.textContent = "hold photo for camera & color info · tap outside to return";
        populateBackExif(item, imgEl);
        openLightboxModal();
      }
    }

    function syncAudio(item, autoStart = false) {
      const targetTitle = item.song || DEFAULT_SONG;
      if (musicTitleEl.textContent !== targetTitle) {
        musicTitleEl.textContent = targetTitle;
      }

      if (!item.audio) {
        bgAudio.pause();
        loadedAudioSrc = "";
        musicPill.classList.remove("playing");
        musicProgressEl.style.transform = "scaleX(0)";
        musicStateEl.textContent = "—";
        return;
      }

      if (autoStart && !isAudioActive) {
        isAudioActive = true;
        initAudioAnalyser();
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
      }

      if (loadedAudioSrc === item.audio) {
        if (isAudioActive && bgAudio.paused) {
          bgAudio.play().catch(() => {});
        }
        return;
      }

      loadedAudioSrc = item.audio;
      bgAudio.src = item.audio;
      musicProgressEl.style.transform = "scaleX(0)";

      if (isAudioActive) {
        bgAudio.play()
          .then(() => {
            musicPill.classList.add("playing");
            musicStateEl.textContent = "pause";
          })
          .catch(() => {
            musicPill.classList.remove("playing");
            musicStateEl.textContent = "play";
          });
      }
    }

    function renderGallery() {
      scatterCanvas.innerHTML = "";
      archiveCountEl.textContent = `${entries.length} frames`;

      entries.forEach((item, idx) => {
        const card = document.createElement("article");
        card.className = "scatter-item" + (idx === currentIndex ? " is-active-song" : "");
        card.style.transitionDelay = `${Math.min(idx * 90, 540)}ms`;

        const auraGlow = document.createElement("div");
        auraGlow.className = "item-aura-glow";

        const frame = document.createElement("div");
        frame.className = "scatter-frame";

        const img = document.createElement("img");
        img.src = item.src;
        img.alt = item.caption;
        img.decoding = "async";

        img.onload = () => {
          const pal = getDominantPalette(item.src, img);
          if (pal) {
            card.style.setProperty("--item-aura", pal.primaryHex);
            if (idx === currentIndex) applyAtmosphere(pal);
          }
          layoutScatterItems();
          requestAnimationFrame(() => card.classList.add("is-visible"));
        };

        img.onerror = () => {
          layoutScatterItems();
          card.classList.add("is-visible");
        };

        const dissolve = document.createElement("div");
        dissolve.className = "edge-dissolve";

        frame.appendChild(img);
        frame.appendChild(dissolve);

        const meta = document.createElement("div");
        meta.className = "scatter-meta";

        const title = document.createElement("div");
        title.className = "scatter-title";
        title.textContent = item.caption;

        const sub = document.createElement("div");
        sub.className = "scatter-sub";
        sub.textContent = item.sub || item.song || "Stillness";

        meta.appendChild(title);
        meta.appendChild(sub);

        card.appendChild(auraGlow);
        card.appendChild(frame);
        card.appendChild(meta);

        card.addEventListener("click", () => {
          selectEntry(idx, true);
        });

        scatterCanvas.appendChild(card);
      });

      layoutScatterItems();
    }

    async function syncGitHubAssets() {
      try {
        const imgApi = `https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${REPO_CONFIG.folder}`;
        const audioApi = `https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${REPO_CONFIG.audioFolder}`;

        const [imgRes, audioRes] = await Promise.all([
          fetch(imgApi),
          fetch(audioApi).catch(() => null)
        ]);

        const audioMap = new Map();
        if (audioRes && audioRes.ok) {
          const audioFiles = await audioRes.json();
          const validAudio = /\.(mp3|m4a|ogg|wav|aac)$/i;
          audioFiles
            .filter(f => f.type === "file" && validAudio.test(f.name))
            .forEach(f => {
              const baseName = f.name.replace(/\.[^/.]+$/, "").toLowerCase();
              audioMap.set(baseName, `./${REPO_CONFIG.audioFolder}/${encodeURIComponent(f.name)}`);
            });
        }

        if (imgRes && imgRes.ok) {
          const files = await imgRes.json();
          const validExt = /\.(jpe?g|png|webp|gif|avif)$/i;
          const existingNames = new Set(entries.map(p => p.file));

          const extraPhotos = files
            .filter(f => f.type === "file" && validExt.test(f.name) && !existingNames.has(f.name))
            .map((f, i) => {
              const baseName = f.name.replace(/\.[^/.]+$/, "").toLowerCase();
              const title = formatNewCaption(f.name);
              const num = String(entries.length + i + 1).padStart(2, "0");
              return {
                file: f.name,
                src: `./${REPO_CONFIG.folder}/${encodeURIComponent(f.name)}`,
                caption: title,
                sub: `Archive · ${num}`,
                song: audioMap.has(baseName) ? title : DEFAULT_SONG,
                audio: audioMap.get(baseName) || DEFAULT_AUDIO
              };
            });

          if (extraPhotos.length > 0) {
            entries = [...entries, ...extraPhotos];
            renderGallery();
          }
        }
      } catch (_) {}
    }

    musicPill.addEventListener("click", () => {
      const item = entries[currentIndex];
      if (!item || !item.audio) return;

      initAudioAnalyser();
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }

      if (bgAudio.paused) {
        isAudioActive = true;
        if (!loadedAudioSrc) {
          loadedAudioSrc = item.audio;
          bgAudio.src = item.audio;
        }
        bgAudio.play()
          .then(() => {
            musicPill.classList.add("playing");
            musicStateEl.textContent = "pause";
          })
          .catch(() => {
            isAudioActive = false;
            musicPill.classList.remove("playing");
            musicStateEl.textContent = "retry";
          });
      } else {
        isAudioActive = false;
        bgAudio.pause();
        musicPill.classList.remove("playing");
        musicStateEl.textContent = "play";
        document.documentElement.style.setProperty("--bass-boost", "0");
      }
    });

    bgAudio.addEventListener("play", () => {
      musicPill.classList.add("playing");
      musicStateEl.textContent = "pause";
    });

    bgAudio.addEventListener("pause", () => {
      musicPill.classList.remove("playing");
      musicStateEl.textContent = "play";
      document.documentElement.style.setProperty("--bass-boost", "0");
    });

    bgAudio.addEventListener("timeupdate", () => {
      if (bgAudio.duration) {
        musicProgressEl.style.transform = `scaleX(${bgAudio.currentTime / bgAudio.duration})`;
      }
    });

    /* ระบบกดค้าง (Long Press) เพื่อพลิกการ์ด 3D พร้อม Motion Blur เฉพาะตัวหนังสือ */
    let holdTimer = null;
    let didFlipOnHold = false;
    let hintSwitchTimer = null;

    function smoothUpdateHint(nextText) {
      clearTimeout(hintSwitchTimer);
      lightboxHint.classList.add("is-switching");
      hintSwitchTimer = setTimeout(() => {
        lightboxHint.textContent = nextText;
        lightboxHint.classList.remove("is-switching");
      }, 220);
    }

    function toggleCardFlip() {
      const currentlyFlipped = flipCard.classList.contains("is-flipped");

      lightboxCaption.classList.remove("is-blur-pulse");
      void lightboxCaption.offsetWidth;
      lightboxCaption.classList.add("is-blur-pulse");

      if (!currentlyFlipped) {
        flipCard.classList.remove("is-flipping-back");
        flipCard.classList.add("is-flipped");
        smoothUpdateHint("hold again to flip back · tap outside to return");
      } else {
        flipCard.classList.add("is-flipping-back");
        flipCard.classList.remove("is-flipped");
        smoothUpdateHint("hold photo for camera & color info · tap outside to return");
        setTimeout(() => {
          flipCard.classList.remove("is-flipping-back");
        }, 420);
      }

      if (navigator.vibrate) {
        try { navigator.vibrate(14); } catch (_) {}
      }
    }

    function startHold(e) {
      e.stopPropagation();
      didFlipOnHold = false;
      flipCard.classList.add("is-pressing");
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        flipCard.classList.remove("is-pressing");
        didFlipOnHold = true;
        toggleCardFlip();
      }, 360);
    }

    function cancelHold(e) {
      if (e) e.stopPropagation();
      clearTimeout(holdTimer);
      flipCard.classList.remove("is-pressing");
    }

    flipScene.addEventListener("pointerdown", startHold);
    flipScene.addEventListener("pointerup", (e) => {
      cancelHold(e);
    });
    flipScene.addEventListener("pointerleave", cancelHold);
    flipScene.addEventListener("pointercancel", cancelHold);
    flipScene.addEventListener("contextmenu", (e) => e.preventDefault());
    flipScene.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!didFlipOnHold && flipCard.classList.contains("is-flipped")) {
        toggleCardFlip();
      }
    });

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox || e.target.id === "lightbox-inner") {
        closeLightboxModal();
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeLightboxModal();
      if (e.key === " ") {
        e.preventDefault();
        musicPill.click();
      }
    });

    initFilmGrain();
    initAtmosphereCanvas();
    initLookAround();
    renderGallery();
    syncAudio(entries[0], false);
    syncGitHubAssets();
  </script>
</body>
</html>
