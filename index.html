<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ustzyix</title>
  <style>
    :root {
      --fg-color: #e4e4e7;
      --fg-muted: rgba(228, 228, 231, 0.46);
      --fg-whisper: rgba(228, 228, 231, 0.24);
      --border-color: rgba(228, 228, 231, 0.13);
      --glass-bg: rgba(8, 8, 10, 0.48);
      --aura-primary: #8c1d18;
      --aura-secondary: #3b1814;
      --ease-liquid: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-drift: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      color: var(--fg-color);
      background-color: #040406;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* พื้นหลังหลักที่ปรับเฉดสีตามกลุ่มสีส่วนใหญ่ของรูปภาพ */
    #ambient-layer {
      position: fixed;
      inset: 0;
      z-index: -5;
      background: radial-gradient(circle at 50% 40%, #260d0d 0%, #040406 78%);
      transition: background 1.6s var(--ease-liquid);
    }

    /* ชั้นหมอกลอยช้าๆ แบบ Silent Hill */
    .mist-layer {
      position: fixed;
      inset: -25%;
      z-index: -4;
      pointer-events: none;
      opacity: 0.4;
      background:
        radial-gradient(ellipse 65% 45% at 30% 38%, var(--aura-primary) 0%, transparent 70%),
        radial-gradient(ellipse 60% 50% at 70% 66%, var(--aura-secondary) 0%, transparent 72%);
      filter: blur(62px);
      animation: mistDrift 24s ease-in-out infinite alternate;
      transition: background 1.6s ease;
      will-change: transform;
    }

    @keyframes mistDrift {
      0% { transform: translate3d(-2.5%, -1.5%, 0) scale(1); }
      50% { transform: translate3d(2%, 1.2%, 0) scale(1.06); }
      100% { transform: translate3d(-1.2%, 2.2%, 0) scale(1.02); }
    }

    /* ละอองเถ้า/ฝุ่นลอยจางๆ แบบ Dark Souls & Silent Hill */
    .ash-field {
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      overflow: hidden;
    }

    .ash-mote {
      position: absolute;
      bottom: -10px;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: var(--fg-color);
      opacity: 0;
      animation: ashFloat linear infinite;
      will-change: transform, opacity;
    }

    @keyframes ashFloat {
      0% { transform: translate3d(0, 0, 0); opacity: 0; }
      20% { opacity: 0.22; }
      80% { opacity: 0.14; }
      100% { transform: translate3d(var(--drift-x, 24px), -105dvh, 0); opacity: 0; }
    }

    /* ขอบมืดลึกให้รู้สึกโดดเดี่ยวท่ามกลางความว่างเปล่า */
    .void-vignette {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background: radial-gradient(
        circle at 50% 44%,
        transparent 24%,
        rgba(3, 3, 5, 0.72) 74%,
        rgba(2, 2, 3, 0.96) 100%
      );
    }

    /* ผิวสัมผัสเกรนฟิล์มบางเบา */
    .film-grain {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.032;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 26px 32px;
      font-size: 12px;
    }

    .brand {
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: lowercase;
      color: var(--fg-muted);
      transition: color 0.8s ease;
    }

    .memory-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--fg-whisper);
      transition: color 0.8s ease;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 24px 44px;
      width: 100%;
    }

    .solitary-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      width: 100%;
      animation: fadeSlow 1.6s var(--ease-liquid) forwards;
    }

    @keyframes fadeSlow {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* เวทีแสดงภาพแบบซ้อน 2 เลเยอร์รองรับ Directional Motion Blur */
    .frame-wrap {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 220px;
      touch-action: pan-y;
      will-change: transform, filter;
    }

    /* แสงเรืองจางๆ รอบภาพ */
    .frame-aura {
      position: absolute;
      inset: -24px;
      z-index: -1;
      border-radius: 16px;
      background: radial-gradient(circle, var(--aura-primary) 0%, transparent 72%);
      opacity: 0.34;
      filter: blur(30px);
      transition: background 1.4s ease, opacity 1.2s ease, transform 0.8s var(--ease-drift);
      pointer-events: none;
    }

    .frame-wrap.is-shifting .frame-aura {
      opacity: 0.52;
      transform: scale(1.08);
    }

    .slide-img {
      grid-area: 1 / 1;
      max-width: min(86vw, 660px);
      max-height: 52dvh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 3px;
      border: 1px solid var(--border-color);
      box-shadow:
        0 35px 95px -15px rgba(0, 0, 0, 0.9),
        0 0 1px 1px rgba(255, 255, 255, 0.04);
      opacity: 0;
      transform: translate3d(0, 0, 0) scale(1);
      pointer-events: none;
      will-change: transform, opacity;
    }

    .slide-img.is-active {
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
    }

    .slide-img.is-exiting {
      z-index: 1;
    }

    .meta-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
      text-align: center;
    }

    .caption {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.22em;
      color: var(--fg-color);
      opacity: 0.9;
      transition:
        opacity 0.38s var(--ease-liquid),
        transform 0.48s var(--ease-drift),
        filter 0.38s ease,
        color 0.8s ease;
      will-change: transform, opacity, filter;
    }

    .caption.is-shifting {
      opacity: 0;
      filter: blur(5px);
      transform: translate3d(0, 6px, 0);
    }

    /* แถบเล่นเพลงมินิมอล */
    .music-pill {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      max-width: min(84vw, 310px);
      padding: 7px 16px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--fg-muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: border-color 0.4s ease, color 0.4s ease, transform 0.25s var(--ease-liquid);
    }

    .music-pill:hover,
    .music-pill.playing {
      color: var(--fg-color);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .music-pill:active {
      transform: scale(0.98);
    }

    .eq-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
      width: 10px;
      flex-shrink: 0;
    }

    .eq-bars i {
      display: block;
      width: 1.5px;
      height: 3px;
      background-color: currentColor;
      transition: height 0.25s ease;
    }

    .eq-bars i:nth-child(2) { height: 8px; }
    .eq-bars i:nth-child(3) { height: 5px; }

    .music-pill.playing .eq-bars i {
      animation: eqBounce 1.1s ease-in-out infinite alternate;
    }
    .music-pill.playing .eq-bars i:nth-child(2) { animation-delay: 0.25s; }
    .music-pill.playing .eq-bars i:nth-child(3) { animation-delay: 0.5s; }

    @keyframes eqBounce {
      0% { height: 2px; }
      100% { height: 10px; }
    }

    .music-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-state {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.65;
      flex-shrink: 0;
    }

    .music-progress {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 1px;
      width: 0%;
      background: currentColor;
      opacity: 0.55;
      transition: width 0.25s linear;
    }

    .swatches {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--fg-whisper);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-top: 2px;
      transition: opacity 0.4s ease, filter 0.4s ease;
    }

    .swatches.is-shifting {
      opacity: 0.25;
      filter: blur(3px);
    }

    .swatch-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      cursor: pointer;
      opacity: 0.85;
      transition: transform 0.25s var(--ease-liquid), opacity 0.25s ease;
    }

    .swatch-dot:hover {
      transform: scale(1.3);
      opacity: 1;
    }

    /* ปุ่มเปลี่ยนภาพแบบมินิมอลกลมกลืนไปกับความมืด */
    .nav-whisper {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px;
      letter-spacing: 0.16em;
      color: var(--fg-muted);
    }

    .nav-whisper.hidden {
      display: none;
    }

    .nav-whisper button {
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      color: inherit;
      font: inherit;
      letter-spacing: inherit;
      cursor: pointer;
      padding: 5px 14px;
      opacity: 0.72;
      transition:
        opacity 0.25s ease,
        border-color 0.25s ease,
        color 0.25s ease,
        transform 0.22s var(--ease-liquid);
    }

    .nav-whisper button:hover {
      opacity: 1;
      color: var(--fg-color);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .nav-whisper button:active {
      transform: scale(0.94);
    }

    @media (max-width: 600px) {
      header { padding: 22px 22px; }
      .slide-img { max-width: 88vw; max-height: 48dvh; }
      .solitary-stage { gap: 22px; }
    }
  </style>
</head>
<body>
  <!-- SVG Filter สำหรับสร้าง Directional Motion Blur ตามแกนแนวนอน -->
  <svg width="0" height="0" style="position:fixed;pointer-events:none;" aria-hidden="true">
    <defs>
      <filter id="directional-motion-blur" x="-15%" y="-5%" width="130%" height="110%" color-interpolation-filters="sRGB">
        <feGaussianBlur id="motion-blur-node" in="SourceGraphic" stdDeviation="0 0" />
      </filter>
    </defs>
  </svg>

  <div id="ambient-layer"></div>
  <div class="mist-layer"></div>
  <div class="ash-field" id="ash-field"></div>
  <div class="void-vignette"></div>
  <div class="film-grain"></div>

  <header>
    <div class="brand">ustzyix</div>
    <div class="memory-tag">stillness</div>
  </header>

  <main>
    <section class="solitary-stage">
      <div class="frame-wrap" id="touch-area">
        <div class="frame-aura"></div>
        <img id="img-slot-0" class="slide-img is-active" alt="ustzyix" />
        <img id="img-slot-1" class="slide-img" alt="ustzyix" />
      </div>

      <div class="meta-bar">
        <div class="caption" id="photo-caption">Crimson — 01</div>

        <button class="music-pill" id="music-pill" type="button" aria-label="Toggle audio">
          <span class="eq-bars" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="music-title" id="music-title">TV Girl · Loving Machine</span>
          <span class="music-state" id="music-state">play</span>
          <span class="music-progress" id="music-progress"></span>
        </button>

        <div class="swatches" id="swatch-bar"></div>

        <div class="nav-whisper" id="nav-whisper">
          <button id="prev-btn" type="button">← prev</button>
          <span id="counter">1 / 2</span>
          <button id="next-btn" type="button">next →</button>
        </div>
      </div>
    </section>
  </main>

  <audio id="bg-audio" loop preload="auto"></audio>

  <script>
    const REPO_CONFIG = {
      owner: "ustzyix",
      repo: "ustzyix.github.io",
      folder: "images",
      audioFolder: "audio"
    };

    const DEFAULT_AUDIO = "./audio/Loving%20Machine.mp3";
    const DEFAULT_SONG = "TV Girl · Loving Machine";

    // รายการรูปภาพปัจจุบันในโฟลเดอร์ images/ ของ GitHub
    const ENTRIES = [
      {
        file: "IMG_5755 (2).jpg",
        src: "./images/IMG_5755%20(2).jpg",
        caption: "Crimson — 01",
        song: DEFAULT_SONG,
        audio: DEFAULT_AUDIO
      },
      {
        file: "IMG_5738 (1).jpg",
        src: "./images/IMG_5738%20(1).jpg",
        caption: "Magenta — 02",
        song: DEFAULT_SONG,
        audio: DEFAULT_AUDIO
      }
    ];

    let entries = [...ENTRIES];
    let currentIndex = 0;
    let activeSlot = 0;
    let isAudioActive = false;
    let loadedAudioSrc = "";
    let blurAnimFrame = null;
    let renderToken = 0;

    const slots = [
      document.getElementById("img-slot-0"),
      document.getElementById("img-slot-1")
    ];
    const touchArea = document.getElementById("touch-area");
    const motionBlurNode = document.getElementById("motion-blur-node");
    const captionEl = document.getElementById("photo-caption");
    const swatchBar = document.getElementById("swatch-bar");
    const ambientLayer = document.getElementById("ambient-layer");
    const navWhisper = document.getElementById("nav-whisper");
    const counterEl = document.getElementById("counter");
    const ashField = document.getElementById("ash-field");

    const bgAudio = document.getElementById("bg-audio");
    const musicPill = document.getElementById("music-pill");
    const musicTitleEl = document.getElementById("music-title");
    const musicStateEl = document.getElementById("music-state");
    const musicProgressEl = document.getElementById("music-progress");

    function initAshMotes() {
      const count = 14;
      for (let i = 0; i < count; i++) {
        const mote = document.createElement("span");
        mote.className = "ash-mote";
        mote.style.left = `${Math.random() * 100}%`;
        mote.style.animationDuration = `${16 + Math.random() * 18}s`;
        mote.style.animationDelay = `${-Math.random() * 20}s`;
        mote.style.setProperty("--drift-x", `${(Math.random() - 0.5) * 60}px`);
        const size = Math.random() > 0.65 ? 2 : 1.5;
        mote.style.width = `${size}px`;
        mote.style.height = `${size}px`;
        ashField.appendChild(mote);
      }
    }

    // ควบคุมระดับ Directional Motion Blur แบบโค้งความเร็วชัตเตอร์ และถอดฟิลเตอร์ออกเมื่อหยุดนิ่งเพื่อความคมชัดสูงสุด
    function triggerMotionBlur(peakBlur = 17, duration = 640) {
      if (blurAnimFrame) cancelAnimationFrame(blurAnimFrame);
      touchArea.style.filter = "url(#directional-motion-blur)";
      touchArea.classList.add("is-shifting");
      const startTime = performance.now();

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);

        let intensity;
        if (progress < 0.22) {
          intensity = progress / 0.22;
        } else {
          const decay = (progress - 0.22) / 0.78;
          intensity = Math.pow(1 - decay, 2.4);
        }

        const blurX = (peakBlur * intensity).toFixed(2);
        const blurY = (peakBlur * 0.07 * intensity).toFixed(2);
        motionBlurNode.setAttribute("stdDeviation", `${blurX} ${blurY}`);

        if (progress < 1) {
          blurAnimFrame = requestAnimationFrame(step);
        } else {
          motionBlurNode.setAttribute("stdDeviation", "0 0");
          touchArea.style.filter = "none";
          touchArea.classList.remove("is-shifting");
          blurAnimFrame = null;
        }
      }

      blurAnimFrame = requestAnimationFrame(step);
    }

    function setInstantMotionBlur(blurX) {
      if (blurAnimFrame) {
        cancelAnimationFrame(blurAnimFrame);
        blurAnimFrame = null;
      }
      const clamped = Math.max(0, Math.min(14, blurX));
      if (clamped > 0.05) {
        touchArea.style.filter = "url(#directional-motion-blur)";
        motionBlurNode.setAttribute("stdDeviation", `${clamped.toFixed(2)} ${(clamped * 0.06).toFixed(2)}`);
      } else {
        motionBlurNode.setAttribute("stdDeviation", "0 0");
        touchArea.style.filter = "none";
      }
    }

    function formatNewCaption(filename) {
      return filename
        .replace(/\.[^/.]+$/, "")
        .replace(/\(\d+\)/g, "")
        .replace(/^IMG[-_]?/i, "")
        .replace(/[-_]/g, " ")
        .trim() || "Stillness";
    }

    // ตรวจจับรูปใหม่และไฟล์เสียงใหม่ใน GitHub อัตโนมัติเมื่อมีการอัปโหลดเพิ่มในอนาคต
    async function syncGitHubAssets() {
      try {
        const imgApi = `https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${REPO_CONFIG.folder}`;
        const audioApi = `https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${REPO_CONFIG.audioFolder}`;

        const [imgRes, audioRes] = await Promise.all([
          fetch(imgApi),
          fetch(audioApi).catch(() => null)
        ]);

        const audioMap = new Map();
        if (audioRes && audioRes.ok) {
          const audioFiles = await audioRes.json();
          const validAudio = /\.(mp3|m4a|ogg|wav|aac)$/i;
          audioFiles
            .filter(f => f.type === "file" && validAudio.test(f.name))
            .forEach(f => {
              const baseName = f.name.replace(/\.[^/.]+$/, "").toLowerCase();
              audioMap.set(baseName, `./${REPO_CONFIG.audioFolder}/${encodeURIComponent(f.name)}`);
            });
        }

        if (imgRes && imgRes.ok) {
          const files = await imgRes.json();
          const validExt = /\.(jpe?g|png|webp|gif|avif)$/i;
          const existingNames = new Set(entries.map(p => p.file));

          const extraPhotos = files
            .filter(f => f.type === "file" && validExt.test(f.name) && !existingNames.has(f.name))
            .map(f => {
              const baseName = f.name.replace(/\.[^/.]+$/, "").toLowerCase();
              const title = formatNewCaption(f.name);
              return {
                file: f.name,
                src: `./${REPO_CONFIG.folder}/${encodeURIComponent(f.name)}`,
                caption: title,
                song: audioMap.has(baseName) ? title : DEFAULT_SONG,
                audio: audioMap.get(baseName) || DEFAULT_AUDIO
              };
            });

          if (extraPhotos.length > 0) {
            entries = [...entries, ...extraPhotos];
            updateNavDisplay();
          }
        }
      } catch (_) {}
    }

    // จัดกลุ่มสีตามพื้นที่ส่วนใหญ่ของภาพจริง (ป้องกันสีสิ่งของชิ้นเล็กๆ ดึงพื้นหลังเพี้ยน)
    function extractDominantAtmosphere(imgElement) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      const size = 72;
      canvas.width = size;
      canvas.height = size;
      ctx.drawImage(imgElement, 0, 0, size, size);

      const data = ctx.getImageData(0, 0, size, size).data;
      const buckets = new Map();
      const step = 28;
      let rSum = 0, gSum = 0, bSum = 0, total = 0;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        rSum += r; gSum += g; bSum += b; total++;

        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const sat = max === 0 ? 0 : (max - min) / max;
        const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;

        // ข้ามเงามืดสนิทและแสงขาวจ้า เพื่อให้จับเฉดสีบรรยากาศของฉากได้แม่นยำ
        if (lum < 0.08 || lum > 0.90) continue;

        const key = `${Math.floor(r / step)},${Math.floor(g / step)},${Math.floor(b / step)}`;
        let bucket = buckets.get(key);
        if (!bucket) {
          bucket = { r: 0, g: 0, b: 0, count: 0, satSum: 0 };
          buckets.set(key, bucket);
        }
        bucket.r += r;
        bucket.g += g;
        bucket.b += b;
        bucket.count += 1;
        bucket.satSum += sat;
      }

      const clusters = Array.from(buckets.values()).map(b => {
        const avgR = b.r / b.count;
        const avgG = b.g / b.count;
        const avgB = b.b / b.count;
        const avgSat = b.satSum / b.count;
        const score = b.count * (0.45 + avgSat * 1.15);
        return { rgb: [avgR, avgG, avgB], count: b.count, sat: avgSat, score };
      });

      clusters.sort((a, b) => b.score - a.score);

      const avg = [rSum / total, gSum / total, bSum / total];
      const primary = clusters.length > 0 ? clusters[0].rgb : avg;

      let secondary = null;
      for (let i = 1; i < clusters.length; i++) {
        const c = clusters[i].rgb;
        const dist = Math.abs(c[0] - primary[0]) + Math.abs(c[1] - primary[1]) + Math.abs(c[2] - primary[2]);
        if (dist > 75) {
          secondary = c;
          break;
        }
      }

      if (!secondary) {
        secondary = primary.map(v => v * 0.45);
      }

      return { primary, secondary };
    }

    function rgbToHex([r, g, b]) {
      return "#" + [r, g, b]
        .map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, "0"))
        .join("");
    }

    function applyAtmosphere(imgElement) {
      try {
        const { primary, secondary } = extractDominantAtmosphere(imgElement);
        const primaryHex = rgbToHex(primary);
        const secondaryHex = rgbToHex(secondary);

        const glowPrimary = rgbToHex(primary.map(v => v * 0.65));
        const glowSecondary = rgbToHex(secondary.map(v => v * 0.52));
        const abyssBase = rgbToHex(primary.map(v => v * 0.14));

        document.documentElement.style.setProperty("--aura-primary", primaryHex);
        document.documentElement.style.setProperty("--aura-secondary", secondaryHex);

        ambientLayer.style.background = `
          radial-gradient(circle at 50% 34%, ${glowPrimary}cc 0%, transparent 56%),
          radial-gradient(circle at 50% 78%, ${glowSecondary}99 0%, ${abyssBase} 72%, #040406 100%)
        `;

        swatchBar.innerHTML = `
          <span class="swatch-dot" style="background:${primaryHex}" title="Copy ${primaryHex}" onclick="navigator.clipboard?.writeText('${primaryHex}')"></span>
          <span>${primaryHex.toUpperCase()}</span>
          <span>·</span>
          <span class="swatch-dot" style="background:${secondaryHex}" title="Copy ${secondaryHex}" onclick="navigator.clipboard?.writeText('${secondaryHex}')"></span>
          <span>${secondaryHex.toUpperCase()}</span>
        `;
      } catch (_) {}
    }

    function syncAudio(item) {
      musicTitleEl.textContent = item.song || DEFAULT_SONG;

      if (!item.audio) {
        bgAudio.pause();
        loadedAudioSrc = "";
        musicPill.classList.remove("playing");
        musicProgressEl.style.width = "0%";
        musicStateEl.textContent = "—";
        return;
      }

      if (loadedAudioSrc === item.audio) {
        if (isAudioActive && bgAudio.paused) bgAudio.play().catch(() => {});
        musicStateEl.textContent = !bgAudio.paused ? "pause" : "play";
        return;
      }

      loadedAudioSrc = item.audio;
      bgAudio.src = item.audio;
      musicProgressEl.style.width = "0%";

      if (isAudioActive) {
        bgAudio.play()
          .then(() => {
            musicPill.classList.add("playing");
            musicStateEl.textContent = "pause";
          })
          .catch(() => {
            musicPill.classList.remove("playing");
            musicStateEl.textContent = "play";
          });
      } else {
        musicPill.classList.remove("playing");
        musicStateEl.textContent = "play";
      }
    }

    function updateNavDisplay() {
      if (entries.length > 1) {
        navWhisper.classList.remove("hidden");
        counterEl.textContent = `${currentIndex + 1} / ${entries.length}`;
      } else {
        navWhisper.classList.add("hidden");
      }
    }

    // เปลี่ยนรูปภาพแบบ Dual-Layer Crossfade + Directional Motion Blur
    function renderEntry(index, direction = 0) {
      if (!entries.length) return;
      const token = ++renderToken;
      currentIndex = (index + entries.length) % entries.length;
      const item = entries[currentIndex];

      const loader = new Image();
      loader.src = item.src;

      const commitTransition = () => {
        if (token !== renderToken) return;

        const outgoingImg = slots[activeSlot];
        const nextSlot = 1 - activeSlot;
        const incomingImg = slots[nextSlot];

        if (direction === 0) {
          incomingImg.src = item.src;
          incomingImg.style.transition = "none";
          incomingImg.style.opacity = "0";
          incomingImg.style.transform = "translate3d(0, 12px, 0) scale(0.985)";
          incomingImg.className = "slide-img is-active";

          void incomingImg.offsetWidth;

          incomingImg.style.transition = "transform 0.9s var(--ease-drift), opacity 0.85s var(--ease-liquid)";
          incomingImg.style.opacity = "1";
          incomingImg.style.transform = "translate3d(0, 0, 0) scale(1)";

          activeSlot = nextSlot;
          captionEl.textContent = item.caption;
          applyAtmosphere(incomingImg);
          syncAudio(item);
          updateNavDisplay();
          return;
        }

        const shiftDist = 52;
        const exitOffset = direction > 0 ? -shiftDist : shiftDist;
        const enterOffset = direction > 0 ? shiftDist : -shiftDist;

        incomingImg.src = item.src;
        incomingImg.style.transition = "none";
        incomingImg.style.opacity = "0";
        incomingImg.style.transform = `translate3d(${enterOffset}px, 0, 0) scale(1.035)`;
        incomingImg.className = "slide-img is-active";

        void incomingImg.offsetWidth;

        triggerMotionBlur(17, 640);

        outgoingImg.className = "slide-img is-exiting";
        outgoingImg.style.transition = "transform 0.62s var(--ease-drift), opacity 0.5s var(--ease-liquid)";
        outgoingImg.style.opacity = "0";
        outgoingImg.style.transform = `translate3d(${exitOffset}px, 0, 0) scale(0.96)`;

        incomingImg.style.transition = "transform 0.7s var(--ease-drift), opacity 0.6s var(--ease-liquid)";
        incomingImg.style.opacity = "1";
        incomingImg.style.transform = "translate3d(0, 0, 0) scale(1)";

        captionEl.classList.add("is-shifting");
        swatchBar.classList.add("is-shifting");

        setTimeout(() => {
          if (token !== renderToken) return;
          captionEl.textContent = item.caption;
          captionEl.classList.remove("is-shifting");
          swatchBar.classList.remove("is-shifting");
        }, 200);

        activeSlot = nextSlot;
        applyAtmosphere(incomingImg);
        syncAudio(item);
        updateNavDisplay();
      };

      loader.onload = commitTransition;
      loader.onerror = commitTransition;
    }

    musicPill.addEventListener("click", () => {
      const item = entries[currentIndex];
      if (!item || !item.audio) return;

      if (bgAudio.paused) {
        isAudioActive = true;
        if (!loadedAudioSrc) {
          loadedAudioSrc = item.audio;
          bgAudio.src = item.audio;
        }
        bgAudio.play()
          .then(() => {
            musicPill.classList.add("playing");
            musicStateEl.textContent = "pause";
          })
          .catch(() => {
            isAudioActive = false;
            musicPill.classList.remove("playing");
            musicStateEl.textContent = "retry";
          });
      } else {
        isAudioActive = false;
        bgAudio.pause();
        musicPill.classList.remove("playing");
        musicStateEl.textContent = "play";
      }
    });

    bgAudio.addEventListener("play", () => {
      musicPill.classList.add("playing");
      musicStateEl.textContent = "pause";
    });

    bgAudio.addEventListener("pause", () => {
      musicPill.classList.remove("playing");
      musicStateEl.textContent = "play";
    });

    bgAudio.addEventListener("timeupdate", () => {
      if (bgAudio.duration) {
        musicProgressEl.style.width = `${(bgAudio.currentTime / bgAudio.duration) * 100}%`;
      }
    });

    document.getElementById("prev-btn").onclick = () => renderEntry(currentIndex - 1, -1);
    document.getElementById("next-btn").onclick = () => renderEntry(currentIndex + 1, 1);

    window.addEventListener("keydown", (e) => {
      if (entries.length > 1 && e.key === "ArrowLeft") renderEntry(currentIndex - 1, -1);
      if (entries.length > 1 && e.key === "ArrowRight") renderEntry(currentIndex + 1, 1);
      if (e.key === " ") {
        e.preventDefault();
        musicPill.click();
      }
    });

    let touchStartX = 0;
    let isDragging = false;

    touchArea.addEventListener("touchstart", (e) => {
      if (entries.length <= 1) return;
      touchStartX = e.changedTouches[0].screenX;
      isDragging = true;
      const currentImg = slots[activeSlot];
      currentImg.style.transition = "none";
    }, { passive: true });

    touchArea.addEventListener("touchmove", (e) => {
      if (!isDragging || entries.length <= 1) return;
      const deltaX = e.changedTouches[0].screenX - touchStartX;
      const currentImg = slots[activeSlot];
      const dampenedX = deltaX * 0.34;
      const scale = 1 - Math.min(Math.abs(deltaX) / 1400, 0.035);

      currentImg.style.transform = `translate3d(${dampenedX}px, 0, 0) scale(${scale})`;
      setInstantMotionBlur(Math.abs(deltaX) * 0.075);
    }, { passive: true });

    touchArea.addEventListener("touchend", (e) => {
      if (!isDragging || entries.length <= 1) return;
      isDragging = false;
      const diff = e.changedTouches[0].screenX - touchStartX;

      if (Math.abs(diff) > 38) {
        renderEntry(diff > 0 ? currentIndex - 1 : currentIndex + 1, diff > 0 ? -1 : 1);
      } else {
        const currentImg = slots[activeSlot];
        currentImg.style.transition = "transform 0.45s var(--ease-liquid)";
        currentImg.style.transform = "translate3d(0, 0, 0) scale(1)";
        triggerMotionBlur(5, 280);
      }
    }, { passive: true });

    initAshMotes();
    renderEntry(0, 0);
    syncGitHubAssets();
  </script>
</body>
</html>
