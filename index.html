<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ustzyix</title>
  <style>
    :root {
      --fg-color: #e4e4e8;
      --fg-muted: rgba(228, 228, 232, 0.44);
      --fg-whisper: rgba(228, 228, 232, 0.22);
      --border-whisper: rgba(228, 228, 232, 0.12);
      --aura-primary: #7a1c18;
      --aura-secondary: #2b1311;
      --photo-grade: brightness(0.90) contrast(1.10) saturate(0.92);
      --px: 0px;
      --py: 0px;
      --bass-boost: 0;
      --ease-liquid: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-drift: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ล็อกหน้าจอตายตัว ป้องกันหน้าเว็บเลื่อน/เด้ง/ซูมในมือถือและ WebView */
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      color: var(--fg-color);
      background-color: #010102;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ชั้นที่ 1: บรรยากาศสีหลักที่ดูดมาจากภาพปัจจุบัน */
    #ambient-layer {
      position: fixed;
      inset: 0;
      z-index: -7;
      background:
        radial-gradient(circle at 50% 38%, rgba(122, 28, 24, 0.38) 0%, transparent 58%),
        radial-gradient(circle at 50% 82%, rgba(43, 19, 17, 0.30) 0%, #010102 76%);
      transition: background 1.2s ease;
      pointer-events: none;
    }

    /* ชั้นที่ 2: หมอกลึก 2 ระดับความเร็วเคลื่อนตัวสวนทางกัน */
    .mist-far {
      position: fixed;
      inset: -24%;
      z-index: -6;
      pointer-events: none;
      opacity: 0.48;
      background:
        radial-gradient(ellipse 62% 46% at 24% 35%, var(--aura-primary) 0%, transparent 72%),
        radial-gradient(ellipse 58% 50% at 76% 68%, var(--aura-secondary) 0%, transparent 74%);
      animation: mistSwayA 28s ease-in-out infinite alternate;
    }

    .mist-near {
      position: fixed;
      inset: -18%;
      z-index: -5;
      pointer-events: none;
      opacity: 0.28;
      background:
        radial-gradient(ellipse 50% 38% at 72% 32%, var(--aura-primary) 0%, transparent 70%),
        radial-gradient(ellipse 66% 42% at 30% 76%, rgba(205, 210, 225, 0.09) 0%, transparent 75%);
      animation: mistSwayB 20s ease-in-out infinite alternate;
    }

    @keyframes mistSwayA {
      0% { transform: translate3d(-2.8%, -1.4%, 0) scale(1); }
      100% { transform: translate3d(2.8%, 1.8%, 0) scale(1.07); }
    }

    @keyframes mistSwayB {
      0% { transform: translate3d(2.4%, 1.4%, 0) scale(1.05); }
      100% { transform: translate3d(-2.8%, -1.6%, 0) scale(0.98); }
    }

    /* ชั้นที่ 3: ลำแสงเฉียง (ใช้ Radial-Gradient แทน Conic เพื่อป้องกันบัคบล็อกดำใน Android WebView) */
    .god-rays {
      position: fixed;
      inset: -20%;
      z-index: -4;
      pointer-events: none;
      opacity: 0.28;
      background:
        radial-gradient(ellipse 18% 72% at 36% 24%, var(--aura-primary) 0%, transparent 75%),
        radial-gradient(ellipse 14% 68% at 54% 28%, rgba(255, 248, 236, 0.16) 0%, transparent 75%);
      transform: rotate(-22deg);
      animation: raySweep 17s ease-in-out infinite alternate;
    }

    @keyframes raySweep {
      0% { transform: translate3d(-3%, -1%, 0) rotate(-24deg); opacity: 0.18; }
      50% { opacity: 0.32; }
      100% { transform: translate3d(3%, 1.5%, 0) rotate(-19deg); opacity: 0.22; }
    }

    /* ชั้นที่ 4: ความมืดรอบนอกโอบล้อมความโดดเดี่ยว */
    .void-vignette {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background: radial-gradient(
        circle at 50% 42%,
        transparent 14%,
        rgba(1, 1, 2, 0.74) 64%,
        rgba(0, 0, 0, 0.99) 100%
      );
    }

    /* ชั้นที่ 5: Canvas 60fps ละอองฝุ่น/เถ้า/หิ่งห้อยแสง 3 ระดับความลึก */
    #atmosphere-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }

    /* ชั้นที่ 6: เกรนฟิล์มอนาล็อกขนาดพอดีจอ (ไม่ขยาย 200% ป้องกัน GPU Texture Clipping) */
    .film-grain {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0.042;
      background-repeat: repeat;
      animation: grainShift 0.36s steps(2) infinite;
    }

    @keyframes grainShift {
      0% { background-position: 0 0; }
      33% { background-position: 24px -18px; }
      66% { background-position: -19px 27px; }
      100% { background-position: 14px 12px; }
    }

    header {
      flex-shrink: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: max(20px, env(safe-area-inset-top)) 26px 8px;
      font-size: 11px;
      z-index: 6;
    }

    .brand {
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: lowercase;
      color: var(--fg-muted);
    }

    .presence-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9.5px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--fg-whisper);
    }

    .pulse-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--fg-muted);
      animation: solitaryPulse 4.2s ease-in-out infinite;
    }

    @keyframes solitaryPulse {
      0%, 100% { opacity: 0.18; transform: scale(0.85); }
      50% { opacity: 0.85; transform: scale(1.3); }
    }

    main {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 10px max(26px, env(safe-area-inset-bottom));
      overflow: hidden;
    }

    .solitary-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 100%;
      animation: enterWorld 1.4s var(--ease-liquid) forwards;
    }

    @keyframes enterWorld {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* พื้นที่หน้าต่างโลก: รองรับทุกรูปทุกสัดส่วนโดยไม่ขยับ layout */
    .viewport-portal {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      height: min(56dvh, 490px);
      touch-action: none;
    }

    /* แสงออร่าหลังภาพ */
    .portal-aura {
      position: absolute;
      inset: -48px;
      z-index: -1;
      background: radial-gradient(circle, var(--aura-primary) 0%, transparent 64%);
      opacity: calc(0.36 + var(--bass-boost) * 0.24);
      transform: scale(calc(1 + var(--bass-boost) * 0.08));
      animation: auraPulse 7.5s ease-in-out infinite alternate;
      transition: opacity 0.45s ease;
      pointer-events: none;
    }

    @keyframes auraPulse {
      0% { opacity: 0.28; }
      100% { opacity: 0.46; }
    }

    .viewport-portal.is-shifting .portal-aura {
      animation: none;
      opacity: 0.60;
    }

    /* เลเยอร์สลับภาพ (Dual Slot) */
    .world-slot {
      grid-area: 1 / 1;
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      opacity: 0;
      transform: translate3d(0, 0, 0) scale(1);
      pointer-events: none;
      backface-visibility: hidden;
    }

    .world-slot.is-active {
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
    }

    .world-slot.is-exiting {
      z-index: 1;
    }

    /* เงาสะท้อนหางตา (Peripheral Echo) ขยายออกรอบๆ ภาพหลัก และละลายขอบครบทั้ง 4 ด้าน */
    .peripheral-echo {
      grid-area: 1 / 1;
      max-width: min(98vw, 800px);
      max-height: min(62dvh, 540px);
      width: auto;
      height: auto;
      object-fit: contain;
      opacity: 0.28;
      filter: brightness(0.62) contrast(1.18);
      -webkit-mask-image: radial-gradient(
        ellipse 50% 50% at 50% 50%,
        #000 18%,
        rgba(0, 0, 0, 0.35) 56%,
        transparent 96%
      );
      mask-image: radial-gradient(
        ellipse 50% 50% at 50% 50%,
        #000 18%,
        rgba(0, 0, 0, 0.35) 56%,
        transparent 96%
      );
      transform: translate3d(calc(var(--px) * -0.7), calc(var(--py) * -0.7), 0) scale(1.16);
      pointer-events: none;
    }

    .world-slot.is-active .peripheral-echo {
      animation: echoDrift 20s ease-in-out infinite alternate;
    }

    @keyframes echoDrift {
      0% { transform: translate3d(calc(var(--px) * -0.7 - 1.5%), calc(var(--py) * -0.7 - 1%), 0) scale(1.14); }
      100% { transform: translate3d(calc(var(--px) * -0.7 + 1.5%), calc(var(--py) * -0.7 + 1%), 0) scale(1.20); }
    }

    /* กรอบละลายขอบ 50% 50% พอดีทุกด้าน (แก้บัคขอบบน-ล่างตัดเป็นเส้นตรง) */
    .feathered-window {
      grid-area: 1 / 1;
      position: relative;
      display: inline-grid;
      place-items: center;
      overflow: hidden;
      -webkit-mask-image: radial-gradient(
        ellipse 50% 50% at 50% 50%,
        #000 46%,
        rgba(0, 0, 0, 0.78) 68%,
        rgba(0, 0, 0, 0.28) 86%,
        transparent 99%
      );
      mask-image: radial-gradient(
        ellipse 50% 50% at 50% 50%,
        #000 46%,
        rgba(0, 0, 0, 0.78) 68%,
        rgba(0, 0, 0, 0.28) 86%,
        transparent 99%
      );
      transform: translate3d(var(--px), var(--py), 0);
      transition: transform 0.22s ease-out;
    }

    /* ตัวรูปภาพหลักที่หายใจและเคลื่อนไหวเหมือนสายตาคนยืนมองอยู่คนเดียว */
    .living-photo {
      grid-area: 1 / 1;
      display: block;
      max-width: min(93vw, 730px);
      max-height: min(55dvh, 480px);
      width: auto;
      height: auto;
      object-fit: contain;
      filter: var(--photo-grade);
      transform: scale(1.04) translate3d(0, 0, 0);
      backface-visibility: hidden;
    }

    .world-slot.is-active .living-photo {
      animation: povStandstillBreath 15s ease-in-out infinite alternate;
    }

    @keyframes povStandstillBreath {
      0% {
        transform: scale(1.035) translate3d(-1.2%, -0.6%, 0) rotate(-0.4deg);
      }
      50% {
        transform: scale(1.09) translate3d(0.5%, -1.1%, 0) rotate(0.22deg);
      }
      100% {
        transform: scale(1.13) translate3d(1.2%, 0.8%, 0) rotate(0.4deg);
      }
    }

    /* ชั้นแสงตะเกียง/แสงจันทร์ไหววูบภายในฉาก (ใช้โปร่งใสปกติแทน mix-blend-mode เพื่อกันบัคบล็อกดำ) */
    .scene-flicker {
      grid-area: 1 / 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background:
        radial-gradient(circle at 28% 24%, var(--aura-primary) 0%, transparent 58%),
        radial-gradient(circle at 72% 64%, rgba(255, 246, 230, 0.14) 0%, transparent 55%);
      opacity: 0.16;
      animation: candleLightFlicker 5.2s ease-in-out infinite alternate;
    }

    @keyframes candleLightFlicker {
      0%   { opacity: 0.08; }
      18%  { opacity: 0.22; }
      35%  { opacity: 0.11; }
      57%  { opacity: 0.25; }
      76%  { opacity: 0.12; }
      100% { opacity: 0.19; }
    }

    /* เงาเมฆ/กิ่งไม้เคลื่อนผ่านฉากช้าๆ */
    .cloud-shadow {
      grid-area: 1 / 1;
      width: 170%;
      height: 170%;
      pointer-events: none;
      background:
        radial-gradient(ellipse 42% 36% at 35% 45%, rgba(0, 0, 0, 0.44) 0%, transparent 70%),
        radial-gradient(ellipse 38% 44% at 70% 60%, rgba(0, 0, 0, 0.34) 0%, transparent 68%);
      animation: shadowPass 13s ease-in-out infinite alternate;
    }

    @keyframes shadowPass {
      0% { transform: translate3d(-26%, -12%, 0) rotate(-3deg); opacity: 0.32; }
      50% { opacity: 0.68; }
      100% { transform: translate3d(26%, 14%, 0) rotate(3deg); opacity: 0.30; }
    }

    /* ส่วนควบคุมมินิมอล */
    .whisper-hud {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
      text-align: center;
      z-index: 6;
    }

    .caption {
      height: 22px;
      line-height: 22px;
      max-width: 88vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.26em;
      color: var(--fg-color);
      opacity: 0.88;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.95);
      transition: opacity 0.22s var(--ease-liquid);
    }

    .caption.is-shifting {
      opacity: 0;
    }

    .music-pill {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      max-width: min(86vw, 310px);
      height: 30px;
      padding: 0 15px;
      border-radius: 999px;
      background: rgba(6, 6, 8, 0.55);
      border: 1px solid var(--border-whisper);
      color: var(--fg-muted);
      font-size: 10.5px;
      letter-spacing: 0.1em;
      cursor: pointer;
      touch-action: manipulation;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    @media (hover: hover) {
      .music-pill:hover {
        color: var(--fg-color);
        border-color: rgba(255, 255, 255, 0.22);
      }
    }

    .music-pill.playing,
    .music-pill:active {
      color: var(--fg-color);
      border-color: rgba(255, 255, 255, 0.24);
    }

    .eq-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 9px;
      width: 9px;
      flex-shrink: 0;
    }

    .eq-bars i {
      display: block;
      width: 1.5px;
      height: 8px;
      background-color: currentColor;
      transform-origin: bottom;
      transform: scaleY(0.35);
    }

    .eq-bars i:nth-child(2) { transform: scaleY(0.85); }
    .eq-bars i:nth-child(3) { transform: scaleY(0.55); }

    .music-pill.playing .eq-bars i {
      animation: eqBounce 0.9s ease-in-out infinite alternate;
    }
    .music-pill.playing .eq-bars i:nth-child(2) { animation-delay: 0.25s; }
    .music-pill.playing .eq-bars i:nth-child(3) { animation-delay: 0.5s; }

    @keyframes eqBounce {
      0% { transform: scaleY(0.25); }
      100% { transform: scaleY(1); }
    }

    .music-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-state {
      min-width: 40px;
      text-align: right;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.6;
      flex-shrink: 0;
    }

    .music-progress {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 1px;
      width: 100%;
      background: currentColor;
      opacity: 0.48;
      transform: scaleX(0);
      transform-origin: left;
    }

    /* ปุ่มเปลี่ยนภาพตำแหน่งนิ่งสนิท ไม่ค้างกรอบหลังกดบนมือถือ */
    .nav-whisper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 2px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: var(--fg-whisper);
    }

    .nav-whisper.hidden {
      display: none;
    }

    #counter {
      min-width: 54px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      transition: opacity 0.22s ease;
    }

    #counter.is-shifting {
      opacity: 0.35;
    }

    .nav-whisper button {
      min-width: 78px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 999px;
      color: var(--fg-muted);
      font: inherit;
      letter-spacing: inherit;
      cursor: pointer;
      padding: 0 12px;
      opacity: 0.78;
      outline: none;
      touch-action: manipulation;
      transition: opacity 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }

    @media (hover: hover) {
      .nav-whisper button:hover {
        opacity: 1;
        color: var(--fg-color);
        border-color: var(--border-whisper);
      }
    }

    .nav-whisper button:active {
      opacity: 1;
      color: var(--fg-color);
      border-color: var(--border-whisper);
    }

    @media (max-width: 600px) {
      header { padding: max(16px, env(safe-area-inset-top)) 20px 6px; }
      .viewport-portal { height: 50dvh; }
      .living-photo { max-width: 94vw; max-height: 49dvh; }
      .peripheral-echo { max-width: 98vw; max-height: 55dvh; }
      .solitary-stage { gap: 16px; }
    }
  </style>
</head>
<body>
  <div id="ambient-layer"></div>
  <div class="mist-far"></div>
  <div class="mist-near"></div>
  <div class="god-rays"></div>
  <div class="void-vignette"></div>
  <canvas id="atmosphere-canvas"></canvas>
  <div class="film-grain" id="film-grain"></div>

  <header>
    <div class="brand">ustzyix</div>
    <div class="presence-status">
      <span class="pulse-dot"></span>
      <span>stillness</span>
    </div>
  </header>

  <main>
    <section class="solitary-stage">
      <div class="viewport-portal" id="touch-area">
        <div class="portal-aura"></div>

        <div id="slot-0" class="world-slot is-active">
          <img id="echo-0" class="peripheral-echo" decoding="async" alt="" aria-hidden="true" />
          <div class="feathered-window">
            <img id="img-0" class="living-photo" decoding="async" alt="ustzyix" />
            <div class="scene-flicker"></div>
            <div class="cloud-shadow"></div>
          </div>
        </div>

        <div id="slot-1" class="world-slot">
          <img id="echo-1" class="peripheral-echo" decoding="async" alt="" aria-hidden="true" />
          <div class="feathered-window">
            <img id="img-1" class="living-photo" decoding="async" alt="ustzyix" />
            <div class="scene-flicker"></div>
            <div class="cloud-shadow"></div>
          </div>
        </div>
      </div>

      <div class="whisper-hud">
        <div class="caption" id="photo-caption">Crimson — 01</div>

        <button class="music-pill" id="music-pill" type="button" aria-label="Toggle audio">
          <span class="eq-bars" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="music-title" id="music-title">TV Girl · Loving Machine</span>
          <span class="music-state" id="music-state">play</span>
          <span class="music-progress" id="music-progress"></span>
        </button>

        <div class="nav-whisper" id="nav-whisper">
          <button id="prev-btn" type="button">← prev</button>
          <span id="counter">1 / 2</span>
          <button id="next-btn" type="button">next →</button>
        </div>
      </div>
    </section>
  </main>

  <audio id="bg-audio" loop preload="metadata"></audio>

  <script>
    const REPO_CONFIG = {
      owner: "ustzyix",
      repo: "ustzyix.github.io",
      folder: "images",
      audioFolder: "audio"
    };

    const DEFAULT_AUDIO = "./audio/Loving%20Machine.mp3";
    const DEFAULT_SONG = "TV Girl · Loving Machine";

    const ENTRIES = [
      {
        file: "IMG_5755 (2).jpg",
        src: "./images/IMG_5755%20(2).jpg",
        caption: "Crimson — 01",
        song: DEFAULT_SONG,
        audio: DEFAULT_AUDIO
      },
      {
        file: "IMG_5738 (1).jpg",
        src: "./images/IMG_5738%20(1).jpg",
        caption: "Magenta — 02",
        song: DEFAULT_SONG,
        audio: DEFAULT_AUDIO
      }
    ];

    let entries = [...ENTRIES];
    let currentIndex = 0;
    let activeSlot = 0;
    let isAudioActive = false;
    let loadedAudioSrc = "";
    let hudTimer = null;
    let auraTimer = null;
    let renderToken = 0;
    let particleTint = { r: 225, g: 215, b: 215 };

    let audioCtx = null;
    let analyser = null;
    let freqData = null;

    const imageCache = new Map();
    const paletteCache = new Map();

    const sampleCanvas = document.createElement("canvas");
    sampleCanvas.width = 36;
    sampleCanvas.height = 36;
    const sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });

    const worldSlots = [
      document.getElementById("slot-0"),
      document.getElementById("slot-1")
    ];
    const mainImgs = [
      document.getElementById("img-0"),
      document.getElementById("img-1")
    ];
    const echoImgs = [
      document.getElementById("echo-0"),
      document.getElementById("echo-1")
    ];

    const touchArea = document.getElementById("touch-area");
    const captionEl = document.getElementById("photo-caption");
    const ambientLayer = document.getElementById("ambient-layer");
    const navWhisper = document.getElementById("nav-whisper");
    const counterEl = document.getElementById("counter");
    const filmGrainEl = document.getElementById("film-grain");

    const bgAudio = document.getElementById("bg-audio");
    const musicPill = document.getElementById("music-pill");
    const musicTitleEl = document.getElementById("music-title");
    const musicStateEl = document.getElementById("music-state");
    const musicProgressEl = document.getElementById("music-progress");

    document.addEventListener("gesturestart", (e) => e.preventDefault());
    document.addEventListener("dblclick", (e) => e.preventDefault());

    function initFilmGrain() {
      const c = document.createElement("canvas");
      c.width = 96;
      c.height = 96;
      const ctx = c.getContext("2d");
      const imgData = ctx.createImageData(96, 96);
      const buf = imgData.data;
      for (let i = 0; i < buf.length; i += 4) {
        const v = (Math.random() * 255) | 0;
        buf[i] = v;
        buf[i + 1] = v;
        buf[i + 2] = v;
        buf[i + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
      filmGrainEl.style.backgroundImage = `url(${c.toDataURL("image/png")})`;
    }

    function initAtmosphereCanvas() {
      const canvas = document.getElementById("atmosphere-canvas");
      const ctx = canvas.getContext("2d");
      let width = 0;
      let height = 0;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener("resize", resize, { passive: true });

      const count = width < 600 ? 44 : 64;
      const motes = Array.from({ length: count }, () => {
        const depth = Math.random();
        return {
          x: Math.random() * width,
          y: Math.random() * height,
          r: 0.65 + depth * 2.0,
          vx: (Math.random() - 0.5) * (0.16 + depth * 0.28),
          vy: -(0.14 + depth * 0.36),
          phase: Math.random() * Math.PI * 2,
          freq: 0.009 + Math.random() * 0.016,
          alpha: 0.09 + depth * 0.25,
          depth
        };
      });

      function tick() {
        ctx.clearRect(0, 0, width, height);
        const { r, g, b } = particleTint;

        let bass = 0;
        if (analyser && !bgAudio.paused) {
          analyser.getByteFrequencyData(freqData);
          let sum = 0;
          for (let k = 0; k < 6; k++) sum += freqData[k];
          bass = sum / (6 * 255);
          document.documentElement.style.setProperty("--bass-boost", bass.toFixed(3));
        }

        const cx = width * 0.5;
        const cy = height * 0.44;
        const maxDist = Math.hypot(cx, cy) || 1;

        for (let i = 0; i < motes.length; i++) {
          const m = motes[i];
          m.phase += m.freq;
          m.x += m.vx + Math.sin(m.phase) * 0.22;
          m.y += m.vy - bass * 0.25 * m.depth;

          if (m.y < -14) {
            m.y = height + 14;
            m.x = Math.random() * width;
          }
          if (m.x < -14) m.x = width + 14;
          if (m.x > width + 14) m.x = -14;

          const distRatio = 1 - Math.min(Math.hypot(m.x - cx, m.y - cy) / (maxDist * 0.72), 1);
          const lightCatch = 0.6 + distRatio * 0.85;
          const twinkle = 0.65 + 0.35 * Math.sin(m.phase * 1.8);
          const finalAlpha = Math.min(m.alpha * lightCatch * twinkle + bass * 0.08, 0.62);

          ctx.beginPath();
          ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${finalAlpha.toFixed(3)})`;
          ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function initLookAround() {
      let targetX = 0;
      let targetY = 0;
      let curX = 0;
      let curY = 0;

      window.addEventListener("pointermove", (e) => {
        const nx = (e.clientX / window.innerWidth) * 2 - 1;
        const ny = (e.clientY / window.innerHeight) * 2 - 1;
        targetX = nx * 12;
        targetY = ny * 9;
      }, { passive: true });

      window.addEventListener("deviceorientation", (e) => {
        if (e.gamma === null || e.beta === null) return;
        const gx = Math.max(-25, Math.min(25, e.gamma)) / 25;
        const gy = Math.max(-25, Math.min(25, e.beta - 45)) / 25;
        targetX = gx * 11;
        targetY = gy * 8;
      }, { passive: true });

      function updateParallax() {
        curX += (targetX - curX) * 0.065;
        curY += (targetY - curY) * 0.065;
        document.documentElement.style.setProperty("--px", `${curX.toFixed(2)}px`);
        document.documentElement.style.setProperty("--py", `${curY.toFixed(2)}px`);
        requestAnimationFrame(updateParallax);
      }
      requestAnimationFrame(updateParallax);
    }

    function initAudioAnalyser() {
      if (audioCtx) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioCtx = new AudioContextClass();
        const source = audioCtx.createMediaElementSource(bgAudio);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        freqData = new Uint8Array(analyser.frequencyBinCount);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
      } catch (_) {
        analyser = null;
      }
    }

    function preloadImage(src) {
      if (imageCache.has(src)) return Promise.resolve(imageCache.get(src));
      const promise = new Promise((resolve) => {
        const img = new Image();
        img.decoding = "async";
        img.onload = () => {
          imageCache.set(src, img);
          resolve(img);
        };
        img.onerror = () => resolve(null);
        img.src = src;
      });
      imageCache.set(src, promise);
      return promise;
    }

    function formatNewCaption(filename) {
      return filename
        .replace(/\.[^/.]+$/, "")
        .replace(/\(\d+\)/g, "")
        .replace(/^IMG[-_]?/i, "")
        .replace(/[-_]/g, " ")
        .trim() || "Stillness";
    }

    async function syncGitHubAssets() {
      try {
        const imgApi = `https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${REPO_CONFIG.folder}`;
        const audioApi = `https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${REPO_CONFIG.audioFolder}`;

        const [imgRes, audioRes] = await Promise.all([
          fetch(imgApi),
          fetch(audioApi).catch(() => null)
        ]);

        const audioMap = new Map();
        if (audioRes && audioRes.ok) {
          const audioFiles = await audioRes.json();
          const validAudio = /\.(mp3|m4a|ogg|wav|aac)$/i;
          audioFiles
            .filter(f => f.type === "file" && validAudio.test(f.name))
            .forEach(f => {
              const baseName = f.name.replace(/\.[^/.]+$/, "").toLowerCase();
              audioMap.set(baseName, `./${REPO_CONFIG.audioFolder}/${encodeURIComponent(f.name)}`);
            });
        }

        if (imgRes && imgRes.ok) {
          const files = await imgRes.json();
          const validExt = /\.(jpe?g|png|webp|gif|avif)$/i;
          const existingNames = new Set(entries.map(p => p.file));

          const extraPhotos = files
            .filter(f => f.type === "file" && validExt.test(f.name) && !existingNames.has(f.name))
            .map(f => {
              const baseName = f.name.replace(/\.[^/.]+$/, "").toLowerCase();
              const title = formatNewCaption(f.name);
              return {
                file: f.name,
                src: `./${REPO_CONFIG.folder}/${encodeURIComponent(f.name)}`,
                caption: title,
                song: audioMap.has(baseName) ? title : DEFAULT_SONG,
                audio: audioMap.get(baseName) || DEFAULT_AUDIO
              };
            });

          if (extraPhotos.length > 0) {
            entries = [...entries, ...extraPhotos];
            extraPhotos.forEach(p => preloadImage(p.src));
            updateNavDisplay(false);
          }
        }
      } catch (_) {}
    }

    function getDominantPalette(src, imgElement) {
      if (paletteCache.has(src)) return paletteCache.get(src);

      try {
        const size = 36;
        sampleCtx.clearRect(0, 0, size, size);
        sampleCtx.drawImage(imgElement, 0, 0, size, size);

        const data = sampleCtx.getImageData(0, 0, size, size).data;
        const buckets = new Map();
        const step = 28;
        let rSum = 0, gSum = 0, bSum = 0, lumSum = 0, total = 0;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i + 1], b = data[i + 2];
          rSum += r; gSum += g; bSum += b; total++;

          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const sat = max === 0 ? 0 : (max - min) / max;
          const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
          lumSum += lum;

          if (lum < 0.08 || lum > 0.90) continue;

          const key = `${(r / step) | 0},${(g / step) | 0},${(b / step) | 0}`;
          let bucket = buckets.get(key);
          if (!bucket) {
            bucket = { r: 0, g: 0, b: 0, count: 0, satSum: 0 };
            buckets.set(key, bucket);
          }
          bucket.r += r;
          bucket.g += g;
          bucket.b += b;
          bucket.count += 1;
          bucket.satSum += sat;
        }

        const clusters = Array.from(buckets.values()).map(b => {
          const avgSat = b.satSum / b.count;
          return {
            rgb: [b.r / b.count, b.g / b.count, b.b / b.count],
            score: b.count * (0.45 + avgSat * 1.15)
          };
        });

        clusters.sort((a, b) => b.score - a.score);

        const avg = [rSum / total, gSum / total, bSum / total];
        const avgLum = lumSum / total;
        const primary = clusters.length > 0 ? clusters[0].rgb : avg;

        let secondary = null;
        for (let i = 1; i < clusters.length; i++) {
          const c = clusters[i].rgb;
          const dist = Math.abs(c[0] - primary[0]) + Math.abs(c[1] - primary[1]) + Math.abs(c[2] - primary[2]);
          if (dist > 75) {
            secondary = c;
            break;
          }
        }
        if (!secondary) secondary = primary.map(v => v * 0.45);

        const photoGrade = avgLum > 0.52
          ? "brightness(0.78) contrast(1.16) saturate(0.86)"
          : avgLum < 0.24
            ? "brightness(1.05) contrast(1.06) saturate(0.96)"
            : "brightness(0.88) contrast(1.12) saturate(0.90)";

        const result = {
          primaryHex: rgbToHex(primary),
          secondaryHex: rgbToHex(secondary),
          glowPrimary: rgbToHex(primary.map(v => v * 0.54)),
          glowSecondary: rgbToHex(secondary.map(v => v * 0.44)),
          abyssBase: rgbToHex(primary.map(v => v * 0.10)),
          photoGrade,
          tint: {
            r: Math.round(180 + primary[0] * 0.28),
            g: Math.round(180 + primary[1] * 0.28),
            b: Math.round(185 + primary[2] * 0.28)
          }
        };

        paletteCache.set(src, result);
        return result;
      } catch (_) {
        return null;
      }
    }

    function rgbToHex([r, g, b]) {
      return "#" + [r, g, b]
        .map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, "0"))
        .join("");
    }

    function applyAtmosphere(src, imgElement) {
      const palette = getDominantPalette(src, imgElement);
      if (!palette) return;

      const { primaryHex, secondaryHex, glowPrimary, glowSecondary, abyssBase, photoGrade, tint } = palette;
      particleTint = tint;

      document.documentElement.style.setProperty("--aura-primary", primaryHex);
      document.documentElement.style.setProperty("--aura-secondary", secondaryHex);
      document.documentElement.style.setProperty("--photo-grade", photoGrade);

      ambientLayer.style.background = `
        radial-gradient(circle at 50% 38%, ${glowPrimary}c8 0%, transparent 58%),
        radial-gradient(circle at 50% 82%, ${glowSecondary}94 0%, ${abyssBase} 74%, #010102 100%)
      `;
    }

    function syncAudio(item) {
      const targetTitle = item.song || DEFAULT_SONG;
      if (musicTitleEl.textContent !== targetTitle) {
        musicTitleEl.textContent = targetTitle;
      }

      if (!item.audio) {
        bgAudio.pause();
        loadedAudioSrc = "";
        musicPill.classList.remove("playing");
        musicProgressEl.style.transform = "scaleX(0)";
        musicStateEl.textContent = "—";
        return;
      }

      if (loadedAudioSrc === item.audio) {
        if (isAudioActive && bgAudio.paused) bgAudio.play().catch(() => {});
        musicStateEl.textContent = !bgAudio.paused ? "pause" : "play";
        return;
      }

      loadedAudioSrc = item.audio;
      bgAudio.src = item.audio;
      musicProgressEl.style.transform = "scaleX(0)";

      if (isAudioActive) {
        bgAudio.play()
          .then(() => {
            musicPill.classList.add("playing");
            musicStateEl.textContent = "pause";
          })
          .catch(() => {
            musicPill.classList.remove("playing");
            musicStateEl.textContent = "play";
          });
      } else {
        musicPill.classList.remove("playing");
        musicStateEl.textContent = "play";
      }
    }

    function updateNavDisplay(animate = true) {
      if (entries.length > 1) {
        navWhisper.classList.remove("hidden");
        if (!animate) {
          counterEl.textContent = `${currentIndex + 1} / ${entries.length}`;
        }
      } else {
        navWhisper.classList.add("hidden");
      }
    }

    function renderEntry(index, direction = 0) {
      if (!entries.length) return;
      const token = ++renderToken;
      currentIndex = (index + entries.length) % entries.length;
      const item = entries[currentIndex];
      const nextCountText = `${currentIndex + 1} / ${entries.length}`;

      updateNavDisplay(true);
      syncAudio(item);

      const performSwap = (loadedImgEl) => {
        if (token !== renderToken) return;

        const outgoingSlot = worldSlots[activeSlot];
        const nextSlot = 1 - activeSlot;
        const incomingSlot = worldSlots[nextSlot];
        const incomingImg = mainImgs[nextSlot];
        const incomingEcho = echoImgs[nextSlot];

        incomingImg.src = item.src;
        incomingEcho.src = item.src;

        if (direction === 0) {
          incomingSlot.style.transition = "none";
          incomingSlot.style.opacity = "0";
          incomingSlot.style.transform = "translate3d(0, 0, 0) scale(0.985)";
          incomingSlot.className = "world-slot is-active";

          void incomingSlot.offsetWidth;

          incomingSlot.style.transition = "transform 0.85s var(--ease-drift), opacity 0.8s var(--ease-liquid)";
          incomingSlot.style.opacity = "1";
          incomingSlot.style.transform = "translate3d(0, 0, 0) scale(1)";

          activeSlot = nextSlot;
          captionEl.textContent = item.caption;
          counterEl.textContent = nextCountText;
          if (loadedImgEl) applyAtmosphere(item.src, loadedImgEl);
          return;
        }

        const shiftDist = 34;
        const exitOffset = direction > 0 ? -shiftDist : shiftDist;
        const enterOffset = direction > 0 ? shiftDist : -shiftDist;

        incomingSlot.style.transition = "none";
        incomingSlot.style.opacity = "0";
        incomingSlot.style.transform = `translate3d(${enterOffset}px, 0, 0) scale(1.03, 0.98)`;
        incomingSlot.className = "world-slot is-active";

        void incomingSlot.offsetWidth;

        clearTimeout(auraTimer);
        touchArea.classList.add("is-shifting");
        auraTimer = setTimeout(() => touchArea.classList.remove("is-shifting"), 450);

        outgoingSlot.className = "world-slot is-exiting";
        outgoingSlot.style.transition = "transform 0.48s var(--ease-drift), opacity 0.4s var(--ease-liquid)";
        outgoingSlot.style.opacity = "0";
        outgoingSlot.style.transform = `translate3d(${exitOffset}px, 0, 0) scale(1.025, 0.98)`;

        incomingSlot.style.transition = "transform 0.56s var(--ease-drift), opacity 0.46s var(--ease-liquid)";
        incomingSlot.style.opacity = "1";
        incomingSlot.style.transform = "translate3d(0, 0, 0) scale(1, 1)";

        clearTimeout(hudTimer);
        captionEl.classList.add("is-shifting");
        counterEl.classList.add("is-shifting");

        hudTimer = setTimeout(() => {
          if (token !== renderToken) return;
          captionEl.textContent = item.caption;
          counterEl.textContent = nextCountText;
          captionEl.classList.remove("is-shifting");
          counterEl.classList.remove("is-shifting");
        }, 140);

        activeSlot = nextSlot;
        if (loadedImgEl) applyAtmosphere(item.src, loadedImgEl);
      };

      const cached = imageCache.get(item.src);
      if (cached instanceof HTMLImageElement) {
        performSwap(cached);
      } else {
        preloadImage(item.src).then((imgEl) => performSwap(imgEl));
      }
    }

    musicPill.addEventListener("click", () => {
      const item = entries[currentIndex];
      if (!item || !item.audio) return;

      initAudioAnalyser();
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }

      if (bgAudio.paused) {
        isAudioActive = true;
        if (!loadedAudioSrc) {
          loadedAudioSrc = item.audio;
          bgAudio.src = item.audio;
        }
        bgAudio.play()
          .then(() => {
            musicPill.classList.add("playing");
            musicStateEl.textContent = "pause";
          })
          .catch(() => {
            isAudioActive = false;
            musicPill.classList.remove("playing");
            musicStateEl.textContent = "retry";
          });
      } else {
        isAudioActive = false;
        bgAudio.pause();
        musicPill.classList.remove("playing");
        musicStateEl.textContent = "play";
        document.documentElement.style.setProperty("--bass-boost", "0");
      }
    });

    bgAudio.addEventListener("play", () => {
      musicPill.classList.add("playing");
      musicStateEl.textContent = "pause";
    });

    bgAudio.addEventListener("pause", () => {
      musicPill.classList.remove("playing");
      musicStateEl.textContent = "play";
      document.documentElement.style.setProperty("--bass-boost", "0");
    });

    bgAudio.addEventListener("timeupdate", () => {
      if (bgAudio.duration) {
        musicProgressEl.style.transform = `scaleX(${bgAudio.currentTime / bgAudio.duration})`;
      }
    });

    document.getElementById("prev-btn").onclick = (e) => {
      e.currentTarget.blur();
      renderEntry(currentIndex - 1, -1);
    };
    document.getElementById("next-btn").onclick = (e) => {
      e.currentTarget.blur();
      renderEntry(currentIndex + 1, 1);
    };

    window.addEventListener("keydown", (e) => {
      if (entries.length > 1 && e.key === "ArrowLeft") renderEntry(currentIndex - 1, -1);
      if (entries.length > 1 && e.key === "ArrowRight") renderEntry(currentIndex + 1, 1);
      if (e.key === " ") {
        e.preventDefault();
        musicPill.click();
      }
    });

    let touchStartX = 0;
    let isDragging = false;

    touchArea.addEventListener("touchstart", (e) => {
      if (entries.length <= 1) return;
      touchStartX = e.changedTouches[0].screenX;
      isDragging = true;
      worldSlots[activeSlot].style.transition = "none";
    }, { passive: true });

    touchArea.addEventListener("touchmove", (e) => {
      if (!isDragging || entries.length <= 1) return;
      const deltaX = e.changedTouches[0].screenX - touchStartX;
      const dampenedX = deltaX * 0.34;
      const stretchX = 1 + Math.min(Math.abs(deltaX) / 2200, 0.035);
      const squashY = 1 - Math.min(Math.abs(deltaX) / 3600, 0.02);

      worldSlots[activeSlot].style.transform = `translate3d(${dampenedX}px, 0, 0) scale(${stretchX}, ${squashY})`;
    }, { passive: true });

    touchArea.addEventListener("touchend", (e) => {
      if (!isDragging || entries.length <= 1) return;
      isDragging = false;
      const diff = e.changedTouches[0].screenX - touchStartX;

      if (Math.abs(diff) > 36) {
        renderEntry(diff > 0 ? currentIndex - 1 : currentIndex + 1, diff > 0 ? -1 : 1);
      } else {
        const currentSlot = worldSlots[activeSlot];
        currentSlot.style.transition = "transform 0.38s var(--ease-liquid)";
        currentSlot.style.transform = "translate3d(0, 0, 0) scale(1, 1)";
      }
    }, { passive: true });

    initFilmGrain();
    initAtmosphereCanvas();
    initLookAround();
    entries.forEach(item => preloadImage(item.src));
    renderEntry(0, 0);
    syncGitHubAssets();
  </script>
</body>
</html>
