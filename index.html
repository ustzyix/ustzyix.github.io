<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ustzyix</title>
  <style>
    :root {
      --fg-color: #dcdce0;
      --fg-muted: rgba(220, 220, 224, 0.42);
      --fg-whisper: rgba(220, 220, 224, 0.22);
      --border-color: rgba(220, 220, 224, 0.11);
      --glass-bg: rgba(8, 8, 10, 0.76);
      --aura-primary: #8c1d18;
      --aura-secondary: #3b1814;
      --ease-liquid: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-drift: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ล็อกหน้าจอทั้ง html และ body แบบตายตัว ป้องกันหน้าเว็บเลื่อน/เด้ง/ซูมในมือถือและ WebView */
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      color: var(--fg-color);
      background-color: #020203;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* พื้นหลังความมืดลึกแบบ Pure Gradient */
    #ambient-layer {
      position: fixed;
      inset: 0;
      z-index: -5;
      background:
        radial-gradient(circle at 50% 34%, rgba(140, 29, 24, 0.34) 0%, transparent 56%),
        radial-gradient(circle at 50% 78%, rgba(59, 24, 20, 0.26) 0%, #020203 74%);
      pointer-events: none;
    }

    /* ชั้นหมอกระยะไกลเคลื่อนตัวช้าๆ */
    .mist-layer {
      position: fixed;
      inset: -20%;
      z-index: -4;
      pointer-events: none;
      opacity: 0.44;
      background:
        radial-gradient(ellipse 58% 42% at 28% 38%, var(--aura-primary) 0%, transparent 72%),
        radial-gradient(ellipse 54% 46% at 72% 66%, var(--aura-secondary) 0%, transparent 74%);
      animation: mistDriftFar 28s ease-in-out infinite alternate;
      will-change: transform;
    }

    /* ชั้นหมอกระลอกที่สองสวนทางจางๆ เพิ่มมิติความลึก */
    .mist-layer-near {
      position: fixed;
      inset: -15%;
      z-index: -3;
      pointer-events: none;
      opacity: 0.24;
      background:
        radial-gradient(ellipse 46% 34% at 68% 36%, var(--aura-primary) 0%, transparent 70%),
        radial-gradient(ellipse 62% 38% at 35% 74%, rgba(190, 195, 210, 0.08) 0%, transparent 75%);
      animation: mistDriftNear 21s ease-in-out infinite alternate;
      will-change: transform;
    }

    @keyframes mistDriftFar {
      0% { transform: translate3d(-2.2%, -1.2%, 0) scale(1); }
      100% { transform: translate3d(2.2%, 1.6%, 0) scale(1.05); }
    }

    @keyframes mistDriftNear {
      0% { transform: translate3d(2%, 1%, 0) scale(1.03); }
      100% { transform: translate3d(-2.5%, -1.4%, 0) scale(0.99); }
    }

    /* ละอองฝุ่น/เถ้าลอยในอากาศ (แยก 2 ระดับความลึก: หลังภาพ และ หน้าภาพ) */
    .ash-field {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      overflow: hidden;
    }

    .foreground-dust {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      overflow: hidden;
    }

    .ash-mote {
      position: absolute;
      bottom: -10px;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(235, 235, 240, 0.85);
      opacity: 0;
      animation: ashFloat linear infinite;
      will-change: transform, opacity;
    }

    .foreground-dust .ash-mote {
      width: 2.5px;
      height: 2.5px;
      background: rgba(245, 245, 250, 0.72);
    }

    @keyframes ashFloat {
      0% { transform: translate3d(0, 0, 0); opacity: 0; }
      22% { opacity: var(--mote-opacity, 0.2); }
      78% { opacity: calc(var(--mote-opacity, 0.2) * 0.65); }
      100% { transform: translate3d(var(--drift-x, 22px), -105dvh, 0); opacity: 0; }
    }

    /* ขอบมืดลึกโอบล้อมความโดดเดี่ยว */
    .void-vignette {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(
        circle at 50% 42%,
        transparent 20%,
        rgba(2, 2, 3, 0.78) 72%,
        rgba(1, 1, 2, 0.98) 100%
      );
    }

    header {
      flex-shrink: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: max(20px, env(safe-area-inset-top)) 28px 10px;
      font-size: 12px;
      z-index: 5;
    }

    .brand {
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: lowercase;
      color: var(--fg-muted);
    }

    .memory-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--fg-whisper);
    }

    main {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 20px max(28px, env(safe-area-inset-bottom));
      overflow: hidden;
    }

    .solitary-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      width: 100%;
      max-width: 100%;
      animation: fadeSlow 1.4s var(--ease-liquid) forwards;
    }

    @keyframes fadeSlow {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ฟิกซ์ความสูงกรอบภาพคงที่ ป้องกันปุ่มด้านล่างขยับเวลาเปลี่ยนรูปแนวนอน/แนวตั้ง */
    .frame-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      height: min(48dvh, 420px);
      touch-action: none;
    }

    /* แสงเรืองรอบหน้าต่างภาพ */
    .frame-aura {
      position: absolute;
      inset: -44px;
      z-index: -1;
      background: radial-gradient(circle, var(--aura-primary) 0%, transparent 66%);
      opacity: 0.34;
      animation: auraBreathe 7.5s ease-in-out infinite alternate;
      transition: opacity 0.55s ease, transform 0.55s var(--ease-drift);
      pointer-events: none;
      will-change: transform, opacity;
    }

    @keyframes auraBreathe {
      0% { opacity: 0.26; transform: scale(0.98); }
      50% { opacity: 0.38; transform: scale(1.03); }
      100% { opacity: 0.29; transform: scale(1); }
    }

    .frame-wrap.is-shifting .frame-aura {
      animation: none;
      opacity: 0.52;
      transform: scale(1.06);
    }

    /* เลเยอร์หน้าต่างของแต่ละภาพ (ตัดขอบภาพที่กำลังหายใจอยู่ด้านในไม่ให้ล้นกรอบ) */
    .slide-layer {
      grid-area: 1 / 1;
      position: relative;
      display: inline-grid;
      place-items: center;
      overflow: hidden;
      border-radius: 3px;
      border: 1px solid var(--border-color);
      box-shadow:
        0 32px 85px -12px rgba(0, 0, 0, 0.94),
        0 0 0 1px rgba(0, 0, 0, 0.65);
      opacity: 0;
      transform: translate3d(0, 0, 0) scale(1, 1);
      pointer-events: none;
      will-change: transform, opacity;
      backface-visibility: hidden;
    }

    .slide-layer.is-active {
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
    }

    .slide-layer.is-exiting {
      z-index: 1;
    }

    /* ตัวรูปภาพที่ "มีชีวิตและกำลังหายใจ" ช้าๆ เหมือนกล้องสายตาคนยืนมองอยู่คนเดียว */
    .slide-photo {
      grid-area: 1 / 1;
      display: block;
      max-width: min(86vw, 660px);
      max-height: min(48dvh, 420px);
      width: auto;
      height: auto;
      object-fit: contain;
      transform: scale(1.02) translate3d(0, 0, 0);
      will-change: transform;
      backface-visibility: hidden;
    }

    .slide-layer.is-active .slide-photo {
      animation: livingWorldBreath 18s ease-in-out infinite alternate;
    }

    @keyframes livingWorldBreath {
      0% {
        transform: scale(1.015) translate3d(-0.7%, -0.4%, 0);
      }
      50% {
        transform: scale(1.045) translate3d(0.4%, -0.7%, 0);
      }
      100% {
        transform: scale(1.065) translate3d(0.7%, 0.5%, 0);
      }
    }

    /* แสงไฟ/เงาเมฆไหววูบจางๆ ภายในภาพ (จำลองบรรยากาศมีชีวิตแบบไร้ผู้คน) */
    .light-flicker {
      grid-area: 1 / 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
      mix-blend-mode: screen;
      background:
        radial-gradient(circle at 32% 28%, var(--aura-primary) 0%, transparent 62%),
        radial-gradient(circle at 72% 65%, rgba(255, 248, 235, 0.14) 0%, transparent 58%);
      opacity: 0.16;
      animation: atmosphericFlicker 6.4s ease-in-out infinite alternate;
      will-change: opacity;
    }

    @keyframes atmosphericFlicker {
      0%   { opacity: 0.10; }
      24%  { opacity: 0.22; }
      38%  { opacity: 0.13; }
      62%  { opacity: 0.25; }
      81%  { opacity: 0.14; }
      100% { opacity: 0.20; }
    }

    /* ขอบมืดเลนส์กล้องภายในภาพ ให้มิติความลึกสมจริง */
    .lens-vignette {
      grid-area: 1 / 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
      box-shadow: inset 0 0 38px rgba(0, 0, 0, 0.68);
    }

    .meta-bar {
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
      z-index: 5;
    }

    .caption {
      height: 22px;
      line-height: 22px;
      max-width: 88vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.22em;
      color: var(--fg-color);
      opacity: 0.88;
      transition: opacity 0.28s var(--ease-liquid);
      will-change: opacity;
    }

    .caption.is-shifting {
      opacity: 0;
    }

    /* แถบเล่นเพลงมินิมอล ล็อกขนาดคงที่ไม่มีขยับตอนกด */
    .music-pill {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      max-width: min(86vw, 320px);
      height: 32px;
      padding: 0 16px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--border-color);
      color: var(--fg-muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      cursor: pointer;
      touch-action: manipulation;
      transition: border-color 0.25s ease, color 0.25s ease;
    }

    .music-pill:hover,
    .music-pill.playing {
      color: var(--fg-color);
      border-color: rgba(255, 255, 255, 0.26);
    }

    .eq-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
      width: 10px;
      flex-shrink: 0;
    }

    .eq-bars i {
      display: block;
      width: 1.5px;
      height: 9px;
      background-color: currentColor;
      transform-origin: bottom;
      transform: scaleY(0.35);
    }

    .eq-bars i:nth-child(2) { transform: scaleY(0.85); }
    .eq-bars i:nth-child(3) { transform: scaleY(0.55); }

    .music-pill.playing .eq-bars i {
      animation: eqBounce 0.9s ease-in-out infinite alternate;
    }
    .music-pill.playing .eq-bars i:nth-child(2) { animation-delay: 0.25s; }
    .music-pill.playing .eq-bars i:nth-child(3) { animation-delay: 0.5s; }

    @keyframes eqBounce {
      0% { transform: scaleY(0.25); }
      100% { transform: scaleY(1); }
    }

    .music-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-state {
      min-width: 44px;
      text-align: right;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.65;
      flex-shrink: 0;
    }

    .music-progress {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 1px;
      width: 100%;
      background: currentColor;
      opacity: 0.55;
      transform: scaleX(0);
      transform-origin: left;
      will-change: transform;
    }

    .swatches {
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--fg-whisper);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
      transition: opacity 0.26s ease;
    }

    .swatches.is-shifting {
      opacity: 0.35;
    }

    .swatch-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      cursor: pointer;
      opacity: 0.85;
      flex-shrink: 0;
    }

    /* ปุ่มเปลี่ยนภาพตำแหน่งนิ่งสนิท 100% ไม่มีขยับหรือยุบตัว */
    .nav-whisper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10.5px;
      letter-spacing: 0.16em;
      color: var(--fg-muted);
    }

    .nav-whisper.hidden {
      display: none;
    }

    #counter {
      min-width: 56px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .nav-whisper button {
      min-width: 86px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      color: inherit;
      font: inherit;
      letter-spacing: inherit;
      cursor: pointer;
      padding: 0 14px;
      opacity: 0.78;
      touch-action: manipulation;
      transition: opacity 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .nav-whisper button:hover,
    .nav-whisper button:active {
      opacity: 1;
      color: var(--fg-color);
      border-color: rgba(255, 255, 255, 0.28);
    }

    @media (max-width: 600px) {
      header { padding: max(16px, env(safe-area-inset-top)) 20px 8px; }
      .frame-wrap { height: 42dvh; }
      .slide-photo { max-width: 88vw; max-height: 42dvh; }
      .solitary-stage { gap: 18px; }
    }
  </style>
</head>
<body>
  <div id="ambient-layer"></div>
  <div class="mist-layer"></div>
  <div class="mist-layer-near"></div>
  <div class="ash-field" id="ash-field"></div>
  <div class="void-vignette"></div>
  <div class="foreground-dust" id="foreground-dust"></div>

  <header>
    <div class="brand">ustzyix</div>
    <div class="memory-tag">stillness</div>
  </header>

  <main>
    <section class="solitary-stage">
      <div class="frame-wrap" id="touch-area">
        <div class="frame-aura"></div>

        <div id="slot-layer-0" class="slide-layer is-active">
          <img id="img-slot-0" class="slide-photo" decoding="async" alt="ustzyix" />
          <div class="light-flicker"></div>
          <div class="lens-vignette"></div>
        </div>

        <div id="slot-layer-1" class="slide-layer">
          <img id="img-slot-1" class="slide-photo" decoding="async" alt="ustzyix" />
          <div class="light-flicker"></div>
          <div class="lens-vignette"></div>
        </div>
      </div>

      <div class="meta-bar">
        <div class="caption" id="photo-caption">Crimson — 01</div>

        <button class="music-pill" id="music-pill" type="button" aria-label="Toggle audio">
          <span class="eq-bars" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="music-title" id="music-title">TV Girl · Loving Machine</span>
          <span class="music-state" id="music-state">play</span>
          <span class="music-progress" id="music-progress"></span>
        </button>

        <div class="swatches" id="swatch-bar"></div>

        <div class="nav-whisper" id="nav-whisper">
          <button id="prev-btn" type="button">← prev</button>
          <span id="counter">1 / 2</span>
          <button id="next-btn" type="button">next →</button>
        </div>
      </div>
    </section>
  </main>

  <audio id="bg-audio" loop preload="metadata"></audio>

  <script>
    const REPO_CONFIG = {
      owner: "ustzyix",
      repo: "ustzyix.github.io",
      folder: "images",
      audioFolder: "audio"
    };

    const DEFAULT_AUDIO = "./audio/Loving%20Machine.mp3";
    const DEFAULT_SONG = "TV Girl · Loving Machine";

    // รายการรูปภาพปัจจุบันในโฟลเดอร์ images/ ของ GitHub
    const ENTRIES = [
      {
        file: "IMG_5755 (2).jpg",
        src: "./images/IMG_5755%20(2).jpg",
        caption: "Crimson — 01",
        song: DEFAULT_SONG,
        audio: DEFAULT_AUDIO
      },
      {
        file: "IMG_5738 (1).jpg",
        src: "./images/IMG_5738%20(1).jpg",
        caption: "Magenta — 02",
        song: DEFAULT_SONG,
        audio: DEFAULT_AUDIO
      }
    ];

    let entries = [...ENTRIES];
    let currentIndex = 0;
    let activeSlot = 0;
    let isAudioActive = false;
    let loadedAudioSrc = "";
    let captionTimer = null;
    let auraTimer = null;
    let renderToken = 0;

    // แคชรูปภาพและค่าสีไว้ในหน่วยความจำ กดรัวได้ทันทีโดยไม่คำนวณซ้ำ
    const imageCache = new Map();
    const paletteCache = new Map();

    // Shared Offscreen Canvas ขนาดเล็ก (36x36) ประหยัด CPU/RAM
    const sampleCanvas = document.createElement("canvas");
    sampleCanvas.width = 36;
    sampleCanvas.height = 36;
    const sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });

    const layerSlots = [
      document.getElementById("slot-layer-0"),
      document.getElementById("slot-layer-1")
    ];
    const imgSlots = [
      document.getElementById("img-slot-0"),
      document.getElementById("img-slot-1")
    ];
    const touchArea = document.getElementById("touch-area");
    const captionEl = document.getElementById("photo-caption");
    const swatchBar = document.getElementById("swatch-bar");
    const ambientLayer = document.getElementById("ambient-layer");
    const navWhisper = document.getElementById("nav-whisper");
    const counterEl = document.getElementById("counter");
    const ashField = document.getElementById("ash-field");
    const foregroundDust = document.getElementById("foreground-dust");

    const bgAudio = document.getElementById("bg-audio");
    const musicPill = document.getElementById("music-pill");
    const musicTitleEl = document.getElementById("music-title");
    const musicStateEl = document.getElementById("music-state");
    const musicProgressEl = document.getElementById("music-progress");

    // ป้องกันการซูมเมื่อกดรัวหรือบีบนิ้วบนมือถือ
    document.addEventListener("gesturestart", (e) => e.preventDefault());
    document.addEventListener("dblclick", (e) => e.preventDefault());

    function initAtmosphericParticles() {
      const bgFrag = document.createDocumentFragment();
      for (let i = 0; i < 6; i++) {
        const mote = document.createElement("span");
        mote.className = "ash-mote";
        mote.style.left = `${(i + 0.5) * (100 / 6)}%`;
        mote.style.animationDuration = `${20 + (i % 3) * 6}s`;
        mote.style.animationDelay = `${-i * 3.8}s`;
        mote.style.setProperty("--drift-x", `${(i % 2 === 0 ? 1 : -1) * 16}px`);
        mote.style.setProperty("--mote-opacity", "0.22");
        bgFrag.appendChild(mote);
      }
      ashField.appendChild(bgFrag);

      // ละอองฝุ่นระยะใกล้ลอยผ่านหน้าต่างภาพช้าๆ สร้างความรู้สึกเหมือนยืนอยู่ในห้องว่างจริง
      const fgFrag = document.createDocumentFragment();
      for (let i = 0; i < 4; i++) {
        const mote = document.createElement("span");
        mote.className = "ash-mote";
        mote.style.left = `${18 + i * 21}%`;
        mote.style.animationDuration = `${15 + (i % 2) * 5}s`;
        mote.style.animationDelay = `${-i * 4.1}s`;
        mote.style.setProperty("--drift-x", `${(i % 2 === 0 ? -1 : 1) * 26}px`);
        mote.style.setProperty("--mote-opacity", "0.14");
        fgFrag.appendChild(mote);
      }
      foregroundDust.appendChild(fgFrag);
    }

    function preloadImage(src) {
      if (imageCache.has(src)) return Promise.resolve(imageCache.get(src));
      const promise = new Promise((resolve) => {
        const img = new Image();
        img.decoding = "async";
        img.onload = () => {
          imageCache.set(src, img);
          resolve(img);
        };
        img.onerror = () => resolve(null);
        img.src = src;
      });
      imageCache.set(src, promise);
      return promise;
    }

    function formatNewCaption(filename) {
      return filename
        .replace(/\.[^/.]+$/, "")
        .replace(/\(\d+\)/g, "")
        .replace(/^IMG[-_]?/i, "")
        .replace(/[-_]/g, " ")
        .trim() || "Stillness";
    }

    // ตรวจจับรูปใหม่และไฟล์เสียงใหม่ใน GitHub อัตโนมัติเมื่อมีการอัปโหลดเพิ่มในอนาคต
    async function syncGitHubAssets() {
      try {
        const imgApi = `https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${REPO_CONFIG.folder}`;
        const audioApi = `https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${REPO_CONFIG.audioFolder}`;

        const [imgRes, audioRes] = await Promise.all([
          fetch(imgApi),
          fetch(audioApi).catch(() => null)
        ]);

        const audioMap = new Map();
        if (audioRes && audioRes.ok) {
          const audioFiles = await audioRes.json();
          const validAudio = /\.(mp3|m4a|ogg|wav|aac)$/i;
          audioFiles
            .filter(f => f.type === "file" && validAudio.test(f.name))
            .forEach(f => {
              const baseName = f.name.replace(/\.[^/.]+$/, "").toLowerCase();
              audioMap.set(baseName, `./${REPO_CONFIG.audioFolder}/${encodeURIComponent(f.name)}`);
            });
        }

        if (imgRes && imgRes.ok) {
          const files = await imgRes.json();
          const validExt = /\.(jpe?g|png|webp|gif|avif)$/i;
          const existingNames = new Set(entries.map(p => p.file));

          const extraPhotos = files
            .filter(f => f.type === "file" && validExt.test(f.name) && !existingNames.has(f.name))
            .map(f => {
              const baseName = f.name.replace(/\.[^/.]+$/, "").toLowerCase();
              const title = formatNewCaption(f.name);
              return {
                file: f.name,
                src: `./${REPO_CONFIG.folder}/${encodeURIComponent(f.name)}`,
                caption: title,
                song: audioMap.has(baseName) ? title : DEFAULT_SONG,
                audio: audioMap.get(baseName) || DEFAULT_AUDIO
              };
            });

          if (extraPhotos.length > 0) {
            entries = [...entries, ...extraPhotos];
            extraPhotos.forEach(p => preloadImage(p.src));
            updateNavDisplay();
          }
        }
      } catch (_) {}
    }

    // จัดกลุ่มสีตามพื้นที่ส่วนใหญ่ของภาพจริง (คำนวณครั้งเดียวแล้วเก็บลง Cache)
    function getDominantPalette(src, imgElement) {
      if (paletteCache.has(src)) return paletteCache.get(src);

      try {
        const size = 36;
        sampleCtx.clearRect(0, 0, size, size);
        sampleCtx.drawImage(imgElement, 0, 0, size, size);

        const data = sampleCtx.getImageData(0, 0, size, size).data;
        const buckets = new Map();
        const step = 28;
        let rSum = 0, gSum = 0, bSum = 0, total = 0;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i + 1], b = data[i + 2];
          rSum += r; gSum += g; bSum += b; total++;

          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const sat = max === 0 ? 0 : (max - min) / max;
          const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;

          if (lum < 0.08 || lum > 0.90) continue;

          const key = `${(r / step) | 0},${(g / step) | 0},${(b / step) | 0}`;
          let bucket = buckets.get(key);
          if (!bucket) {
            bucket = { r: 0, g: 0, b: 0, count: 0, satSum: 0 };
            buckets.set(key, bucket);
          }
          bucket.r += r;
          bucket.g += g;
          bucket.b += b;
          bucket.count += 1;
          bucket.satSum += sat;
        }

        const clusters = Array.from(buckets.values()).map(b => {
          const avgSat = b.satSum / b.count;
          return {
            rgb: [b.r / b.count, b.g / b.count, b.b / b.count],
            score: b.count * (0.45 + avgSat * 1.15)
          };
        });

        clusters.sort((a, b) => b.score - a.score);

        const avg = [rSum / total, gSum / total, bSum / total];
        const primary = clusters.length > 0 ? clusters[0].rgb : avg;

        let secondary = null;
        for (let i = 1; i < clusters.length; i++) {
          const c = clusters[i].rgb;
          const dist = Math.abs(c[0] - primary[0]) + Math.abs(c[1] - primary[1]) + Math.abs(c[2] - primary[2]);
          if (dist > 75) {
            secondary = c;
            break;
          }
        }
        if (!secondary) secondary = primary.map(v => v * 0.45);

        const result = {
          primaryHex: rgbToHex(primary),
          secondaryHex: rgbToHex(secondary),
          glowPrimary: rgbToHex(primary.map(v => v * 0.56)),
          glowSecondary: rgbToHex(secondary.map(v => v * 0.46)),
          abyssBase: rgbToHex(primary.map(v => v * 0.11))
        };

        paletteCache.set(src, result);
        return result;
      } catch (_) {
        return null;
      }
    }

    function rgbToHex([r, g, b]) {
      return "#" + [r, g, b]
        .map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, "0"))
        .join("");
    }

    function applyAtmosphere(src, imgElement) {
      const palette = getDominantPalette(src, imgElement);
      if (!palette) return;

      const { primaryHex, secondaryHex, glowPrimary, glowSecondary, abyssBase } = palette;
      document.documentElement.style.setProperty("--aura-primary", primaryHex);
      document.documentElement.style.setProperty("--aura-secondary", secondaryHex);

      ambientLayer.style.background = `
        radial-gradient(circle at 50% 34%, ${glowPrimary}c4 0%, transparent 56%),
        radial-gradient(circle at 50% 78%, ${glowSecondary}94 0%, ${abyssBase} 72%, #020203 100%)
      `;

      swatchBar.innerHTML = `
        <span class="swatch-dot" style="background:${primaryHex}" title="Copy ${primaryHex}" onclick="navigator.clipboard?.writeText('${primaryHex}')"></span>
        <span>${primaryHex.toUpperCase()}</span>
        <span>·</span>
        <span class="swatch-dot" style="background:${secondaryHex}" title="Copy ${secondaryHex}" onclick="navigator.clipboard?.writeText('${secondaryHex}')"></span>
        <span>${secondaryHex.toUpperCase()}</span>
      `;
    }

    function syncAudio(item) {
      const targetTitle = item.song || DEFAULT_SONG;
      if (musicTitleEl.textContent !== targetTitle) {
        musicTitleEl.textContent = targetTitle;
      }

      if (!item.audio) {
        bgAudio.pause();
        loadedAudioSrc = "";
        musicPill.classList.remove("playing");
        musicProgressEl.style.transform = "scaleX(0)";
        musicStateEl.textContent = "—";
        return;
      }

      if (loadedAudioSrc === item.audio) {
        if (isAudioActive && bgAudio.paused) bgAudio.play().catch(() => {});
        musicStateEl.textContent = !bgAudio.paused ? "pause" : "play";
        return;
      }

      loadedAudioSrc = item.audio;
      bgAudio.src = item.audio;
      musicProgressEl.style.transform = "scaleX(0)";

      if (isAudioActive) {
        bgAudio.play()
          .then(() => {
            musicPill.classList.add("playing");
            musicStateEl.textContent = "pause";
          })
          .catch(() => {
            musicPill.classList.remove("playing");
            musicStateEl.textContent = "play";
          });
      } else {
        musicPill.classList.remove("playing");
        musicStateEl.textContent = "play";
      }
    }

    function updateNavDisplay() {
      if (entries.length > 1) {
        navWhisper.classList.remove("hidden");
        counterEl.textContent = `${currentIndex + 1} / ${entries.length}`;
      } else {
        navWhisper.classList.add("hidden");
      }
    }

    // เปลี่ยนรูปภาพแบบ Dual-Layer Crossfade + Living World Frame
    function renderEntry(index, direction = 0) {
      if (!entries.length) return;
      const token = ++renderToken;
      currentIndex = (index + entries.length) % entries.length;
      const item = entries[currentIndex];

      updateNavDisplay();
      syncAudio(item);

      const performSwap = (loadedImgEl) => {
        if (token !== renderToken) return;

        const outgoingLayer = layerSlots[activeSlot];
        const nextSlot = 1 - activeSlot;
        const incomingLayer = layerSlots[nextSlot];
        const incomingImg = imgSlots[nextSlot];

        if (direction === 0) {
          incomingImg.src = item.src;
          incomingLayer.style.transition = "none";
          incomingLayer.style.opacity = "0";
          incomingLayer.style.transform = "translate3d(0, 0, 0) scale(0.985, 0.985)";
          incomingLayer.className = "slide-layer is-active";

          void incomingLayer.offsetWidth;

          incomingLayer.style.transition = "transform 0.75s var(--ease-drift), opacity 0.7s var(--ease-liquid)";
          incomingLayer.style.opacity = "1";
          incomingLayer.style.transform = "translate3d(0, 0, 0) scale(1, 1)";

          activeSlot = nextSlot;
          captionEl.textContent = item.caption;
          if (loadedImgEl) applyAtmosphere(item.src, loadedImgEl);
          return;
        }

        const shiftDist = 34;
        const exitOffset = direction > 0 ? -shiftDist : shiftDist;
        const enterOffset = direction > 0 ? shiftDist : -shiftDist;

        incomingImg.src = item.src;
        incomingLayer.style.transition = "none";
        incomingLayer.style.opacity = "0";
        incomingLayer.style.transform = `translate3d(${enterOffset}px, 0, 0) scale(1.035, 0.975)`;
        incomingLayer.className = "slide-layer is-active";

        void incomingLayer.offsetWidth;

        clearTimeout(auraTimer);
        touchArea.classList.add("is-shifting");
        auraTimer = setTimeout(() => touchArea.classList.remove("is-shifting"), 400);

        outgoingLayer.className = "slide-layer is-exiting";
        outgoingLayer.style.transition = "transform 0.44s var(--ease-drift), opacity 0.36s var(--ease-liquid)";
        outgoingLayer.style.opacity = "0";
        outgoingLayer.style.transform = `translate3d(${exitOffset}px, 0, 0) scale(1.03, 0.975)`;

        incomingLayer.style.transition = "transform 0.5s var(--ease-drift), opacity 0.42s var(--ease-liquid)";
        incomingLayer.style.opacity = "1";
        incomingLayer.style.transform = "translate3d(0, 0, 0) scale(1, 1)";

        clearTimeout(captionTimer);
        captionEl.classList.add("is-shifting");
        swatchBar.classList.add("is-shifting");

        captionTimer = setTimeout(() => {
          if (token !== renderToken) return;
          captionEl.textContent = item.caption;
          captionEl.classList.remove("is-shifting");
          swatchBar.classList.remove("is-shifting");
        }, 140);

        activeSlot = nextSlot;
        if (loadedImgEl) applyAtmosphere(item.src, loadedImgEl);
      };

      const cached = imageCache.get(item.src);
      if (cached instanceof HTMLImageElement) {
        performSwap(cached);
      } else {
        preloadImage(item.src).then((imgEl) => performSwap(imgEl));
      }
    }

    musicPill.addEventListener("click", () => {
      const item = entries[currentIndex];
      if (!item || !item.audio) return;

      if (bgAudio.paused) {
        isAudioActive = true;
        if (!loadedAudioSrc) {
          loadedAudioSrc = item.audio;
          bgAudio.src = item.audio;
        }
        bgAudio.play()
          .then(() => {
            musicPill.classList.add("playing");
            musicStateEl.textContent = "pause";
          })
          .catch(() => {
            isAudioActive = false;
            musicPill.classList.remove("playing");
            musicStateEl.textContent = "retry";
          });
      } else {
        isAudioActive = false;
        bgAudio.pause();
        musicPill.classList.remove("playing");
        musicStateEl.textContent = "play";
      }
    });

    bgAudio.addEventListener("play", () => {
      musicPill.classList.add("playing");
      musicStateEl.textContent = "pause";
    });

    bgAudio.addEventListener("pause", () => {
      musicPill.classList.remove("playing");
      musicStateEl.textContent = "play";
    });

    bgAudio.addEventListener("timeupdate", () => {
      if (bgAudio.duration) {
        musicProgressEl.style.transform = `scaleX(${bgAudio.currentTime / bgAudio.duration})`;
      }
    });

    document.getElementById("prev-btn").onclick = () => renderEntry(currentIndex - 1, -1);
    document.getElementById("next-btn").onclick = () => renderEntry(currentIndex + 1, 1);

    window.addEventListener("keydown", (e) => {
      if (entries.length > 1 && e.key === "ArrowLeft") renderEntry(currentIndex - 1, -1);
      if (entries.length > 1 && e.key === "ArrowRight") renderEntry(currentIndex + 1, 1);
      if (e.key === " ") {
        e.preventDefault();
        musicPill.click();
      }
    });

    let touchStartX = 0;
    let isDragging = false;

    touchArea.addEventListener("touchstart", (e) => {
      if (entries.length <= 1) return;
      touchStartX = e.changedTouches[0].screenX;
      isDragging = true;
      layerSlots[activeSlot].style.transition = "none";
    }, { passive: true });

    touchArea.addEventListener("touchmove", (e) => {
      if (!isDragging || entries.length <= 1) return;
      const deltaX = e.changedTouches[0].screenX - touchStartX;
      const dampenedX = deltaX * 0.34;
      const stretchX = 1 + Math.min(Math.abs(deltaX) / 2200, 0.04);
      const squashY = 1 - Math.min(Math.abs(deltaX) / 3600, 0.02);

      layerSlots[activeSlot].style.transform = `translate3d(${dampenedX}px, 0, 0) scale(${stretchX}, ${squashY})`;
    }, { passive: true });

    touchArea.addEventListener("touchend", (e) => {
      if (!isDragging || entries.length <= 1) return;
      isDragging = false;
      const diff = e.changedTouches[0].screenX - touchStartX;

      if (Math.abs(diff) > 36) {
        renderEntry(diff > 0 ? currentIndex - 1 : currentIndex + 1, diff > 0 ? -1 : 1);
      } else {
        const currentLayer = layerSlots[activeSlot];
        currentLayer.style.transition = "transform 0.36s var(--ease-liquid)";
        currentLayer.style.transform = "translate3d(0, 0, 0) scale(1, 1)";
      }
    }, { passive: true });

    initAtmosphericParticles();
    entries.forEach(item => preloadImage(item.src));
    renderEntry(0, 0);
    syncGitHubAssets();
  </script>
</body>
</html>
