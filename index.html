<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="description" content="ustzyix — Atmospheric visual and photographic studio archive."/>
<meta name="theme-color" content="#050507"/>
<title>ustzyix — Visual Studio</title>
<link rel="preload" href="data/photos.js" as="script"/>
<link rel="preconnect" href="https://api.github.com" crossorigin/>
<style>
@property --aura-1{syntax:"<color>";inherits:true;initial-value:#9b221c}
@property --aura-2{syntax:"<color>";inherits:true;initial-value:#481a16}
@property --abyss{syntax:"<color>";inherits:true;initial-value:#1c0907}
:root{--bg:#050507;--fg:#f5f5f9;--fg2:rgba(245,245,249,.7);--fg3:rgba(245,245,249,.42);--ease:cubic-bezier(.22,1,.36,1);--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;width:100%;height:100dvh;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Inter","SF Pro Text","Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
header,.card,.lb{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid rgba(255,255,255,.7);outline-offset:3px}

/* ---------- atmosphere ---------- */
.atm{position:fixed;inset:0;z-index:-8;pointer-events:none;opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 0s linear 1s}
.atm.on{opacity:1;visibility:visible;transition:opacity 1s ease}
.atm i{position:absolute;display:block;pointer-events:none}
.amb{inset:0;background:
 radial-gradient(ellipse 85% 65% at 50% 34%,color-mix(in srgb,var(--aura-1) 72%,transparent),transparent 72%),
 radial-gradient(ellipse 95% 78% at 50% 82%,color-mix(in srgb,var(--aura-2) 55%,transparent),var(--abyss) 86%,var(--bg))}
.mist{inset:-14%;opacity:.58;will-change:transform;
 background:radial-gradient(ellipse 70% 56% at 24% 32%,var(--aura-1),transparent 75%),radial-gradient(ellipse 68% 62% at 78% 68%,var(--aura-2),transparent 78%);
 animation:sway 24s ease-in-out infinite alternate}
@keyframes sway{from{transform:translate3d(-2.5%,-1.2%,0) scale(1)}to{transform:translate3d(2.5%,1.5%,0) scale(1.05)}}
.rays{inset:-20%;opacity:.24;will-change:transform;transform:rotate(-22deg);
 background:radial-gradient(ellipse 20% 78% at 36% 24%,var(--aura-1),transparent 78%),radial-gradient(ellipse 16% 72% at 54% 28%,rgba(255,248,240,.14),transparent 78%);
 animation:ray 18s ease-in-out infinite alternate}
@keyframes ray{from{transform:translate3d(-3%,-1%,0) rotate(-24deg)}to{transform:translate3d(3%,1.5%,0) rotate(-19deg)}}
.fluted,.halftone{position:fixed;inset:0;z-index:-5;pointer-events:none;opacity:0;transition:opacity .7s var(--ease)}
.fluted{background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0,rgba(0,0,0,.2) 14px,rgba(255,255,255,.04) 28px)}
.halftone{background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.2px);background-size:16px 16px}
[data-look=fluted] .fluted{opacity:.8}
[data-look=halftone] .halftone{opacity:.5}
.vig{position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse 82% 76% at 50% 48%,transparent 45%,rgba(5,5,7,.4) 78%,rgba(3,3,5,.8))}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
body.modal-active .mist,body.modal-active .rays{animation-play-state:paused}

/* ---------- liquid glass (GPU-locked so backdrop-filter never drops) ---------- */
.glass,.hair{position:relative}
.glass{background:radial-gradient(120% 100% at 14% 0%,rgba(255,255,255,.16),transparent 55%),linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);transform:translateZ(0)}
.glass::before,.hair::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
 background:linear-gradient(145deg,rgba(255,255,255,.6),rgba(255,255,255,.07) 32%,rgba(255,255,255,.02) 62%,rgba(255,255,255,.3));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
 mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}

.card.glass,.tag.glass{-webkit-backdrop-filter:none;backdrop-filter:none}

/* ---------- header ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:25;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;
 padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left))}
header>*{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
.mark{width:14px;height:14px;border-radius:5px;background:conic-gradient(from 140deg,var(--aura-1),#f472b6,#818cf8,var(--aura-1));box-shadow:0 0 14px var(--aura-1)}
.brand{font-size:12.5px;font-weight:600;letter-spacing:.16em}
.count{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--fg2);padding-left:10px;border-left:1px solid rgba(255,255,255,.14)}
.dot{width:5px;height:5px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,.8);animation:pulse 3.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45;transform:scale(.85)}}
.tools{display:flex;align-items:center;gap:8px}
.seg{display:flex;height:38px;padding:4px;border-radius:999px;box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
.thumb{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:rgba(255,255,255,.18);box-shadow:0 3px 12px rgba(0,0,0,.28),inset 0 0 0 .5px rgba(255,255,255,.28)}
.thumb.ready{transition:transform .5s var(--ease),width .5s var(--ease)}
.tab{position:relative;z-index:1;height:30px;padding:0 12px;border:0;border-radius:999px;background:none;color:var(--fg2);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:color .3s}
.tab.on,.tab:hover{color:var(--fg)}
.ibtn{display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;cursor:pointer;box-shadow:0 10px 30px -12px rgba(0,0,0,.6);transition:transform .3s var(--ease)}
.ibtn:active{transform:translateZ(0) scale(.92)}
.ibtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[data-layout=grid] .i-g,[data-layout=scatter] .i-s{display:none}
@media(max-width:640px){.count{display:none}.tab{padding:0 10px;font-size:11.5px}}

/* ---------- stage ---------- */
main{position:fixed;inset:0;z-index:2;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
main::-webkit-scrollbar{display:none}
.canvas{position:relative;width:calc(100% - 40px);max-width:1240px;margin:76px auto 0;min-height:calc(100dvh - 110px)}
[data-layout=grid] .canvas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:22px;margin-top:84px;padding-bottom:48px;height:auto!important}
[data-layout=grid] .card{position:relative!important;left:auto!important;top:auto!important;width:auto!important;translate:none!important}

.canvas[data-empty]::after{content:"No photos found. Check data/photos.js and the images folder.";position:absolute;left:0;right:0;top:48px;text-align:center;font-size:13px;color:var(--fg2)}

/* ---------- cards + instant shimmer placeholder ---------- */
.card{position:absolute;display:flex;flex-direction:column;gap:10px;padding:8px;border:0;border-radius:28px;text-align:left;cursor:pointer;opacity:0;touch-action:manipulation;
 box-shadow:0 22px 50px -22px rgba(0,0,0,.8),0 0 70px -26px var(--item-aura,var(--aura-1));
 transition:transform .55s var(--ease),box-shadow .55s var(--ease)}
.card.in{opacity:1;animation:rise .85s var(--ease) var(--d,0ms) backwards}
@keyframes rise{from{opacity:0;transform:translate3d(0,22px,0) scale(.97)}}
.card:active{transform:scale(.975)}
@media(hover:hover){.card:hover{z-index:15!important;transform:translateY(-4px);box-shadow:0 30px 70px -20px rgba(0,0,0,.9),0 0 90px -16px var(--item-aura,var(--aura-1))}.card:hover img{transform:scale(1.04)}}
.frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:20px;background:rgba(255,255,255,.04)}
.frame::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.08) 50%,transparent 75%);background-size:200% 100%;animation:shimmer 1.6s linear infinite;pointer-events:none;transition:opacity .4s ease}
.frame.loaded::before{opacity:0;animation:none}
@keyframes shimmer{to{background-position:-200% 0}}
.frame::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16);pointer-events:none}
.frame img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s var(--ease),transform .8s var(--ease)}
.frame.loaded img{opacity:1}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px 4px}
.tw{min-width:0;display:flex;flex-direction:column;gap:3px}
.ttl{font-size:13.5px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11.5px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{flex-shrink:0;padding:5px 11px;border-radius:999px;font-size:11px;color:var(--fg2)}
@media(max-width:680px){body:not([data-layout=grid]) .tag{display:none}}

/* ---------- lightbox (no opacity transition on header so glass blur stays intact) ---------- */
.lb{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px 32px;background:radial-gradient(ellipse 80% 70% at 50% 45%,rgba(5,5,8,.76),rgba(5,5,8,.95));opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility 0s linear .35s}
.lb.open{opacity:1;visibility:visible;transition:opacity .35s var(--ease)}
body.modal-active header,body.modal-active main{pointer-events:none}
.lb .ibtn{position:absolute;z-index:5;background-color:rgba(255,255,255,.06)}
.lb-x{top:max(18px,env(safe-area-inset-top));right:max(18px,env(safe-area-inset-right))}
.lb-p,.lb-n{top:50%;margin-top:-19px}
.lb-p{left:max(18px,env(safe-area-inset-left))}.lb-n{right:max(18px,env(safe-area-inset-right))}
@media(max-width:680px){.lb-p,.lb-n{display:none}}
.lb-in{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:92vw;pointer-events:none}
.scene,.lb-ctl{pointer-events:auto}
.scene{perspective:1500px;display:grid;place-items:center;cursor:pointer;transform:scale(.92) translateY(14px);transition:transform .55s var(--ease);touch-action:manipulation}
.lb.open .scene{transform:none}
.flip{display:grid;place-items:center;transform-style:preserve-3d;transition:transform .72s var(--ease)}
.flip.on{transform:rotateY(180deg)}
.front,.back{grid-area:1/1;border-radius:28px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{padding:8px;background:rgba(255,255,255,.06);box-shadow:0 34px 90px rgba(0,0,0,.85),0 0 80px -18px var(--aura-1)}
.front img{display:block;max-width:min(88vw,760px);max-height:56dvh;width:auto;height:auto;border-radius:20px}
.back{width:100%;height:100%;min-width:min(88vw,390px);min-height:290px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;transform:rotateY(180deg);
 background:radial-gradient(circle at 16% 8%,rgba(255,255,255,.1),transparent 60%),rgba(17,17,23,.95);box-shadow:0 34px 90px rgba(0,0,0,.88),0 0 70px -18px var(--aura-1)}
.ex-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.ex-cam{font-size:13.5px;font-weight:600}
.ex-date{font-size:11px;color:var(--fg2)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{display:flex;flex-direction:column;gap:4px;padding:10px 4px;border-radius:16px;text-align:center;background:rgba(255,255,255,.05)}
.mv{font-family:var(--mono);font-size:11.5px;font-weight:600}
.ml{font-size:10px;color:var(--fg3)}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rk{font-size:11px;color:var(--fg3)}
.rv{font-family:var(--mono);font-size:11px;text-align:right}
.sw{display:inline-flex;align-items:center;gap:6px}
.sw i{width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.cap{font-size:15px;font-weight:600;letter-spacing:.06em}
.fbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 18px;border:0;border-radius:999px;font-size:12.5px;font-weight:500;cursor:pointer;box-shadow:0 10px 30px -12px rgba(0,0,0,.6);transition:transform .3s var(--ease)}
.fbtn:active{transform:translateZ(0) scale(.95)}
.fbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hint{font-size:11px;color:var(--fg3);text-align:center}
</style>
</head>
<body data-look="fluted" data-layout="scatter">
<div class="atm on" id="atmA"><i class="amb"></i><i class="mist"></i><i class="rays"></i></div>
<div class="atm" id="atmB"><i class="amb"></i><i class="mist"></i><i class="rays"></i></div>
<div class="fluted"></div><div class="halftone"></div><div class="vig"></div>
<canvas id="fx"></canvas>

<header id="topBar" role="banner">
  <div class="pill glass"><span class="mark"></span><span class="brand">ustzyix</span><span class="count"><span class="dot"></span><span id="count">2 frames</span></span></div>
  <div class="tools">
    <div class="seg glass" role="toolbar" aria-label="Atmosphere">
      <span class="thumb" id="thumb"></span>
      <button class="tab on" type="button" data-look-btn="fluted">Fluted</button>
      <button class="tab" type="button" data-look-btn="mist">Mist</button>
      <button class="tab" type="button" data-look-btn="halftone">Halftone</button>
    </div>
    <button class="ibtn glass" id="layoutBtn" type="button" aria-label="Switch scatter or grid layout">
      <svg class="i-s" viewBox="0 0 24 24"><rect x="3" y="4" width="9" height="7" rx="2"/><rect x="12" y="13" width="9" height="7" rx="2"/></svg>
      <svg class="i-g" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.8"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.8"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.8"/></svg>
    </button>
  </div>
</header>

<main id="stage" role="main"><div class="canvas" id="canvas"></div></main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo view">
  <button class="ibtn glass lb-x" id="lbX" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <button class="ibtn glass lb-p" id="lbP" type="button" aria-label="Previous photo"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
  <button class="ibtn glass lb-n" id="lbN" type="button" aria-label="Next photo"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
  <div class="lb-in">
    <div class="scene" id="scene" role="button" tabindex="0" aria-label="Flip card for camera information">
      <div class="flip" id="flip">
        <div class="front hair"><img id="lbImg" alt="" draggable="false"/></div>
        <div class="back hair">
          <div class="ex-top"><span class="ex-cam" id="xCam"></span><span class="ex-date" id="xDate"></span></div>
          <div class="metrics">
            <div class="mc"><span class="mv" id="xAp"></span><span class="ml">Aperture</span></div>
            <div class="mc"><span class="mv" id="xSh"></span><span class="ml">Shutter</span></div>
            <div class="mc"><span class="mv" id="xFo"></span><span class="ml">Focal</span></div>
            <div class="mc"><span class="mv" id="xIso"></span><span class="ml">ISO</span></div>
          </div>
          <div class="rows">
            <div class="row"><span class="rk">Palette</span><span class="sw"><i id="sw1"></i><i id="sw2"></i><span class="rv" id="swHex"></span></span></div>
            <div class="row"><span class="rk">Edited with</span><span class="rv" id="xApp"></span></div>
            <div class="row"><span class="rk">Resolution</span><span class="rv" id="xRes"></span></div>
            <div class="row"><span class="rk">File</span><span class="rv" id="xFile"></span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="cap" id="cap"></div>
    <div class="lb-ctl">
      <button class="fbtn glass" id="fbtn" type="button"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16m0 0v5m0-5h5M3 12A9 9 0 0 1 18.5 5.8L21 8m0 0V3m0 5h-5"/></svg><span id="fbtnT">Camera info</span></button>
    </div>
    <div class="hint">tap to flip · swipe to browse · esc to close</div>
  </div>
</div>

<script src="data/photos.js"></script>
<script>
const G=window.GALLERY||{};
const FOLDER=String(G.folder||"images").replace(/^\.?\/+|\/+$/g,"");
const TFOLDER=G.thumbFolder?String(G.thumbFolder).replace(/^\.?\/+|\/+$/g,""):"";
const IMG_OK=/\.(jpe?g|png|webp|gif|avif)$/i,pad=n=>String(n).padStart(2,"0");
const capOf=f=>f.replace(/\.[^/.]+$/,"").replace(/\(\d+\)/g,"").replace(/^IMG[-_]?/i,"").replace(/[-_]+/g," ").trim()||"Untitled";
function toEntry(p,i){
 if(typeof p==="string")p={file:p};
 const file=p.file||String(p.src).split("/").pop();
 const src=p.src||`./${FOLDER}/${encodeURIComponent(file)}`;
 const thumb=p.thumb||(TFOLDER?`./${TFOLDER}/${encodeURIComponent(file)}`:src);
 return{file,src,thumb,caption:p.title||capOf(file),sub:p.sub||`Archive · ${pad(i+1)}`,tag:p.tag||"",exif:p.exif||null,auto:!!p.auto}}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const body=document.body,root=document.documentElement.style;
let entries=(G.photos||[]).filter(p=>p&&(typeof p==='string'||p.file||p.src)).map(toEntry),cards=[],cur=0,tint=[225,215,215],modal=false,grid=false;
const canvas=$("#canvas"),stage=$("#stage"),topBar=$("#topBar"),lb=$("#lb"),flip=$("#flip"),lbImg=$("#lbImg");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- tabs with sliding glass thumb ---------- */
const tabs=$$("[data-look-btn]"),thumb=$("#thumb");
function moveThumb(){const a=$(".tab.on");if(a)thumb.style.cssText=`width:${a.offsetWidth}px;transform:translateX(${a.offsetLeft}px)`}
tabs.forEach(b=>b.onclick=()=>{tabs.forEach(x=>x.classList.toggle("on",x===b));body.dataset.look=b.dataset.lookBtn;moveThumb()});
$("#layoutBtn").onclick=()=>{grid=!grid;body.dataset.layout=grid?"grid":"scatter";
 cards.forEach(c=>{c.style.translate="";if(grid){c.style.zIndex="";}});
 if(grid)canvas.style.height="";stage.scrollTo({top:0});scheduleLayout()};

/* ---------- floating motes ---------- */
let fxId=0;
function startFx(){if(!fxId&&!modal&&!document.hidden)fxId=requestAnimationFrame(fxTick)}
let fxTick;
(()=>{const cv=$("#fx"),ctx=cv.getContext("2d");let W,H;
 const size=()=>{const d=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)};size();
 const motes=Array.from({length:W<600?26:42},()=>{const d=Math.random();return{x:Math.random()*W,y:Math.random()*H,r:.65+d*1.7,vx:(Math.random()-.5)*(.14+d*.22),vy:-(.12+d*.28),p:Math.random()*6.28,f:.009+Math.random()*.015,a:.08+d*.22}});
 fxTick=()=>{if(modal||document.hidden){fxId=0;return}
  ctx.clearRect(0,0,W,H);const[r,g,b]=tint;
  for(const m of motes){m.p+=m.f;m.x+=m.vx+Math.sin(m.p)*.2;m.y+=m.vy;
   if(m.y<-14){m.y=H+14;m.x=Math.random()*W}if(m.x<-14)m.x=W+14;if(m.x>W+14)m.x=-14;
   ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,6.283);ctx.fillStyle=`rgba(${r},${g},${b},${Math.min(m.a*(.65+.35*Math.sin(m.p*1.8)),.5).toFixed(3)})`;ctx.fill()}
  fxId=requestAnimationFrame(fxTick)};
 let t;addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(size,150)},{passive:true});
 document.addEventListener("visibilitychange",startFx);startFx()})();

/* ---------- parallax ---------- */
let tx=0,ty=0,cx=0,cy=0,pr=0;
function par(){cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;
 for(const c of cards)c.style.translate=`${(cx*c._d).toFixed(2)}px ${(cy*c._d).toFixed(2)}px`;
 pr=Math.abs(tx-cx)+Math.abs(ty-cy)>.02?requestAnimationFrame(par):0}
addEventListener("pointermove",e=>{if(modal||grid)return;tx=(e.clientX/innerWidth*2-1)*12;ty=(e.clientY/innerHeight*2-1)*9;pr||(pr=requestAnimationFrame(par))},{passive:true});

/* ---------- palette ---------- */
const palCache=new Map(),sc=document.createElement("canvas");sc.width=sc.height=36;
const sx=sc.getContext("2d",{willReadFrequently:true});
const hex=a=>"#"+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,"0")).join("");
async function palette(key,img){
 if(palCache.has(key))return palCache.get(key);
 try{let bm;try{bm=await createImageBitmap(img,{resizeWidth:36,resizeHeight:36,resizeQuality:"low"})}catch(_){bm=img}
  sx.clearRect(0,0,36,36);sx.drawImage(bm,0,0,36,36);bm.close?.();const d=sx.getImageData(0,0,36,36).data,bk=new Map();
  let R=0,G=0,B=0,n=0;
  for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];R+=r;G+=g;B+=b;n++;
   const mx=Math.max(r,g,b),mn=Math.min(r,g,b),s=mx?(mx-mn)/mx:0,l=(.299*r+.587*g+.114*b)/255;
   if(l<.08||l>.9)continue;
   const k=`${r/28|0},${g/28|0},${b/28|0}`;let o=bk.get(k);if(!o)bk.set(k,o={r:0,g:0,b:0,c:0,s:0});
   o.r+=r;o.g+=g;o.b+=b;o.c++;o.s+=s}
  const cl=[...bk.values()].map(o=>({rgb:[o.r/o.c,o.g/o.c,o.b/o.c],sc:o.c*(.45+o.s/o.c*1.15)})).sort((a,b)=>b.sc-a.sc);
  const p=cl.length?cl[0].rgb:[R/n,G/n,B/n];
  let s2=null;for(let i=1;i<cl.length;i++){const c=cl[i].rgb;if(Math.abs(c[0]-p[0])+Math.abs(c[1]-p[1])+Math.abs(c[2]-p[2])>75){s2=c;break}}
  if(!s2)s2=p.map(v=>v*.45);
  const res={a:hex(p),b:hex(s2),abyss:hex(p.map(v=>v*.2)),tint:[180+p[0]*.28,180+p[1]*.28,185+p[2]*.28].map(Math.round)};
  palCache.set(key,res);return res}catch(_){return null}}
let front=$("#atmA"),back=$("#atmB"),curA="",fadeT=0;
[["--aura-1","#9b221c"],["--aura-2","#481a16"],["--abyss","#1c0907"]].forEach(([k,v])=>front.style.setProperty(k,v));
function applyAtmosphere(p){if(!p)return;tint=p.tint;
 $("#sw1").style.background=p.a;$("#sw2").style.background=p.b;$("#swHex").textContent=p.a.toUpperCase();
 if(p.a===curA)return;curA=p.a;
 root.setProperty("--aura-1",p.a);root.setProperty("--aura-2",p.b);root.setProperty("--abyss",p.abyss);
 const n=back;n.style.transition="none";n.classList.remove("on");void n.offsetWidth;n.style.transition="";
 n.style.setProperty("--aura-1",p.a);n.style.setProperty("--aura-2",p.b);n.style.setProperty("--abyss",p.abyss);
 n.style.zIndex=-8;front.style.zIndex=-9;n.classList.add("on");
 const old=front;front=n;back=old;clearTimeout(fadeT);fadeT=setTimeout(()=>{if(back!==front)back.classList.remove("on")},1100)}

/* ---------- scatter layout ---------- */
const MP=[{x:.04,w:.46,g:-12,d:.45},{x:.5,w:.46,g:36,d:.7},{x:.12,w:.56,g:24,d:.85},{x:.44,w:.5,g:-16,d:.55},{x:.04,w:.45,g:34,d:.65},{x:.48,w:.48,g:28,d:.5}];
const DP=[{x:.07,w:.3,g:-24,d:.45},{x:.6,w:.32,g:28,d:.75},{x:.24,w:.34,g:-12,d:.9},{x:.48,w:.31,g:-40,d:.6},{x:.07,w:.28,g:24,d:.5},{x:.65,w:.29,g:-30,d:.8}];
let lt=0;const scheduleLayout=()=>{lt||(lt=requestAnimationFrame(()=>{lt=0;layout();moveThumb()}))};
function layout(){
 if(grid||!cards.length)return;
 const W=canvas.clientWidth;if(!W)return;
 const P=W<680?MP:DP,minH=Math.max(300,stage.clientHeight-110);
 cards.forEach((el,i)=>{const p=P[i%P.length],w=Math.round(W*p.w),l=Math.round(W*p.x);
  el._d=p.d;el._l=l;el._w=w;el.style.width=w+"px";el.style.left=l+"px";el.style.zIndex=Math.round(p.d*10)});
 let bottom=0;
 cards.forEach((el,i)=>{const p=P[i%P.length],h=el.offsetHeight||el._w*.68+44;let top=8;
  if(i){const q=cards[i-1],ov=el._l<q._l+q._w+16&&el._l+el._w+16>q._l;
   top=ov?bottom+Math.max(20,p.g+24):Math.max(bottom-h*.42+p.g,q._t+42)}
  el._t=top;el.style.top=Math.round(top)+"px";bottom=Math.max(bottom,top+h)});
 canvas.style.height=Math.max(bottom+56,minH)+"px"}
new ResizeObserver(scheduleLayout).observe(stage);

/* ---------- EXIF ---------- */
const exifCache=new Map();
function parseTiff(v,t){
 const L=v.getUint16(t)===0x4949,g16=o=>v.getUint16(t+o,L),g32=o=>v.getUint32(t+o,L),p={},
 str=(o,n)=>{let s="";for(let i=0;i<n-1&&v.getUint8(t+o+i);i++)s+=String.fromCharCode(v.getUint8(t+o+i));return s.trim()},
 rat=o=>[g32(o),g32(o+4)];
 const ifd=off=>{const n=g16(off);
  for(let i=0;i<n;i++){const e=off+2+i*12,tag=g16(e),c=g32(e+4),vo=g32(e+8);
   if(tag===0x10F)p.make=str(vo,c);else if(tag===0x110)p.model=str(vo,c);else if(tag===0x131)p.software=str(vo,c);
   else if(tag===0x9003||tag===0x132)p.date=p.date||str(vo,c);else if(tag===0x8769)ifd(vo);
   else if(tag===0x829A){const[a,b]=rat(vo);if(a&&b)p.shutter=a<b?`1/${Math.round(b/a)}s`:`${(a/b).toFixed(1)}s`}
   else if(tag===0x829D){const[a,b]=rat(vo);if(a&&b)p.aperture="f/"+(a/b).toFixed(1).replace(/\.0$/,"")}
   else if(tag===0x8827)p.iso="ISO "+g16(e+8);
   else if(tag===0x920A){const[a,b]=rat(vo);if(a&&b)p.focal=(a/b).toFixed(2).replace(/\.00$/,"")+" mm"}}};
 ifd(g32(4));return p}
async function readExif(src){
 if(exifCache.has(src))return exifCache.get(src);
 let out=null;
 try{let r=await fetch(src,{headers:{Range:"bytes=0-65535"}});const v=new DataView(await r.arrayBuffer());
  if(v.getUint16(0)===0xFFD8){let o=2;
   while(o<v.byteLength-4){const m=v.getUint16(o),len=v.getUint16(o+2);
    if(m===0xFFE1&&v.getUint32(o+4)===0x45786966){out=parseTiff(v,o+10);break}
    if((m&0xFF00)!==0xFF00)break;o+=2+len}}}catch(_){}
 exifCache.set(src,out);return out}
async function fillExif(it,img){
 const m=it.exif||{},a=m.camera?null:await readExif(it.src)||{};
 const T=(id,v)=>$(id).textContent=v||"—";
 T("#xCam",m.camera||`${a.make||""} ${a.model||""}`.trim());
 T("#xDate",m.captured||(a.date||"").replace(/^(\d{4}):(\d{2}):(\d{2})\s+(\d{2}:\d{2}).*$/,"$3/$2/$1 · $4"));
 T("#xAp",m.aperture||a?.aperture);T("#xSh",m.shutter||a?.shutter);T("#xFo",m.focal||a?.focal);T("#xIso",m.iso||a?.iso);
 T("#xApp",m.app||a?.software);T("#xFile",it.file);
 const targetImg=(lbImg.naturalWidth?lbImg:img);
 T("#xRes",m.resolution||(targetImg&&targetImg.naturalWidth?`${targetImg.naturalWidth} × ${targetImg.naturalHeight} (${(targetImg.naturalWidth*targetImg.naturalHeight/1e6).toFixed(1)} MP)`:""))}

/* ---------- lightbox ---------- */
function openLb(){modal=true;topBar.inert=true;stage.inert=true;body.classList.add("modal-active");lb.classList.add("open");$("#lbX").focus({preventScroll:true})}
function closeLb(){if(!modal)return;modal=false;topBar.inert=false;stage.inert=false;body.classList.remove("modal-active");lb.classList.remove("open");
 setTimeout(()=>{if(!modal){flip.classList.remove("on");$("#fbtnT").textContent="Camera info"}},380);startFx()}
const decoded=new Map();
function predecode(src){let im=decoded.get(src);
 if(!im){im=new Image();im.decoding="async";im.src=src;decoded.set(src,im);if(decoded.size>8)decoded.delete(decoded.keys().next().value)}
 return Promise.race([im.decode?im.decode().catch(()=>{}):0,new Promise(r=>setTimeout(r,900))])}
let selTok=0;
async function select(i,open){
 if(!entries.length)return;cur=(i+entries.length)%entries.length;const it=entries[cur],img=cards[cur]?.querySelector("img"),tok=++selTok;
 if(open){await predecode(it.src);if(tok!==selTok)return;
  flip.classList.remove("on");$("#fbtnT").textContent="Camera info";lbImg.src=it.src;$("#cap").textContent=it.caption;fillExif(it,img);if(!modal)openLb()}
 if(img&&img.complete&&img.naturalWidth){const p=await palette(it.thumb,img);if(tok===selTok)applyAtmosphere(p)}}
function toggleFlip(){const on=flip.classList.toggle("on");$("#fbtnT").textContent=on?"View photo":"Camera info";navigator.vibrate?.(10)}
$("#fbtn").onclick=e=>{e.stopPropagation();toggleFlip()};
$("#scene").onclick=toggleFlip;
$("#scene").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggleFlip()}};
$("#lbX").onclick=e=>{e.stopPropagation();closeLb()};
$("#lbP").onclick=e=>{e.stopPropagation();select(cur-1,true)};
$("#lbN").onclick=e=>{e.stopPropagation();select(cur+1,true)};
lb.onclick=e=>{if(e.target===lb||e.target.classList.contains("lb-in"))closeLb()};
let sX=0,sY=0;
lb.addEventListener("touchstart",e=>{sX=e.touches[0].clientX;sY=e.touches[0].clientY},{passive:true});
lb.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-sX,dy=t.clientY-sY;if(Math.abs(dx)>60&&Math.abs(dy)<50)select(cur+(dx<0?1:-1),true)},{passive:true});
addEventListener("keydown",e=>{if(!modal)return;if(e.key==="Escape")closeLb();else if(e.key==="ArrowLeft")select(cur-1,true);else if(e.key==="ArrowRight")select(cur+1,true)});

/* ---------- gallery ---------- */
function addCard(it,i){
 const el=document.createElement("button");el.type="button";el.className="card glass in";el.style.setProperty("--d",Math.min(i*70,420)+"ms");
 el.setAttribute("aria-label","Inspect "+it.caption);
 el.innerHTML=`<div class="frame"><img alt="${esc(it.caption)}" decoding="async" draggable="false"></div><div class="meta"><div class="tw"><div class="ttl">${esc(it.caption)}</div><div class="sub">${esc(it.sub||"Stillness")}</div></div>${it.tag?`<span class="tag glass">${esc(it.tag)}</span>`:""}</div>`;
 const frame=el.querySelector(".frame"),img=el.querySelector("img");
 img.fetchPriority=i<4?"high":"low";
 img.loading=i<4?"eager":"lazy";
 img.onload=async()=>{frame.classList.add("loaded");scheduleLayout();
  const p=await palette(it.thumb,img);if(p){el.style.setProperty("--item-aura",p.a);if(entries[cur]===it)applyAtmosphere(p)}};
 img.onerror=()=>{if(img.src!==new URL(it.src,location.href).href){img.src=it.src;return}
  if(it.auto){const k=entries.indexOf(it);if(k>-1){entries.splice(k,1);cards.splice(k,1)}el.remove();updateCount();scheduleLayout();return}
  frame.classList.add("loaded");scheduleLayout()};
 img.src=it.thumb;
 el.onclick=()=>{if(!modal)select(entries.indexOf(it),true)};
 canvas.append(el);cards.push(el)}
function updateCount(){$("#count").textContent=`${entries.length} frame${entries.length==1?"":"s"}`;canvas.toggleAttribute("data-empty",!entries.length)}
entries.forEach(addCard);updateCount();scheduleLayout();

/* ---------- discovery: Stale-While-Revalidate (0ms cache render + background sync) ---------- */
const DK="gallery_dir_v3",DTTL=15*60*1000;
function repoInfo(){
 if(G.repo){const[o,r]=G.repo.split("/");return{o,r}}
 const h=location.hostname,seg=location.pathname.split("/")[1];
 return h.endsWith(".github.io")?{o:h.split(".")[0],r:seg&&!/\./.test(seg)?seg:h}:null}
function addExtra(files){
 const have=new Set(entries.map(p=>p.file));
 files.filter(f=>!have.has(f)).forEach(f=>{const e=toEntry({file:f,auto:true},entries.length);entries.push(e);addCard(e,entries.length-1)});
 updateCount();scheduleLayout()}
async function discover(){
 if(G.discover===false)return;const r=repoInfo();if(!r)return;
 let cached=null;
 try{cached=JSON.parse(localStorage.getItem(DK)||"null")}catch(_){}
 if(cached?.files?.length){addExtra(cached.files);if(Date.now()-cached.t<DTTL)return}
 try{const res=await fetch(`https://api.github.com/repos/${r.o}/${r.r}/contents/${FOLDER}`);if(!res.ok)return;
  const files=(await res.json()).filter(f=>f.type==="file"&&IMG_OK.test(f.name)).map(f=>f.name).sort();
  try{localStorage.setItem(DK,JSON.stringify({t:Date.now(),files}))}catch(_){}
  addExtra(files)}catch(_){}}
discover();
requestAnimationFrame(()=>{moveThumb();requestAnimationFrame(()=>thumb.classList.add("ready"))});
</script>
