<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="description" content="ustzyix — A black-space visual archive for image, motion, interactive, and audio work."/>
<meta name="theme-color" content="#000000"/>
<title>ustzyix — Visual Studio</title>
<link rel="preload" href="data/projects.js" as="script"/>
<link rel="preconnect" href="https://api.github.com" crossorigin/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"/>
<style>
:root{
 --bg:#000;--fg:#f5f5f5;--fg2:rgba(245,245,245,.62);--fg3:rgba(245,245,245,.38);
 --surface:#08080a;--surface-2:#111114;--line:rgba(255,255,255,.16);
 --ease:cubic-bezier(.22,1,.36,1);
 --serif:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
 --sans:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Inter","SF Pro Text",sans-serif;
 --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;width:100%;height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
header,.card,.lb,.pm,.pl-deck,.ix-bar{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid rgba(255,255,255,.7);outline-offset:3px}

/* ---------- header ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:25;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;
 padding:max(18px,env(safe-area-inset-top)) max(22px,env(safe-area-inset-right)) 12px max(22px,env(safe-area-inset-left))}
header>*{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0;border:0;border-radius:999px;background:transparent}
.brand-btn{cursor:pointer;transition:transform .25s var(--ease),background .25s var(--ease)}
.brand-btn:active{transform:translateZ(0) scale(.95)}
@media(hover:hover){.brand-btn:hover{opacity:.72}}
.mark{flex-shrink:0;width:12px;height:12px;border-radius:50%;background:#f5f5f5}
.brand{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.01em}
.chev{width:13px;height:13px;fill:none;stroke:var(--fg2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s var(--ease)}
.brand-btn[aria-expanded=true] .chev{transform:rotate(180deg)}
.count{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:var(--fg2);padding-left:12px;margin-left:4px;border-left:1px solid rgba(255,255,255,.18);white-space:nowrap}
.dot{flex-shrink:0;width:5px;height:5px;border-radius:50%;background:#4ade80;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45;transform:scale(.85)}}
.tools{display:flex;align-items:center;gap:8px}
.ibtn{position:relative;display:grid;place-items:center;width:38px;height:38px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:transparent;cursor:pointer;transition:transform .25s var(--ease)}
.ibtn:active{transform:translateZ(0) scale(.92)}
.ibtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn .i-s,.ibtn .i-g{position:absolute;transition:opacity .3s var(--ease),transform .38s var(--ease)}
[data-layout=grid] .i-g,[data-layout=scatter] .i-s{opacity:0;transform:scale(.6) rotate(-25deg);pointer-events:none}
[data-layout=grid] .i-s,[data-layout=scatter] .i-g{opacity:1;transform:scale(1) rotate(0deg)}
[data-mode=interactive] #layoutBtn,[data-mode=playlist] #layoutBtn{display:none}
@media(max-width:640px){.count{display:none}.brand{font-size:18px}}

/* Mobile zoom-stable UI: keep the visual system proportional to the viewport. */
.mobile-layout header{position:relative;isolation:isolate;gap:8px;padding:max(2vw,env(safe-area-inset-top)) 2.4vw 1.3vw}
.mobile-layout header::before{content:"";position:absolute;inset:-22px 0 -28px;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.78),rgba(0,0,0,.34) 58%,transparent 100%);-webkit-backdrop-filter:blur(20px) saturate(.72);backdrop-filter:blur(20px) saturate(.72);-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 22%,rgba(0,0,0,.82) 50%,rgba(0,0,0,.28) 78%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,#000 22%,rgba(0,0,0,.82) 50%,rgba(0,0,0,.28) 78%,transparent 100%);-webkit-mask-size:100% 100%;mask-size:100% 100%}
.mobile-layout header>*{position:relative;z-index:1}
.mobile-layout .pill{gap:8px;height:29px}
.mobile-layout .mark{width:12px;height:12px}
.mobile-layout .brand{font-size:20px}
.mobile-layout .chev{width:13px;height:13px}
.mobile-layout .count{display:inline-flex;gap:6px;font-size:10px;padding-left:12px;margin-left:4px}
.mobile-layout .dot{width:5px;height:5px}
.mobile-layout .tools{gap:8px}
.mobile-layout .ibtn{width:29px;height:29px;min-width:29px;min-height:29px}
.mobile-layout .ibtn svg{width:13px;height:13px}

/* ---------- project switcher window ---------- */
.pm{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0);visibility:hidden;pointer-events:none;transition:background .2s var(--ease),visibility 0s linear .2s}
.pm.open{background:rgba(0,0,0,.86);visibility:visible;pointer-events:auto;transition:background .2s var(--ease),visibility 0s}
.pm-box{width:100%;max-width:460px;max-height:min(78dvh,560px);display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.18);border-radius:28px;background:linear-gradient(180deg,#111114 0%,#08080a 100%);box-shadow:0 28px 80px rgba(0,0,0,.52),0 0 0 1px rgba(255,255,255,.035) inset;
 opacity:0;will-change:transform,opacity;transform:translate3d(0,10px,0) scale(.96);
 transition:transform .2s var(--ease),opacity .2s var(--ease)}
.pm.open .pm-box{opacity:1;transform:translate3d(0,0,0) scale(1)}
.pm-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 24px 18px;border-bottom:1px solid rgba(255,255,255,.12)}
.pm-t{font-family:var(--sans);font-size:19px;font-weight:600;letter-spacing:.01em;line-height:1.2}
.pm-x{display:grid;place-items:center;width:38px;height:38px;border:1px solid rgba(255,255,255,.24);border-radius:50%;background:#0b0b0d;
 cursor:pointer;transition:transform .2s var(--ease),background .2s var(--ease)}
.pm-x:active{transform:scale(.9)}
.pm-x svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.pm-list{display:flex;flex-direction:column;gap:12px;padding:18px 18px 22px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.pm-list::-webkit-scrollbar{display:none}
.pitem{display:flex;align-items:center;gap:16px;width:100%;padding:12px;border:1px solid rgba(255,255,255,.14);border-radius:20px;text-align:left;cursor:pointer;
 background:#0d0d10;transition:transform .25s var(--ease),background .25s var(--ease),border-color .25s var(--ease)}
.pitem:active{transform:scale(.98)}
@media(hover:hover){.pitem:hover{background:#151519;border-color:rgba(255,255,255,.28)}}
.pitem.active{background:#121217;border-color:rgba(255,255,255,.42);box-shadow:0 10px 26px rgba(0,0,0,.22)}
.pthumb{flex-shrink:0;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;
 background:#08080a;border:1px solid rgba(255,255,255,.22)}
.pcode{font-family:var(--mono);font-size:13.5px;font-weight:500;letter-spacing:.18em;padding-left:.18em;color:var(--fg)}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ptitle{font-family:var(--sans);font-size:17px;font-weight:600;letter-spacing:.01em;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{font-family:var(--sans);font-size:13px;letter-spacing:.02em;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbadge{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1px solid rgba(255,255,255,.2);border-radius:999px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);background:transparent}
.pitem.active .pbadge{color:var(--fg);border-color:rgba(255,255,255,.42)}

/* ---------- stage & keep-alive views ---------- */
main{position:fixed;inset:0;z-index:2;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
main::-webkit-scrollbar{display:none}
.canvas{position:relative;width:calc(100% - 44px);max-width:1360px;margin:124px auto 0;min-height:calc(100dvh - 158px)}
.mobile-layout .canvas{width:92vw;max-width:none;margin-top:clamp(136px,18vw,176px);min-height:calc(100dvh - 14vw)}
.proj-view{position:relative;width:100%;min-height:inherit}
.proj-view[hidden]{display:none!important}
[data-mode=gallery][data-layout=grid] .canvas{min-height:0;margin-top:124px;padding-bottom:48px;height:auto!important}
[data-mode=gallery][data-layout=grid] .proj-view{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));align-content:start;align-items:start;min-height:0;gap:22px;height:auto!important}
[data-mode=gallery][data-layout=grid] .card{position:relative!important;left:auto!important;top:auto!important;width:auto!important;translate:none!important}
.canvas[data-empty]::after{content:attr(data-empty-msg);position:absolute;left:0;right:0;top:48px;text-align:center;font-size:13px;color:var(--fg2)}

/* ---------- gallery cards ---------- */
.card{position:absolute;display:flex;flex-direction:column;gap:9px;padding:0;border:0;border-radius:0;background:transparent;text-align:left;cursor:pointer;opacity:0;touch-action:manipulation;filter:blur(var(--scroll-blur,0px));
 contain:layout style paint;content-visibility:auto;contain-intrinsic-size:280px 320px;
 transition:transform .45s var(--ease),top .5s var(--ease),filter .28s var(--ease)}
.card.in{opacity:1;animation:rise .55s var(--ease) var(--d,0ms) backwards}
.card.settled{opacity:1;animation:none}
.card.flipping{will-change:transform;transition:none}
@keyframes rise{from{opacity:0;transform:translate3d(0,14px,0) scale(.975)}}
.card:active{transform:scale(.975)}
@media(hover:hover){.card:hover{z-index:15!important;transform:translateY(-6px)}.card:hover img,.card:hover video{transform:scale(1.025)}}
.frame{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:16px;background:#111;border:1px solid rgba(255,255,255,.12)}
.mobile-layout .card{gap:var(--card-gap,clamp(8px,1.2vw,12px))}
.mobile-layout .frame{border-radius:var(--frame-radius,16px)}
.mobile-layout .meta{gap:var(--card-meta-gap,clamp(5px,1vw,8px));padding-bottom:var(--card-meta-bottom,clamp(4px,1vw,8px))}
.mobile-layout .ttl{font-size:var(--card-title-size,clamp(14px,2.2vw,20px))}
.mobile-layout .sub,.mobile-layout[data-mode=gallery]:not([data-layout=grid]) .tag{font-size:var(--card-sub-size,clamp(10px,1.45vw,14px))}
.mobile-layout[data-mode=gallery]:not([data-layout=grid]) .tag{display:inline}
.frame.loaded{aspect-ratio:auto}
.frame img,.frame video{display:block;width:100%;height:auto;opacity:0;transition:opacity .4s var(--ease),transform .7s var(--ease);pointer-events:none}
.frame.loaded img,.frame.loaded video{opacity:1}
.vbadge{position:absolute;top:10px;right:10px;z-index:2;display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border:1px solid rgba(255,255,255,.24);border-radius:999px;font-size:9.5px;font-family:var(--mono);letter-spacing:.06em;background:#08080a;color:var(--fg)}
.meta{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:0 1px 4px}
.tw{min-width:0;display:flex;flex-direction:column;gap:2px}
.ttl{font-family:var(--sans);font-size:clamp(13px,1.25vw,18px);font-weight:500;letter-spacing:.01em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-family:var(--mono);font-size:clamp(10px,.9vw,14px);letter-spacing:.03em;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{flex-shrink:0;padding:0;font-family:var(--mono);font-size:clamp(10px,.9vw,14px);letter-spacing:.03em;color:var(--fg2);text-align:right}
@media(max-width:680px){body[data-mode=gallery]:not([data-layout=grid]) .tag{display:none}}

/* ---------- interactive & playlist stages ---------- */
.ix-wrap{display:flex;flex-direction:column;gap:12px;max-width:900px;margin:10px auto 36px;padding:12px;border:1px solid var(--line);border-radius:24px;background:var(--surface);animation:rise .55s var(--ease) backwards}
.ix-frame{position:relative;width:100%;height:min(68dvh,600px);border:1px solid rgba(255,255,255,.14);border-radius:18px;overflow:hidden;background:#08080c}
.ix-frame iframe{display:block;width:100%;height:100%;border:0;image-rendering:pixelated}
.ix-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 6px}
.ix-info{min-width:0;display:flex;flex-direction:column;gap:2px}
.ix-info .ttl{font-family:var(--sans);font-size:14.5px;font-weight:600;letter-spacing:.01em}
.ix-ctl{font-size:10.5px;font-family:var(--mono);letter-spacing:.04em;color:var(--fg2)}
.ix-fs{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border:1px solid rgba(255,255,255,.22);border-radius:999px;font-size:11.5px;font-weight:500;cursor:pointer;background:transparent;transition:transform .2s var(--ease)}
.ix-fs svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ix-wrap.fs-fallback{position:fixed;inset:0;z-index:45;max-width:none;margin:0;border-radius:0;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.ix-wrap.fs-fallback .ix-frame{height:calc(100% - 52px)}
.pl-wrap{display:flex;flex-direction:column;gap:18px;max-width:760px;margin:10px auto 48px;animation:rise .55s var(--ease) backwards}
.pl-deck{display:flex;flex-direction:column;gap:16px;padding:18px;border:1px solid var(--line);border-radius:24px;background:var(--surface)}
.pl-top{display:flex;align-items:center;gap:16px}
.pl-art{flex-shrink:0;width:84px;height:84px;border:1px solid rgba(255,255,255,.2);border-radius:18px;overflow:hidden;display:grid;place-items:center;background:#111114}
.pl-art img{width:100%;height:100%;object-fit:cover}
.pl-art svg{width:28px;height:28px;fill:none;stroke:var(--fg);stroke-width:1.6}
.pl-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pl-now{font-size:10px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg3)}
.pl-title{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.02em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-artist{font-size:12px;letter-spacing:.03em;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-prog{display:flex;flex-direction:column;gap:6px}
.pl-bar{width:100%;height:6px;border-radius:999px;background:rgba(255,255,255,.12);cursor:pointer;overflow:hidden}
.pl-fill{height:100%;width:0%;border-radius:999px;background:var(--fg);transition:width .1s linear}
.pl-times{display:flex;justify-content:space-between;font-size:10.5px;font-family:var(--mono);color:var(--fg3)}
.pl-btns{display:flex;align-items:center;justify-content:center;gap:14px}
.pl-cbtn{display:grid;place-items:center;width:40px;height:40px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:transparent;cursor:pointer}
.pl-cbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pl-play{width:50px;height:50px;background:var(--fg);color:#000}
.pl-play svg{width:20px;height:20px;fill:currentColor;stroke:none}
.pl-tracks{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border:1px solid rgba(255,255,255,.12);border-radius:18px;text-align:left;cursor:pointer;background:var(--surface-2)}
.trow.on{border-color:rgba(255,255,255,.4);background:#151519}
.tnum{width:22px;font-size:11px;font-family:var(--mono);color:var(--fg3);text-align:center}
.tinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tttl{font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tart{font-size:11px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdur{font-size:11px;font-family:var(--mono);color:var(--fg3)}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(72px,10vh,128px) 20px 32px;background:rgba(0,0,0,.94);opacity:0;visibility:hidden;transition:opacity .32s var(--ease),visibility 0s linear .32s}
.lb.open{opacity:1;visibility:visible;transition:opacity .32s var(--ease)}
body.modal-active header,body.modal-active main{pointer-events:none}
.lb .ibtn,.lb .fbtn{background:#0b0b0d;border-color:rgba(255,255,255,.24)}
.lb .ibtn{position:absolute;z-index:5}
.lb-x{top:max(18px,env(safe-area-inset-top));right:max(18px,env(safe-area-inset-right))}
.lb-in{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:clamp(28px,4vh,64px);max-width:92vw;pointer-events:none}
.scene,.lb-ctl{pointer-events:auto}
.scene{perspective:1500px;display:grid;place-items:center;cursor:pointer;transform:scale(.93) translateY(12px);transition:transform .45s var(--ease);touch-action:manipulation}
.lb.open .scene{transform:none}
.flip{display:grid;place-items:center;transform-style:preserve-3d;transition:transform .65s var(--ease)}
.flip.on{transform:rotateY(180deg)}
.front,.back{grid-area:1/1;border:1px solid rgba(255,255,255,.2);border-radius:var(--lb-radius,24px);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{padding:var(--lb-frame-gap,6px);background:var(--surface)}
.front img,.front video{display:block;max-width:min(88vw,760px);max-height:56dvh;width:auto;height:auto;border-radius:var(--lb-media-radius,20px)}
.lb.lb-horizontal .front img,.lb.lb-horizontal .front video{max-width:min(94vw,1100px);max-height:68dvh}
.back{width:100%;height:100%;min-width:min(88vw,390px);min-height:290px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;transform:rotateY(180deg);background:var(--surface)}
.ex-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.ex-cam{font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:.01em}
.ex-date{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--fg2)}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{display:flex;flex-direction:column;gap:4px;padding:10px 4px;border:1px solid rgba(255,255,255,.1);border-radius:16px;text-align:center;background:var(--surface-2)}
.mv{font-family:var(--mono);font-size:11.5px;font-weight:500}
.ml{font-family:var(--sans);font-size:10px;letter-spacing:.04em;color:var(--fg3)}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rk{font-family:var(--sans);font-size:11px;letter-spacing:.03em;color:var(--fg3)}
.rv{font-family:var(--mono);font-size:11px;text-align:right}
.cap{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.04em}
.fbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 18px;border:1px solid rgba(255,255,255,.24);border-radius:999px;font-size:12px;font-weight:500;letter-spacing:.03em;cursor:pointer;background:#0b0b0d;transition:transform .25s var(--ease)}
.fbtn:active{transform:translateZ(0) scale(.95)}
.fbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hint{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--fg3);text-align:center}
</style>
</head>
<body data-layout="scatter" data-mode="gallery">

<header id="topBar" role="banner">
  <button class="pill brand-btn" id="projBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Switch project archive">

/* ---------- thumbnail directory & extension resolvers ---------- */

function buildThumbCandidates(file,fDir,tDir,thumbExts,explicitThumb,isVid,allowVidThumb){

function toEntry(p,i,folder,tfolder,thumbExts,allowVidThumb){

/* ---------- auto first-frame video poster cache ---------- */

  const w=160,h=Math.max(1,Math.round(w*(videoEl.videoHeight/videoEl.videoWidth)));

/* ---------- viewport observer: play visible videos & track active video ---------- */

/* ---------- lazy loader & idle prefetcher for individual data/*.js files ---------- */

/* ---------- FLIP layout switch ---------- */
let flipTok=0;
$("#layoutBtn").onclick=()=>{
 if((activeProj.type||"gallery")!=="gallery")return;
 const tok=++flipTok,vh=innerHeight;
 const first=cards.map(c=>c.getBoundingClientRect());

  cards.forEach((c,i)=>{
   const f=first[i],l=last[i];if(!f||!l||!f.width||!l.width)return;
   if((f.bottom<-120&&l.bottom<-120)||(f.top>vh+120&&l.top>vh+120))return;
   const dx=f.left-l.left,dy=f.top-l.top,s=f.width/l.width;
   if(Math.abs(dx)<.5&&Math.abs(dy)<.5&&Math.abs(s-1)<.002)return;

/* ---------- desktop-only mouse parallax ---------- */
let tx=0,ty=0,cx=0,cy=0,pr=0;

 for(const c of cards)c.style.translate=`${(cx*c._d).toFixed(2)}px ${(cy*c._d).toFixed(2)}px`;
 pr=Math.abs(tx-cx)+Math.abs(ty-cy)>.02?requestAnimationFrame(par):0}

/* ---------- scroll depth ---------- */
let depthRaf=0;

 if(modal||pmOpen||grid||(activeProj.type||"gallery")!=="gallery")return;

  const r=c.getBoundingClientRect();

/* ---------- scatter layout ---------- */
const DP=[{x:.07,w:.3,g:-24,d:.45},{x:.6,w:.32,g:28,d:.75},{x:.24,w:.34,g:-12,d:.9},{x:.48,w:.31,g:-40,d:.6},{x:.07,w:.28,g:24,d:.5},{x:.65,w:.29,g:-30,d:.8}];
const MOBILE_DP=[{x:.02,w:.3,g:-24,d:.45},{x:.64,w:.32,g:28,d:.75},{x:.18,w:.34,g:-12,d:.9},{x:.53,w:.31,g:-40,d:.6},{x:.02,w:.28,g:24,d:.5},{x:.68,w:.29,g:-30,d:.8}];

const scheduleLayout=()=>{lt||(lt=requestAnimationFrame(()=>{lt=0;layout(false)}))};
function layout(force){
 if(grid||!cards.length||(activeProj.type||"gallery")!=="gallery")return;

 if(widthChanged)lastLayoutW=W;
 const unit=mobileLayout?W/900:1;
 const P=mobileLayout?MOBILE_DP:DP,minH=mobileLayout?Math.max(300*unit,stage.clientHeight-110*unit):Math.max(300,stage.clientHeight-110);

  if(el._landscape||!el._mediaReady)return 0;
  const frame=el.querySelector(".frame"),media=el.querySelector("img,video");
  const nw=media?.naturalWidth||media?.videoWidth||0,nh=media?.naturalHeight||media?.videoHeight||0;
  const provisionalW=Math.round(W*P[i%P.length].w);
  const h=nw&&nh?provisionalW*(nh/nw):frame?.getBoundingClientRect().height||0;
  return h>0?h:0;

  if(el._landscape&&balanceHeight&&w<balanceHeight){

   w=delta>balanceTolerance?Math.round(balanceHeight):Math.round(w+(balanceHeight-w)*.7);
  }
  const l=Math.min(Math.round(W*p.x),Math.max(0,W-w));
  const sizeChanged=force||widthChanged||!el._sized||el._w!==w;
  el._d=p.d;el._l=l;el._w=w;
  if(mobileLayout){el.style.setProperty("--card-gap","clamp(8px,1.2vw,12px)");el.style.setProperty("--card-meta-gap","clamp(5px,1vw,8px)");el.style.setProperty("--card-meta-bottom","clamp(4px,1vw,8px)");el.style.setProperty("--card-title-size","clamp(14px,2.2vw,20px)");el.style.setProperty("--card-sub-size","clamp(10px,1.45vw,14px)");el.style.setProperty("--frame-radius",`${Math.max(1,Math.round(w*.04*100)/100)}px`)}
  if(sizeChanged){el.style.width=w+"px";el.style.left=l+"px";el.style.zIndex=Math.round(p.d*10);el._hLocked=false;el._sized=true}});

  if(!force&&!widthChanged&&el._hLocked&&el._h)return el._h;

  bottom=Math.max(bottom,top+h)});

}
new ResizeObserver(()=>layout(true)).observe(stage);

/* ---------- EXIF / Media Metadata ---------- */
const exifCache=new Map();
function parseTiff(v,t){
 const L=v.getUint16(t)===0x4949,g16=o=>v.getUint16(t+o,L),g32=o=>v.getUint32(t+o,L),p={},

  for(let i=0;i<n;i++){const e=off+2+i*12,tag=g16(e),c=g32(e+4),vo=g32(e+8);
   if(tag===0x10F)p.make=str(vo,c);else if(tag===0x110)p.model=str(vo,c);else if(tag===0x131)p.software=str(vo,c);
   else if(tag===0x9003||tag===0x132)p.date=p.date||str(vo,c);else if(tag===0x8769)ifd(vo);
   else if(tag===0x829A){const[a,b]=rat(vo);if(a&&b)p.shutter=a<b?`1/${Math.round(b/a)}s`:`${(a/b).toFixed(1)}s`}
   else if(tag===0x829D){const[a,b]=rat(vo);if(a&&b)p.aperture="f/"+(a/b).toFixed(1).replace(/\.0$/,"")}
   else if(tag===0x8827)p.iso="ISO "+g16(e+8);
   else if(tag===0x920A){const[a,b]=rat(vo);if(a&&b)p.focal=(a/b).toFixed(2).replace(/\.00$/,"")+" mm"}}};

async function readExif(src){
 if(exifCache.has(src))return exifCache.get(src);
 let out=null;
 try{let r=await fetch(src,{headers:{Range:"bytes=0-65535"}});const v=new DataView(await r.arrayBuffer());
  if(v.getUint16(0)===0xFFD8){let o=2;
   while(o<v.byteLength-4){const m=v.getUint16(o),len=v.getUint16(o+2);
    if(m===0xFFE1&&v.getUint32(o+4)===0x45786966){out=parseTiff(v,o+10);break}
    if((m&0xFF00)!==0xFF00)break;o+=2+len}}}catch(_){}

async function fillExif(it,mediaEl){
 const T=(id,v)=>$(id).textContent=v||"—";
 if(it.isVid){
  $("#mL1").textContent="Duration";$("#mL2").textContent="Format";$("#mL3").textContent="Ratio";$("#mL4").textContent="Audio";
  const ext=(it.file.split(".").pop()||"MP4").toUpperCase();
  const vw=lbVid.videoWidth||mediaEl?.videoWidth||0,vh=lbVid.videoHeight||mediaEl?.videoHeight||0;
  const dur=lbVid.duration||mediaEl?.duration||0;
  T("#xCam",it.sub||"Motion Sequence");T("#xDate",activeProj.year||"Video");
  T("#xAp",dur?fmtTime(dur):"Loop");T("#xSh",ext);
  T("#xFo",vw&&vh?`${(vw/vh).toFixed(2)}:1`:"—");T("#xIso","Stereo");
  T("#xApp",it.app||"—");T("#xFile",it.file);
  T("#xRes",vw&&vh?`${vw} × ${vh}`:"—");
  return;
 }
 $("#mL1").textContent="Aperture";$("#mL2").textContent="Shutter";$("#mL3").textContent="Focal";$("#mL4").textContent="ISO";
 const m=it.exif||{},full=m.camera&&m.captured&&m.aperture&&m.shutter&&m.focal&&m.iso;
 const a=full?{}:(await readExif(it.src))||{};
 T("#xCam",m.camera||`${a.make||""} ${a.model||""}`.trim());
 T("#xDate",m.captured||(a.date||"").replace(/^(\d{4}):(\d{2}):(\d{2})\s+(\d{2}:\d{2}).*$/,"$3/$2/$1 · $4"));
 T("#xAp",m.aperture||a.aperture);T("#xSh",m.shutter||a.shutter);T("#xFo",m.focal||a.focal);T("#xIso",m.iso||a.iso);
 T("#xApp",m.app||it.app||a.software);T("#xFile",it.file);

 const w=fullReady?lbImg.naturalWidth:(fallbackOnly?mediaEl.naturalWidth:0);
 const h=fullReady?lbImg.naturalHeight:(fallbackOnly?mediaEl.naturalHeight:0);
 T("#xRes",m.resolution||(w&&h?`${w} × ${h} (${(w*h/1e6).toFixed(1)} MP)`:"Loading…"));
}

/* ---------- lightbox (Progressive Thumbnail -> Full-Res) ---------- */
function openLb(){modal=true;topBar.inert=true;stage.inert=true;syncCardVideos(true);body.classList.add("modal-active");lb.classList.add("open");syncLightboxShape();$("#lbX").focus({preventScroll:true})}
function closeLb(){
 if(!modal)return;modal=false;topBar.inert=false;stage.inert=false;body.classList.remove("modal-active");lb.classList.remove("open");
 lbVid.pause();
 setTimeout(()=>{if(!modal){flip.classList.remove("on");$("#fbtnT").textContent="Media info";lbVid.removeAttribute("src");lbVid.load();syncCardVideos(false)}},340);
}
function syncLightboxShape(){
 const media=lbImg.style.display!=="none"?lbImg:lbVid;
 const rect=media.getBoundingClientRect(),w=rect.width||Math.min(innerWidth*.88,760);
 const nw=media.naturalWidth||media.videoWidth||0,nh=media.naturalHeight||media.videoHeight||0;
 lb.classList.toggle("lb-horizontal",!!(nw&&nh&&nw/nh>1.25));
 const radius=Math.max(1,Math.round(w*.035*100)/100);
 const gap=Math.max(1,Math.round(w*.008*100)/100);
 lb.style.setProperty("--lb-radius",`${radius}px`);
 lb.style.setProperty("--lb-media-radius",`${Math.max(1,radius-4)}px`);
 lb.style.setProperty("--lb-frame-gap",`${gap}px`);
}
const decoded=new Map();
function predecode(src){
 let rec=decoded.get(src);
 if(!rec){
  const im=new Image();im.decoding="async";im.src=src;
  const prom=(im.decode?im.decode().then(()=>im.naturalWidth>0):new Promise(r=>{im.onload=()=>r(im.naturalWidth>0);im.onerror=()=>r(false)})).catch(()=>false);
  rec={im,prom};
  decoded.set(src,rec);
  if(decoded.size>4)decoded.delete(decoded.keys().next().value);
 }
 return rec.prom;
}
let selTok=0;
async function select(i,open){
 if(!entries.length)return;
 cur=(i+entries.length)%entries.length;
 const it=entries[cur],mediaEl=cards[cur]?.querySelector("img,video"),tok=++selTok;
 if(!open)return;

 const activeThumb=it.resolvedThumb||it.thumb;
 flip.classList.remove("on");
 $("#fbtnT").textContent="Media info";
 $("#cap").textContent=it.caption;

 if(it.isVid){
  lbImg.style.display="none";lbImg.dataset.fullSrc="";
  lbVid.style.display="block";
  lbVid.crossOrigin="anonymous";
  const posterUrl=it.poster||vidPosterCache.get(it.src)||"";
  if(posterUrl)lbVid.poster=posterUrl;else lbVid.removeAttribute("poster");
  lbVid.src=it.src;
  lbVid.onloadedmetadata=()=>{fillExif(it,mediaEl);syncLightboxShape()};
  lbVid.onerror=()=>{if(lbVid.hasAttribute("crossorigin")){lbVid.removeAttribute("crossorigin");lbVid.load()}};
  lbVid.play().catch(()=>{});
  fillExif(it,mediaEl);
  if(!modal)openLb();else syncLightboxShape();
  return;
 }

 lbVid.pause();lbVid.style.display="none";
 lbImg.style.display="block";
 lbImg.dataset.fullSrc="";

 const hasDistinctThumb=activeThumb&&activeThumb!==it.src;
 if(hasDistinctThumb){
  // Open immediately with cached thumbnail, then upgrade to full-res once decoded
  lbImg.src=activeThumb;
  lbImg.onload=syncLightboxShape;
  fillExif(it,mediaEl);
  if(!modal)openLb();
  const ok=await predecode(it.src);
  if(tok!==selTok||!modal)return;
  if(ok){
   lbImg.src=it.src;
   lbImg.dataset.fullSrc=it.src;
   syncLightboxShape();
   fillExif(it,lbImg);
  }
 }else{
  await Promise.race([predecode(it.src),new Promise(r=>setTimeout(r,450))]);
  if(tok!==selTok)return;
  lbImg.src=it.src;
  lbImg.onload=()=>{if(tok===selTok){lbImg.dataset.fullSrc=it.src;syncLightboxShape();fillExif(it,lbImg)}};
  if(lbImg.complete&&lbImg.naturalWidth>0)lbImg.dataset.fullSrc=it.src;
  fillExif(it,mediaEl);
  if(!modal)openLb();else syncLightboxShape();
 }
}
function toggleFlip(){const on=flip.classList.toggle("on");if(on&&!lbVid.paused)lbVid.pause();$("#fbtnT").textContent=on?"View media":"Media info";navigator.vibrate?.(10)}
$("#fbtn").onclick=e=>{e.stopPropagation();toggleFlip()};
$("#scene").onclick=e=>{if(e.target===lbVid)return;toggleFlip()};
$("#scene").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggleFlip()}};

lb.onclick=e=>{if(e.target===lb||e.target.classList.contains("lb-in"))closeLb()};

window.visualViewport?.addEventListener("resize",()=>{if(modal)syncLightboxShape()},{passive:true});

/* ---------- mode 1: gallery ---------- */
function addCard(it,i,tok=loadTok,targetContainer=activeViewEl||canvas){
 const el=document.createElement("button");el.type="button";el.className="card in";el.style.setProperty("--d",Math.min(i*55,330)+"ms");
 el.setAttribute("aria-label","Inspect "+it.caption);
 el.addEventListener("animationend",()=>el.classList.add("settled"),{once:true});
 const initPoster=it.poster||vidPosterCache.get(it.src)||"";
 const mediaHtml=it.isVid
  ?`<video data-src="${esc(it.src)}" ${initPoster?`poster="${esc(initPoster)}"`:""} crossorigin="anonymous" muted loop playsinline preload="none"></video><span class="vbadge">▶ VIDEO</span>`
  :`<img alt="${esc(it.caption)}" decoding="async" draggable="false">`;
 el.innerHTML=`<div class="frame">${mediaHtml}</div><div class="meta"><div class="tw"><div class="ttl">${esc(it.caption)}</div><div class="sub">${esc(it.sub||"Stillness")}</div></div>${it.tag?`<span class="tag">${esc(it.tag)}</span>`:""}</div>`;
 const frame=el.querySelector(".frame"),mediaEl=el.querySelector("img,video");
 const onReady=()=>{
  el._mediaReady=true;
  const w=mediaEl.naturalWidth||mediaEl.videoWidth,h=mediaEl.naturalHeight||mediaEl.videoHeight;
  if(w&&h){frame.style.aspectRatio=`${w}/${h}`;el._landscape=w/h>1.25}
  frame.classList.add("loaded");
  if(tok===loadTok)scheduleLayout();
  if(it.isVid){
   const captured=captureVideoPoster(mediaEl,it.src);
   if(captured&&!mediaEl.getAttribute("poster"))mediaEl.poster=captured;
   return;
  }
 };

 if(it.isVid){
  // Probe optional poster candidates from thumbFolder for videos if configured
  if(it.thumbCandidates&&it.thumbCandidates.length){
   let pIdx=0;
   const tryVidPoster=()=>{
    if(pIdx>=it.thumbCandidates.length)return;
    const url=it.thumbCandidates[pIdx++];
    const probe=new Image();probe.decoding="async";
    probe.onload=()=>{
     if(tok!==loadTok)return;
     it.poster=url;
     vidPosterCache.set(it.src,url);
     mediaEl.poster=url;
     if(!el._mediaReady&&probe.naturalWidth&&probe.naturalHeight){
      el._mediaReady=true;
      frame.style.aspectRatio=`${probe.naturalWidth}/${probe.naturalHeight}`;
      frame.classList.add("loaded");
      scheduleLayout();
     }
    };
    probe.onerror=tryVidPoster;
    probe.src=url;
   };
   tryVidPoster();
  }
  mediaEl.onloadeddata=onReady;
  mediaEl.onerror=()=>{
   if(mediaEl.hasAttribute("crossorigin")){mediaEl.removeAttribute("crossorigin");mediaEl.load();return}
   el._mediaReady=true;frame.classList.add("loaded");if(tok===loadTok)scheduleLayout();
  };
  vidObs.observe(mediaEl);
 }else{
  const candidates=[...it.thumbCandidates];
  if(!candidates.includes(it.src))candidates.push(it.src);
  let candIdx=0;
  const saveData=!!navigator.connection?.saveData;
  mediaEl.fetchPriority=i<2&&!saveData?"high":"low";
  mediaEl.loading=i<2&&!saveData?"eager":"lazy";
  mediaEl.onload=()=>{
   it.resolvedThumb=candidates[candIdx]||it.src;
   onReady();
  };
  mediaEl.onerror=()=>{
   candIdx++;
   if(candIdx<candidates.length){
    mediaEl.src=candidates[candIdx];
    return;
   }
   if(it.auto){
    const k=entries.indexOf(it);
    if(k>-1){entries.splice(k,1);cards.splice(k,1)}
    el.remove();
    if(tok===loadTok){updateCount();scheduleLayout()}
    return;
   }
   el._mediaReady=true;frame.classList.add("loaded");if(tok===loadTok)scheduleLayout();
  };
  mediaEl.src=candidates[0];
 }
 el.onclick=()=>{if(!modal&&!pmOpen)select(entries.indexOf(it),true)};
 targetContainer.append(el);cards.push(el);
}
function updateCount(msg){
 $("#count").textContent=`${entries.length} item${entries.length==1?"":"s"}`;
 canvas.dataset.emptyMsg=msg||"No items found in this collection yet.";
 canvas.toggleAttribute("data-empty",!entries.length);
}

let activeAudio=null;
function stopAudio(){if(activeAudio){activeAudio.pause();activeAudio.src="";activeAudio=null}}
function mountPlaylist(proj,targetContainer=activeViewEl||canvas){
 const fDir=cleanDir(proj.folder||"audio");
 let tracks=(proj.tracks||[]).map(t=>{if(typeof t==="string")t={file:t};const file=t.file||String(t.src).split("/").pop();return{file,src:t.src||`./${encodePath(fDir)}/${encodePath(file)}`,title:t.title||capOf(file),artist:t.artist||proj.title||"ustzyix",cover:t.cover?(isDirectUrl(t.cover)?t.cover:`./${encodePath(fDir)}/${encodePath(t.cover)}`):""}});
 let idx=0;const aud=new Audio();aud.preload="metadata";activeAudio=aud;

 wrap.innerHTML=`<div class="pl-deck"><div class="pl-top"><div class="pl-art" id="plArt">${TYPE_ICON.playlist}</div><div class="pl-meta"><div class="pl-now">Now Playing</div><div class="pl-title" id="plTitle">—</div><div class="pl-artist" id="plArtist">${esc(proj.sub||"Audio Archive")}</div></div></div><div class="pl-prog"><div class="pl-bar" id="plBar"><div class="pl-fill" id="plFill"></div></div><div class="pl-times"><span id="plCur">0:00</span><span id="plDur">0:00</span></div></div><div class="pl-btns"><button class="pl-cbtn" id="plPrev" type="button"><svg viewBox="0 0 24 24"><path d="M19 20 9 12l10-8v16zM5 19V5"/></svg></button><button class="pl-cbtn pl-play" id="plPlay" type="button"><svg id="plIco" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button><button class="pl-cbtn" id="plNext" type="button"><svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zM19 5v14"/></svg></button></div></div><div class="pl-tracks" id="plList"></div>`;
 targetContainer.append(wrap);
 const listEl=wrap.querySelector("#plList"),artEl=wrap.querySelector("#plArt"),icoEl=wrap.querySelector("#plIco");
 const setPlayIcon=on=>{icoEl.innerHTML=on?`<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>`:`<path d="M8 5v14l11-7z"/>`};
 function loadTrack(i,autoPlay){if(!tracks.length)return;idx=(i+tracks.length)%tracks.length;const tr=tracks[idx];aud.src=tr.src;wrap.querySelector("#plTitle").textContent=tr.title;wrap.querySelector("#plArtist").textContent=tr.artist;wrap.querySelector("#plCur").textContent="0:00";wrap.querySelector("#plDur").textContent="0:00";wrap.querySelector("#plFill").style.width="0%";if(tr.cover){artEl.innerHTML=`<img src="${esc(tr.cover)}" alt=""/>`}else{artEl.innerHTML=TYPE_ICON.playlist}[...listEl.children].forEach((r,k)=>r.classList.toggle("on",k===idx));if(autoPlay)aud.play().then(()=>setPlayIcon(true)).catch(()=>setPlayIcon(false))}
 function renderTracks(){$("#count").textContent=`${tracks.length} track${tracks.length==1?"":"s"}`;canvas.dataset.emptyMsg="No audio tracks found in this folder yet.";canvas.toggleAttribute("data-empty",!tracks.length);listEl.innerHTML="";tracks.forEach((tr,k)=>{const row=document.createElement("button");row.type="button";row.className="trow"+(k===idx?" on":"");row.innerHTML=`<span class="tnum">${pad(k+1)}</span><div class="tinfo"><div class="tttl">${esc(tr.title)}</div><div class="tart">${esc(tr.artist)}</div></div><span class="tdur">▶</span>`;row.onclick=()=>loadTrack(k,true);listEl.append(row)});if(tracks.length&&!aud.src)loadTrack(0,false)}
 wrap.querySelector("#plPlay").onclick=()=>{if(!tracks.length)return;if(aud.paused)aud.play().then(()=>setPlayIcon(true)).catch(()=>{});else{aud.pause();setPlayIcon(false)}};
 wrap.querySelector("#plPrev").onclick=()=>loadTrack(idx-1,true);wrap.querySelector("#plNext").onclick=()=>loadTrack(idx+1,true);
 wrap.querySelector("#plBar").onclick=e=>{if(!aud.duration)return;const r=e.currentTarget.getBoundingClientRect();aud.currentTime=((e.clientX-r.left)/r.width)*aud.duration};
 aud.ontimeupdate=()=>{if(!aud.duration)return;wrap.querySelector("#plFill").style.width=`${(aud.currentTime/aud.duration*100).toFixed(1)}%`;wrap.querySelector("#plCur").textContent=fmtTime(aud.currentTime)};
 aud.onloadedmetadata=()=>{wrap.querySelector("#plDur").textContent=fmtTime(aud.duration)};aud.onended=()=>loadTrack(idx+1,true);
 renderTracks();
 if(proj.discover!==false)scheduleIdle(()=>discoverFiles(fDir,AUD_OK,proj.id,files=>{const have=new Set(tracks.map(x=>x.file));files.filter(f=>!have.has(f)).forEach(f=>tracks.push({file:f,src:`./${encodePath(fDir)}/${encodePath(f)}`,title:capOf(f),artist:proj.title||"ustzyix",cover:""}));renderTracks()}));
}

/* ---------- GitHub folder auto-discovery ---------- */
const DTTL=15*60*1000;
function repoInfo(){
 if(G.repo){const[o,r]=G.repo.split("/");return{o,r}}
 const h=location.hostname,seg=location.pathname.split("/")[1];
 return h.endsWith(".github.io")?{o:h.split(".")[0],r:seg&&!/\./.test(seg)?seg:h}:null}
async function discoverFiles(folder,regex,pid,onFiles){
 const r=repoInfo();if(!r)return;
 const dk=`gallery_dir_v4_${folder}`;
 let cached=null;
 try{cached=JSON.parse(localStorage.getItem(dk)||"null")}catch(_){}
 if(cached?.files?.length){if(activeProj.id===pid)onFiles(cached.files);if(Date.now()-cached.t<DTTL)return}
 try{const res=await fetch(`https://api.github.com/repos/${r.o}/${r.r}/contents/${folder}`);if(!res.ok)return;
  const files=(await res.json()).filter(f=>f.type==="file"&&regex.test(f.name)).map(f=>f.name).sort();
  try{localStorage.setItem(dk,JSON.stringify({t:Date.now(),files}))}catch(_){}
  if(activeProj.id===pid)onFiles(files)}catch(_){}
}

/* ---------- Keep-Alive View Cache & Project Switcher ---------- */
const viewCache=new Map();
const MAX_CACHED_VIEWS=6;

function suspendCurrentView(){
 stopAudio();
 visibleVideos.clear();
 if(activeProj?.id&&viewCache.has(activeProj.id)){
  viewCache.get(activeProj.id).scrollTop=stage.scrollTop||0;
 }
 cards.forEach(c=>{
  const v=c.querySelector("video");
  if(v){
   vidObs.unobserve(v);
   v.pause();
   if(v.getAttribute("src")){
    v.removeAttribute("src");
    v.load();
   }
  }
 });
 if(activeViewEl)activeViewEl.hidden=true;
}

function evictOldestView(){
 if(viewCache.size<MAX_CACHED_VIEWS)return;
 const oldestKey=viewCache.keys().next().value;
 const old=viewCache.get(oldestKey);
 if(old){
  old.cards.forEach(c=>{const v=c.querySelector("video");if(v){vidObs.unobserve(v);v.pause();v.removeAttribute("src");v.load()}});
  old.el.remove();
 }
 viewCache.delete(oldestKey);
}

let loadTok=0;
async function loadProject(baseProj,pushHash){
 suspendCurrentView();
 const tok=++loadTok;
 activeProj=baseProj;selTok++;cur=0;tx=ty=cx=cy=0;
 const mode=baseProj.type||"gallery";
 body.dataset.mode=mode;
 $("#projName").textContent=baseProj.title||"Archive";
 document.title=`ustzyix — ${baseProj.title||"Visual Studio"}`;
 if(pushHash&&baseProj.id)history.replaceState(null,"","#"+encodeURIComponent(baseProj.id));

 if(mode==="gallery"&&baseProj.id&&viewCache.has(baseProj.id)){
  const cached=viewCache.get(baseProj.id);
  viewCache.delete(baseProj.id);
  viewCache.set(baseProj.id,cached);
  activeProj=cached.proj;
  activeViewEl=cached.el;
  entries=cached.entries;
  cards=cached.cards;
  activeViewEl.hidden=false;
  updateCount();
  if(grid){
   cards.forEach(c=>{c.classList.add("settled");c.style.translate="";c.style.zIndex=""});
   canvas.style.height="";
  }else{
   cards.forEach(c=>c.classList.add("settled"));
   layout(false);
  }
  stage.scrollTop=cached.scrollTop||0;
  cards.forEach(c=>{const v=c.querySelector("video");if(v)vidObs.observe(v)});
  return;
 }

 $("#count").textContent="Loading…";
 canvas.style.height="";canvas.removeAttribute("data-empty");
 if(stage.scrollTop)stage.scrollTop=0;
 const viewEl=document.createElement("div");
 viewEl.className="proj-view";
 canvas.append(viewEl);
 activeViewEl=viewEl;
 cards=[];entries=[];

 const{ok,proj}=await fetchProjectDetail(baseProj);
 if(tok!==loadTok){viewEl.remove();return}
 activeProj=proj;
 if(!ok&&proj.data){
  updateCount(`Could not load ${proj.data} — check file syntax.`);
  return;
 }

 if(mode==="interactive"){mountInteractive(proj,viewEl);return}
 if(mode==="playlist"){mountPlaylist(proj,viewEl);return}

 const fDir=cleanDir(proj.folder||"images");
 const tDir=resolveThumbDir(proj,fDir);
 const tExts=resolveThumbExts(proj);
 const allowVidThumb=!!(proj.videoThumbs??G.videoThumbs);

 entries=(proj.photos||[])
  .filter(p=>p&&(typeof p==="string"||p.file||p.src))
  .map((p,i)=>toEntry(p,i,fDir,tDir,tExts,allowVidThumb));
 entries.forEach((e,i)=>addCard(e,i,tok,viewEl));
 updateCount();
 if(!grid)layout(true);

 if(proj.id){
  evictOldestView();
  viewCache.set(proj.id,{el:viewEl,proj,entries,cards,scrollTop:0});
 }

 if(proj.discover!==false){
  scheduleIdle(()=>{
   if(tok!==loadTok)return;
   discoverFiles(fDir,MEDIA_OK,proj.id,files=>{
    if(tok!==loadTok)return;
    const have=new Set(entries.map(p=>p.file));
    const added=files.filter(f=>!have.has(f));
    if(!added.length)return;
    added.forEach(f=>{
     const e=toEntry({file:f,auto:true},entries.length,fDir,tDir,tExts,allowVidThumb);
     entries.push(e);
     addCard(e,entries.length-1,tok,viewEl);
    });
    updateCount();scheduleLayout();
   });
  });
 }
}

const initHash=decodeURIComponent(location.hash.replace(/^#/,""));
const startProj=PROJECTS.find(p=>p.id===initHash)||PROJECTS[0];
loadProject(startProj,false);
addEventListener("hashchange",()=>{
 const h=decodeURIComponent(location.hash.replace(/^#/,""));
 const found=PROJECTS.find(p=>p.id===h);
 if(found&&found.id!==activeProj.id)loadProject(found,false);
});
