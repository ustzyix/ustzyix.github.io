<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ustzyix</title>
  <style>
    :root {
      --fg-color: #e6e6ea;
      --fg-muted: rgba(230, 230, 234, 0.52);
      --fg-whisper: rgba(230, 230, 234, 0.28);
      --aura-primary: #8c1d18;
      --aura-secondary: #3b1814;
      --px: 0px;
      --py: 0px;
      --bass-boost: 0;
      --ease-liquid: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-drift: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #020203;
      color: var(--fg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ชั้นที่ 1: บรรยากาศสีหลักหน้าแรก (เพิ่มความกว้างและความชัดของสี) */
    #ambient-layer {
      position: fixed;
      inset: 0;
      z-index: -7;
      background:
        radial-gradient(ellipse 85% 65% at 50% 34%, rgba(155, 34, 28, 0.56) 0%, transparent 72%),
        radial-gradient(ellipse 90% 70% at 50% 80%, rgba(72, 26, 22, 0.44) 0%, #020203 86%);
      transition: background 1.2s ease;
      pointer-events: none;
    }

    /* ชั้นที่ 2: หมอกลึกเคลื่อนตัวช้าๆ (เพิ่มความชัดให้สอดรับกับสีพื้นหลัง) */
    .mist-far {
      position: fixed;
      inset: -24%;
      z-index: -6;
      pointer-events: none;
      opacity: 0.62;
      background:
        radial-gradient(ellipse 74% 58% at 24% 34%, var(--aura-primary) 0%, transparent 76%),
        radial-gradient(ellipse 70% 62% at 76% 68%, var(--aura-secondary) 0%, transparent 78%);
      animation: mistSwayA 28s ease-in-out infinite alternate;
    }

    .mist-near {
      position: fixed;
      inset: -18%;
      z-index: -5;
      pointer-events: none;
      opacity: 0.36;
      background:
        radial-gradient(ellipse 62% 48% at 72% 32%, var(--aura-primary) 0%, transparent 74%),
        radial-gradient(ellipse 72% 50% at 30% 76%, rgba(205, 210, 225, 0.08) 0%, transparent 78%);
      animation: mistSwayB 20s ease-in-out infinite alternate;
    }

    @keyframes mistSwayA {
      0% { transform: translate3d(-2.5%, -1.2%, 0) scale(1); }
      100% { transform: translate3d(2.5%, 1.5%, 0) scale(1.05); }
    }

    @keyframes mistSwayB {
      0% { transform: translate3d(2%, 1.1%, 0) scale(1.03); }
      100% { transform: translate3d(-2.4%, -1.3%, 0) scale(0.98); }
    }

    /* ชั้นที่ 3: ลำแสงเฉียงส่องผ่านความมืด */
    .god-rays {
      position: fixed;
      inset: -20%;
      z-index: -4;
      pointer-events: none;
      opacity: 0.28;
      background:
        radial-gradient(ellipse 22% 78% at 36% 24%, var(--aura-primary) 0%, transparent 78%),
        radial-gradient(ellipse 18% 72% at 54% 28%, rgba(255, 248, 236, 0.14) 0%, transparent 78%);
      transform: rotate(-22deg);
      animation: raySweep 17s ease-in-out infinite alternate;
    }

    @keyframes raySweep {
      0% { transform: translate3d(-3%, -1%, 0) rotate(-24deg); opacity: 0.18; }
      50% { opacity: 0.32; }
      100% { transform: translate3d(3%, 1.5%, 0) rotate(-19deg); opacity: 0.22; }
    }

    /* ชั้นที่ 4: ความมืดรอบขอบจอ (เปิดพื้นที่ตรงกลางกว้างขึ้นให้สีพื้นหลังโชว์ชัด) */
    .void-vignette {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background: radial-gradient(
        circle at 50% 45%,
        transparent 42%,
        rgba(2, 2, 3, 0.56) 84%,
        rgba(0, 0, 1, 0.92) 100%
      );
    }

    /* ชั้นที่ 5: Canvas 60fps ละอองฝุ่นลอยในอากาศ */
    #atmosphere-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
    }

    /* ชั้นที่ 6: เกรนฟิล์มอนาล็อกบางเบา */
    .film-grain {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0.035;
      background-repeat: repeat;
      animation: grainShift 0.36s steps(2) infinite;
    }

    @keyframes grainShift {
      0% { background-position: 0 0; }
      33% { background-position: 24px -18px; }
      66% { background-position: -19px 27px; }
      100% { background-position: 14px 12px; }
    }

    /* แถบหัวเว็บลอยโปร่งแสงด้านบน */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: max(18px, env(safe-area-inset-top)) 26px 14px;
      font-size: 12px;
      z-index: 20;
      background: linear-gradient(to bottom, rgba(2, 2, 3, 0.72) 0%, transparent 100%);
      pointer-events: none;
    }

    .brand {
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: lowercase;
      color: var(--fg-muted);
      pointer-events: auto;
    }

    .presence-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--fg-whisper);
    }

    .pulse-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--fg-muted);
      animation: solitaryPulse 4.2s ease-in-out infinite;
    }

    @keyframes solitaryPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.85); }
      50% { opacity: 0.85; transform: scale(1.25); }
    }

    /* ผืนผ้าใบวางรูปกระจายตัวอิสระ (Scattered Canvas) */
    main {
      position: relative;
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 84px 16px 130px;
      z-index: 2;
    }

    .scatter-canvas {
      position: relative;
      width: 100%;
      min-height: 82dvh;
    }

    /* การ์ดรูปภาพแต่ละใบที่ลอยกระจายบนพื้นที่มืด */
    .scatter-item {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 9px;
      cursor: pointer;
      opacity: 0;
      transform: translate3d(0, 18px, 0);
      transition:
        opacity 0.85s var(--ease-liquid),
        transform 0.85s var(--ease-drift),
        z-index 0s;
      will-change: transform, opacity;
    }

    .scatter-item.is-visible {
      opacity: 1;
      transform: translate3d(
        calc(var(--px) * var(--depth, 0.5)),
        calc(var(--py) * var(--depth, 0.5)),
        0
      );
    }

    /* วงแสงสีพื้นหลังเฉพาะตัวของรูปแต่ละใบ ให้แผ่กว้างและชัดขึ้น */
    .item-aura-glow {
      position: absolute;
      inset: -48px;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(
        ellipse 68% 64% at 50% 48%,
        var(--item-aura, var(--aura-primary)) 0%,
        transparent 74%
      );
      opacity: 0.58;
      transition: opacity 0.45s ease, transform 0.55s var(--ease-drift);
    }

    .scatter-item.is-active-song .item-aura-glow {
      opacity: 0.78;
      transform: scale(1.08);
    }

    @media (hover: hover) {
      .scatter-item:hover {
        z-index: 12 !important;
      }
      .scatter-item:hover .item-aura-glow {
        opacity: 0.85;
        transform: scale(1.12);
      }
      .scatter-item:hover .scatter-frame {
        transform: scale(1.035);
        box-shadow:
          0 28px 75px -10px rgba(0, 0, 0, 0.94),
          0 0 75px -6px var(--item-aura, var(--aura-primary));
      }
      .scatter-item:hover .scatter-title {
        color: var(--fg-color);
      }
    }

    .scatter-item:active .scatter-frame {
      transform: scale(0.98);
    }

    /* กรอบสี่เหลี่ยมไร้เส้นขอบ ละลายขอบเนียนเข้ากับสีรอบรูป */
    .scatter-frame {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 6px;
      border: none;
      background-color: #050507;
      box-shadow:
        0 20px 55px -12px rgba(0, 0, 0, 0.88),
        0 0 65px -8px var(--item-aura, var(--aura-primary));
      transition: transform 0.55s var(--ease-drift), box-shadow 0.55s ease;
    }

    .scatter-frame img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
      transform: scale(1.015);
      transition: transform 8s ease-out;
    }

    .scatter-item.is-active-song .scatter-frame img {
      animation: subtleFloatBreath 14s ease-in-out infinite alternate;
    }

    @keyframes subtleFloatBreath {
      0% { transform: scale(1.015) translate3d(-0.4%, -0.3%, 0); }
      100% { transform: scale(1.045) translate3d(0.4%, 0.4%, 0); }
    }

    /* เงาละลายขอบสี่เหลี่ยม 4 ด้านให้ภาพกลืนกับฉากหลัง */
    .edge-dissolve {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow:
        inset 0 0 18px 4px rgba(2, 2, 3, 0.58),
        inset 0 0 36px 1px rgba(2, 2, 3, 0.24);
    }

    /* ป้ายชื่อเล็กๆ ใต้รูปแต่ละใบ */
    .scatter-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-left: 2px;
      max-width: 100%;
    }

    .scatter-title {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: rgba(230, 230, 234, 0.84);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.25s ease;
    }

    .scatter-sub {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9.5px;
      letter-spacing: 0.06em;
      color: rgba(230, 230, 234, 0.42);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scatter-item.is-active-song .scatter-title::before {
      content: "● ";
      font-size: 7px;
      vertical-align: middle;
      color: var(--fg-color);
      opacity: 0.88;
    }

    /* แถบเพลงลอยด้านล่างไร้เส้นขอบ */
    .floating-dock {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: max-content;
      max-width: 90vw;
    }

    .music-pill {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      max-width: min(88vw, 330px);
      height: 34px;
      padding: 0 18px;
      border-radius: 999px;
      border: none;
      outline: none;
      background: rgba(12, 12, 16, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.72);
      color: var(--fg-muted);
      font-size: 11px;
      letter-spacing: 0.08em;
      cursor: pointer;
      touch-action: manipulation;
      transition: background-color 0.22s ease, color 0.22s ease, transform 0.2s ease;
    }

    .music-pill:active {
      transform: scale(0.97);
    }

    .music-pill.playing {
      color: var(--fg-color);
      background: rgba(22, 22, 28, 0.84);
    }

    .eq-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 10px;
      width: 10px;
      flex-shrink: 0;
    }

    .eq-bars i {
      display: block;
      width: 1.5px;
      height: 9px;
      background-color: currentColor;
      transform-origin: bottom;
      transform: scaleY(0.35);
    }

    .eq-bars i:nth-child(2) { transform: scaleY(0.85); }
    .eq-bars i:nth-child(3) { transform: scaleY(0.55); }

    .music-pill.playing .eq-bars i {
      animation: eqBounce 0.9s ease-in-out infinite alternate;
    }
    .music-pill.playing .eq-bars i:nth-child(2) { animation-delay: 0.25s; }
    .music-pill.playing .eq-bars i:nth-child(3) { animation-delay: 0.5s; }

    @keyframes eqBounce {
      0% { transform: scaleY(0.25); }
      100% { transform: scaleY(1); }
    }

    .music-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-state {
      min-width: 42px;
      text-align: right;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9.5px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.68;
      flex-shrink: 0;
    }

    .music-progress {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 1.5px;
      width: 100%;
      background: currentColor;
      opacity: 0.45;
      transform: scaleX(0);
      transform-origin: left;
    }

    /* ============================================================
       หน้า 2: โหมดขยายดูรูปเดี่ยว (คงความมืดเดิม + กดค้างพลิกการ์ด 3D)
       ============================================================ */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px 84px;
      background: rgba(2, 2, 3, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s var(--ease-liquid);
    }

    .lightbox.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-inner {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      max-width: 92vw;
      transform: scale(0.95);
      transition: transform 0.45s var(--ease-drift);
    }

    .lightbox.is-open .lightbox-inner {
      transform: scale(1);
    }

    /* เวที 3D Flip Card */
    .flip-scene {
      perspective: 1400px;
      display: grid;
      place-items: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .flip-card {
      position: relative;
      display: grid;
      place-items: center;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 0.78s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .flip-card.is-pressing {
      transform: scale(0.975);
      transition: transform 0.25s ease-out;
    }

    .flip-card.is-flipped {
      transform: rotateY(180deg);
    }

    .flip-card.is-flipped.is-pressing {
      transform: rotateY(180deg) scale(0.975);
    }

    /* ด้านหน้า: รูปภาพคมชัด */
    .flip-front {
      grid-area: 1 / 1;
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.96),
        0 0 80px -10px var(--aura-primary);
    }

    .flip-front img {
      display: block;
      max-width: min(90vw, 760px);
      max-height: 60dvh;
      width: auto;
      height: auto;
      object-fit: contain;
      pointer-events: none;
    }

    /* ด้านหลัง: แผ่นบันทึกรายละเอียดของรูปนั้นๆ */
    .flip-back {
      grid-area: 1 / 1;
      width: 100%;
      height: 100%;
      min-width: min(82vw, 320px);
      min-height: 250px;
      border-radius: 6px;
      padding: 26px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: left;
      background:
        radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.045) 0%, transparent 65%),
        rgba(10, 10, 14, 0.94);
      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.96),
        0 0 70px -16px var(--aura-primary),
        inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      transform: rotateY(180deg);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow-y: auto;
    }

    .back-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .back-index {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--fg-whisper);
    }

    .back-date {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9.5px;
      letter-spacing: 0.12em;
      color: var(--fg-muted);
    }

    .back-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      padding: 16px 0;
    }

    .back-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      letter-spacing: 0.14em;
      color: var(--fg-color);
    }

    .back-note {
      font-size: 12.5px;
      line-height: 1.72;
      letter-spacing: 0.02em;
      color: rgba(230, 230, 234, 0.74);
      white-space: pre-line;
    }

    .back-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9.5px;
      letter-spacing: 0.1em;
      color: var(--fg-whisper);
    }

    .lightbox-caption {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      letter-spacing: 0.22em;
      color: var(--fg-color);
      opacity: 0.9;
      text-align: center;
    }

    .lightbox-hint {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--fg-whisper);
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="ambient-layer"></div>
  <div class="mist-far"></div>
  <div class="mist-near"></div>
  <div class="god-rays"></div>
  <div class="void-vignette"></div>
  <canvas id="atmosphere-canvas"></canvas>
  <div class="film-grain" id="film-grain"></div>

  <header>
    <div class="brand">ustzyix</div>
    <div class="presence-status">
      <span class="pulse-dot"></span>
      <span id="archive-count">stillness</span>
    </div>
  </header>

  <main>
    <div class="scatter-canvas" id="scatter-canvas"></div>
  </main>

  <div class="floating-dock">
    <button class="music-pill" id="music-pill" type="button" aria-label="Toggle audio">
      <span class="eq-bars" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="music-title" id="music-title">TV Girl · Loving Machine</span>
      <span class="music-state" id="music-state">play</span>
      <span class="music-progress" id="music-progress"></span>
    </button>
  </div>

  <!-- หน้า 2: Lightbox ดูรูปเดี่ยว + กดค้างเพื่อพลิกด้านหลังใส่รายละเอียด -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-inner" id="lightbox-inner">
      <div class="flip-scene" id="flip-scene">
        <div class="flip-card" id="flip-card">
          <!-- ด้านหน้ารูป -->
          <div class="flip-front">
            <img id="lightbox-img" alt="" />
            <div class="edge-dissolve"></div>
          </div>

          <!-- ด้านหลังรายละเอียดรูป -->
          <div class="flip-back">
            <div class="back-header">
              <span class="back-index" id="back-index">FRAME — 01</span>
              <span class="back-date" id="back-date">2026</span>
            </div>
            <div class="back-body">
              <div class="back-title" id="back-title">Crimson — 01</div>
              <div class="back-note" id="back-note">บันทึกเรื่องราว ความทรงจำ หรือรายละเอียดของภาพนี้...</div>
            </div>
            <div class="back-footer">
              <span id="back-location">Bangkok, TH</span>
              <span id="back-camera">35mm / Digital</span>
            </div>
          </div>

      <div class="lightbox-caption" id="lightbox-caption"></div>
      <div class="lightbox-hint" id="lightbox-hint">hold photo to flip · tap outside to return</div>
    </div>
  </div>

  <audio id="bg-audio" loop preload="metadata"></audio>

  <script>
    const REPO_CONFIG = {
      owner: "ustzyix",
      repo: "ustzyix.github.io",
      folder: "images",
      audioFolder: "audio"
    };

    const DEFAULT_AUDIO = "./audio/Loving%20Machine.mp3";
    const DEFAULT_SONG = "TV Girl · Loving Machine";

    /* แก้ไขรายละเอียดหลังการ์ดของแต่ละรูปได้ตรงนี้ */
    const ENTRIES = [
      {
        file: "IMG_5755 (2).jpg",
        src: "./images/IMG_5755%20(2).jpg",
        caption: "Crimson — 01",
        sub: "Nocturne · 01",
        date: "2026 · 01",
        location: "Night Street",
        camera: "Stillness Archive",
        note: "แสงไฟสีแดงยามค่ำคืนกับความเงียบงันท่ามกลางผู้คน\n(กดค้างที่รูปอีกครั้งเพื่อพลิกกลับ)",
        song: DEFAULT_SONG,
        audio: DEFAULT_AUDIO
      },
      {
        file: "IMG_5738 (1).jpg",
        src: "./images/IMG_5738%20(1).jpg",
        caption: "Magenta — 02",
        sub: "Stillness · 02",
        date: "2026 · 02",
        location: "Late Hours",
        camera: "Stillness Archive",
        note: "เงาสะท้อนสีชมพูม่วงในความมืด\n(สามารถแก้ไขข้อความตรงนี้ในโค้ดได้เลย)",
        song: DEFAULT_SONG,
        audio: DEFAULT_AUDIO
      }
    ];

    let entries = [...ENTRIES];
    let currentIndex = 0;
    let isAudioActive = false;
    let loadedAudioSrc = "";
    let particleTint = { r: 225, g: 215, b: 215 };

    let audioCtx = null;
    let analyser = null;
    let freqData = null;

    const paletteCache = new Map();
    const sampleCanvas = document.createElement("canvas");
    sampleCanvas.width = 36;
    sampleCanvas.height = 36;
    const sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });

    const scatterCanvas = document.getElementById("scatter-canvas");
    const ambientLayer = document.getElementById("ambient-layer");
    const archiveCountEl = document.getElementById("archive-count");
    const filmGrainEl = document.getElementById("film-grain");

    const bgAudio = document.getElementById("bg-audio");
    const musicPill = document.getElementById("music-pill");
    const musicTitleEl = document.getElementById("music-title");
    const musicStateEl = document.getElementById("music-state");
    const musicProgressEl = document.getElementById("music-progress");

    const lightbox = document.getElementById("lightbox");
    const flipScene = document.getElementById("flip-scene");
    const flipCard = document.getElementById("flip-card");
    const lightboxImg = document.getElementById("lightbox-img");
    const lightboxCaption = document.getElementById("lightbox-caption");
    const lightboxHint = document.getElementById("lightbox-hint");

    const backIndexEl = document.getElementById("back-index");
    const backDateEl = document.getElementById("back-date");
    const backTitleEl = document.getElementById("back-title");
    const backNoteEl = document.getElementById("back-note");
    const backLocationEl = document.getElementById("back-location");
    const backCameraEl = document.getElementById("back-camera");

    function initFilmGrain() {
      const c = document.createElement("canvas");
      c.width = 96;
      c.height = 96;
      const ctx = c.getContext("2d");
      const imgData = ctx.createImageData(96, 96);
      const buf = imgData.data;
      for (let i = 0; i < buf.length; i += 4) {
        const v = (Math.random() * 255) | 0;
        buf[i] = v;
        buf[i + 1] = v;
        buf[i + 2] = v;
        buf[i + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
      filmGrainEl.style.backgroundImage = `url(${c.toDataURL("image/png")})`;
    }

    function initAtmosphereCanvas() {
      const canvas = document.getElementById("atmosphere-canvas");
      const ctx = canvas.getContext("2d");
      let width = 0;
      let height = 0;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener("resize", () => {
        resize();
        layoutScatterItems();
      }, { passive: true });

      const count = width < 600 ? 36 : 56;
      const motes = Array.from({ length: count }, () => {
        const depth = Math.random();
        return {
          x: Math.random() * width,
          y: Math.random() * height,
          r: 0.65 + depth * 1.8,
          vx: (Math.random() - 0.5) * (0.14 + depth * 0.24),
          vy: -(0.12 + depth * 0.30),
          phase: Math.random() * Math.PI * 2,
          freq: 0.009 + Math.random() * 0.015,
          alpha: 0.08 + depth * 0.22,
          depth
        };
      });

      function tick() {
        ctx.clearRect(0, 0, width, height);
        const { r, g, b } = particleTint;

        let bass = 0;
        if (analyser && !bgAudio.paused) {
          analyser.getByteFrequencyData(freqData);
          let sum = 0;
          for (let k = 0; k < 6; k++) sum += freqData[k];
          bass = sum / (6 * 255);
          document.documentElement.style.setProperty("--bass-boost", bass.toFixed(3));
        }

        for (let i = 0; i < motes.length; i++) {
          const m = motes[i];
          m.phase += m.freq;
          m.x += m.vx + Math.sin(m.phase) * 0.20;
          m.y += m.vy - bass * 0.22 * m.depth;

          if (m.y < -14) {
            m.y = height + 14;
            m.x = Math.random() * width;
          }
          if (m.x < -14) m.x = width + 14;
          if (m.x > width + 14) m.x = -14;

          const twinkle = 0.65 + 0.35 * Math.sin(m.phase * 1.8);
          const finalAlpha = Math.min(m.alpha * twinkle + bass * 0.06, 0.52);

          ctx.beginPath();
          ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${finalAlpha.toFixed(3)})`;
          ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function initLookAround() {
      let targetX = 0;
      let targetY = 0;
      let curX = 0;
      let curY = 0;

      window.addEventListener("pointermove", (e) => {
        const nx = (e.clientX / window.innerWidth) * 2 - 1;
        const ny = (e.clientY / window.innerHeight) * 2 - 1;
        targetX = nx * 10;
        targetY = ny * 8;
      }, { passive: true });

      window.addEventListener("deviceorientation", (e) => {
        if (e.gamma === null || e.beta === null) return;
        const gx = Math.max(-25, Math.min(25, e.gamma)) / 25;
        const gy = Math.max(-25, Math.min(25, e.beta - 45)) / 25;
        targetX = gx * 10;
        targetY = gy * 8;
      }, { passive: true });

      function updateParallax() {
        curX += (targetX - curX) * 0.06;
        curY += (targetY - curY) * 0.06;
        document.documentElement.style.setProperty("--px", `${curX.toFixed(2)}px`);
        document.documentElement.style.setProperty("--py", `${curY.toFixed(2)}px`);
        requestAnimationFrame(updateParallax);
      }
      requestAnimationFrame(updateParallax);
    }

    function initAudioAnalyser() {
      if (audioCtx) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioCtx = new AudioContextClass();
        const source = audioCtx.createMediaElementSource(bgAudio);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        freqData = new Uint8Array(analyser.frequencyBinCount);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
      } catch (_) {
        analyser = null;
      }
    }

    function formatNewCaption(filename) {
      return filename
        .replace(/\.[^/.]+$/, "")
        .replace(/\(\d+\)/g, "")
        .replace(/^IMG[-_]?/i, "")
        .replace(/[-_]/g, " ")
        .trim() || "Stillness";
    }

    function getDominantPalette(src, imgElement) {
      if (paletteCache.has(src)) return paletteCache.get(src);

      try {
        const size = 36;
        sampleCtx.clearRect(0, 0, size, size);
        sampleCtx.drawImage(imgElement, 0, 0, size, size);

        const data = sampleCtx.getImageData(0, 0, size, size).data;
        const buckets = new Map();
        const step = 28;
        let rSum = 0, gSum = 0, bSum = 0, total = 0;

        for (let i = 0; i < data.length; i += 4) {
          const r = data[i], g = data[i + 1], b = data[i + 2];
          rSum += r; gSum += g; bSum += b; total++;

          const max = Math.max(r, g, b);
          const min = Math.min(r, g, b);
          const sat = max === 0 ? 0 : (max - min) / max;
          const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;

          if (lum < 0.08 || lum > 0.90) continue;

          const key = `${(r / step) | 0},${(g / step) | 0},${(b / step) | 0}`;
          let bucket = buckets.get(key);
          if (!bucket) {
            bucket = { r: 0, g: 0, b: 0, count: 0, satSum: 0 };
            buckets.set(key, bucket);
          }
          bucket.r += r;
          bucket.g += g;
          bucket.b += b;
          bucket.count += 1;
          bucket.satSum += sat;
        }

        const clusters = Array.from(buckets.values()).map(b => {
          const avgSat = b.satSum / b.count;
          return {
            rgb: [b.r / b.count, b.g / b.count, b.b / b.count],
            score: b.count * (0.45 + avgSat * 1.15)
          };
        });

        clusters.sort((a, b) => b.score - a.score);

        const avg = [rSum / total, gSum / total, bSum / total];
        const primary = clusters.length > 0 ? clusters[0].rgb : avg;

        let secondary = null;
        for (let i = 1; i < clusters.length; i++) {
          const c = clusters[i].rgb;
          const dist = Math.abs(c[0] - primary[0]) + Math.abs(c[1] - primary[1]) + Math.abs(c[2] - primary[2]);
          if (dist > 75) {
            secondary = c;
            break;
          }
        }
        if (!secondary) secondary = primary.map(v => v * 0.45);

        const result = {
          primaryHex: rgbToHex(primary),
          secondaryHex: rgbToHex(secondary),
          glowPrimary: rgbToHex(primary.map(v => v * 0.78)),
          glowSecondary: rgbToHex(secondary.map(v => v * 0.64)),
          abyssBase: rgbToHex(primary.map(v => v * 0.18)),
          tint: {
            r: Math.round(180 + primary[0] * 0.28),
            g: Math.round(180 + primary[1] * 0.28),
            b: Math.round(185 + primary[2] * 0.28)
          }
        };

        paletteCache.set(src, result);
        return result;
      } catch (_) {
        return null;
      }
    }

    function rgbToHex([r, g, b]) {
      return "#" + [r, g, b]
        .map(x => Math.max(0, Math.min(255, Math.round(x))).toString(16).padStart(2, "0"))
        .join("");
    }

    /* ปรับสีพื้นหลังหน้าแรกให้กว้างและชัดขึ้นตามภาพที่เลือก */
    function applyAtmosphere(palette) {
      if (!palette) return;
      const { primaryHex, secondaryHex, glowPrimary, glowSecondary, abyssBase, tint } = palette;
      particleTint = tint;

      document.documentElement.style.setProperty("--aura-primary", primaryHex);
      document.documentElement.style.setProperty("--aura-secondary", secondaryHex);

      ambientLayer.style.background = `
        radial-gradient(ellipse 85% 65% at 50% 34%, ${glowPrimary}dc 0%, transparent 72%),
        radial-gradient(ellipse 90% 70% at 50% 80%, ${glowSecondary}b4 0%, ${abyssBase} 84%, #020203 100%)
      `;
    }

    function layoutScatterItems() {
      const containerWidth = scatterCanvas.clientWidth;
      if (!containerWidth) return;

      const isMobile = containerWidth < 680;
      const items = Array.from(scatterCanvas.querySelectorAll(".scatter-item"));
      if (!items.length) return;

      const mobilePatterns = [
        { xPct: 0.04, wPct: 0.44, gapY: -30, depth: 0.45 },
        { xPct: 0.55, wPct: 0.41, gapY: 42,  depth: 0.70 },
        { xPct: 0.14, wPct: 0.52, gapY: 28,  depth: 0.85 },
        { xPct: 0.46, wPct: 0.48, gapY: -22, depth: 0.55 },
        { xPct: 0.05, wPct: 0.42, gapY: 36,  depth: 0.65 },
        { xPct: 0.50, wPct: 0.46, gapY: 30,  depth: 0.50 }
      ];

      const desktopPatterns = [
        { xPct: 0.06, wPct: 0.24, gapY: -40, depth: 0.45 },
        { xPct: 0.64, wPct: 0.26, gapY: 30,  depth: 0.75 },
        { xPct: 0.25, wPct: 0.28, gapY: -20, depth: 0.90 },
        { xPct: 0.46, wPct: 0.27, gapY: -55, depth: 0.60 },
        { xPct: 0.08, wPct: 0.23, gapY: 24,  depth: 0.50 },
        { xPct: 0.68, wPct: 0.25, gapY: -35, depth: 0.80 }
      ];

      const patterns = isMobile ? mobilePatterns : desktopPatterns;
      let cursorY = isMobile ? 16 : 24;
      let prevBottom = 0;

      items.forEach((el, idx) => {
        const pat = patterns[idx % patterns.length];
        const widthPx = Math.round(containerWidth * pat.wPct);
        const leftPx = Math.round(containerWidth * pat.xPct);

        el.style.width = `${widthPx}px`;
        el.style.left = `${leftPx}px`;
        el.style.setProperty("--depth", pat.depth);
        el.style.zIndex = Math.round(pat.depth * 10);

        const rectHeight = el.offsetHeight || Math.round(widthPx * 1.25);

        if (idx === 0) {
          el.style.top = `${cursorY}px`;
          prevBottom = cursorY + rectHeight;
        } else {
          const prevEl = items[idx - 1];
          const prevLeft = parseFloat(prevEl.style.left) || 0;
          const prevWidth = parseFloat(prevEl.style.width) || 0;

          const horizontalOverlap =
            leftPx < prevLeft + prevWidth + 16 &&
            leftPx + widthPx + 16 > prevLeft;

          if (horizontalOverlap) {
            cursorY = prevBottom + Math.max(32, pat.gapY + 34);
          } else {
            cursorY = Math.max(
              prevBottom - rectHeight * 0.42 + pat.gapY,
              (parseFloat(prevEl.style.top) || 0) + 56
            );
          }

          el.style.top = `${Math.round(cursorY)}px`;
          prevBottom = Math.max(prevBottom, cursorY + rectHeight);
        }
      });

      scatterCanvas.style.height = `${Math.round(prevBottom + 60)}px`;
    }

    function selectEntry(index, openModal = false) {
      if (!entries.length) return;
      currentIndex = (index + entries.length) % entries.length;
      const item = entries[currentIndex];

      const allItems = scatterCanvas.querySelectorAll(".scatter-item");
      allItems.forEach((el, i) => {
        el.classList.toggle("is-active-song", i === currentIndex);
      });

      const imgEl = allItems[currentIndex]?.querySelector("img");
      if (imgEl && imgEl.complete && imgEl.naturalWidth > 0) {
        const pal = getDominantPalette(item.src, imgEl);
        if (pal) applyAtmosphere(pal);
      }

      syncAudio(item, openModal);

      if (openModal) {
        flipCard.classList.remove("is-flipped", "is-pressing");
        lightboxImg.src = item.src;
        lightboxCaption.textContent = item.caption;
        lightboxHint.textContent = "hold photo to flip · tap outside to return";

        const num = String(currentIndex + 1).padStart(2, "0");
        backIndexEl.textContent = `FRAME — ${num}`;
        backDateEl.textContent = item.date || "2026";
        backTitleEl.textContent = item.caption;
        backNoteEl.textContent = item.note || item.sub || "Stillness archive.";
        backLocationEl.textContent = item.location || "Archive";
        backCameraEl.textContent = item.camera || "ustzyix";

        lightbox.classList.add("is-open");
      }
    }

    function syncAudio(item, autoStart = false) {
      const targetTitle = item.song || DEFAULT_SONG;
      if (musicTitleEl.textContent !== targetTitle) {
        musicTitleEl.textContent = targetTitle;
      }

      if (!item.audio) {
        bgAudio.pause();
        loadedAudioSrc = "";
        musicPill.classList.remove("playing");
        musicProgressEl.style.transform = "scaleX(0)";
        musicStateEl.textContent = "—";
        return;
      }

      if (autoStart && !isAudioActive) {
        isAudioActive = true;
        initAudioAnalyser();
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
      }

      if (loadedAudioSrc === item.audio) {
        if (isAudioActive && bgAudio.paused) {
          bgAudio.play().catch(() => {});
        }
        return;
      }

      loadedAudioSrc = item.audio;
      bgAudio.src = item.audio;
      musicProgressEl.style.transform = "scaleX(0)";

      if (isAudioActive) {
        bgAudio.play()
          .then(() => {
            musicPill.classList.add("playing");
            musicStateEl.textContent = "pause";
          })
          .catch(() => {
            musicPill.classList.remove("playing");
            musicStateEl.textContent = "play";
          });
      }
    }

    function renderGallery() {
      scatterCanvas.innerHTML = "";
      archiveCountEl.textContent = `${entries.length} frames`;

      entries.forEach((item, idx) => {
        const card = document.createElement("article");
        card.className = "scatter-item" + (idx === currentIndex ? " is-active-song" : "");
        card.style.transitionDelay = `${Math.min(idx * 90, 540)}ms`;

        const auraGlow = document.createElement("div");
        auraGlow.className = "item-aura-glow";

        const frame = document.createElement("div");
        frame.className = "scatter-frame";

        const img = document.createElement("img");
        img.src = item.src;
        img.alt = item.caption;
        img.decoding = "async";

        img.onload = () => {
          const pal = getDominantPalette(item.src, img);
          if (pal) {
            card.style.setProperty("--item-aura", pal.primaryHex);
            if (idx === currentIndex) applyAtmosphere(pal);
          }
          layoutScatterItems();
          requestAnimationFrame(() => card.classList.add("is-visible"));
        };

        img.onerror = () => {
          layoutScatterItems();
          card.classList.add("is-visible");
        };

        const dissolve = document.createElement("div");
        dissolve.className = "edge-dissolve";

        frame.appendChild(img);
        frame.appendChild(dissolve);

        const meta = document.createElement("div");
        meta.className = "scatter-meta";

        const title = document.createElement("div");
        title.className = "scatter-title";
        title.textContent = item.caption;

        const sub = document.createElement("div");
        sub.className = "scatter-sub";
        sub.textContent = item.sub || item.song || "Stillness";

        meta.appendChild(title);
        meta.appendChild(sub);

        card.appendChild(auraGlow);
        card.appendChild(frame);
        card.appendChild(meta);

        card.addEventListener("click", () => {
          selectEntry(idx, true);
        });

        scatterCanvas.appendChild(card);
      });

      layoutScatterItems();
    }

    async function syncGitHubAssets() {
      try {
        const imgApi = `https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${REPO_CONFIG.folder}`;
        const audioApi = `https://api.github.com/repos/${REPO_CONFIG.owner}/${REPO_CONFIG.repo}/contents/${REPO_CONFIG.audioFolder}`;

        const [imgRes, audioRes] = await Promise.all([
          fetch(imgApi),
          fetch(audioApi).catch(() => null)
        ]);

        const audioMap = new Map();
        if (audioRes && audioRes.ok) {
          const audioFiles = await audioRes.json();
          const validAudio = /\.(mp3|m4a|ogg|wav|aac)$/i;
          audioFiles
            .filter(f => f.type === "file" && validAudio.test(f.name))
            .forEach(f => {
              const baseName = f.name.replace(/\.[^/.]+$/, "").toLowerCase();
              audioMap.set(baseName, `./${REPO_CONFIG.audioFolder}/${encodeURIComponent(f.name)}`);
            });
        }

        if (imgRes && imgRes.ok) {
          const files = await imgRes.json();
          const validExt = /\.(jpe?g|png|webp|gif|avif)$/i;
          const existingNames = new Set(entries.map(p => p.file));

          const extraPhotos = files
            .filter(f => f.type === "file" && validExt.test(f.name) && !existingNames.has(f.name))
            .map((f, i) => {
              const baseName = f.name.replace(/\.[^/.]+$/, "").toLowerCase();
              const title = formatNewCaption(f.name);
              const num = String(entries.length + i + 1).padStart(2, "0");
              return {
                file: f.name,
                src: `./${REPO_CONFIG.folder}/${encodeURIComponent(f.name)}`,
                caption: title,
                sub: `Archive · ${num}`,
                date: "2026",
                location: "Archive",
                camera: "ustzyix",
                note: `${title} — Stillness archive.`,
                song: audioMap.has(baseName) ? title : DEFAULT_SONG,
                audio: audioMap.get(baseName) || DEFAULT_AUDIO
              };
            });

          if (extraPhotos.length > 0) {
            entries = [...entries, ...extraPhotos];
            renderGallery();
          }
        }
      } catch (_) {}
    }

    musicPill.addEventListener("click", () => {
      const item = entries[currentIndex];
      if (!item || !item.audio) return;

      initAudioAnalyser();
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }

      if (bgAudio.paused) {
        isAudioActive = true;
        if (!loadedAudioSrc) {
          loadedAudioSrc = item.audio;
          bgAudio.src = item.audio;
        }
        bgAudio.play()
          .then(() => {
            musicPill.classList.add("playing");
            musicStateEl.textContent = "pause";
          })
          .catch(() => {
            isAudioActive = false;
            musicPill.classList.remove("playing");
            musicStateEl.textContent = "retry";
          });
      } else {
        isAudioActive = false;
        bgAudio.pause();
        musicPill.classList.remove("playing");
        musicStateEl.textContent = "play";
        document.documentElement.style.setProperty("--bass-boost", "0");
      }
    });

    bgAudio.addEventListener("play", () => {
      musicPill.classList.add("playing");
      musicStateEl.textContent = "pause";
    });

    bgAudio.addEventListener("pause", () => {
      musicPill.classList.remove("playing");
      musicStateEl.textContent = "play";
      document.documentElement.style.setProperty("--bass-boost", "0");
    });

    bgAudio.addEventListener("timeupdate", () => {
      if (bgAudio.duration) {
        musicProgressEl.style.transform = `scaleX(${bgAudio.currentTime / bgAudio.duration})`;
      }
    });

    /* ระบบกดค้าง (Long Press) เพื่อพลิกการ์ด 3D ในหน้าดูรูปเดี่ยว */
    let holdTimer = null;
    let didFlipOnHold = false;

    function toggleCardFlip() {
      const isFlipped = flipCard.classList.toggle("is-flipped");
      lightboxHint.textContent = isFlipped
        ? "hold again to flip back · tap outside to return"
        : "hold photo to flip · tap outside to return";
      if (navigator.vibrate) {
        try { navigator.vibrate(14); } catch (_) {}
      }
    }

    function startHold(e) {
      e.stopPropagation();
      didFlipOnHold = false;
      flipCard.classList.add("is-pressing");
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => {
        flipCard.classList.remove("is-pressing");
        didFlipOnHold = true;
        toggleCardFlip();
      }, 360);
    }

    function cancelHold(e) {
      if (e) e.stopPropagation();
      clearTimeout(holdTimer);
      flipCard.classList.remove("is-pressing");
    }

    flipScene.addEventListener("pointerdown", startHold);
    flipScene.addEventListener("pointerup", (e) => {
      cancelHold(e);
    });
    flipScene.addEventListener("pointerleave", cancelHold);
    flipScene.addEventListener("pointercancel", cancelHold);
    flipScene.addEventListener("contextmenu", (e) => e.preventDefault());
    flipScene.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!didFlipOnHold && flipCard.classList.contains("is-flipped")) {
        toggleCardFlip();
      }
    });

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox || e.target.id === "lightbox-inner") {
        lightbox.classList.remove("is-open");
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") lightbox.classList.remove("is-open");
      if (e.key === " ") {
        e.preventDefault();
        musicPill.click();
      }
    });

    initFilmGrain();
    initAtmosphereCanvas();
    initLookAround();
    renderGallery();
    syncAudio(entries[0], false);
    syncGitHubAssets();
  </script>
</body>
</html>
